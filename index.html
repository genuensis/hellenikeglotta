ial als aorists forts i als adjectius de la 3a declinació.<\/em><\/p>\n<ul><li>La ciutat té murs segurs.<\/li><li>Els genets anaren (ἦλθον) cap a la ciutat.<\/li><li>L'esclau insensat veié el senyor i fugí.<\/li><li>Dau va trobar el xic i el va perseguir.<\/li><li>Alexandre va agafar l'esclau.<\/li><li>El xic va caure a terra i va plorar.<\/li><li>Tu eres un esclau mentider (fals) i insensat.<\/li><li>Les (teues) paraules no són veritables.<\/li><li>L'esclau prudent no abandona (deixa) el camp.<\/li><li>La fugida del xic es va aturar.<\/li><\/ul>"},{"id":"t5b","unit":5,"kind":"b","title":"Ὁ βασιλεὺς καὶ ὁ ξύλινος ἵππος","paras":["Τὸ παλαιόν, ἡ Τροία μεγάλη πόλις ἦν. Ἆρα ἡ Τροία μικρὰ κώμη ἦν; Οὔ, μικρὰ κώμη οὐκ ἦν, ἀλλὰ μεγάλη πόλις ἦν. Ἡ πόλις τείχη εἶχεν. Τὰ τῆς πόλεως τείχη ὑψηλὰ καὶ ἀσφαλῆ ἦν.","Ὁ τῆς πόλεως βασιλεὺς Πρίαμος ἦν. Τίς ἦν ὁ Πρίαμος; Ὁ Πρίαμος βασιλεὺς τῆς πόλεως ἦν. Οἱ Ἕλληνες πρὸς τὴν πόλιν ἦλθον. Διὰ τί ἦλθον οἱ Ἕλληνες; Ὅτι τὴν πόλιν ἐμίσουν καὶ τὴν Τροίαν φθείρειν ἤθελον. Οἱ Ἕλληνες τοὺς Τρῶας ἔπαιον, ἀλλὰ τὰ τείχη ἰσχυρὰ ἦν. Οἱ γὰρ τοῦ βασιλέως φύλακες ἀνδρεῖοι ἦσαν.","Οἱ οὖν Ἕλληνες ἵππον ξύλινον ἐποίησαν. Τί ἐποίησαν οἱ Ἕλληνες; Ἵππον ἐποίησαν! Οἱ Ἕλληνες τὸν ἵππον ἔλιπον πρὸ τῶν τειχῶν. Ἔπειτα οἱ Ἕλληνες πρὸς τὴν θάλατταν ἔφυγον. Ποῖ ἔφυγον οἱ Ἕλληνες; Πρὸς τὴν θάλατταν ἔφυγον! Οἱ Τρῶες τὸν ἵππον εἶδον καὶ ἐθαύμασαν. Οἱ Τρῶες ἔλεγον· «Οἱ Ἕλληνες ἔφυγον! Ὁ ἵππος καλὸν δῶρόν ἐστιν!».","Ὁ ἱερεὺς Λαοκόων σώφρων ἀνὴρ ἦν. Τίς ἦν Λαοκόων; Ἱερεὺς ἦν. Ἆρα ἄφρων ἦν; Οὔ, ὁ ἱερεὺς ἄφρων οὐκ ἦν, ἀλλὰ σώφρων ἦν. Ὁ σώφρων ἱερεὺς εἶπεν· «Ὦ βασιλεῦ, ἄκουε! Μὴ πίστευε τοῖς Ἕλλησιν. Οἱ τῶν Ἑλλήνων λόγοι ψευδεῖς εἰσιν. Τοῦτο τὸ δῶρον ἀσφαλὲς οὐκ ἔστιν. Οἱ γὰρ Ἕλληνες ἀεὶ ψευδεῖς εἰσιν!».","Ἀλλὰ ὁ βασιλεὺς ἄφρων ἦν. Ἆρα ὁ βασιλεὺς σώφρων ἦν; Οὔ, ὁ βασιλεὺς σώφρων οὐκ ἦν. Ὁ ἄφρων βασιλεὺς τοὺς τοῦ σώφρονος ἀνδρὸς λόγους οὐκ ἤκουσεν. Οἱ τοῦ ἱερέως λόγοι ἀληθεῖς ἦσαν, ἀλλὰ ὁ βασιλεὺς τὰ ἀληθῆ οὐκ ἤκουσεν. Ὁ βασιλεὺς καὶ οἱ πολῖται τὸν ἵππον εἰς τὴν πόλιν ἤγαγον.","Ἐν δὲ τῇ νυκτί, οἱ Ἕλληνες ἐκ τοῦ ἵππου ἐξῆλθον. Πόθεν ἐξῆλθον; Ἐκ τοῦ ἵππου ἐξῆλθον! Ἄλλοι Ἕλληνες πάλιν πρὸς τὴν πόλιν ἦλθον. Οἱ πολέμιοι τὴν πόλιν ἔλαβον καὶ τὰ τείχη ἔλυσαν. Ὁ ἄφρων βασιλεὺς ἔπεσεν καὶ ἀπέθανεν. Οὕτως ἡ πόλις τὸν ὄλεθρον ἔλαβεν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Ἆρα ἡ Τροία μικρὰ κώμη ἦν;<\/li><li>Τίς ἦν ὁ βασιλεὺς τῆς πόλεως;<\/li><li>Διὰ τί οἱ Ἕλληνες πρὸς τὴν πόλιν ἦλθον;<\/li><li>Τί ἐποίησαν οἱ Ἕλληνες καὶ τί ἔλιπον πρὸ τῶν τειχῶν;<\/li><li>Ποῖ (cap a on) ἔφυγον οἱ Ἕλληνες;<\/li><li>Τίς ἦν Λαοκόων;<\/li><li>Ἆρα ὁ βασιλεὺς τοὺς τοῦ ἱερέως λόγους ἤκουσεν;<\/li><li>Ποῖ ἤγαγον τὸν ἵππον ὁ βασιλεὺς καὶ οἱ πολῖται;<\/li><li>Πόθεν (d'on) ἐξῆλθον οἱ Ἕλληνες ἐν τῇ νυκτί;<\/li><li>Τί ἔλαβεν ἡ πόλις πρὸς τῷ τέλει (al final);<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge o grup del mite les realitza. (Opcions: Ὁ Πρίαμος, Οἱ Ἕλληνες, Οἱ Τρῶες / Οἱ πολῖται, Ὁ Λαοκόων).<\/em><\/p>\n<ul><li>Ἵππον ξύλινον ἐποίησαν καὶ πρὸ τῶν τειχῶν ἔλιπον. (_______________)<\/li><li>Τὸν ἵππον εἶδον καὶ μεγάλως ἐθαύμασαν. (_______________)<\/li><li>Ἱερεὺς ἦν καὶ εἶπεν· «Μὴ πίστευε τοῖς Ἕλλησιν». (_______________)<\/li><li>Τὴν πόλιν ἐμίσουν καὶ τὴν Τροίαν φθείρειν ἤθελον. (_______________)<\/li><li>Ἄφρων ἦν καὶ τὰ ἀληθῆ οὐκ ἤκουσεν. (_______________)<\/li><li>Σώφρων ἀνὴρ ἦν καὶ τὸ δῶρον ἀσφαλὲς οὐκ εἶναι εἶπεν. (_______________)<\/li><li>Τὸν ἵππον εἰς τὴν πόλιν ἤγαγον. (_______________)<\/li><li>Ἐν τῇ νυκτί, ἐκ τοῦ ἵππου ἐξῆλθον. (_______________)<\/li><li>Τὴν πόλιν ἔλαβον καὶ τὰ τείχη ἔλυσαν. (_______________)<\/li><li>Ἔπεσεν καὶ ἀπέθανεν. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ σώφρων ἱερεὺς Λαοκόων εἶπεν· «Μὴ πίστευε τοῖς Ἕλλησιν».<\/li><li>☐ Οἱ Ἕλληνες πρὸς τὴν θάλατταν ἔφυγον.<\/li><li>☐ Ὁ βασιλεὺς ἀπέθανεν καὶ ἡ πόλις τὸν ὄλεθρον ἔλαβεν.<\/li><li>☐ Οἱ Ἕλληνες ἵππον ξύλινον ἐποίησαν καὶ πρὸ τῶν τειχῶν ἔλιπον.<\/li><li>☐ Οἱ πολέμιοι τὴν πόλιν ἔλαβον καὶ τὰ τείχη ἔλυσαν.<\/li><li>☐ Ἡ Τροία μεγάλη πόλις ἦν καὶ ὑψηλὰ τείχη εἶχεν.<\/li><li>☐ Ἀλλὰ ὁ ἄφρων βασιλεὺς τοὺς ἀληθεῖς λόγους οὐκ ἤκουσεν.<\/li><li>☐ Ἐν τῇ νυκτί, οἱ Ἕλληνες ἐκ τοῦ ἵππου ἐξῆλθον.<\/li><li>☐ Οἱ πολῖται τὸν ἵππον εἰς τὴν πόλιν ἤγαγον.<\/li><li>☐ Οἱ Τρῶες τὸν ἵππον εἶδον καὶ τὸ δῶρον ἐθαύμασαν.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite.<\/em><\/p>\n<ul><li>Ἡ Τροία μεγάλη πόλις ἦν καὶ τὰ τείχη ὑψηλὰ ἦν.<\/li><li>Οἱ Ἕλληνες τὴν πόλιν ἐμίσουν καὶ τὴν Τροίαν φθείρειν ἤθελον.<\/li><li>Οἱ οὖν Ἕλληνες ἵππον ξύλινον ἐποίησαν καὶ ἔλιπον πρὸ τῶν τειχῶν.<\/li><li>Ὁ σώφρων ἱερεὺς εἶπεν· «Μὴ πίστευε τοῖς Ἕλλησιν».<\/li><li>Τοῦτο τὸ δῶρον ἀσφαλὲς οὐκ ἔστιν, οἱ γὰρ Ἕλληνες ψευδεῖς εἰσιν.<\/li><li>Ὁ ἄφρων βασιλεὺς τοὺς τοῦ σώφρονος ἀνδρὸς λόγους οὐκ ἤκουσεν.<\/li><li>Ὁ βασιλεὺς καὶ οἱ πολῖται τὸν ἵππον εἰς τὴν πόλιν ἤγαγον.<\/li><li>Ἐν δὲ τῇ νυκτί, οἱ Ἕλληνες ἐκ τοῦ ἵππου ἐξῆλθον.<\/li><li>Οἱ πολέμιοι τὴν πόλιν ἔλαβον καὶ τὰ τείχη ἔλυσαν.<\/li><li>Ὁ ἄφρων βασιλεὺς ἔπεσεν καὶ ἡ πόλις τὸν ὄλεθρον ἔλαβεν.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>πόλις, πόλεως<\/strong> (ciutat): ____________________<\/li><li><strong>βασιλεύς, βασιλέως<\/strong> (rei): ____________________<\/li><li><strong>ἡμέρα, ἡμέρας<\/strong> (dia): ____________________<\/li><li><strong>παλαιός, παλαιά, παλαιόν<\/strong> (antic, vell): ____________________<\/li><li><strong>ψευδής, ψευδές<\/strong> (fals, mentider): ____________________<\/li><li><strong>πολέμιος, πολεμία, πολέμιον<\/strong> (enemic, hostil): ____________________<\/li><li><strong>λύω<\/strong> (deslligar, destruir): ____________________<\/li><li><strong>ἱερεύς, ἱερέως<\/strong> (sacerdot): ____________________<\/li><li><strong>Ἕλλην, Ἕλληνος<\/strong> (grec): ____________________<\/li><li><strong>ξύλινος, ξυλίνη, ξύλινον<\/strong> (de fusta): ____________________<\/li><\/ul>"},{"id":"t6a","unit":6,"kind":"a","title":"Ἡ ἐκ τῶν Ἀθηνῶν ὁδὸς καὶ οἱ τοῦ Ἀλεξάνδρου λόγοι","paras":["Τῇ ὑστεραίᾳ ἡμέρᾳ, ὁ Ἀλέξανδρος βούλεται ἐκ τῶν Ἀθηνῶν ἀπελθεῖν. Ὁ γὰρ δεσπότης νομίζει τὴν φυγὴν ἤδη παύσασθαι καὶ τὴν ἑαυτοῦ κώμην ἀσφαλῆ εἶναι. Ὁ Ἀλέξανδρος φίλον τινὰ ἐν ταῖς Ἀθήναις ἔχει. Τὸ τοῦ φίλου ὄνομα Δημοσθένης ἐστίν. Ὁ Δημοσθένης νομίζει τὰς Ἀθήνας καλὴν πόλιν εἶναι καὶ κελεύει τὸν Ἀλέξανδρον ἐν τῇ πόλει μένειν.","Ὁ Δημοσθένης λέγει· «Ὦ Ἀλέξανδρε, διὰ τί βούλει ἐκ τῶν Ἀθηνῶν ἐλθεῖν; Ἐγὼ νομίζω ταύτην τὴν πόλιν ἀρίστην εἶναι. Ἐνταῦθα ἔξεστι τοὺς ῥήτορας ἀκούειν καὶ πολλὰ πράγματα μαθεῖν. Δεῖ γὰρ τοὺς ἐλευθέρους ἄνδρας ἀεὶ μανθάνειν. Τὸ γὰρ μανθάνειν τὴν σοφίαν τοῖς ἀνθρώποις φέρει. Ἆρα οὐ νομίζεις τὸ ἐν τῇ ἀγορᾷ εἶναι καλὸν εἶναι;».","Ὁ δὲ Ἀλέξανδρος ἀποκρίνεται· «Ἐγὼ ὁμολογῶ τὰς Ἀθήνας θαυμαστὴν πόλιν εἶναι, ἀλλὰ ἀνάγκη ἐστὶ πρὸς τὴν οἰκίαν ἐπανελθεῖν. Πιστεύω γὰρ τὴν Ἑλένην ἐμὲ περιμένειν. Καὶ δεῖ τὸν δεσπότην τοὺς δούλους φυλάττειν καὶ τὸν ἀγρὸν θεραπεύειν. Τὸ γὰρ τὸν ἀγρὸν θεραπεύειν τὸν σῖτον παρέχει. Ἄνευ δὲ τοῦ σίτου οὐκ ἔξεστι ζῆν.».","Ὁ Δημοσθένης φησὶ τὸν Ἀλέξανδρον ἀληθῆ λέγειν. Ὁ Ἀλέξανδρος οὖν κελεύει τὸν Δάον καὶ τὸν Ξάνθον ἀναστῆναι καὶ τὰ πράγματα λαβεῖν. Ὁ δὲ Ξάνθος, ὁ ἀργὸς δοῦλος, μέγα ἄχθος φέρει. Ὁ Ξάνθος κλαίει. Ὁ γὰρ δοῦλος νομίζει τὸ ἄχθος μέγα εἶναι καὶ τὴν ὁδὸν μακρὰν ἔσεσθαι. Ὁ Ξάνθος βούλεται ἐν τῇ πόλει μένειν. Τὸ γὰρ καθεύδειν ἡδύ ἐστι τῷ Ξάνθῳ, ἀλλὰ τὸ ἐργάζεσθαι χαλεπόν ἐστιν.","Ὁ Ἀλέξανδρος εἰς τὸν δοῦλον βλέπει καὶ μανθάνει αὐτὸν κλαίειν. Ὁ δεσπότης λέγει· «Ὦ Ξάνθε, σὺ ἄφρων εἶ. Ἐγὼ γὰρ νομίζω σε ἀεὶ τὸν πόνον φεύγειν. Ἀλλὰ δεῖ τὸν δοῦλον ἀγαθὸν εἶναι καὶ τῷ δεσπότῃ πείθεσθαι. Ἆρα πιστεύεις τὸ φεύγειν τὴν σωτηρίαν φέρειν; Οὔ! Ἐγὼ φημι τὸν λύκον τὰ πρόβατα φαγεῖν, ὅτι σὺ ἐν τῷ ἀγρῷ ἐκάθευδες. Διὰ τὸ καθεύδειν σὺ τὸν κίνδυνον ἤγαγες. Νῦν οὖν δεῖ σε τὴν δίκην λαβεῖν.».","Ὁ δὲ Δάος νομίζει τὸν Ἀλέξανδρον δίκαιον εἶναι. Ὁ Δάος λέγει· «Ὦ δέσποτα, οἱ σοὶ λόγοι ἀληθεῖς εἰσιν. Ἐγὼ πιστεύω τὸν Ξάνθον σώφρονα γενήσεσθαι. Ὁ γὰρ φόβος ἀναγκάζει αὐτὸν σώφρονα γίγνεσθαι.».","Ὁ Ξάνθος μεγάλης ὀργῆς ἀκούει καὶ φοβεῖται. Ὁ δοῦλος λέγει· «Ὦ δέσποτα, ὁμολογῶ ἐμαυτὸν κακὸν δοῦλον εἶναι. Ἀλλὰ ἐγὼ πιστεύω ἐν τοῖς ὑστέροις χρόνοις ἀγαθὸς δοῦλος ἔσεσθαι. Ἐγὼ ὑπισχνοῦμαι οὐκέτι φεύξειν, ἀλλὰ ἀεὶ ἐν τῷ ἀγρῷ μενεῖν καὶ ἐργάσεσθαι. Νομίζω γὰρ τὸν πόνον ἄμεινον εἶναι τῆς σῆς ὀργῆς.».","Ὁ Ἀλέξανδρος λέγει· «Ἐλπίζω τοὺς σοὺς λόγους ἀληθεῖς εἶναι. Ἐγὼ γὰρ βούλομαί σε μαθεῖν ὅτι τὸ ψεύδεσθαι κακόν ἐστιν.».","Οὕτως οἱ ἄνθρωποι ἐκ τῆς πόλεως ἐξέρχονται. Πρὸ τῶν τειχῶν τῆς πόλεως, ὁ Ἀλέξανδρος πολλοὺς ἀνθρώπους ὁρᾷ. Οἱ ἄνθρωποι τὰ ὅπλα φέρουσιν. Ὁ Δάος νομίζει τοὺς ἀνθρώπους στρατιώτας εἶναι. Ὁ Δάος λέγει· «Ὦ δέσποτα, ὁρῶ τοὺς στρατιώτας πρὸς τὸν πόλεμον ἰέναι.».","Ὁ Ἀλέξανδρος ἀποκρίνεται· «Τὸ μάχεσθαι χαλεπόν ἐστιν. Ἐγὼ νομίζω τὴν εἰρήνην ἀμείνω τοῦ πολέμου εἶναι. Ἀλλὰ δεῖ τοὺς στρατιώτας τὴν πατρίδα σῴζειν.» Ὁ Ἀλέξανδρος ἐλπίζει τὴν εἰς τὴν κώμην ὁδὸν ταχεῖαν ἔσεσθαι καὶ τὴν Ἑλένην εὑρεῖν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Τί βούλεται ὁ Ἀλέξανδρος τῇ ὑστεραίᾳ ἡμέρᾳ;<\/li><li>Τίς ἐστιν ὁ τοῦ Ἀλεξάνδρου φίλος ἐν ταῖς Ἀθήναις;<\/li><li>Τί κελεύει ὁ Δημοσθένης τὸν Ἀλέξανδρον ποιεῖν (què li mana fer);<\/li><li>Τί φέρει τὸ μανθάνειν τοῖς ἀνθρώποις;<\/li><li>Τίνα πιστεύει ὁ Ἀλέξανδρος περιμένειν ἐν τῇ κώμῃ;<\/li><li>Διὰ τί κλαίει ὁ Ξάνθος ἐν τῇ ὁδῷ;<\/li><li>Ἆρα τὸ ἐργάζεσθαι ἡδύ ἐστι τῷ Ξάνθῳ;<\/li><li>Τί πιστεύει ὁ Ἀλέξανδρος περὶ τοῦ Ξάνθου (sobre Xantos);<\/li><li>Τί ὑπισχνεῖται (promet) ὁ Ξάνθος ἐν τοῖς ὑστέροις χρόνοις;<\/li><li>Τί ἐλπίζει ὁ Ἀλέξανδρος πρὸς τῷ τέλει τοῦ κειμένου (al final del text);<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (S-C-V).<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος νομίζει τὴν φυγὴν τοῦ Ξάνθου παύσασθαι.<\/li><li>Ὁ Δημοσθένης νομίζει τὰς Ἀθήνας κακὴν πόλιν εἶναι.<\/li><li>Ὁ Ἀλέξανδρος ὁμολογῶ τὰς Ἀθήνας θαυμαστὴν πόλιν εἶναι.<\/li><li>Τὸ τὸν ἀγρὸν θεραπεύειν μέγαν κίνδυνον παρέχει.<\/li><li>Ὁ Ξάνθος, ὁ ἀργὸς δοῦλος, μικρὸν ἄχθος φέρει καὶ χαίρει.<\/li><li>Τὸ καθεύδειν ἡδύ ἐστι τῷ Ξάνθῳ, ἀλλὰ τὸ ἐργάζεσθαι χαλεπόν ἐστιν.<\/li><li>Ὁ Ἀλέξανδρος πιστεύει τὸ φεύγειν τὴν σωτηρίαν φέρειν τοῖς δούλοις.<\/li><li>Ὁ Ξάνθος ὑπισχνεῖται ἀεὶ τὸν πόνον φεύξειν καὶ καθευδήσειν.<\/li><li>Οἱ στρατιῶται, οὓς ὁ Ἀλέξανδρος καὶ ὁ Δάος ὁρῶσιν, ὅπλα φέρουσιν.<\/li><li>Ὁ Ἀλέξανδρος νομίζει τὸν πόλεμον ἀμείνω (millor) τῆς εἰρήνης εἶναι.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίνα φίλον ἔχει ὁ Ἀλέξανδρος ἐν ταῖς Ἀθήναις; (_______________)<\/li><li>Τίς κελεύει τὸν Ἀλέξανδρον ἐν τῇ πόλει μένειν; (_______________)<\/li><li>Τί φέρει τοῖς ἀνθρώποις τὸ μανθάνειν; (_______________)<\/li><li>Τίνα πιστεύει ὁ Ἀλέξανδρος ἐν τῇ κώμῃ περιμένειν; (_______________)<\/li><li>Τί παρέχει τὸ τὸν ἀγρὸν θεραπεύειν; [el blat] (_______________)<\/li><li>Τίς φέρει μέγα ἄχθος καὶ κλαίει; (_______________)<\/li><li>Τίνι ἐστὶν ἡδὺ τὸ καθεύδειν; (_______________)<\/li><li>Τίνα βούλεται ὁ Ἀλέξανδρος δίκην λαβεῖν; [a l'esclau / a Xantos] (_______________)<\/li><li>Τί νομίζει ὁ Ἀλέξανδρος ἄμεινον τοῦ πολέμου εἶναι; (_______________)<\/li><li>Τί ἐλπίζει ὁ Ἀλέξανδρος εὑρεῖν ἐν τῇ κώμῃ; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (presta atenció als infinitius).<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος βούλεται ἐκ τῶν Ἀθηνῶν _____. (aorist fort)<\/li><li>Ὁ Δημοσθένης νομίζει τὰς Ἀθήνας ἀρίστην πόλιν _____.<\/li><li>Ὁ Ἀλέξανδρος νομίζει τὴν _____ ἤδη παύσασθαι.<\/li><li>_____ μανθάνειν τὴν σοφίαν τοῖς ἀνθρώποις φέρει.<\/li><li>Ὁ δεσπότης νομίζει τὸν δοῦλον ἀεὶ τὸν πόνον _____.<\/li><li>Ὁ Ξάνθος νομίζει τὴν _____ μακρὰν ἔσεσθαι.<\/li><li>Ὁ Ἀλέξανδρος βούλεται τὸν Ξάνθον _____ (aprendre) ὅτι τὸ ψεύδεσθαι κακόν ἐστιν.<\/li><li>Ὁ Ξάνθος ὑπισχνεῖται οὐκέτι _____, ἀλλὰ ἀεὶ ἐργάσεσθαι.<\/li><li>Ὁ Δάος ὁρᾷ τοὺς _____ πρὸς τὸν πόλεμον ἰέναι (anar).<\/li><li>Ὁ Ἀλέξανδρος ἐλπίζει τὴν πρὸς τὴν κώμην ὁδὸν ταχεῖαν _____.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: L'Infinitiu Substantivat.<\/em> <em>Transforma l'oració principal en un subjecte format per un infinitiu substantivat (amb l'article neutre τό) i copia la resta de la frase.<\/em> <em>Exemple: Ὁ ἄνθρωπος μανθάνει ➞ Τὸ μανθάνειν χαλεπόν ἐστιν.<\/em><\/p>\n<ul><li>Ὁ Ξάνθος καθεύδει. ➞ (________________) ἡδύ ἐστι τῷ Ξάνθῳ.<\/li><li>Οἱ δοῦλοι τὸν ἀγρὸν θεραπεύουσιν. ➞ (________________) τὸν σῖτον παρέχει.<\/li><li>Οἱ στρατιῶται μάχονται. ➞ (________________) χαλεπόν ἐστιν.<\/li><li>Ὁ δοῦλος ψεύδεται. ➞ (________________) κακόν ἐστιν.<\/li><\/ul>\n<p><em>Exercici B: Oracions Completives (Acusatiu + Infinitiu).<\/em> <em>Transforma l'estil directe en indirecte fent dependre la frase dels verbs νομίζω o πιστεύω. El subjecte de la frase original passarà a Acusatiu, i el verb a Infinitiu (mantín el temps original: present, aorist o futur).<\/em> <em>Exemple: Ἡ ὁδὸς μακρά ἐστιν. Ὁ ἄνθρωπος νομίζει… ➞ Ὁ ἄνθρωπος νομίζει τὴν ὁδὸν μακρὰν εἶναι.<\/em><\/p>\n<ul><li>Αἱ Ἀθῆναι ἀρίστη πόλις εἰσίν. ➞ Ὁ Δημοσθένης νομίζει…<\/li><li>Ἡ Ἑλένη τὸν δεσπότην περιμένει. ➞ Ὁ Ἀλέξανδρος πιστεύει…<\/li><li>Ὁ Ξάνθος ἀεὶ τὸν πόνον φεύγει. ➞ Ὁ Ἀλέξανδρος νομίζει…<\/li><li>Ἡ ὁδὸς ταχεῖα ἔσται (Futur d'εἰμί). ➞ Ὁ Ἀλέξανδρος ἐλπίζει…<\/li><li>Ὁ Ξάνθος σώφρων γενήσεται (Futur de γίγνομαι). ➞ Ὁ Δάος πιστεύει…<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Declina els substantius/adjectius, conjuga els verbs en la forma personal o no personal adequada (atenció als infinitius completius) i ordena les paraules per a formar oracions correctes en grec, respectant l'estructura S-C-V.<\/em><\/p>\n<ul><li>ὁ / Δημοσθένης / αἱ / Ἀθῆναι / καλός / πόλις / εἶναι / νομίζειν.<\/li><li>ὁ / Ἀλέξανδρος / ἡ / Ἑλένη / ἑαυτοῦ / περιμένειν / πιστεύειν.<\/li><li>τὸ / μανθάνειν / ἡ / σοφία / οἱ / ἄνθρωποι / φέρειν.<\/li><li>ὁ / δοῦλος / οὐκέτι / φεύγειν (en futur: φεύξειν) / ὑπισχνεῖσθαι.<\/li><li>ὁ / Δάος / οἱ / στρατιῶται / τὰ / ὅπλα / φέρειν / ὁρᾶν.<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text, parant especial atenció a l'infinitiu i al seu subjecte en acusatiu.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος νομίζει τὴν φυγὴν ἤδη παύσασθαι καὶ τὴν ἑαυτοῦ κώμην ἀσφαλῆ εἶναι.<\/li><li>Ὁ Δημοσθένης νομίζει τὰς Ἀθήνας καλὴν πόλιν εἶναι καὶ κελεύει τὸν Ἀλέξανδρον ἐν τῇ πόλει μένειν.<\/li><li>Τὸ γὰρ μανθάνειν τὴν σοφίαν τοῖς ἀνθρώποις φέρει.<\/li><li>Πιστεύω γὰρ τὴν Ἑλένην ἐμὲ περιμένειν.<\/li><li>Ὁ Ξάνθος βούλεται ἐν τῇ πόλει μένειν.<\/li><li>Τὸ γὰρ καθεύδειν ἡδύ ἐστι τῷ Ξάνθῳ, ἀλλὰ τὸ ἐργάζεσθαι χαλεπόν ἐστιν.<\/li><li>Ἆρα πιστεύεις τὸ φεύγειν τὴν σωτηρίαν φέρειν;<\/li><li>Ἐγὼ πιστεύω ἐν τοῖς ὑστέροις χρόνοις ἀγαθὸς δοῦλος ἔσεσθαι.<\/li><li>Ἐγὼ ὑπισχνοῦμαι οὐκέτι φεύξειν, ἀλλὰ ἀεὶ ἐν τῷ ἀγρῷ μενεῖν καὶ ἐργάσεσθαι.<\/li><li>Ὁ Ἀλέξανδρος ἐλπίζει τὴν εἰς τὴν κώμην ὁδὸν ταχεῖαν ἔσεσθαι καὶ τὴν Ἑλένην εὑρεῖν.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 6 i respectant l'estructura S-C-V i l'ortografia politònica. (Presta atenció a la construcció d'Acusatiu + Infinitiu i a l'infinitiu substantivat).<\/em><\/p>\n<ul><li>Alexandre vol eixir d'Atenes (ἐκ τῶν Ἀθηνῶν).<\/li><li>Demòstenes creu que Atenes (acusatiu) és una ciutat excel·lent.<\/li><li>El fet d'aprendre porta saviesa als hòmens.<\/li><li>El senyor creu que Helena l'espera.<\/li><li>Xantos plora perquè porta un gran pes.<\/li><li>Dormir és agradable, però treballar és difícil.<\/li><li>El senyor creu que l'esclau roí fuig del treball.<\/li><li>L'esclau promet que ell ja no fugirà (infinitiu futur).<\/li><li>Dau veu que els soldats porten les armes.<\/li><li>Alexandre espera que el camí serà (infinitiu futur) ràpid.<\/li><\/ul>"},{"id":"t6b","unit":6,"kind":"b","title":"Ὁ Ὀδυσσεὺς καὶ αἱ Σειρῆνες","paras":["Μετὰ τὸν πόλεμον, ὁ Ὀδυσσεὺς βούλεται εἰς τὴν ἑαυτοῦ πατρίδα ἐπανελθεῖν. Ἡ πατρὶς Ἰθάκη ὀνομάζεται. Ὁ δὲ Ὀδυσσεὺς γιγνώσκει τὴν διὰ τῆς θαλάττης ὁδὸν μακρὰν καὶ χαλεπὴν εἶναι.","Ἡ Κίρκη δεινὴ θεά ἐστιν. Ἡ θεὰ λέγει τῷ Ὀδυσσεῖ τὰς Σειρῆνας κίνδυνον μέγαν εἶναι. Ἡ Κίρκη λέγει· «Ὦ Ὀδυσσεῦ, δεῖ σε καὶ τοὺς σοὺς ναύτας μάλα φυλάττεσθαι. Ἐγὼ γὰρ φημι τὰς Σειρῆνας τοὺς ἀνθρώπους διαφθείρειν. Αἱ Σειρῆνες δεινὰ τέρατά εἰσιν, ἀλλὰ γυναικῶν φωνὴν ἔχουσιν. Καὶ ἀνάγκη ἐστὶ τὰ τέρατα καλῶς ᾄδειν. Τὸ γὰρ τὰς Σειρῆνας ᾄδειν πάντας τοὺς ναύτας θέλγει. Οἱ δὲ ναῦται βούλονται ἐγγὺς ἐλθεῖν καὶ τὰ τέρατα ἰδεῖν. Ἀλλὰ ἐγὼ νομίζω πάντας τοὺς ναύτας ἀποθανεῖσθαι. Τὸ γὰρ ἀκούειν τὸν θάνατον φέρει.».","Διὰ τοῦτο, ἡ θεὰ κελεύει τὸν Ὀδυσσέα κηρὸν λαβεῖν καὶ εἰς τὰ τῶν ναυτῶν ὦτα βαλεῖν. Ἡ Κίρκη λέγει· «Νομίζω τὸν κηρὸν τοὺς ναύτας σώσειν. Οἱ γὰρ ναῦται οὐχ οἷοί τε ἔσονται ἀκοῦσαι τὴν φωνήν. Τὸ μὴ ἀκούειν τὴν ναῦν σῴζει. Σὺ δὲ ἴσως βούλει τὰ τέρατα ἀκοῦσαι. Εἰ βούλει ἀκοῦσαι, δεῖ τοὺς ναύτας σε καταδῆσαι πρὸς τὸν ἱστόν.».","Ὁ Ὀδυσσεὺς νομίζει τοὺς τῆς Κίρκης λόγους ἀληθεῖς εἶναι. Ὁ οὖν ἥρως κελεύει τοὺς ἑταίρους ταῦτα πάντα ποιεῖν. Ὁ Ὀδυσσεὺς κελεύει τοὺς ἑταίρους ἑαυτὸν καταδῆσαι. Οἱ δὲ ἑταῖροι πιστεύουσι τὸν Ὀδυσσέα ἄριστον ἡγεμόνα εἶναι, καὶ ὁμολογοῦσι πάντα ποιεῖν.","Μετὰ δὲ ταῦτα, ἡ ναῦς ἐγγὺς τῶν Σειρήνων ἔρχεται. Ὁ Ὀδυσσεὺς τὰς Σειρῆνας καλῶς ᾄδειν ἀκούει. Ὁ Ὀδυσσεὺς βούλεται πρὸς τὰς Σειρῆνας ἐλθεῖν. Ὁ ἥρως νομίζει τὰ τέρατα φίλα εἶναι. Διὰ τὴν τῆς φωνῆς ἡδονήν, ὁ Ὀδυσσεὺς κελεύει τοὺς ναύτας ἑαυτὸν λῦσαι.","Ἀλλὰ οἱ ναῦται τὸν Ὀδυσσέα οὐκ ἀκούουσιν. Οἱ ναῦται πιστεύουσι τὸν Ὀδυσσέα ἄφρονα νῦν εἶναι. Διὰ τοῦτο, οἱ ναῦται βούλονται τὸν ἥρωα σῴζειν καὶ τὸν ἱστὸν οὐ λείπουσιν. Οἱ ἑταῖροι νομίζουσι τὸ μένειν ἀναγκαῖον εἶναι.","Οὕτως ἡ ναῦς τὰς Σειρῆνας φεύγει. Ὁ Ὀδυσσεὺς μανθάνει τὸ ἄνευ τοῦ κηροῦ ἀκούειν μέγαν κίνδυνον εἶναι. Νῦν ὁ ἥρως ἐλπίζει ταχέως εἰς τὴν Ἰθάκην ἐπανελεύσεσθαι καὶ τὸν κίνδυνον διὰ παντὸς φυγεῖν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Ποῖ (cap a on) βούλεται ὁ Ὀδυσσεὺς ἐπανελθεῖν μετὰ τὸν πόλεμον;<\/li><li>Τί λέγει ἡ Κίρκη περὶ τῶν Σειρήνων;<\/li><li>Τί ἔχουσιν αἱ Σειρῆνες;<\/li><li>Τί φέρει τὸ ἀκούειν τὰ τέρατα;<\/li><li>Τί κελεύει ἡ θεὰ λαβεῖν καὶ βαλεῖν εἰς τὰ ὦτα;<\/li><li>Τί βούλεται ὁ Ὀδυσσεὺς ἀκοῦσαι;<\/li><li>Τί κελεύει ὁ Ὀδυσσεὺς τοὺς ἑταίρους ποιεῖν (què els mana fer);<\/li><li>Διὰ τί ὁ Ὀδυσσεὺς κελεύει τοὺς ναύτας ἑαυτὸν λῦσαι;<\/li><li>Ἆρα οἱ ναῦται τὸν Ὀδυσσέα λύουσιν;<\/li><li>Τί μανθάνει ὁ ἥρως πρὸς τῷ τέλει (al final);<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge o grup del mite les realitza. (Opcions: Ὁ Ὀδυσσεύς, Ἡ Κίρκη, Αἱ Σειρῆνες, Οἱ ναῦται / Οἱ ἑταῖροι).<\/em><\/p>\n<ul><li>Εἰς τὴν ἑαυτοῦ πατρίδα (Ἰθάκην) ἐπανελθεῖν βούλεται. (_______________)<\/li><li>Δεινὴ θεά ἐστιν καὶ κελεύει κηρὸν λαβεῖν. (_______________)<\/li><li>Δεινὰ τέρατά εἰσιν καὶ γυναικῶν φωνὴν ἔχουσιν. (_______________)<\/li><li>Κελεύει τοὺς ἑταίρους ἑαυτὸν καταδῆσαι πρὸς τὸν ἱστόν. (_______________)<\/li><li>Πιστεύουσι τὸν Ὀδυσσέα ἄριστον ἡγεμόνα εἶναι καὶ πάντα ποιοῦσιν. (_______________)<\/li><li>Τὸ ᾄδειν πάντας τοὺς ναύτας θέλγει. (_______________)<\/li><li>Τὰ τέρατα φίλα εἶναι νομίζει καὶ βούλεται ἑαυτὸν λῦσαι. (_______________)<\/li><li>Τὸν ἥρωα οὐκ ἀκούουσιν καὶ ἑαυτὸν οὐ λύουσιν. (_______________)<\/li><li>Νομίζουσι τὸ μένειν ἀναγκαῖον εἶναι. (_______________)<\/li><li>Ἐλπίζει ταχέως εἰς τὴν Ἰθάκην ἐπανελεύσεσθαι. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ἡ ναῦς ἐγγὺς τῶν Σειρήνων ἔρχεται.<\/li><li>☐ Ὁ Ὀδυσσεὺς μανθάνει τὸ ἀκούειν ἄνευ τοῦ κηροῦ μέγαν κίνδυνον εἶναι.<\/li><li>☐ Ἡ θεὰ κελεύει κηρὸν εἰς τὰ τῶν ναυτῶν ὦτα βαλεῖν.<\/li><li>☐ Ὁ Ὀδυσσεὺς βούλεται εἰς τὴν ἑαυτοῦ πατρίδα Ἰθάκην ἐπανελθεῖν.<\/li><li>☐ Ὁ ἥρως τὰ τέρατα φίλα εἶναι νομίζει καὶ κελεύει ἑαυτὸν λῦσαι.<\/li><li>☐ Ὁ Ὀδυσσεὺς τὰς Σειρῆνας καλῶς ᾄδειν ἀκούει.<\/li><li>☐ Ὁ Ὀδυσσεὺς κελεύει τοὺς ἑταίρους ἑαυτὸν καταδῆσαι πρὸς τὸν ἱστόν.<\/li><li>☐ Ἡ δεινὴ θεὰ Κίρκη λέγει τὰς Σειρῆνας κίνδυνον μέγαν εἶναι.<\/li><li>☐ Οὕτως ἡ ναῦς τὰς Σειρῆνας φεύγει.<\/li><li>☐ Ἀλλὰ οἱ ναῦται τὸν Ὀδυσσέα οὐκ ἀκούουσιν καὶ τὸν ἱστὸν οὐ λείπουσιν.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite (para molta atenció a la sintaxi de l'infinitiu).<\/em><\/p>\n<ul><li>Ὁ δὲ Ὀδυσσεὺς γιγνώσκει τὴν διὰ τῆς θαλάττης ὁδὸν μακρὰν καὶ χαλεπὴν εἶναι.<\/li><li>Ἡ Κίρκη λέγει τὰς Σειρῆνας κίνδυνον μέγαν εἶναι.<\/li><li>Ἐγὼ γὰρ φημι τὰς Σειρῆνας τοὺς ἀνθρώπους διαφθείρειν.<\/li><li>Τὸ γὰρ τὰς Σειρῆνας ᾄδειν πάντας τοὺς ναύτας θέλγει.<\/li><li>Ἀλλὰ ἐγὼ νομίζω πάντας τοὺς ναύτας ἀποθανεῖσθαι.<\/li><li>Τὸ μὴ ἀκούειν τὴν ναῦν σῴζει.<\/li><li>Ὁ Ὀδυσσεὺς νομίζει τοὺς τῆς Κίρκης λόγους ἀληθεῖς εἶναι.<\/li><li>Οἱ ἑταῖροι πιστεύουσι τὸν Ὀδυσσέα ἄριστον ἡγεμόνα εἶναι.<\/li><li>Ὁ Ὀδυσσεὺς τὰς Σειρῆνας καλῶς ᾄδειν ἀκούει.<\/li><li>Ὁ Ὀδυσσεὺς μανθάνει τὸ ἄνευ τοῦ κηροῦ ἀκούειν μέγαν κίνδυνον εἶναι.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>χρόνος<\/strong> (temps): ____________________<\/li><li><strong>φωνή<\/strong> (veu, so): ____________________<\/li><li><strong>γυνή, γυναικός<\/strong> (dona): ____________________<\/li><li><strong>πόλεμος<\/strong> (guerra): ____________________<\/li><li><strong>ὄνομα, ὀνόματος<\/strong> (nom): ____________________<\/li><li><strong>θάλαττα<\/strong> (mar): ____________________<\/li><li><strong>σοφία<\/strong> (saviesa): ____________________<\/li><li><strong>ναύτης<\/strong> (mariner): ____________________<\/li><li><strong>ταχύς, ταχεῖα, ταχύ<\/strong> (ràpid): ____________________<\/li><li><strong>ἀγορά<\/strong> (plaça, mercat): ____________________<\/li><\/ul>"},{"id":"t7a","unit":7,"kind":"a","title":"Ἡ πρὸς τὴν κώμην ὁδὸς καὶ οἱ λῃσταί","paras":["Τοῦ ἡλίου καταδύντος, ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι, καταλιπόντες τὰς Ἀθήνας, πρὸς τὴν ἑαυτῶν κώμην ἐπορεύοντο. Ὁ μὲν Ἀλέξανδρος, ἡγούμενος τῶν δούλων, τὰ ὅπλα ἔφερεν. Οὗτος γὰρ ὁ ἀνὴρ τοὺς ἐν τῇ ὁδῷ κινδύνους ἐγιγνώσκεν. Ὁ δὲ Δάος, φέρων τὰ πράγματα, σιγῇ εἵπετο. Ὁ δὲ Ξάνθος, ἄχθος τι ἐπὶ τῶν ὤμων ἔχων, ἀεὶ ἔκλαιεν.","Ὁ Ξάνθος, οὐκέτι βαίνειν βουλόμενος, ἵσταται καὶ λέγει· «Τίς ταῦτα τὰ πράγματα φέρειν δύναται; Ἐγώ εἰμι δοῦλος, οὐχ ἵππος! Ἆρα ὑμεῖς τὸν ἐμὸν πόνον οὐχ ὁρᾶτε; Ἐγὼ αὐτός, ὢν καματηρός, ἀναπαύσασθαι βούλομαι.».","Ὁ Ἀλέξανδρος, ἀκούσας ταῦτα τὰ ῥήματα, ὀργὴν ἔλαβεν καὶ εἶπεν αὐτῷ· «Σίγα, ὦ ἄφρων παῖ! Σὺ αὐτὸς ἤγαγες τοῦτον τὸν πόνον. Ἡμεῖς γάρ, διώκοντές σε, πρὸς τὴν πόλιν ἤλθομεν. Νῦν δὲ σιγῇ βαῖνε. Ἐκεῖνοι γὰρ οἱ στρατιῶται, τοῖς πολεμίοις μαχόμενοι, μείζονα πόνον ἔχουσιν. Σὺ οὖν μὴ κλαῖε!».","Ξαίφνης, τῶν ἀνθρώπων διὰ τῆς σκοτεινῆς ὕλης πορευομένων, ψόφος τις ἠκούσθη. Ὁ Ἀλέξανδρος, τὸν ψόφον ἀκούσας, τοὺς δούλους παύεσθαι ἐκέλευσεν. Ἐκ τῆς ὕλης ἄνδρες τινές, τὰ πρόσωπα κρύπτοντες καὶ ξίφη ἔχοντες, ἐφάνησαν.","Ὁ Ξάνθος, ἰδὼν τοὺς ἄνδρας καὶ μέγαν φόβον λαβών, ἐβόησεν· «Τίνες εἰσὶν οὗτοι οἱ ἄνδρες; Τί βούλονται;».","Ὁ Δάος, δεικνὺς τοὺς ἐχθρούς, ἀπεκρίνατο· «Οἱ ἐκ τῆς ὕλης ἐρχόμενοι λῃσταί εἰσιν! Αὐτοὶ βούλονται ἡμᾶς ἀποκτεῖναι καὶ τὰ πράγματα λαβεῖν!» Οἱ δὲ λῃσταί, ἰδόντες τοὺς ὁδοιπόρους, ὥρμησαν πρὸς αὐτούς. Ὁ πρῶτος λῃστής, ξίφος ἔχων, τὸν Ἀλέξανδρον πατάξαι ἤθελεν.","Ἀλλὰ ὁ Ἀλέξανδρος, οὐδὲν φοβούμενος, ἑτοιμότατος ἦν. Ὁ δεσπότης, τὸ ἑαυτοῦ ξίφος σπασάμενος, ἰσχυρῶς ἐμάχετο. Ὁ Ἀλέξανδρος, παίσας τὸν πρῶτον λῃστήν, αὐτὸν ἔβαλεν εἰς τὴν γῆν. Τοῦ δὲ πρώτου λῃστοῦ πεσόντος, ὁ δεύτερος τὸν Δάον ἁρπάσαι ἐπειρᾶτο. Ἀλλὰ ὁ Δάος, λίθον τινὰ λαβὼν καὶ βαλών, τὸν ἐχθρὸν ἔπληξεν.","Τῶν δὲ λῃστῶν νικηθέντων, οἱ ἄλλοι κακοὶ ἄνδρες, φοβηθέντες τὸν Ἀλέξανδρον καὶ τὸν Δάον, ταχέως εἰς τὴν ὕλην ἔφυγον. Οἱ φεύγοντες τὰ ὅπλα ἐν τῇ ὁδῷ κατέλιπον.","Τοῦ δὲ κινδύνου παυσαμένου, ὁ Ξάνθος, ὃς ὑπὸ δένδρῳ τινὶ κρυπτόμενος πάντα ἔβλεψεν, ἐξῆλθεν. Ὁ ἄφρων παῖς εἶπεν· «Ἆρα εἴδετε ταῦτα; Ἐγὼ αὐτοὺς ἐδίωξα! Οἱ λῃσταί, ἰδόντες ἐμὲ ἑτοίμαζοντα τὸ ξίφος, εὐθὺς ἔφυγον!».","Ὁ Δάος, ἀκούσας τὸν δοῦλον καὶ μέγα καταγελῶν, ἀπεκρίνατο· «Σύ; Ἡμεῖς εἴδομέν σε κρυπτόμενον καὶ κλαίοντα! Σὺ φεύγων ἔπεσες! Ὁ Ἀλέξανδρος ἡμᾶς ἔσωσεν, οὐ σύ!» Ὁ Ἀλέξανδρος, μειδιάσας, τοὺς δούλους τὰ πράγματα λαβεῖν ἐκέλευσεν. Οὕτως οἱ ἄνθρωποι, σωθέντες ἐκ τῶν λῃστῶν, τὴν ὁδὸν πρὸς τὴν κώμην αὖθις ἤρξαντο."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Ποῖ (cap a on) ἐπορεύοντο ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι τοῦ ἡλίου καταδύντος;<\/li><li>Τί ἔφερεν ὁ Ἀλέξανδρος, ἡγούμενος τῶν δούλων;<\/li><li>Διὰ τί ἵσταται ὁ Ξάνθος ἐν τῇ ὁδῷ;<\/li><li>Τίς ἔλαβεν ὀργὴν ἀκούσας τὰ τοῦ Ξάνθου ῥήματα;<\/li><li>Τίνες ἐφάνησαν ἐκ τῆς σκοτεινῆς ὕλης;<\/li><li>Τί ἐβούλοντο οἱ λῃσταὶ ποιεῖν (què volien fer);<\/li><li>Πῶς (com) ἐμάχετο ὁ Ἀλέξανδρος τὸ ἑαυτοῦ ξίφος σπασάμενος;<\/li><li>Τίνι (amb què) ἔπληξεν ὁ Δάος τὸν δεύτερον ἐχθρόν;<\/li><li>Ποῦ ἐκρύπτετο ὁ ἄφρων Ξάνθος τοῦ κινδύνου παυσαμένου;<\/li><li>Τίς ἔσωσεν τοὺς δούλους ἐκ τῶν λῃστῶν;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (S-C-V).<\/em><\/p>\n<ul><li>Τοῦ ἡλίου καταδύντος, ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι πρὸς τὰς Ἀθήνας ἐπορεύοντο.<\/li><li>Ὁ Ξάνθος, ἄχθος τι ἐπὶ τῶν ὤμων ἔχων, ἀεὶ ἐγέλα.<\/li><li>Ὁ Ἀλέξανδρος ὀργὴν ἔλαβεν καὶ εἶπεν· «Σίγα, ὦ ἄφρων παῖ!».<\/li><li>Τῶν ἀνθρώπων διὰ τῆς ὕλης πορευομένων, ψόφος τις ἠκούσθη.<\/li><li>Οἱ ἐκ τῆς ὕλης ἐρχόμενοι ἄνδρες στρατιῶταί εἰσιν.<\/li><li>Ὁ πρῶτος λῃστὴς τὸν Δάον πατάξαι ἤθελεν.<\/li><li>Ὁ Ἀλέξανδρος, οὐδὲν φοβούμενος, ἑτοιμότατος ἦν καὶ τὸ ἑαυτοῦ ξίφος ἐσπάσατο.<\/li><li>Ὁ Δάος, ἄλλο ξίφος λαβών, τὸν ἐχθρὸν ἔπληξεν.<\/li><li>Ὁ Ξάνθος τοὺς λῃστὰς ἐδίωξεν καὶ τοὺς ἄλλους ἔσωσεν.<\/li><li>Οἱ ἄνθρωποι, σωθέντες ἐκ τῶν λῃστῶν, τὴν ὁδὸν πρὸς τὴν κώμην αὖθις ἤρξαντο.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίνος καταδύντος ἐπορεύοντο οἱ ἄνθρωποι; (_______________)<\/li><li>Τίνα ἔφερεν ὁ Ἀλέξανδρος; [les armes] (_______________)<\/li><li>Τίς ἵσταται, οὐκέτι βαίνειν βουλόμενος; (_______________)<\/li><li>Τίνες ἔχουσιν μείζονα πόνον ἐν τῷ πολέμῳ; (_______________)<\/li><li>Τίνες ἐφάνησαν ἐκ τῆς ὕλης; [uns hòmens / els lladres] (_______________)<\/li><li>Τίνα πατάξαι ἤθελεν ὁ πρῶτος λῃστής; (_______________)<\/li><li>Τί σπασάμενος ἐμάχετο ὁ δεσπότης; [la seua espasa] (_______________)<\/li><li>Τί λαβὼν ἔπληξεν ὁ Δάος τὸν ἐχθρόν; [una pedra] (_______________)<\/li><li>Ὑπὸ τίνι ἐκρύπτετο ὁ Ξάνθος; [baix d'un cert arbre] (_______________)<\/li><li>Τίς ἔσωσεν τοὺς δούλους ἐν τῇ ὁδῷ; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (para atenció als participis i pronoms).<\/em><\/p>\n<ul><li>Τοῦ ἡλίου _____, ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι πρὸς τὴν κώμην ἐπορεύοντο.<\/li><li>Ὁ μὲν Ἀλέξανδρος, _____ τῶν δούλων, τὰ ὅπλα ἔφερεν.<\/li><li>Ὁ Ξάνθος, οὐκέτι βαίνειν _____, ἵσταται.<\/li><li>Ὁ Ἀλέξανδρος, _____ ταῦτα τὰ ῥήματα, ὀργὴν ἔλαβεν.<\/li><li>Ἐκ τῆς ὕλης ἄνδρες τινές, τὰ πρόσωπα _____ καὶ ξίφη ἔχοντες, ἐφάνησαν.<\/li><li>Οἱ _____ ἐρχόμενοι λῃσταί εἰσιν!<\/li><li>Ὁ δεσπότης, τὸ ἑαυτοῦ ξίφος _____, ἰσχυρῶς ἐμάχετο.<\/li><li>Τοῦ δὲ πρώτου λῃστοῦ _____, ὁ δεύτερος τὸν Δάον ἁρπάσαι ἐπειρᾶτο.<\/li><li>Τῶν δὲ λῃστῶν _____, οἱ ἄλλοι κακοὶ ἄνδρες ταχέως ἔφυγον.<\/li><li>Ὁ Δάος, ἀκούσας τὸν δοῦλον καὶ μέγα _____, ἀπεκρίνατο.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Els Pronoms (Demostratius i Personals).<\/em> <em>Canvia el pronom i el substantiu que l'acompanya de singular a plural o viceversa, mantenint el mateix gènere i cas.<\/em><\/p>\n<ul><li>ἐγώ εἰμι δοῦλος ➞ (_______________) ἐσμεν δοῦλοι.<\/li><li>οὗτος ὁ ἀνήρ ➞ (_______________)<\/li><li>ταῦτα τὰ ῥήματα ➞ (_______________)<\/li><li>ἐκεῖνοι οἱ στρατιῶται ➞ (_______________)<\/li><li>ὁ Ἀλέξανδρος ἡμᾶς ἔσωσεν ➞ ὁ Ἀλέξανδρος (_______________) ἔσωσεν.<\/li><\/ul>\n<p><em>Exercici B: El Participi Concertat.<\/em> <em>Transforma el primer verb de cada parell en un participi (concertant en cas Nominatiu amb el subjecte) per a unir les dues oracions en una sola. Fixa't en l'aspecte: usa el participi de present per a accions simultànies i el d'aorist per a accions anteriors.<\/em> <em>Exemple: Ὁ Δάος φέρει τὰ πράγματα. Ὁ Δάος ἕπεται. ➞ Ὁ Δάος, φέρων τὰ πράγματα, ἕπεται.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος ἀκούει (aorist: ἤκουσεν) τὸν ψόφον. Ὁ Ἀλέξανδρος τοὺς δούλους παύεσθαι ἐκέλευσεν. ➞ Ὁ Ἀλέξανδρος, ________ τὸν ψόφον, τοὺς δούλους…<\/li><li>Οἱ ἄνδρες κρύπτουσι τὰ πρόσωπα. Οἱ ἄνδρες ἐφάνησαν. ➞ Οἱ ἄνδρες, ________ τὰ πρόσωπα, ἐφάνησαν.<\/li><li>Ὁ Ἀλέξανδρος σπᾶται (aorist mitjà: ἐσπάσατο) τὸ ξίφος. Ὁ Ἀλέξανδρος ἐμάχετο. ➞ Ὁ Ἀλέξανδρος, τὸ ξίφος ________, ἐμάχετο.<\/li><li>Ὁ Δάος λαμβάνει (aorist: ἔλαβεν) λίθον. Ὁ Δάος τὸν ἐχθρὸν ἔπληξεν. ➞ Ὁ Δάος, λίθον ________, τὸν ἐχθρὸν ἔπληξεν.<\/li><li>Ὁ Ξάνθος κρύπτεται ὑπὸ δένδρῳ. Ὁ Ξάνθος πάντα ἔβλεψεν. ➞ Ὁ Ξάνθος, ὑπὸ δένδρῳ ________, πάντα ἔβλεψεν.<\/li><\/ul>\n<p><em>Exercici C: El Genitiu Absolut.<\/em> <em>Transforma l'oració temporal (introduïda mentalment per \"quan\" o \"mentre\") en una estructura de Genitiu Absolut. Posa el subjecte i el participi en genitiu.<\/em> <em>Exemple: Ὅτε (quan) ὁ ἥλιος κατέδυ ➞ Τοῦ ἡλίου καταδύντος…<\/em><\/p>\n<ul><li>Ὅτε οἱ ἄνθρωποι ἐπορεύοντο, ψόφος τις ἠκούσθη. ➞ (<strong><em>) διὰ τῆς ὕλης (<\/em><\/strong>), ψόφος τις ἠκούσθη.<\/li><li>Ὅτε ὁ πρῶτος λῃστὴς ἔπεσεν (aorist: πεσών), ὁ δεύτερος ὥρμησεν. ➞ (<strong><em>) πρώτου λῃστοῦ (<\/em><\/strong>), ὁ δεύτερος ὥρμησεν.<\/li><li>Ὅτε οἱ λῃσταὶ ἐνικήθησαν (aorist passiu: νικηθέντες), οἱ ἄλλοι ἔφυγον. ➞ (<strong><em>) λῃστῶν (<\/em><\/strong>), οἱ ἄλλοι ἔφυγον.<\/li><li>Ὅτε ὁ κίνδυνος ἐπαύσατο (aorist mitjà: παυσάμενος), ὁ Ξάνθος ἐξῆλθεν. ➞ (<strong><em>) κινδύνου (<\/em><\/strong>), ὁ Ξάνθος ἐξῆλθεν.<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Declina els substantius i pronoms, conjuga els verbs en la forma indicada (forma personal o participi) i ordena les paraules per a formar oracions correctes en grec, respectant l'estructura S-C-V i el Genitiu Absolut quan calga.<\/em><\/p>\n<ul><li>ὁ ἥλιος / καταδύω (participi aorist, genitiu) / ὁ / Ἀλέξανδρος / πορεύομαι (imperfet d'indicatiu).<\/li><li>οὗτος / ὁ / ἀνήρ / τὰ / ὅπλα / φέρω (imperfet).<\/li><li>ἐγώ / αὐτός / ἀναπαύομαι / βούλομαι (present).<\/li><li>ὁ / δεσπότης / τὸ / ἑαυτοῦ / ξίφος / σπάω (participi aorist mitjà, nominatiu) / μάχομαι (imperfet).<\/li><li>ὁ / Δάος / ὁ / δοῦλος / ἀκούω (participi aorist actiu, nominatiu) / καταγελάω (imperfet).<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text, parant especial atenció als participis i a les estructures absolutes.<\/em><\/p>\n<ul><li>Τοῦ ἡλίου καταδύντος, ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι πρὸς τὴν ἑαυτῶν κώμην ἐπορεύοντο.<\/li><li>Ὁ μὲν Ἀλέξανδρος, ἡγούμενος τῶν δούλων, τὰ ὅπλα ἔφερεν.<\/li><li>Ὁ Ξάνθος, οὐκέτι βαίνειν βουλόμενος, ἵσταται καὶ κλαίει.<\/li><li>Ὁ Ἀλέξανδρος, ἀκούσας ταῦτα τὰ ῥήματα, ὀργὴν ἔλαβεν.<\/li><li>Τῶν ἀνθρώπων διὰ τῆς σκοτεινῆς ὕλης πορευομένων, ψόφος τις ἠκούσθη.<\/li><li>Ὁ Ἀλέξανδρος, τὸ ἑαυτοῦ ξίφος σπασάμενος, ἰσχυρῶς ἐμάχετο.<\/li><li>Τοῦ δὲ πρώτου λῃστοῦ πεσόντος, ὁ δεύτερος τὸν Δάον ἁρπάσαι ἐπειρᾶτο.<\/li><li>Ὁ Δάος, λίθον τινὰ λαβὼν καὶ βαλών, τὸν ἐχθρὸν ἔπληξεν.<\/li><li>Τῶν δὲ λῃστῶν νικηθέντων, οἱ ἄλλοι ταχέως εἰς τὴν ὕλην ἔφυγον.<\/li><li>Οὕτως οἱ ἄνθρωποι, σωθέντες ἐκ τῶν λῃστῶν, τὴν ὁδὸν αὖθις ἤρξαντο.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 7 i respectant l'estructura S-C-V i l'ortografia politònica. Para atenció a l'ús dels pronoms (οὗτος, ἐκεῖνος, αὐτός) i a les construccions de participi.<\/em><\/p>\n<ul><li>En pondre's el sol (Gen. Absolut), els hòmens caminaven cap a l'aldea.<\/li><li>Este home (οὗτος), portant (participi present) les armes, liderava els esclaus.<\/li><li>Sentint estes paraules (participi aorist), el senyor es va enfadar (va agafar ira).<\/li><li>Mentre els hòmens caminaven pel bosc (Gen. Absolut), van aparéixer uns lladres.<\/li><li>Ells mateixos (Αὐτοί) volien matar el senyor.<\/li><li>Havent caigut el primer lladre (Gen. Absolut), els altres van fugir.<\/li><li>Dau, agafant una pedra (participi aorist), va colpejar l'enemic.<\/li><li>Havent sigut vençuts els lladres (Gen. Absolut passiu), els esclaus es van salvar.<\/li><li>Xantos deia açò, amagant-se (participi present mitjà) baix d'un arbre.<\/li><li>Nosaltres mateixos (ἡμεῖς αὐτοί) vam veure els lladres fugint (participi present en acusatiu).<\/li><\/ul>"},{"id":"t7b","unit":7,"kind":"b","title":"Ὁ Ἰάσων, ἡ Μήδεια καὶ τὸ χρυσόμαλλον δέρας","paras":["Τὸ παλαιόν, ὁ Ἰάσων, βουλόμενος τὸ χρυσόμαλλον δέρας λαβεῖν, εἰς τὴν Κολχίδα μετὰ τῶν ἑταίρων ἦλθεν. Τοῦτο τὸ δέρας ἱερώτατον ἦν καὶ μέγιστον πλοῦτον ἔφερεν. Ἀλλὰ τὸ λαβεῖν τὸ δέρας χαλεπώτατον ἦν. Τὸ γὰρ δέρας, κρεμάμενον ἐπὶ δένδρου τινός, ἐν σκοτεινῇ ὕλῃ ἦν. Δράκων τις, ἄγριος καὶ μέγιστος ὤν, αὐτὸ ἐφύλαττεν.","Οὗτος ὁ δράκων, ἀεὶ βλέπων καὶ οὐδέποτε καθεύδων, δεινότατος ἦν. Ἐκ τοῦ στόματος πῦρ καὶ θάνατον ἔφερεν. Τίς οὖν οἷός τε ἦν τοῦτον τὸν δράκοντα ἀποκτεῖναι καὶ τὸ δέρας λαβεῖν; Πολλοὶ ἄνδρες, πειρασάμενοι τὸ δέρας ἁρπάσαι, ὑπὸ τοῦ θηρίου ἀπέθανον. Οἱ ἀποθανόντες οὐκέτι τὴν ἑαυτῶν πατρίδα εἶδον.","Ἡ δὲ Μήδεια κόρη τοῦ τῆς Κολχίδος βασιλέως ἦν. Αὕτη ἡ γυνή, ἰδοῦσα τὸν Ἰάσονα καὶ θαυμάσασα τὴν αὐτοῦ ἀνδρείαν, εὐθὺς αὐτὸν ἐφίλησεν. Ἡ Μήδεια, σοφωτάτη οὖσα, φάρμακά τινα μαγικὰ εἶχεν. Ἡ κόρη, σῶσαι τὸν ἥρωα βουλομένη, κρύφα πρὸς αὐτὸν ἦλθεν.","Ἡ Μήδεια τῷ Ἰάσονι εἶπεν· «Ἐγὼ οἶδα τοῦτον τὸν κίνδυνον. Οὐδεὶς ἄνθρωπος, μαχόμενος τῷ δράκοντι, σωθῆναι δύναται. Ἀλλὰ ἐγώ, φιλοῦσά σε, τοῦτο τὸ φάρμακόν σοι δώσω. Τοῦτο τὸ φάρμακον τὸν δράκοντα κοιμίσει. Σὺ δὲ ὀμόσον ἐμὲ γυναῖκα ἕξειν.» Ὁ Ἰάσων, δεξάμενος τὸ φάρμακον, ταῦτα πάντα ποιεῖν ὡμολόγησεν.","Τῆς νυκτὸς γενομένης, ἐκεῖνος ὁ ἥρως καὶ ἡ γυνὴ πρὸς τὴν ὕλην ἦλθον. Ὁ δράκων, ἀκούσας ψόφον τινά, τὸ πῦρ ἑτοίμαζεν. Ἀλλὰ ἡ Μήδεια, προσελθοῦσα τῷ δράκοντι καὶ ᾄδουσα καλὴν ᾠδήν, τὸ φάρμακον αὐτῷ ἔδωκεν. Τοῦ δράκοντος τὸ φάρμακον πιόντος, βαθὺς ὕπνος αὐτὸν ἔλαβεν. Ὁ ἄγριος φύλαξ τοὺς ὀφθαλμοὺς ἔκλεισεν.","Τοῦ θηρίου καθεύδοντος, ὁ Ἰάσων, προσελθὼν τῷ δένδρῳ καὶ λαβὼν τὸ χρυσόμαλλον δέρας, ταχέως ἔφυγεν. Ἡ Μήδεια, ἑπομένη τῷ Ἰάσονι, τὴν ἑαυτῆς πατρίδα κατέλιπεν. Οἱ ἄλλοι Ἕλληνες, ἰδόντες τὸν Ἰάσονα τὸ δέρας φέροντα, μεγάλως ἔχαιρον. Οὕτως οὗτος ὁ ἥρως, σωθεὶς ὑπὸ ταύτης τῆς γυναικός, τὸ δῶρον ἔλαβεν καὶ μεγάλην δόξαν ηὗρεν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Ποῖ (cap a on) ἦλθεν ὁ Ἰάσων μετὰ τῶν ἑταίρων;<\/li><li>Τί ἔφερεν τὸ χρυσόμαλλον δέρας;<\/li><li>Ποῦ ἦν τὸ δέρας, κρεμάμενον ἐπὶ δένδρου τινός;<\/li><li>Τίς ἐφύλαττεν τὸ δέρας ἐν τῇ σκοτεινῇ ὕλῃ;<\/li><li>Τί ἔφερεν ὁ ἄγριος δράκων ἐκ τοῦ στόματος;<\/li><li>Τίς ἦν ἡ Μήδεια;<\/li><li>Διὰ τί ἡ Μήδεια τὸν Ἰάσονα εὐθὺς ἐφίλησεν (per què el va estimar de sobte);<\/li><li>Τί ἔδωκεν ἡ κόρη τῷ Ἰάσονι;<\/li><li>Τί ἐγένετο τοῦ δράκοντος τὸ φάρμακον πιόντος (què va ocórrer havent begut…);<\/li><li>Τί ἐποίησεν ὁ Ἰάσων τοῦ θηρίου καθεύδοντος;<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents (moltes de les quals usen participis) i escriu en cas nominatiu quin personatge o grup del mite les realitza. (Opcions: Ὁ Ἰάσων, Ἡ Μήδεια, Ὁ δράκων, Πολλοὶ ἄνδρες, Οἱ ἄλλοι Ἕλληνες).<\/em><\/p>\n<ul><li>Βουλόμενος τὸ χρυσόμαλλον δέρας λαβεῖν, εἰς τὴν Κολχίδα ἦλθεν. (_______________)<\/li><li>Ἀεὶ βλέπων καὶ οὐδέποτε καθεύδων, τὸ δέρας ἐφύλαττεν. (_______________)<\/li><li>Πειρασάμενοι τὸ δέρας ἁρπάσαι, ὑπὸ τοῦ θηρίου ἀπέθανον. (_______________)<\/li><li>Ἰδοῦσα τὸν Ἰάσονα καὶ θαυμάσασα τὴν ἀνδρείαν, εὐθὺς αὐτὸν ἐφίλησεν. (_______________)<\/li><li>Σῶσαι τὸν ἥρωα βουλομένη, κρύφα πρὸς αὐτὸν ἦλθεν καὶ φάρμακον ἔδωκεν. (_______________)<\/li><li>Δεξάμενος τὸ φάρμακον, τὴν Μήδειαν γυναῖκα ἕξειν ὡμολόγησεν. (_______________)<\/li><li>Ἀκούσας ψόφον τινά, τὸ πῦρ ἑτοίμαζεν. (_______________)<\/li><li>ᾌδουσα καλὴν ᾠδήν, τὸ φάρμακον τῷ θηρίῳ ἔδωκεν. (_______________)<\/li><li>Προσελθὼν τῷ δένδρῳ καὶ λαβὼν τὸ χρυσόμαλλον δέρας, ταχέως ἔφυγεν. (_______________)<\/li><li>Ἰδόντες τὸν ἥρωα τὸ δέρας φέροντα, μεγάλως ἔχαιρον. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ Ἰάσων ὡμολόγησεν τὴν Μήδειαν γυναῖκα ἕξειν.<\/li><li>☐ Οἱ ἄλλοι Ἕλληνες, ἰδόντες τὸν Ἰάσονα τὸ δέρας φέροντα, μεγάλως ἔχαιρον.<\/li><li>☐ Ὁ Ἰάσων εἰς τὴν Κολχίδα ἦλθεν, τὸ χρυσόμαλλον δέρας λαβεῖν βουλόμενος.<\/li><li>☐ Ἡ Μήδεια, ἰδοῦσα τὸν ἥρωα καὶ τὴν ἀνδρείαν θαυμάσασα, αὐτὸν ἐφίλησεν.<\/li><li>☐ Τοῦ δράκοντος τὸ φάρμακον πιόντος, βαθὺς ὕπνος αὐτὸν ἔλαβεν.<\/li><li>☐ Ἄγριος δράκων, ἀεὶ βλέπων καὶ οὐδέποτε καθεύδων, τὸ δέρας ἐφύλαττεν.<\/li><li>☐ Ἡ Μήδεια, καλὴν ᾠδὴν ᾄδουσα, τὸ φάρμακον τῷ δράκοντι ἔδωκεν.<\/li><li>☐ Τοῦ θηρίου καθεύδοντος, ὁ Ἰάσων τὸ δέρας ἔλαβεν καὶ ταχέως ἔφυγεν.<\/li><li>☐ Ἡ κόρη φάρμακόν τι τῷ Ἰάσονι ἔδωκεν.<\/li><li>☐ Τῆς νυκτὸς γενομένης, ἐκεῖνος ὁ ἥρως καὶ ἡ γυνὴ πρὸς τὴν ὕλην ἦλθον.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite (para molta atenció als participis apositius i les construccions de Genitiu Absolut).<\/em><\/p>\n<ul><li>Ὁ Ἰάσων, βουλόμενος τὸ χρυσόμαλλον δέρας λαβεῖν, εἰς τὴν Κολχίδα μετὰ τῶν ἑταίρων ἦλθεν.<\/li><li>Τὸ γὰρ δέρας, κρεμάμενον ἐπὶ δένδρου τινός, ἐν σκοτεινῇ ὕλῃ ἦν.<\/li><li>Οὗτος ὁ δράκων, ἀεὶ βλέπων καὶ οὐδέποτε καθεύδων, δεινότατος ἦν.<\/li><li>Πολλοὶ ἄνδρες, πειρασάμενοι τὸ δέρας ἁρπάσαι, ὑπὸ τοῦ θηρίου ἀπέθανον.<\/li><li>Αὕτη ἡ γυνή, ἰδοῦσα τὸν Ἰάσονα καὶ θαυμάσασα τὴν αὐτοῦ ἀνδρείαν, εὐθὺς αὐτὸν ἐφίλησεν.<\/li><li>Ἡ κόρη, σῶσαι τὸν ἥρωα βουλομένη, κρύφα πρὸς αὐτὸν ἦλθεν.<\/li><li>Ὁ Ἰάσων, δεξάμενος τὸ φάρμακον, ταῦτα πάντα ποιεῖν ὡμολόγησεν.<\/li><li>Τῆς νυκτὸς γενομένης, ἐκεῖνος ὁ ἥρως καὶ ἡ γυνὴ πρὸς τὴν ὕλην ἦλθον.<\/li><li>Τοῦ δράκοντος τὸ φάρμακον πιόντος, βαθὺς ὕπνος αὐτὸν ἔλαβεν.<\/li><li>Οὕτως οὗτος ὁ ἥρως, σωθεὶς ὑπὸ ταύτης τῆς γυναικός, τὸ δῶρον ἔλαβεν καὶ μεγάλην δόξαν ηὗρεν.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>χρόνος<\/strong> (temps): ____________________<\/li><li><strong>φωνή<\/strong> (veu, so): ____________________<\/li><li><strong>γυνή, γυναικός<\/strong> (dona): ____________________<\/li><li><strong>πόλεμος<\/strong> (guerra): ____________________<\/li><li><strong>ὄνομα, ὀνόματος<\/strong> (nom): ____________________<\/li><li><strong>θάλαττα<\/strong> (mar): ____________________<\/li><li><strong>σοφία<\/strong> (saviesa): ____________________<\/li><li><strong>ναύτης<\/strong> (mariner): ____________________<\/li><li><strong>ταχύς, ταχεῖα, ταχύ<\/strong> (ràpid): ____________________<\/li><li><strong>ἀγορά<\/strong> (plaça, mercat): ____________________<\/li><\/ul>"},{"id":"t8a","unit":8,"kind":"a","title":"Ἡ ἐπάνοδος καὶ τὰ τοῦ Ξάνθου τραύματα","paras":["Μετὰ τὴν μάχην, ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι πρὸς τὴν κώμην πάλιν ἐπορεύοντο. Ἡ οἰκία, εἰς ἣν οἱ ἄνθρωποι ἔβαινον, καλὴ καὶ ἀσφαλής ἦν. Ἡ Ἑλένη, ἣ γυνὴ τοῦ Ἀλεξάνδρου ἐστίν, πρὸ τῆς θύρας ἔμενεν. Ἡ δέσποινα, ἰδοῦσα τοὺς ἄνδρας προσερχομένους, μεγάλως ἔχαιρεν.","Ἀλλὰ ὁ Ξάνθος, ὃς ὁ ἀργὸς δοῦλός ἐστιν, καματηρὸς ἦν καὶ μέγα ἄχθος ἔφερεν. Τὸ ἱμάτιον, ὃ ὁ Ξάνθος ἐφόρει, ὑπὸ τῶν λῃστῶν ἐσχίσθη. Τὸ πρόσωπον αὐτοῦ λίθῳ τινὶ ἐπαίσθη, καὶ τὸ τοῦ δούλου αἷμα εἰς τὴν γῆν ἔπιπτεν.","Ἡ Ἑλένη, ἰδοῦσα τὸν Ξάνθον, μέγαν φόβον ἔλαβεν καὶ ἐβόησεν· «Ὦ Ἀλέξανδρε, τί ἐγένετο ἐν τῇ ὁδῷ; Ὑπὸ τίνος οὗτος ὁ δοῦλος ἐπαίσθη; Διὰ τί τὰ ἱμάτια, ἃ ἐφόρει, οὕτως ἐσχίσθη;».","Ὁ Ἀλέξανδρος, ὃς τὰ ὅπλα ἐν ταῖς χερσὶν εἶχεν, ἀπεκρίνατο· «Ὦ Ἑλένη, ἡμεῖς ἐν τῇ ὕλῃ μεγάλῳ κινδύνῳ περιεπέσομεν. Λῃσταί τινες, οἳ τὰ πρόσωπα ἔκρυπτον, ἐκ τῆς ὕλης ἐξῆλθον. Ἡμεῖς ὑπὸ τῶν λῃστῶν ἐπολεμήθημεν. Οἱ κακοὶ ἄνδρες, οὓς ἐν τῇ ὁδῷ εἴδομεν, ἡμᾶς ἀποκτεῖναι ἐβούλοντο. Ἀλλὰ ἡμεῖς ὑπὸ τῶν θεῶν ἐσώθημεν.».","Ἡ Ἑλένη ἠρώτησεν· «Ἆρα οἱ λῃσταί, περὶ ὧν λέγεις, τὸν Ξάνθον ἔπαισαν;».","Ὁ Δάος, ὃς τὸν ὄνον ἦγεν, εἶπεν· «Ναί, ὦ δέσποινα. Ὁ Ξάνθος ὑπὸ τῶν λῃστῶν ἐδιώχθη. Ὁ παῖς, ὃν ὁρᾷς, ὑπὸ δένδρῳ τινὶ ἐκρύφθη. Ἀλλὰ λῃστής τις αὐτὸν εὗρεν. Οὕτως ὁ Ξάνθος λίθῳ ἐπαίσθη καὶ μεγάλως ἐβλάφθη. Ὁ Ξάνθος, ὃς ἀεὶ τὸν πόνον φεύγει, ὑπὸ τοῦ φόβου ἐβιάσθη κλαίειν.».","Ὁ Ξάνθος, ἀκούσας ταῦτα τὰ ῥήματα, ὀργὴν ἔλαβεν καὶ ἀπεκρίνατο· «Οἱ τοῦ Δάου λόγοι ψευδεῖς εἰσιν! Ἐγὼ ἰσχυρῶς ἐμαχόμην! Οἱ λῃσταί, ὑφ' ὧν ἐπολεμήθημεν, ὑπ' ἐμοῦ ἐδιώχθησαν!».","Ὁ Ἀλέξανδρος δὲ ἐγέλασεν καὶ εἶπεν· «Σίγα, ὦ Ξάνθε. Οἱ λῃσταί, οὓς σὺ λέγεις, ὑπὸ τοῦ ἐμοῦ ξίφους ἐδιώχθησαν. Ὁ πρῶτος λῃστὴς ὑπ' ἐμοῦ ἐπαίσθη καὶ εἰς τὴν γῆν ἐβλήθη. Οἱ ἄλλοι λῃσταί, φόβῳ ληφθέντες, ταχέως ἔφυγον. Οὕτως ἡμεῖς ἐσώθημεν καὶ τὰ πράγματα, ἃ ἐφέρομεν, οὐκ ἐκλάπη.».","Ἡ Ἑλένη, ἀκούσασα τοὺς ἀληθεῖς λόγους, τὸν Ἀλέξανδρον καὶ τὸν Δάον ἐθαύμασεν. Ἡ δέσποινα ἐκέλευσεν τὸν Ξάνθον εἰς τὴν οἰκίαν εἰσελθεῖν. Τὰ τοῦ Ξάνθου τραύματα ὑπὸ τῆς Ἑλένης ὕδατι ἐπλύθη. Οὕτως ὁ δοῦλος ἐθεραπεύθη καὶ ὑπὸ τοῦ ὕπνου ἐλήφθη. Οἱ δὲ ἄλλοι ἄνθρωποι, οἳ ἐν τῇ ὁδῷ ἐσώθησαν, ἐν τῇ ἀσφαλεῖ οἰκίᾳ ἡσύχως ἀνεπαύσαντο."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Ποῖ (cap a on) ἐπορεύοντο ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι μετὰ τὴν μάχην;<\/li><li>Τίς ἔμενεν πρὸ τῆς θύρας;<\/li><li>Ὑπὸ τίνος ἐσχίσθη τὸ ἱμάτιον ὃ ὁ Ξάνθος ἐφόρει;<\/li><li>Τί ἔλαβεν ἡ Ἑλένη ἰδοῦσα τὸν Ξάνθον;<\/li><li>Τίνες ἐξῆλθον ἐκ τῆς ὕλης;<\/li><li>Ὑπὸ τίνων ἐσώθησαν ὁ Ἀλέξανδρος καὶ οἱ δοῦλοι;<\/li><li>Ποῦ (on / davall de què) ἐκρύφθη ὁ Ξάνθος;<\/li><li>Ἆρα ὁ Ξάνθος ἰσχυρῶς ἐμάχετο;<\/li><li>Ὑπὸ τίνος ἐπαίσθη καὶ εἰς τὴν γῆν ἐβλήθη ὁ πρῶτος λῃστής;<\/li><li>Τίνι (amb què) ἐπλύθη τὰ τοῦ Ξάνθου τραύματα;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (S-C-V).<\/em><\/p>\n<ul><li>Ἡ Ἑλένη, ἣ γυνὴ τοῦ Ἀλεξάνδρου ἐστίν, πρὸ τῆς θύρας ἔμενεν.<\/li><li>Τὸ ἱμάτιον, ὃ ὁ Δάος ἐφόρει, ὑπὸ τῶν λῃστῶν ἐσχίσθη.<\/li><li>Ὁ Ἀλέξανδρος εἶπεν ὅτι οἱ λῃσταὶ αὐτοὺς ἀποκτεῖναι ἐβούλοντο.<\/li><li>Ὁ Ξάνθος ὑπὸ τῶν λῃστῶν οὐκ ἐδιώχθη, ἀλλὰ ἰσχυρῶς ἐμάχετο.<\/li><li>Ὁ Ξάνθος ὑπὸ δένδρῳ τινὶ ἐκρύφθη καὶ λίθῳ ἐπαίσθη.<\/li><li>Οἱ λῃσταὶ ὑπὸ τοῦ Ξάνθου ἐδιώχθησαν.<\/li><li>Ὁ πρῶτος λῃστὴς ὑπὸ τοῦ Ἀλεξάνδρου ἐπαίσθη καὶ εἰς τὴν γῆν ἐβλήθη.<\/li><li>Τὰ πράγματα, ἃ οἱ δοῦλοι ἐφέρον, ἐκλάπη ὑπὸ τῶν λῃστῶν.<\/li><li>Τὰ τοῦ Ξάνθου τραύματα ὑπὸ τοῦ Δάου ὕδατι ἐπλύθη.<\/li><li>Οἱ ἄνθρωποι, οἳ ἐσώθησαν, ἐν τῇ ὕλῃ ἀνεπαύσαντο.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Ποῖ ἐπορεύοντο οἱ ἄνθρωποι μετὰ τὴν μάχην; (_______________)<\/li><li>Τίς ἔμενεν πρὸ τῆς θύρας; (_______________)<\/li><li>Τί ἐσχίσθη ὑπὸ τῶν λῃστῶν; [el mantell] (_______________)<\/li><li>Ὑπὸ τίνος ἐπαίσθη τὸ πρόσωπον τοῦ Ξάνθου; [per una pedra] (_______________)<\/li><li>Τί εἶχεν ὁ Ἀλέξανδρος ἐν ταῖς χερσίν; (_______________)<\/li><li>Ὑπὸ τίνων ἐπολεμήθησαν οἱ ἄνθρωποι; (_______________)<\/li><li>Τίνα ἦγεν ὁ Δάος; [l'ase] (_______________)<\/li><li>Ὑπὸ τίνι ἐκρύφθη ὁ Ξάνθος; (_______________)<\/li><li>Ὑπὸ τίνος ἐβλήθη εἰς τὴν γῆν ὁ πρῶτος λῃστής; [per la meua espasa] (_______________)<\/li><li>Τίνι ἐπλύθη τὰ τραύματα; [amb aigua] (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (para atenció als pronoms relatius i als aorists passius).<\/em><\/p>\n<ul><li>Ἡ οἰκία, εἰς _____ οἱ ἄνθρωποι ἔβαινον, καλὴ καὶ ἀσφαλής ἦν.<\/li><li>Ἡ Ἑλένη, _____ γυνὴ τοῦ Ἀλεξάνδρου ἐστίν, πρὸ τῆς θύρας ἔμενεν.<\/li><li>Τὸ ἱμάτιον, _____ ὁ Ξάνθος ἐφόρει, ὑπὸ τῶν λῃστῶν _____.<\/li><li>Οἱ κακοὶ ἄνδρες, _____ ἐν τῇ ὁδῷ εἴδομεν, ἡμᾶς ἀποκτεῖναι ἐβούλοντο.<\/li><li>Ὁ Ξάνθος, _____ ἀεὶ τὸν πόνον φεύγει, ὑπὸ τοῦ φόβου _____ κλαίειν.<\/li><li>Ὁ παῖς, ὃν ὁρᾷς, ὑπὸ δένδρῳ τινὶ _____.<\/li><li>Ὁ πρῶτος λῃστὴς ὑπ' ἐμοῦ _____ καὶ εἰς τὴν γῆν _____.<\/li><li>Οὕτως ἡμεῖς _____ καὶ τὰ πράγματα, ἃ ἐφέρομεν, οὐκ _____.<\/li><li>Τὰ τοῦ Ξάνθου τραύματα ὑπὸ τῆς Ἑλένης ὕδατι _____.<\/li><li>Οὕτως ὁ δοῦλος _____ καὶ ὑπὸ τοῦ ὕπνου _____.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Ἡ ἀναφορικὴ ἀντωνυμία (El Pronom Relatiu).<\/em> <em>Unix les dues oracions en una de sola convertint el substantiu repetit de la segona frase en un pronom relatiu (ὅς, ἥ, ὅ). Recorda la regla d'or: concorda en gènere i nombre amb l'antecedent, però el cas depén de la seua funció a la nova oració.<\/em> <em>Exemple: Ὁ δοῦλος ἔκλαιεν. Ὁ Ἀλέξανδρος τὸν δοῦλον ὁρᾷ. ➞ Ὁ δοῦλος, ὃν ὁ Ἀλέξανδρος ὁρᾷ, ἔκλαιεν.<\/em><\/p>\n<ul><li>Ἡ οἰκία ἀσφαλής ἦν. Οἱ ἄνθρωποι εἰς τὴν οἰκίαν ἔβαινον. ➞ Ἡ οἰκία, εἰς ______ οἱ ἄνθρωποι ἔβαινον, ἀσφαλής ἦν.<\/li><li>Ἡ Ἑλένη πρὸ τῆς θύρας ἔμενεν. Ἡ Ἑλένη γυνὴ τοῦ Ἀλεξάνδρου ἐστίν. ➞ Ἡ Ἑλένη, ______ γυνὴ τοῦ Ἀλεξάνδρου ἐστίν, πρὸ τῆς θύρας ἔμενεν.<\/li><li>Τὸ ἱμάτιον ἐσχίσθη. Ὁ Ξάνθος τὸ ἱμάτιον ἐφόρει. ➞ Τὸ ἱμάτιον, ______ ὁ Ξάνθος ἐφόρει, ἐσχίσθη.<\/li><li>Οἱ ἄνδρες ἡμᾶς ἀποκτεῖναι ἐβούλοντο. Ἡμεῖς τοὺς ἄνδρας εἴδομεν. ➞ Οἱ ἄνδρες, ______ ἡμεῖς εἴδομεν, ἡμᾶς ἀποκτεῖναι ἐβούλοντο.<\/li><li>Οἱ λῃσταὶ ἔφυγον. Ἡμεῖς ὑπὸ τῶν λῃστῶν ἐπολεμήθημεν. ➞ Οἱ λῃσταί, ὑφ' ______ ἡμεῖς ἐπολεμήθημεν, ἔφυγον.<\/li><\/ul>\n<p><em>Exercici B: Παθητικὸς Ἀόριστος (De l'Aorist Actiu a l'Aorist Passiu).<\/em> <em>Transforma l'oració activa en passiva. El CD passarà a ser Subjecte (nominatiu), el Subjecte passarà a ser Complement Agent (ὑπό + genitiu) i el verb canviarà d'Aorist Actiu a Aorist Passiu (-θη- / -η-).<\/em> <em>Exemple: Ὁ Ἀλέξανδρος τὸν δοῦλον ἔλυσεν ➞ Ὁ δοῦλος ὑπὸ τοῦ Ἀλεξάνδρου ἐλύθη.<\/em><\/p>\n<ul><li>Οἱ λῃσταὶ τὸ ἱμάτιον ἔσχισαν (esquinçaren). ➞ Τὸ ἱμάτιον…<\/li><li>Οἱ λῃσταὶ τὸν Ξάνθον ἐδίωξαν. ➞ Ὁ Ξάνθος…<\/li><li>Ὁ Ἀλέξανδρος τὸν πρῶτον λῃστὴν ἔπαισεν. ➞ Ὁ πρῶτος λῃστὴς…<\/li><li>Ὁ Ἀλέξανδρος τὸν πρῶτον λῃστὴν ἔβαλεν. ➞ Ὁ πρῶτος λῃστὴς… (Aor. Passiu: ἐβλήθη)<\/li><li>Ἡ Ἑλένη τὰ τραύματα ἔπλυνεν. ➞ Τὰ τραύματα…<\/li><\/ul>\n<p><em>Exercici C: Ἀπὸ τοῦ ἑνικοῦ εἰς τὸν πληθυντικόν.<\/em> <em>Canvia de singular a plural (o viceversa) les següents oracions passives amb relatiu. Para esment a la regla del neutre plural amb verb en singular!<\/em><\/p>\n<ul><li>Ὁ λῃστής, ὃς ἐφάνη, ἐδιώχθη. ➞ Οἱ λῃσταί, …<\/li><li>Τὸ ἱμάτιον, ὃ ἐφόρει, ἐσχίσθη. ➞ Τὰ ἱμάτια, ἃ ἐφόρει, … <em>(Alerta al verb passiu!)<\/em><\/li><li>Ὁ δοῦλος ὑπὸ τοῦ λῃστοῦ ἐπαίσθη. ➞ Οἱ δοῦλοι…<\/li><li>Ἡμεῖς ὑπὸ τῶν θεῶν ἐσώθημεν. ➞ Ἐγώ…<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Declina els substantius i pronoms relatius, conjuga els verbs en Aorist Passiu i ordena les paraules per a formar oracions correctes en grec, respectant l'estructura S-C-V.<\/em><\/p>\n<ul><li>ἡ / οἰκία / εἰς / ὅς (fem. sg. acusatiu) / ἡμεῖς / βαίνειν (imperfet) / ἀσφαλής / εἶναι.<\/li><li>τὸ / ἱμάτιον / ὑπὸ / οἱ / λῃσταί / σχίζω (aorist passiu).<\/li><li>ὁ / δοῦλος / ὅς (masc. sg. nom.) / λίθος (datiu instrument) / παίω (aor. passiu) / κρύπτω (aor. passiu).<\/li><li>ἡμεῖς / ὑπὸ / οἱ / θεοί / σῴζω (aorist passiu).<\/li><li>τὰ / τραύματα / ὕδωρ (datiu instrument) / πλύνω (aorist passiu). <em>(Recorda la regla del verb amb el subjecte neutre plural).<\/em><\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text, parant especial atenció a les subordinades de relatiu i als verbs en aorist passiu.<\/em><\/p>\n<ul><li>Ἡ οἰκία, εἰς ἣν οἱ ἄνθρωποι ἔβαινον, καλὴ καὶ ἀσφαλής ἦν.<\/li><li>Τὸ ἱμάτιον, ὃ ὁ Ξάνθος ἐφόρει, ὑπὸ τῶν λῃστῶν ἐσχίσθη.<\/li><li>Τὸ πρόσωπον αὐτοῦ λίθῳ τινὶ ἐπαίσθη.<\/li><li>Ἡμεῖς ὑπὸ τῶν λῃστῶν ἐπολεμήθημεν.<\/li><li>Οἱ κακοὶ ἄνδρες, οὓς ἐν τῇ ὁδῷ εἴδομεν, ἡμᾶς ἀποκτεῖναι ἐβούλοντο.<\/li><li>Ὁ Ξάνθος, ὃς ἀεὶ τὸν πόνον φεύγει, ὑπὸ τῶν λῃστῶν ἐδιώχθη.<\/li><li>Ὁ παῖς, ὃν ὁρᾷς, ὑπὸ δένδρῳ τινὶ ἐκρύφθη.<\/li><li>Οἱ λῃσταί, οὓς σὺ λέγεις, ὑπὸ τοῦ ἐμοῦ ξίφους ἐδιώχθησαν.<\/li><li>Τὰ πράγματα, ἃ ἐφέρομεν, οὐκ ἐκλάπη.<\/li><li>Τὰ τοῦ Ξάνθου τραύματα ὑπὸ τῆς Ἑλένης ὕδατι ἐπλύθη καὶ ὁ δοῦλος ἐθεραπεύθη.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 8 i respectant l'estructura S-C-V i l'ortografia politònica. Para atenció als pronoms relatius (ὅς, ἥ, ὅ) i a la veu passiva (sufix -θη-).<\/em><\/p>\n<ul><li>La casa, a la qual (εἰς ἣν) anem, és segura.<\/li><li>La roba, que (ὃ) portava Xantos, va ser trencada (ἐσχίσθη) pels lladres.<\/li><li>El rostre de l'esclau va ser colpejat (ἐπαίσθη) amb una pedra.<\/li><li>Nosaltres vam ser atacats i salvats (ἐσώθημεν) pels déus.<\/li><li>L'esclau, el qual (ὃν) veus, es va amagar (ἐκρύφθη) baix d'un arbre.<\/li><li>Els lladres, els quals (οὓς) atacaren, van ser perseguits (ἐδιώχθησαν) per Alexandre.<\/li><li>El primer lladre va ser llançat (ἐβλήθη) a terra.<\/li><li>Les coses (τὰ πράγματα) no van ser furtades (οὐκ ἐκλάπη). <em>(Atenció: verb en singular!)<\/em><\/li><li>Les ferides van ser llavades amb aigua per Helena.<\/li><li>El xiquet, el qual (ὃς) plorava, va ser guarit (ἐθεραπεύθη).<\/li><\/ul>"},{"id":"t8b","unit":8,"kind":"b","title":"Ὁ Περσεὺς καὶ ἡ Ἀνδρομέδα","paras":["Τὸ παλαιόν, ἡ Κασσιόπεια ἐν τῇ Αἰθιοπίᾳ βασίλεια ἦν. Ἡ γυνή, ἣ πάνυ καλή ἦν, ἄφρονας λόγους εἶπεν. Ἡ Κασσιόπεια ἐκαυχᾶτο ὅτι καλλίων τῶν Νηρηίδων ἦν. Αἱ δὲ Νηρηίδες, αἳ τῆς θαλάττης νύμφαι εἰσίν, ὀργὴν μεγίστην ἔλαβον. Αἱ νύμφαι, ὑφ' ὧν ἡ βασίλεια ἠκούσθη, τὸν Ποσειδῶνα ἐκάλεσαν. Ὁ δὲ Ποσειδῶν, ὃς τῆς θαλάττης θεός ἐστιν, τὴν Αἰθιοπίαν κολάσαι ἤθελεν.","Ἦν δὲ τῇ Κασσιοπείᾳ θυγάτηρ, ἣ Ἀνδρομέδα ὠνομάζετο. Ἡ Ἀνδρομέδα, ἣ καλλίστη παρθένος ἦν, διὰ τοὺς τῆς μητρὸς λόγους ἐκολάσθη. Ὁ γὰρ θεὸς ἄγριον κῆτος ἔπεμψεν, ὃ τὴν χώραν ἔφθειρεν. Οἱ πολῖται ὑπὸ τοῦ κήτους ἠδικήθησαν καὶ πολλοὶ ἄνθρωποι ἀπεκτάνθησαν.","Οἱ οὖν ἄνθρωποι εἰς μαντεῖόν τι ἦλθον. Τὸ μαντεῖον ἔλεγεν ὅτι ἡ χώρα σωθήσεται, εἰ ἡ Ἀνδρομέδα τῷ κήτει παραδοθήσεται. Οὕτως ἡ κόρη, ἣ οὐδὲν κακὸν ἐποίησεν, πρὸς τὴν θάλατταν ἤχθη. Ἡ Ἀνδρομέδα τῇ πέτρᾳ δεσμοῖς ἰσχυροῖς ἐδέθη. Ἡ κόρη, ἣ τῇ πέτρᾳ ἐλείφθη, ἔκλαιεν καὶ τὸν θάνατον ἔμενεν.","Ξαίφνης δὲ ὁ Περσεύς, ὃς ἄριστος ἥρως ἦν, διὰ τοῦ οὐρανοῦ ἐπέτετο. Ὁ ἥρως πτηνὰ πέδιλα εἶχεν, ἃ ὑπὸ τῶν θεῶν αὐτῷ ἐδόθη. Ὁ Περσεύς, τὴν κόρην ἰδών, πρὸς τὴν γῆν κατέβη. Ὁ ἥρως ἠρώτησεν· «Ὦ παρθένε, τίς εἶ; Διὰ τί τῇδε τῇ πέτρᾳ ἐδέθης; Ὑπὸ τίνος ἐνταῦθα ἐλείφθης;».","Ἡ Ἀνδρομέδα, ἣ τὸν ἥρωα εἶδεν, ἀπεκρίνατο· «Ἐγὼ Ἀνδρομέδα εἰμί. Ὑπὸ τῶν πολιτῶν ἐνταῦθα ἤχθην καὶ ἐδέθην, ὅτι δεινὸν τέρας ὑπὸ τοῦ Ποσειδῶνος ἐπέμφθη. Τὸ τέρας, ὃ τὴν χώραν φθείρει, ἐμὲ ἀποκτενεῖ.».","Ταῦτα λεγούσης τῆς παρθένου, τὸ τέρας ἐκ τῆς θαλάττης ἐφάνη. Τὸ ἄγριον κῆτος πρὸς τὴν κόρην ὥρμησεν. Ἀλλὰ ὁ Περσεὺς εἰς τὸν οὐρανὸν ἀνέπτη καὶ ἐπὶ τὸ τέρας κατέβη. Τὸ τέρας ὑπὸ τοῦ ἥρωος ἰσχυρῶς ἐπολεμήθη. Τὸ τοῦ κήτους σῶμα τῷ τοῦ Περσέως ξίφει ἐπαίσθη. Τὸ θηρίον, ὃ πολλὰ τραύματα ἔλαβεν, ὑπὸ τοῦ ἥρωος ἀπεκτάνθη καὶ εἰς τὴν θάλατταν ἔπεσεν.","Οὕτως ἡ Ἀνδρομέδα ὑπὸ τοῦ Περσέως ἐσώθη. Τὰ δεσμά, οἷς ἡ κόρη ἐδέθη, ὑπὸ τοῦ ἥρωος ἐλύθη. Ἡ Ἀνδρομέδα, ἣ ἐκ τοῦ θανάτου ἐσώθη, τὸν Περσέα μεγάλως ἐφίλησεν. Ὁ Περσεύς, ὃς τὸ τέρας ἀπέκτεινεν, τὴν κόρην ἔλαβεν καὶ εἰς τὴν ἑαυτοῦ πατρίδα ἤγαγεν. Ἐκεῖ ἡ Ἀνδρομέδα ὑπὸ τοῦ Περσέως ἐγαμήθη καὶ ἀγαθὸν βίον εἶχεν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Τίς ἦν ἡ Κασσιόπεια;<\/li><li>Τί εἶπεν ἡ ἄφρων βασίλεια;<\/li><li>Τίνες εἰσὶν αἱ Νηρηίδες;<\/li><li>Τί ἔπεμψεν ὁ Ποσειδῶν εἰς τὴν Αἰθιοπίαν;<\/li><li>Τίνι (a què) ἐδέθη ἡ Ἀνδρομέδα;<\/li><li>Τί εἶχεν ὁ Περσεύς, διὰ τοῦ οὐρανοῦ πετόμενος;<\/li><li>Πόθεν (d'on) ἐφάνη τὸ ἄγριον κῆτος;<\/li><li>Ὑπὸ τίνος ἐπολεμήθη τὸ τέρας;<\/li><li>Ποῖ (cap a on) ἔπεσεν τὸ θηρίον;<\/li><li>Ὑπὸ τίνος ἐσώθη ἡ Ἀνδρομέδα;<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge o element del mite les realitza. (Opcions: Ἡ Κασσιόπεια, Αἱ Νηρηίδες, Ὁ Ποσειδῶν / Τὸ κῆτος (ἢ τέρας), Ἡ Ἀνδρομέδα, Ὁ Περσεύς).<\/em><\/p>\n<ul><li>Ἐν τῇ Αἰθιοπίᾳ βασίλεια ἦν καὶ ἄφρονας λόγους εἶπεν. (_______________)<\/li><li>Τῆς θαλάττης νύμφαι εἰσὶν καὶ ὀργὴν μεγίστην ἔλαβον. (_______________)<\/li><li>Τὴν Αἰθιοπίαν κολάσαι ἤθελεν καὶ ἄγριον κῆτος ἔπεμψεν. (_______________)<\/li><li>Τὴν χώραν ἔφθειρεν καὶ πολλοὺς ἀνθρώπους ἀπέκτεινεν. (_______________)<\/li><li>Τῇ πέτρᾳ δεσμοῖς ἰσχυροῖς ἐδέθη καὶ τὸν θάνατον ἔμενεν. (_______________)<\/li><li>Πτηνὰ πέδιλα εἶχεν καὶ διὰ τοῦ οὐρανοῦ ἐπέτετο. (_______________)<\/li><li>Τὸν ἥρωα εἶδεν καὶ ἀπεκρίνατο· «Ἐγὼ Ἀνδρομέδα εἰμί». (_______________)<\/li><li>Τὸ τοῦ κήτους σῶμα τῷ ἑαυτοῦ ξίφει ἔπαισεν. (_______________)<\/li><li>Πολλὰ τραύματα ἔλαβεν, ἀπεκτάνθη καὶ εἰς τὴν θάλατταν ἔπεσεν. (_______________)<\/li><li>Τὴν κόρην ἔλαβεν καὶ εἰς τὴν ἑαυτοῦ πατρίδα ἤγαγεν. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ Περσεύς, τὴν κόρην ἰδών, πρὸς τὴν γῆν κατέβη.<\/li><li>☐ Ἡ Ἀνδρομέδα ὑπὸ τοῦ Περσέως ἐγαμήθη καὶ ἀγαθὸν βίον εἶχεν.<\/li><li>☐ Ὁ δὲ Ποσειδῶν ἄγριον κῆτος ἔπεμψεν, ὃ τὴν χώραν ἔφθειρεν.<\/li><li>☐ Τὸ θηρίον ὑπὸ τοῦ ἥρωος ἀπεκτάνθη καὶ εἰς τὴν θάλατταν ἔπεσεν.<\/li><li>☐ Ἡ Κασσιόπεια ἐκαυχᾶτο ὅτι καλλίων τῶν Νηρηίδων ἦν.<\/li><li>☐ Ἡ κόρη τὸν ἥρωα εἶδεν καὶ εἶπεν· «Ἐγὼ Ἀνδρομέδα εἰμί».<\/li><li>☐ Τὰ δεσμά, οἷς ἡ κόρη ἐδέθη, ὑπὸ τοῦ ἥρωος ἐλύθη.<\/li><li>☐ Τὸ ἄγριον κῆτος ἐκ τῆς θαλάττης ἐφάνη καὶ πρὸς τὴν κόρην ὥρμησεν.<\/li><li>☐ Ἡ Ἀνδρομέδα τῇ πέτρᾳ δεσμοῖς ἰσχυροῖς ἐδέθη.<\/li><li>☐ Τὸ τέρας ὑπὸ τοῦ ἥρωος ἰσχυρῶς ἐπολεμήθη.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite (para molta atenció als pronoms relatius i als aorists passius).<\/em><\/p>\n<ul><li>Ἡ γυνή, ἣ πάνυ καλή ἦν, ἄφρονας λόγους εἶπεν.<\/li><li>Αἱ νύμφαι, ὑφ' ὧν ἡ βασίλεια ἠκούσθη, τὸν Ποσειδῶνα ἐκάλεσαν.<\/li><li>Ὁ γὰρ θεὸς ἄγριον κῆτος ἔπεμψεν, ὃ τὴν χώραν ἔφθειρεν.<\/li><li>Οἱ πολῖται ὑπὸ τοῦ κήτους ἠδικήθησαν καὶ πολλοὶ ἄνθρωποι ἀπεκτάνθησαν.<\/li><li>Ἡ Ἀνδρομέδα, ἣ οὐδὲν κακὸν ἐποίησεν, τῇ πέτρᾳ δεσμοῖς ἰσχυροῖς ἐδέθη.<\/li><li>Ἡ κόρη, ἣ τῇ πέτρᾳ ἐλείφθη, ἔκλαιεν καὶ τὸν θάνατον ἔμενεν.<\/li><li>Ὁ Περσεύς, τὴν κόρην ἰδών, πρὸς τὴν γῆν κατέβη.<\/li><li>Τὸ τέρας ὑπὸ τοῦ ἥρωος ἰσχυρῶς ἐπολεμήθη.<\/li><li>Τὸ θηρίον, ὃ πολλὰ τραύματα ἔλαβεν, ὑπὸ τοῦ ἥρωος ἀπεκτάνθη.<\/li><li>Τὰ δεσμά, οἷς ἡ κόρη ἐδέθη, ὑπὸ τοῦ ἥρωος ἐλύθη.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>αἷμα, αἵματος<\/strong> (sang): ____________________<\/li><li><strong>ὕδωρ, ὕδατος<\/strong> (aigua): ____________________<\/li><li><strong>χείρ, χειρός<\/strong> (mà): ____________________<\/li><li><strong>μήτηρ, μητρός<\/strong> (mare): ____________________<\/li><li><strong>τραῦμα, τραύματος<\/strong> (ferida): ____________________<\/li><li><strong>πέτρα<\/strong> (pedra, roca): ____________________<\/li><li><strong>παρθένος<\/strong> (jove, verge): ____________________<\/li><li><strong>μάχη<\/strong> (batalla, combat): ____________________<\/li><li><strong>γαμέω<\/strong> (casar-se): ____________________<\/li><li><strong>σχίζω<\/strong> (trencar, esquinçar): ____________________<\/li><\/ul>"},{"id":"t9a","unit":9,"kind":"a","title":"Ἡ εἰρήνη καὶ ὁ ἄριστος δοῦλος","paras":["Μετὰ τὸν τῶν λῃστῶν κίνδυνον, πάντες οἱ ἄνθρωποι ἐν τῇ μεγάλῃ οἰκίᾳ ἡσύχως ἔμενον. Ἡ γὰρ εἰρήνη πάντων τῶν πραγμάτων ἀρίστη ἐστίν. Ὁ Ἀλέξανδρος, ὃς πάντων τῶν δεσποτῶν βέλτιστός ἐστιν, πρὸς τοὺς δούλους ἔλεγεν. Ὁ δεσπότης ἐκ τῆς οἰκίας εἰς τὸν ἀγρὸν ἐξῆλθεν.","Ὁ δὲ Ξάνθος, πλεῖστα τραύματα ἔχων, σὺν τῷ δεσπότῃ ἐπορεύετο. Ὁ Ξάνθος νῦν σωφρονέστερος ἦν.","Ὁ Ἀλέξανδρος ἔλεγεν· «Ὦ Ξάνθε, τὸ παλαιόν, σὺ κακίων καὶ ἀργότερος τοῦ Δάου ἦσθα. Ὁ γὰρ Δάος πιστότατος πάντων τῶν δούλων ἐστίν. Ἀλλὰ νῦν, ἐπεὶ ὑπὸ τῶν λῃστῶν ἐπαίσθης καὶ μέγιστον φόβον ἔλαβες, ἐλπίζω σε ἀμείνω γενήσεσθαι.».","Ὁ Ξάνθος, πολλὰ δάκρυα χέων, ἀπεκρίνατο· «Ὦ δέσποτα, οἱ σοὶ λόγοι ἀληθέστατοί εἰσιν. Ὁ γὰρ ἐμὸς φόβος μείζων ἦν τοῦ πόνου. Νῦν οἶδα τὴν ἡμετέραν οἰκίαν ἀσφαλεστέραν εἶναι τῆς ὕλης. Ἐκ γὰρ τῆς ὕλης πλεῖστοι κίνδυνοι ἔρχονται. Ἐγὼ ὑπισχνοῦμαι πλείω χρόνον ἐργάσεσθαι καὶ ἄριστος δοῦλος ἔσεσθαι.».","Ὁ Δάος, ταῦτα ἀκούσας, ἐγέλασεν καὶ εἶπεν· «Τὸ γὰρ ἀληθὲς κρεῖττόν ἐστι τοῦ ψεύδους. Πιστεύω σε ἀληθῆ λέγειν.».","Ἡ Ἑλένη, ἣ μεγίστην χαρὰν εἶχεν, ἐκ τῆς θύρας ἔλεγεν· «Τὸ τὴν εἰρήνην ἔχειν ἄμεινόν ἐστι τοῦ μάχεσθαι. Πάντα τὰ κακὰ ἐπαύσατο.».","Οὕτως, τοῦ ἡλίου λάμποντος, πάντες οἱ ἄνθρωποι χαίροντες ἐν τῇ κώμῃ ἔμενον. Ἡ γὰρ κώμη πάντων τῶν τόπων καλλίστη καὶ ἀσφαλεστάτη ἐστίν. Ὁ δὲ Ἀλέξανδρος καὶ ἡ Ἑλένη πλεῖστον χρόνον ἐν τῇ εἰρήνῃ ἔζησαν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Ποῦ ἔμενον πάντες οἱ ἄνθρωποι μετὰ τὸν τῶν λῃστῶν κίνδυνον;<\/li><li>Τί ἐστι πάντων τῶν πραγμάτων ἀρίστη;<\/li><li>Ποῖ ἐξῆλθεν ὁ Ἀλέξανδρος;<\/li><li>Τίνα εἶχεν ὁ Ξάνθος ἐπορευόμενος σὺν τῷ δεσπότῃ;<\/li><li>Ἆρα ὁ Ξάνθος ἀργότερος τοῦ Δάου ἔτι ἐστίν;<\/li><li>Τίς ἐστι πιστότατος πάντων τῶν δούλων;<\/li><li>Τί ἦν μεῖζον τοῦ πόνου;<\/li><li>Πόθεν (d'on) ἔρχονται πλεῖστοι κίνδυνοι;<\/li><li>Τί ὑπισχνεῖται ὁ Ξάνθος ἐν τοῖς ὑστέροις χρόνοις;<\/li><li>Ἆρα ἡ Ἑλένη νομίζει τὸ μάχεσθαι ἄμεινον εἶναι τῆς εἰρήνης;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (S-C-V).<\/em><\/p>\n<ul><li>Μετὰ τὸν κίνδυνον, πάντες οἱ ἄνθρωποι ἐν τῇ ὕλῃ ἡσύχως ἔμενον.<\/li><li>Ἡ εἰρήνη πάντων τῶν πραγμάτων κακίστη ἐστίν.<\/li><li>Ὁ Ξάνθος, πλεῖστα τραύματα ἔχων, σὺν τῷ δεσπότῃ ἐπορεύετο.<\/li><li>Τὸ παλαιόν, ὁ Δάος κακίων καὶ ἀργότερος τοῦ Ξάνθου ἦν.<\/li><li>Ὁ Ἀλέξανδρος ἐλπίζει τὸν Ξάνθον ἀμείνω γενήσεσθαι.<\/li><li>Ὁ Ξάνθος λέγει ὅτι ὁ πόνος μείζων ἦν τοῦ φόβου.<\/li><li>Ἡ ἡμετέρα οἰκία ἀσφαλεστέρα τῆς ὕλης ἐστίν.<\/li><li>Ὁ Δάος πιστεύει τὸν Ξάνθον ψεύδεσθαι.<\/li><li>Ἡ Ἑλένη, ἣ μεγίστην ὀργὴν εἶχεν, ἐκ τῆς θύρας ἔλεγεν.<\/li><li>Ἡ κώμη πάντων τῶν τόπων καλλίστη καὶ ἀσφαλεστάτη ἐστίν.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίνες ἔμενον ἐν τῇ μεγάλῃ οἰκίᾳ ἡσύχως; (_______________)<\/li><li>Τίνος ἀρίστη ἐστὶν ἡ εἰρήνη; (_______________)<\/li><li>Τίνων βέλτιστός ἐστιν ὁ Ἀλέξανδρος; [de tots els senyors] (_______________)<\/li><li>Τίνα εἶχεν ὁ Ξάνθος; [moltíssimes ferides] (_______________)<\/li><li>Τίνος ἀργότερος ἦν ὁ Ξάνθος τὸ παλαιόν; (_______________)<\/li><li>Τί χέων ἀπεκρίνατο ὁ Ξάνθος; [moltes llàgrimes] (_______________)<\/li><li>Τίνος μείζων ἦν ὁ φόβος τοῦ Ξάνθου; (_______________)<\/li><li>Πόθεν ἔρχονται πλεῖστοι κίνδυνοι; (_______________)<\/li><li>Τίνος κρεῖττόν ἐστι τὸ ἀληθές; (_______________)<\/li><li>Τίνος ἄμεινόν ἐστι τὸ τὴν εἰρήνην ἔχειν; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (para atenció als graus de l'adjectiu i als termes de la comparació).<\/em><\/p>\n<ul><li>Ἡ γὰρ εἰρήνη πάντων τῶν πραγμάτων _____ ἐστίν.<\/li><li>Ὁ Ἀλέξανδρος πάντων τῶν δεσποτῶν _____ ἐστιν.<\/li><li>Ὁ δὲ Ξάνθος, _____ τραύματα ἔχων, σὺν τῷ δεσπότῃ ἐπορεύετο.<\/li><li>Ὁ Ξάνθος νῦν _____ ἦν.<\/li><li>Τὸ παλαιόν, σὺ _____ καὶ _____ τοῦ Δάου ἦσθα.<\/li><li>Ὁ γὰρ Δάος _____ πάντων τῶν δούλων ἐστίν.<\/li><li>Ὁ γὰρ ἐμὸς φόβος _____ ἦν τοῦ πόνου.<\/li><li>Νῦν οἶδα τὴν ἡμετέραν οἰκίαν _____ εἶναι τῆς ὕλης.<\/li><li>Τὸ τὴν εἰρήνην ἔχειν _____ ἐστι τοῦ μάχεσθαι.<\/li><li>Ἡ γὰρ κώμη πάντων τῶν τόπων καλλίστη καὶ _____ ἐστίν.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Graus de l'adjectiu (Comparatiu i Superlatiu).<\/em> <em>Escriu l'adjectiu que falta primer en grau Comparatiu (amb el sufix regular -τερος / -ιων) i després en grau Superlatiu (-τατος / -ιστος), concordant-los amb el substantiu.<\/em><\/p>\n<ul><li>Ὁ δοῦλος πιστός ἐστιν. ➞ Ὁ δοῦλος τοῦ Δάου (<strong>) ἐστίν. / Ὁ δοῦλος (<\/strong>) ἐστίν.<\/li><li>Ἡ κώμη καλή ἐστιν. ➞ Ἡ κώμη τῆς ὕλης (<strong>) ἐστίν. / Ἡ κώμη (<\/strong>) ἐστίν.<\/li><li>Ὁ ἄνθρωπος σώφρων ἐστίν. ➞ Ὁ ἄνθρωπος (<strong>) ἐστίν. / Ὁ ἄνθρωπος (<\/strong>) ἐστίν.<\/li><li>Ὁ φόβος μέγας ἐστίν. ➞ Ὁ φόβος τοῦ πόνου (<strong>) ἐστίν. / Ὁ φόβος (<\/strong>) ἐστίν.<\/li><li>Τὸ δοῦλον εἶναι κακόν ἐστιν. ➞ Τὸ δοῦλον εἶναι (<strong>) ἐστίν. / Τὸ δοῦλον εἶναι (<\/strong>) ἐστίν.<\/li><\/ul>\n<p><em>Exercici B: El segon terme de la comparació.<\/em> <em>Canvia el Genitiu de comparació (segon terme) a la seua forma equivalent utilitzant la conjunció ἤ (que) i el cas Nominatiu (o Acusatiu segons corresponga a la frase).<\/em> <em>Exemple: Ὁ Ξάνθος ἀργότερος τοῦ Δάου ἦν. ➞ Ὁ Ξάνθος ἀργότερος ἦν ἢ ὁ Δάος.<\/em><\/p>\n<ul><li>Ὁ φόβος μείζων τοῦ πόνου ἐστίν. ➞<\/li><li>Ἡ οἰκία ἀσφαλεστέρα τῆς ὕλης ἐστίν. ➞<\/li><li>Τὸ ἀληθὲς κρεῖττόν ἐστι τοῦ ψεύδους. ➞<\/li><li>Τὸ τὴν εἰρήνην ἔχειν ἄμεινόν ἐστι τοῦ μάχεσθαι. ➞<\/li><\/ul>\n<p><em>Exercici C: Adjectius de la 3a classe (πᾶς, μέγας, πολύς).<\/em> <em>Canvia les frases de singular a plural o viceversa, parant molta atenció a les arrels irregulars i a la declinació (3-1-3 per a πᾶς / formes combinades per a μέγας i πολύς).<\/em><\/p>\n<ul><li>Πᾶς ὁ ἄνθρωπος μένει. ➞ (________________) μένουσιν.<\/li><li>Ὁ μέγας κίνδυνος ἔρχεται. ➞ Οἱ (________________) ἔρχονται.<\/li><li>Πολὺ δάκρυον πίπτει. ➞ (________________) πίπτει. <em>(Atenció a la regla del neutre plural)<\/em><\/li><li>Ὁ Ξάνθος πλεῖστον τραῦμα ἔχει. ➞ Ὁ Ξάνθος (________________) ἔχει.<\/li><li>Ἡ μεγάλη οἰκία ἀσφαλής ἐστιν. ➞ Αἱ (________________) ἀσφαλεῖς εἰσιν.<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Declina els substantius i adjectius (en el grau indicat), conjuga els verbs en la forma requerida i ordena les paraules per a formar oracions correctes en grec, respectant l'estructura S-C-V.<\/em><\/p>\n<ul><li>πᾶς / ὁ / ἄνθρωπος / ἐν / ἡ / κώμη / μένειν (imperfet d'indicatiu).<\/li><li>ἡ / εἰρήνη / ἀγαθός (superlatiu: ἀρίστη) / πᾶς / τὸ / πρᾶγμα / εἶναι (present).<\/li><li>ὁ / φόβος / μέγας (comparatiu) / ὁ / πόνος (genitiu) / εἶναι (imperfet).<\/li><li>ἡ / οἰκία / ἀσφαλής (comparatiu) / ἡ / ὕλη (genitiu) / εἶναι (present).<\/li><li>ἡ / Ἑλένη / ὁ / μέγας (superlatiu) / χαρὰ / ἔχειν (imperfet).<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text, parant especial atenció als graus de l'adjectiu i al Genitiu partitiu i comparatiu.<\/em><\/p>\n<ul><li>Μετὰ τὸν τῶν λῃστῶν κίνδυνον, πάντες οἱ ἄνθρωποι ἐν τῇ μεγάλῃ οἰκίᾳ ἡσύχως ἔμενον.<\/li><li>Ἡ γὰρ εἰρήνη πάντων τῶν πραγμάτων ἀρίστη ἐστίν.<\/li><li>Ὁ Ἀλέξανδρος, ὃς πάντων τῶν δεσποτῶν βέλτιστός ἐστιν, πρὸς τοὺς δούλους ἔλεγεν.<\/li><li>Ὁ δὲ Ξάνθος, πλεῖστα τραύματα ἔχων, σὺν τῷ δεσπότῃ ἐπορεύετο.<\/li><li>Τὸ παλαιόν, σὺ κακίων καὶ ἀργότερος τοῦ Δάου ἦσθα.<\/li><li>Ὁ γὰρ Δάος πιστότατος πάντων τῶν δούλων ἐστίν.<\/li><li>Ὁ γὰρ ἐμὸς φόβος μείζων ἦν τοῦ πόνου.<\/li><li>Νῦν οἶδα τὴν ἡμετέραν οἰκίαν ἀσφαλεστέραν εἶναι τῆς ὕλης.<\/li><li>Τὸ τὴν εἰρήνην ἔχειν ἄμεινόν ἐστι τοῦ μάχεσθαι.<\/li><li>Ἡ γὰρ κώμη πάντων τῶν τόπων καλλίστη καὶ ἀσφαλεστάτη ἐστίν.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 9 i respectant l'estructura S-C-V i l'ortografia politònica. (Presta atenció a la gradació de l'adjectiu, utilitzant els comparatius i els superlatius).<\/em><\/p>\n<ul><li>Tots els hòmens es quedaven a la ciutat tranquil·lament (ἡσύχως).<\/li><li>La pau és la millor de totes les coses.<\/li><li>Alexandre és el millor dels senyors.<\/li><li>Dau és el més fidel de tots els esclaus.<\/li><li>Antigament, Xantos era més gandul que Dau (posa'l en genitiu de comparació).<\/li><li>La por de l'esclau era més gran que el dolor (genitiu).<\/li><li>Nosaltres sabem que la casa és més segura que el bosc.<\/li><li>Tindre la pau és millor que lluitar (usa l'infinitiu substantivat!).<\/li><li>Helena tenia la més gran alegria.<\/li><li>L'aldea és el lloc més bell de tots.<\/li><\/ul>"},{"id":"t9b","unit":9,"kind":"b","title":"Ἡ τοῦ Πάριδος κρίσις καὶ τὸ χρυσοῦν μῆλον","paras":["Τὸ παλαιόν, πάντες οἱ θεοὶ καὶ πᾶσαι αἱ θεαὶ ἐν τῷ Ὀλύμπῳ ἦσαν. Ἡ Ἔρις, ἣ κακίστη πασῶν τῶν θεῶν ἦν, μῆλόν τι χρυσοῦν εἰς τὸ μέσον ἔβαλεν. Ἐν δὲ τῷ μήλῳ ἐγράφη· «Τῇ καλλίστῃ».","Ἡ Ἥρα καὶ ἡ Ἀθηνᾶ καὶ ἡ Ἀφροδίτη, αἳ μέγιστον φθόνον εἶχον, τὸ μῆλον ἁρπάσαι ἐβούλοντο. Ὁ Ζεὺς ἐκέλευσεν τὸν Ἑρμῆν τὰς θεὰς πρὸς τὸν Πάριν ἄγειν. Ὁ δὲ Πάρις νεανίας ἦν, ὃς πολλὰ πρόβατα ἐν τῷ ὄρει ἔπασκεν.","Αἱ θεαὶ ἐκ τοῦ Ὀλύμπου πρὸς τὸ ὄρος κατέβησαν. Ὁ Πάρις, τὰς θεὰς ἰδών, μέγιστον φόβον ἔλαβεν.","Ἡ Ἥρα πρῶτον εἶπεν· «Ὦ Πάρι, ἐγὼ μεγίστη θεά εἰμι. Εἰ ἐμὲ καλλίστην νομίζεις καὶ τὸ μῆλον ἐμοὶ δίδως, ἐγώ σοι πλείστους ἀνθρώπους καὶ πάσας τὰς πόλεις δώσω. Ἡ γὰρ δύναμις ἀμείνων ἐστὶ πάντων τῶν δώρων.».","Ἡ δὲ Ἀθηνᾶ ἀπεκρίνατο· «Ἐγὼ δώσω σοι πᾶσαν τὴν σοφίαν. Ὁ γὰρ σοφὸς ἀνὴρ ἰσχυρότερος καὶ βελτίων ἐστὶ τοῦ ἄφρονος. Ἡ σοφία καλλίων ἐστὶ τῆς δυνάμεως.».","Ἡ δὲ Ἀφροδίτη, ἣ πάνυ καλὴ ἦν, ἐγέλασεν καὶ εἶπεν· «Ἐγὼ δώσω σοι τὴν Ἑλένην, ἣ πασῶν τῶν γυναικῶν καλλίστη ἐστίν. Ὁ ἔρως καὶ τὸ κάλλος κρείττω εἰσὶ τοῦ πολέμου.».","Ὁ Πάρις, ἰδὼν τὸ τῆς Ἀφροδίτης κάλλος, ἐνόμισεν αὐτὴν πασῶν καλλίστην εἶναι. Οὕτως ὁ νεανίας τὸ μῆλον τῇ Ἀφροδίτῃ ἔδωκεν.","Διὰ τοῦτο, ἡ Ἥρα καὶ ἡ Ἀθηνᾶ πολέμιαι τοῖς Τρωσὶν ἐγένοντο. Μετὰ δὲ ταῦτα, ὁ Πάρις τὴν Ἑλένην ἥρπασεν, καὶ ἐκ τούτου ὁ μέγιστος πόλεμος ἐγένετο. Πολλοὶ γὰρ καὶ ἄριστοι ἄνδρες ἐν τῇ Τροίᾳ ἀπέθανον. Ὁ γὰρ ἔρως πολλάκις μείζονα ὄλεθρον τῶν ὅπλων φέρει."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Ποῦ ἦσαν πάντες οἱ θεοὶ καὶ πᾶσαι αἱ θεαὶ τὸ παλαιόν;<\/li><li>Τί ἔβαλεν ἡ Ἔρις εἰς τὸ μέσον;<\/li><li>Τί ἐγράφη ἐν τῷ χρυσῷ μήλῳ;<\/li><li>Τίνες ἐβούλοντο τὸ μῆλον ἁρπάσαι;<\/li><li>Ποῖ ἐκέλευσεν ὁ Ζεὺς τὸν Ἑρμῆν τὰς θεὰς ἄγειν;<\/li><li>Τίς ἦν ὁ Πάρις καὶ τί ἐποίει ἐν τῷ ὄρει;<\/li><li>Τί εἶπεν ἡ Ἥρα τῷ Πάριδι δώσειν;<\/li><li>Τί ἀπεκρίνατο ἡ Ἀθηνᾶ περὶ τῆς σοφίας;<\/li><li>Τίνα ἔδωκεν ἡ Ἀφροδίτη τῷ νεανίᾳ;<\/li><li>Διὰ τί ἡ Ἥρα καὶ ἡ Ἀθηνᾶ πολέμιαι τοῖς Τρωσὶν ἐγένοντο;<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge del mite les realitza. (Opcions: Ἡ Ἔρις, Ὁ Ζεύς, Ὁ Πάρις, Ἡ Ἥρα, Ἡ Ἀθηνᾶ, Ἡ Ἀφροδίτη, Ἡ Ἥρα καὶ ἡ Ἀθηνᾶ).<\/em><\/p>\n<ul><li>Κακίστη πασῶν τῶν θεῶν ἦν καὶ μῆλόν τι χρυσοῦν εἰς τὸ μέσον ἔβαλεν. (_______________)<\/li><li>Ἐκέλευσεν τὸν Ἑρμῆν τὰς θεὰς πρὸς τὸν Πάριν ἄγειν. (_______________)<\/li><li>Νεανίας ἦν, ὃς πολλὰ πρόβατα ἐν τῷ ὄρει ἔπασκεν. (_______________)<\/li><li>Εἶπεν ὅτι πλείστους ἀνθρώπους καὶ πάσας τὰς πόλεις δώσει. (_______________)<\/li><li>Εἶπεν ὅτι ὁ σοφὸς ἀνὴρ ἰσχυρότερος καὶ βελτίων ἐστὶ τοῦ ἄφρονος. (_______________)<\/li><li>Ἐγέλασεν καὶ εἶπεν τὴν Ἑλένην, πασῶν καλλίστην γυναῖκα, δώσειν. (_______________)<\/li><li>Ἰδὼν τὸ τῆς Ἀφροδίτης κάλλος, τὸ μῆλον αὐτῇ ἔδωκεν. (_______________)<\/li><li>Εἶπεν ὅτι ἡ δύναμις ἀμείνων ἐστὶ πάντων τῶν δώρων. (_______________)<\/li><li>Πολέμιαι τοῖς Τρωσὶν ἐγένοντο. (_______________)<\/li><li>Τὴν Ἑλένην ἥρπασεν, καὶ ἐκ τούτου ὁ μέγιστος πόλεμος ἐγένετο. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ Ζεὺς ἐκέλευσεν τὸν Ἑρμῆν τὰς θεὰς πρὸς τὸν Πάριν ἄγειν.<\/li><li>☐ Ἡ Ἀφροδίτη ἐγέλασεν καὶ εἶπεν τὴν Ἑλένην δώσειν.<\/li><li>☐ Ὁ Πάρις, ἰδὼν τὸ τῆς Ἀφροδίτης κάλλος, τὸ μῆλον αὐτῇ ἔδωκεν.<\/li><li>☐ Ἡ Ἥρα καὶ ἡ Ἀθηνᾶ πολέμιαι τοῖς Τρωσὶν ἐγένοντο.<\/li><li>☐ Ἡ Ἔρις, ἣ κακίστη πασῶν ἦν, μῆλόν τι χρυσοῦν εἰς τὸ μέσον ἔβαλεν.<\/li><li>☐ Αἱ θεαὶ ἐκ τοῦ Ὀλύμπου πρὸς τὸ ὄρος κατέβησαν.<\/li><li>☐ Ἡ Ἥρα καὶ ἡ Ἀθηνᾶ καὶ ἡ Ἀφροδίτη τὸ μῆλον ἁρπάσαι ἐβούλοντο.<\/li><li>☐ Ὁ Πάρις τὴν Ἑλένην ἥρπασεν, καὶ ἐκ τούτου ὁ μέγιστος πόλεμος ἐγένετο.<\/li><li>☐ Ἡ Ἀθηνᾶ ἀπεκρίνατο ὅτι ὁ σοφὸς ἀνὴρ βελτίων ἐστὶ τοῦ ἄφρονος.<\/li><li>☐ Ἡ Ἥρα πρῶτον εἶπεν πλείστους ἀνθρώπους καὶ πάσας τὰς πόλεις δώσειν.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite (para molta atenció als graus de l'adjectiu i als termes de la comparació).<\/em><\/p>\n<ul><li>Ἡ Ἔρις, ἣ κακίστη πασῶν τῶν θεῶν ἦν, μῆλόν τι χρυσοῦν εἰς τὸ μέσον ἔβαλεν.<\/li><li>Ἡ Ἥρα καὶ ἡ Ἀθηνᾶ καὶ ἡ Ἀφροδίτη, αἳ μέγιστον φθόνον εἶχον, τὸ μῆλον ἁρπάσαι ἐβούλοντο.<\/li><li>Ὁ Ζεὺς ἐκέλευσεν τὸν Ἑρμῆν τὰς θεὰς πρὸς τὸν Πάριν ἄγειν.<\/li><li>Ὁ δὲ Πάρις νεανίας ἦν, ὃς πολλὰ πρόβατα ἐν τῷ ὄρει ἔπασκεν.<\/li><li>Ἡ γὰρ δύναμις ἀμείνων ἐστὶ πάντων τῶν δώρων.<\/li><li>Ὁ γὰρ σοφὸς ἀνὴρ ἰσχυρότερος καὶ βελτίων ἐστὶ τοῦ ἄφρονος.<\/li><li>Ἡ σοφία καλλίων ἐστὶ τῆς δυνάμεως.<\/li><li>Ὁ ἔρως καὶ τὸ κάλλος κρείττω εἰσὶ τοῦ πολέμου.<\/li><li>Ὁ Πάρις, ἰδὼν τὸ τῆς Ἀφροδίτης κάλλος, ἐνόμισεν αὐτὴν πασῶν καλλίστην εἶναι.<\/li><li>Ὁ γὰρ ἔρως πολλάκις μείζονα ὄλεθρον τῶν ὅπλων φέρει.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>εἰρήνη<\/strong> (pau): ____________________<\/li><li><strong>τόπος<\/strong> (lloc, indret): ____________________<\/li><li><strong>πρᾶγμα, πράγματος<\/strong> (cosa, fet): ____________________<\/li><li><strong>ἄριστος, ἀρίστη, ἄριστον<\/strong> (el millor): ____________________<\/li><li><strong>μέσος, μέση, μέσον<\/strong> (mitjà, del mig): ____________________<\/li><li><strong>γράφω<\/strong> (escriure): ____________________<\/li><li><strong>ἔρως, ἔρωτος<\/strong> (amor, passió): ____________________<\/li><li><strong>κάλλος, κάλλους<\/strong> (bellesa): ____________________<\/li><li><strong>πᾶς, πᾶσα, πᾶν<\/strong> (tot, cada): ____________________<\/li><li><strong>ὄρος, ὄρους<\/strong> (muntanya): ____________________<\/li><\/ul>"}],"units":[{"n":1,"title":"El marc geogràfic i les primeres civilitzacions de l'Egeu","cultura":"<h3>El marc geogràfic i les primeres civilitzacions de l'Egeu<\/h3>\n<h4>1. Un país de muntanyes i de mar<\/h4>\n<p>Grècia ocupa l'extrem meridional de la península balcànica, un territori on les serralades cobrixen prop de les tres quartes parts de la superfície i on cap punt es troba a més de noranta quilòmetres del litoral. Estes dos dades expliquen bona part de la història grega. Les muntanyes —el Pindos, el Parnàs, el Taíget, l'Olimp— separen les valls i les xicotetes planes en compartiments aïllats, difícils de comunicar per terra i fàcils de defendre. La mar, en canvi, unix: l'Egeu està sembrat d'illes que funcionen com a passos naturals entre la costa europea i la d'Àsia Menor.<\/p>\n<p>El resultat és un paisatge que afavorix la fragmentació política. En lloc d'un estat unitari, com els regnes fluvials d'Egipte o de Mesopotàmia, Grècia desenrotlla centenars de comunitats xicotetes i independents, cada una amb el seu territori, els seus déus i les seues lleis. Els grecs se sentien un poble —parlaven la mateixa llengua, compartien Homer, els oracles i els jocs— però mai no van formar un únic estat fins que Macedònia i, després, Roma els van sotmetre.<\/p>\n<p>El sòl és prim i pedregós, i les pluges es concentren en l'hivern. L'agricultura es basa en la tríada mediterrània: cereals (sovint insuficients), olivera i vinya. La ramaderia és de cabres i ovelles, i la pesca i el comerç marítim compensen la pobresa del camp. Esta escassetat de terra cultivable és una de les causes de l'expansió colonial.<\/p>\n<h4>2. Els territoris del món grec<\/h4>\n<p><strong>Grècia continental.<\/strong> Al nord, Macedònia, l'Epir i Tessàlia, regions de grans planes i tradició més rural. Al centre, la Fòcide —on s'alça el santuari de Delfos—, la Beòcia de Tebes i l'Àtica, la península on es troba Atenes i el port del Pireu.<\/p>\n<p><strong>El Peloponés.<\/strong> Unit a la resta per l'istme de Corint. Comprén l'Argòlida (Argos, Micenes, Tirint), l'Arcàdia muntanyosa del centre, l'Èlide amb el santuari d'Olímpia, Messènia i Lacònia, la regió d'Esparta travessada pel riu Eurotes.<\/p>\n<p><strong>Les illes.<\/strong> Creta, la major, al sud; les Cíclades al voltant de Delos, illa sagrada d'Apol·lo; Eubea, allargada davant de la costa; Lesbos, pàtria de Safo i Alceu; Quios, Samos i Rodes prop d'Àsia. A la mar Jònica, Ítaca, Cefalònia i Corfú.<\/p>\n<p><strong>La Grècia asiàtica.<\/strong> La franja costanera d'Àsia Menor, colonitzada per grecs des de finals del segon mil·lenni aC. Ací hi ha Milet, on naix la filosofia amb Tales; Efes, amb el temple d'Àrtemis; Halicarnàs, pàtria d'Heròdot. És la zona més rica i oberta a l'orient, i també la primera a caure sota domini persa.<\/p>\n<p><strong>La Grècia colonial.<\/strong> Entre els segles VIII i VI aC els grecs s'establixen a Sicília i al sud d'Itàlia (la Magna Grècia), a les costes de la mar Negra, al nord d'Àfrica i a l'occident mediterrani. A la península Ibèrica van fundar Emporion, l'actual Empúries.<\/p>\n<h4>3. Creta i la civilització minoica<\/h4>\n<p>Cap al 2000 aC va florir a Creta la primera cultura complexa d'Europa, coneguda com a minoica pel nom del llegendari rei Minos. El seu element més característic són els palaus de Cnossos, Festos, Mal·lia i Zacros: conjunts enormes de centenars d'estances organitzades al voltant d'un pati central, sense muralles, que funcionaven alhora com a residència reial, magatzem, taller i centre religiós. L'absència de fortificacions suggerix que Creta controlava la mar i no temia atacs.<\/p>\n<p>L'economia era redistributiva: el palau arreplegava els excedents agrícoles, els emmagatzemava en grans gerres i els repartia. Per a portar-ne el compte van desenrotllar una escriptura, el lineal A, encara no desxifrada. L'art minoic és lluminós i naturalista: frescos amb dofins, lliris i escenes de salt del bou, ceràmica de decoració vegetal i marina, figuretes de la deessa de les serps.<\/p>\n<p>Cap al 1450 aC els palaus van ser destruïts. S'han proposat diverses causes: terratrémols, revoltes internes i, sobretot, l'arribada de guerrers micènics. L'erupció del volcà de Tera, molt anterior (cap al 1600 aC), va poder debilitar l'illa, però no explica per si sola el final dels palaus. El que sí que és clar és que a partir d'eixe moment Cnossos apareix ocupada per gent que escriu en grec.<\/p>\n<h4>4. Els aqueus i el món micènic<\/h4>\n<p>Els primers grecs, els aqueus, van entrar a la península cap al 2000 aC. Entre el 1600 i el 1200 aC van bastir una civilització guerrera coneguda com a micènica, per la ciutadella de Micenes. A diferència dels palaus cretencs, els centres micènics —Micenes, Tirint, Pilos, Tebes— són fortaleses situades en altura i protegides per muralles ciclòpies, formades per blocs tan grans que els grecs posteriors creien obra dels ciclops.<\/p>\n<p>La societat estava encapçalada pel <em>wánax<\/em>, el sobirà, i tenia una administració minuciosa que registrava ramats, teixits, armes i racions en tauletes d'argila escrites en lineal B. El desxiframent d'este sistema per Michael Ventris el 1952 va demostrar que la llengua que amagava era grec: el testimoni escrit més antic de la nostra tradició. Les tombes reials de Micenes, excavades per Heinrich Schliemann, van proporcionar màscares d'or, armes i joies que confirmen la riquesa dels prínceps aqueus.<\/p>\n<p>Cap al 1200 aC este món s'ensorra. Els palaus són incendiats, l'escriptura desapareix i la població disminuïx. Les causes són discutides: moviments de pobles, conflictes interns, crisis agràries i la inestabilitat general que va afectar tot el Mediterrani oriental amb els anomenats «pobles de la mar». La guerra de Troia, que se sol situar entre el 1250 i el 1180 aC, pertany a este període final.<\/p>\n<h4>5. Els segles obscurs i la invenció de l'alfabet<\/h4>\n<p>Entre el 1100 i el 800 aC, aproximadament, Grècia viu una etapa de la qual tenim poques dades: és l'època anomenada dels segles obscurs. Els doris ocupen el Peloponés i Creta; població jònica i eòlica travessa l'Egeu i s'establix a Àsia Menor. Desapareixen els palaus, l'escriptura i el comerç a llarga distància, però es difon el ferro i es consoliden les comunitats locals que donaran lloc a la polis.<\/p>\n<p>Al final d'este període es produïx un fet decisiu. Els grecs adopten l'escriptura dels fenicis i li fan una modificació de conseqüències enormes: transformen alguns signes consonàntics que no necessitaven en signes vocàlics. Naix així el primer alfabet complet de la història, amb lletres per a vocals i consonants, molt més senzill d'aprendre que els sistemes sil·làbics o jeroglífics anteriors. Els testimonis més antics són del segle VIII aC.<\/p>\n<p>L'abast d'esta innovació va molt més enllà de la comoditat tècnica. Un sistema d'entre vint i trenta signes facilita enormement l'aprenentatge de l'escriptura i fa que deixe de ser patrimoni exclusiu d'escribes professionals. Sense alfabet difícilment s'entendrien la fixació dels poemes h
