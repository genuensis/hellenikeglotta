ripteia"],"x":"","id":"c6-53"},{"t":"in","q":"Quin nom rep l'esclau de confiança que acompanyava el xiquet atenés i en vigilava el comportament?","ans":"pedagog","acc":["pedagog","pedagogo","el pedagog","paidagogos","pedagogs"],"x":"","id":"c6-54"},{"t":"in","q":"Quin nom rep la unitat bàsica que designa alhora la casa, la família i el patrimoni?","ans":"oîkos","acc":["oikos","oîkos","l'oikos","l'oîkos","oicos"],"x":"","id":"c6-55"},{"t":"ord","q":"Ordena les etapes de la vida pública d'un ciutadà atenés:","items":["Als díhuit anys s'inscriu en el registre del seu demos","Fa l'efebia, un servei militar de dos anys","Als vint anys ja pot assistir a l'assemblea","Als trenta anys pot formar part del consell i dels tribunals"],"x":"L'accés als càrrecs anava per edats.","id":"c6-56"},{"t":"ord","q":"Ordena les etapes de la formació d'un jove atenés benestant:","items":["Acudix al gramatista, al citarista i al pedotriba, acompanyat pel pedagog","Als díhuit anys entra en l'efebia","Rep lliçons de retòrica i argumentació dels sofistes","Es forma en escoles com l'Acadèmia de Plató o el Liceu d'Aristòtil"],"x":"L'educació atenesa era privada i de pagament; l'efebia, als díhuit anys, separava l'etapa dels tres mestres dels estudis superiors.","id":"c6-57"},{"t":"ord","q":"Ordena les etapes de la vida d'un xiquet espartà:","items":["Viu amb la seua família els primers anys","Als set anys és separat de la família i incorporat a l'agogé","Viu en grup i s'exercita en la lluita i en el maneig de les armes","De jove pot formar part de la krypteia"],"x":"L'Estat controlava tota l'educació.","id":"c6-58"},{"t":"ord","q":"Ordena els passos d'un matrimoni grec:","items":["Les famílies pacten la unió i el pare de la núvia en negocia les condicions","S'acorda la dot que acompanyarà la dona","La xica, cap als quinze anys, passa de la tutela del pare a la del marit","Naixen els fills legítims que continuaran l'oîkos i el culte als avantpassats"],"x":"No era un acte d'elecció personal.","id":"c6-59"},{"t":"mat","q":"Emparella cada grup social d'Atenes amb la seua situació:","pairs":[["Ciutadans","Tenien drets polítics plens i podien posseir terra"],["Metecs","Estrangers lliures que pagaven un impost i no votaven"],["Esclaus","Eren jurídicament propietat del seu amo"],["Lliberts","Havien comprat la llibertat però no eren ciutadans"]],"x":"","id":"c6-60"},{"t":"mat","q":"Emparella cada grup social d'Esparta amb la seua definició:","pairs":[["Hòmoioi","Els «iguals», ciutadans de ple dret dedicats a la guerra"],["Periecs","Lliures de Lacònia dedicats a l'artesania i al comerç"],["Hilotes","Població sotmesa que pertanyia a l'Estat"],["Krypteia","Servei secret format per jóvens espartans"]],"x":"","id":"c6-61"},{"t":"mat","q":"Emparella cada educador atenés amb la seua matèria:","pairs":[["Gramatista","Les lletres, el càlcul i la memorització d'Homer"],["Citarista","La música i la poesia"],["Pedotriba","La gimnàstica a la palestra"],["Pedagog","La vigilància del comportament del xiquet"]],"x":"","id":"c6-62"},{"t":"mat","q":"Emparella cada terme de la vida quotidiana amb el seu significat:","pairs":[["Gineceu","La zona de la casa reservada a les dones"],["Khitón","La túnica"],["Himátion","El mantell"],["Simposi","La reunió de després del sopar"]],"x":"","id":"c6-63"}],"7":[{"t":"mc","q":"Què van fer els grecs, abans que ningú, amb les formes de govern?","o":["Analitzar-les sistemàticament i posar-los nom","Sotmetre-les cada any a una votació popular","Repartir-les entre les seues colònies llunyanes","Prohibir-les totes excepte la democràcia"],"x":"Eixa terminologia que van crear continua vigent hui.","id":"c7-0"},{"t":"mc","q":"Quines funcions concentrava el rei en l'època micènica i en els poemes homèrics?","o":["Militars, judicials i religioses","Comercials, agràries i militars","Religioses, artístiques i fiscals","Judicials, fiscals i diplomàtiques"],"x":"","id":"c7-1"},{"t":"mc","q":"Què li va passar a la monarquia a partir de l'època arcaica?","o":["Va desaparéixer en gran part del món grec o va quedar reduïda a funcions cerimonials","Es va estendre per tot el món grec fins a substituir les aristocràcies i les oligarquies locals","Es va transformar en una magistratura anual sortejada entre tots els ciutadans","Va passar a compartir el poder amb un consell de tirans renovat cada deu anys"],"x":"","id":"c7-2"},{"t":"mc","q":"Quan es parla d'oligarquia i no d'aristocràcia?","o":["Quan el criteri per a governar deixa de ser el naixement i passa a ser la riquesa","Quan el criteri per a governar deixa de ser la riquesa i passa a ser el sorteig","Quan els nobles perden el poder i el guanya un sol home al marge de la llei","Quan el govern d'uns pocs és substituït pel govern del conjunt del poble"],"x":"","id":"c7-3"},{"t":"mc","q":"Què caracteritza la tirania enfront de les altres formes de govern?","o":["És un poder personal aconseguit al marge de la llei","És un poder col·lectiu repartit entre les famílies nobles","És un poder hereditari reduït a funcions cerimonials","És un poder temporal sortejat entre tots els ciutadans"],"x":"Es distingix de la monarquia i de l'aristocràcia perquè el tirà no accedix al poder ni pel naixement ni per cap via legal.","id":"c7-4"},{"t":"mc","q":"En què es diferenciava la democràcia atenesa de les democràcies actuals?","o":["Era directa: els ciutadans decidien ells mateixos i no elegien diputats","Era indirecta: els ciutadans elegien cada any diputats i magistrats","Era limitada: només decidien els ciutadans de les famílies més riques","Era mixta: l'assemblea decidia i un rei hereditari podia vetar-ho tot"],"x":"","id":"c7-5"},{"t":"mc","q":"En quins tres principis es fonamentava la democràcia atenesa?","o":["La isonomía, la isegoría i el sorteig de la majoria de càrrecs","La isonomía, l'ostracisme i l'elecció anual de tots els càrrecs","La isegoría, el misthós i la reelecció indefinida dels magistrats","L'ostracisme, el misthós i la designació hereditària dels càrrecs"],"x":"","id":"c7-6"},{"t":"mc","q":"Què significa isonomía?","o":["La igualtat davant de la llei","L'igual dret a parlar en l'assemblea","L'igual repartiment de la terra","La igualtat davant dels déus"],"x":"","id":"c7-7"},{"t":"mc","q":"Què significa isegoría?","o":["L'igual dret a parlar en l'assemblea","La igualtat davant de la llei","L'igual dret a ser sortejat per a un càrrec","L'igual dret a heretar la ciutadania"],"x":"","id":"c7-8"},{"t":"mc","q":"Per què es considerava el sorteig el procediment més democràtic?","o":["Perquè no afavoria ni els rics ni els populars","Perquè permetia repetir el càrrec moltes vegades","Perquè deixava la decisió en mans dels déus","Perquè estalviava haver de reunir l'assemblea"],"x":"","id":"c7-9"},{"t":"mc","q":"Qui podia assistir a l'assemblea atenesa?","o":["Tots els ciutadans majors de vint anys","Tots els habitants majors de vint anys","Només els ciutadans majors de trenta anys","Només els ciutadans sortejats cada any"],"x":"En quedaven fora les dones, els metecs i els esclaus: vivien a Atenes, però no eren ciutadans.","id":"c7-10"},{"t":"mc","q":"Amb quina freqüència es reunia l'assemblea atenesa?","o":["Unes quaranta vegades a l'any","Una vegada cada dos mesos","Cada dia excepte els dies de festa religiosa","Una sola vegada a l'any"],"x":"","id":"c7-11"},{"t":"mc","q":"Sobre què decidia l'assemblea atenesa?","o":["Sobre la guerra i la pau, els tractats, les lleis, les finances i alguns càrrecs","Sobre la culpabilitat i sobre la pena de totes les causes privades de la ciutat d'Atenes","Sobre els delictes de sang i sobre les causes que afectaven els santuaris","Sobre l'ordre del dia i sobre la supervisió de l'administració diària"],"x":"","id":"c7-12"},{"t":"mc","q":"Com estava format el consell (boulé)?","o":["Per cinc-cents membres sortejats, cinquanta per cada una de les deu tribus","Per sis mil membres sortejats cada any, sis-cents per cada una de les deu tribus","Per cinc-cents membres elegits, cinquanta per cada una de les deu tribus","Per tres-cents membres vitalicis, trenta per cada una de les deu tribus"],"x":"","id":"c7-13"},{"t":"mc","q":"Quina limitació hi havia per a formar part de la boulé?","o":["Un any de mandat i un màxim de dos mandats no consecutius en tota la vida","Un any de mandat i un màxim de deu mandats consecutius en tota la vida","Dos anys de mandat i la prohibició de tornar a exercir el càrrec mai més","Un mandat vitalici reservat als ciutadans majors de seixanta anys"],"x":"","id":"c7-14"},{"t":"mc","q":"Com estaven organitzats els tribunals populars (heliaía)?","o":["Un cos de sis mil ciutadans sortejats cada any, repartits en jurats nombrosos","Un cos de cinc-cents ciutadans elegits cada any, repartits en deu jurats fixos","Un cos de tres mil ciutadans sortejats de per vida, repartits per tribus","Un cos de sis-cents jutges professionals nomenats pel consell de l'areòpag"],"x":"","id":"c7-15"},{"t":"mc","q":"Com es designaven els arconts?","o":["Per sorteig","Per elecció","Per herència","Per aclamació"],"x":"Estos antics caps de la ciutat, que van conservar funcions religioses i judicials, es designaven com la majoria de càrrecs; els estrategs, en canvi, es triaven per elecció.","id":"c7-16"},{"t":"mc","q":"Per què els estrategs es triaven per elecció i podien ser reelegits indefinidament?","o":["Perquè el comandament militar exigia competència tècnica","Perquè el càrrec no tenia cap mena de poder polític","Perquè eren els magistrats més antics de la ciutat","Perquè havien de pagar les campanyes de la seua butxaca"],"x":"Per això el càrrec d'estrateg va ser la via d'influència de Pèricles.","id":"c7-17"},{"t":"mc","q":"Què li va passar al consell de l'areòpag el 462 aC?","o":["Va perdre el poder polític i va quedar reduït a tribunal per als delictes de sang","Va assumir el poder polític i va passar a preparar tot l'ordre del dia de l'assemblea","Va ser dissolt i tots els seus membres van ser desterrats durant deu anys seguits","Va passar a estar format per sis mil ciutadans sortejats cada any per tribus"],"x":"Estava format pels exarconts.","id":"c7-18"},{"t":"mc","q":"Quins mecanismes de control hi havia sobre els magistrats atenesos?","o":["Un examen abans d'entrar en el càrrec i la rendició de comptes en acabar","Un jurament davant de l'assemblea i una multa en cas de derrota militar","Una votació de confiança cada mes davant del consell dels Cinc-cents","Una inspecció anual de l'areòpag i un nou sorteig a la meitat del mandat"],"x":"","id":"c7-19"},{"t":"mc","q":"En què consistia l'ostracisme?","o":["A desterrar deu anys, sense confiscació de béns, un ciutadà considerat perillós","A privar de per vida dels drets civils el ciutadà condemnat per traïció o per impietat","A confiscar els béns i desterrar cinc anys el magistrat que no retia comptes","A expulsar de l'assemblea durant un any el ciutadà acusat d'impietat"],"x":"","id":"c7-20"},{"t":"mc","q":"Quins grups quedaven exclosos de la democràcia atenesa?","o":["Les dones, els metecs i els esclaus","Els metecs, els esclaus i els llauradors","Les dones, els menors i els comerciants","Els esclaus, els estrangers i els nobles"],"x":"Es tracta de la majoria de la població.","id":"c7-21"},{"t":"mc","q":"Per què es va introduir el misthós?","o":["Perquè la participació efectiva depenia del temps disponible","Perquè els magistrats pagaven les despeses de la seua butxaca","Perquè els jurats es negaven a jutjar les causes públiques","Perquè el sorteig deixava fora els ciutadans més rics"],"x":"","id":"c7-22"},{"t":"mc","q":"Quins defectes van retraure els contemporanis a la democràcia atenesa?","o":["La volubilitat de les decisions, els oradors demagogs i les condemnes injustes","La lentitud dels processos, el poder dels arconts i la compra dels jurats","L'excés de jutges professionals, el cost del misthós i la manca d'assemblees","La reelecció dels estrategs, la debilitat del consell i la manca de lleis"],"x":"","id":"c7-23"},{"t":"mc","q":"Quin episodi cita el tema com a exemple de condemna col·lectiva injusta?","o":["El dels generals de les Arginuses","El dels oradors demagogs de la Pnix","El dels metecs sense dret de veu","El dels arconts sortejats per tribus"],"x":"L'assemblea els va condemnar tots junts, sense jutjar-los un per un; el capítol ho posa com a límit del sistema, al costat de la volubilitat de les decisions i de la influència dels demagogs.","id":"c7-24"},{"t":"mc","q":"Què admiraven molts autors antics del sistema polític espartà?","o":["Que combinava elements de totes les formes de govern","Que havia suprimit la monarquia i la substituïa pel sorteig","Que donava el poder al conjunt del poble sense excepcions","Que renovava totes les seues institucions cada generació"],"x":"","id":"c7-25"},{"t":"mc","q":"En què consistia la diarquia espartana?","o":["En dos reis simultanis de dos famílies distintes que es vigilaven mútuament","En dos reis que es rellevaven cada any i procedien sempre de la mateixa família","En dos magistrats elegits anualment que dirigien la política exterior","En dos consells que es repartien les funcions militars i religioses"],"x":"","id":"c7-26"},{"t":"mc","q":"Quines funcions tenien sobretot els reis d'Esparta?","o":["Militars i religioses","Judicials i fiscals","Legislatives i judicials","Comercials i diplomàtiques"],"x":"","id":"c7-27"},{"t":"mc","q":"Quines funcions tenia la gerusía?","o":["Preparava els assumptes i actuava com a tribunal en les causes greus","Controlava els reis i supervisava l'educació dels joves espartans","Votava per aclamació les propostes que li presentaven els èfors","Dirigia la política exterior i cobrava els tributs de la població"],"x":"","id":"c7-28"},{"t":"mc","q":"Quina capacitat de deliberació tenia l'apel·la?","o":["Molt limitada: aprovava o rebutjava el que li presentaven","Molt àmplia: podia esmenar i redactar qualsevol proposta","Nul·la: només assistia a la proclamació de les decisions","Plena: qualsevol ciutadà hi podia demanar la paraula"],"x":"","id":"c7-29"},{"t":"mc","q":"Quins poders tenien els èfors?","o":["Controlaven els reis, dirigien la política exterior i podien jutjar qualsevol ciutadà","Preparaven els assumptes de la gerusía, cobraven els tributs i manaven tot l'exèrcit","Presidien l'apel·la, redactaven les lleis escrites i nomenaven els dos reis","Vigilaven els hilotes, administraven els temples i elegien els ancians"],"x":"També supervisaven l'educació. Eren, de fet, l'òrgan més poderós de l'Estat.","id":"c7-30"},{"t":"mc","q":"Com descriu el tema el conjunt del sistema espartà?","o":["Estable i conservador, amb escàs marge per a la iniciativa individual","Obert i canviant, amb un gran marge per a la iniciativa individual","Inestable i violent, sotmés a les revoltes contínues dels hilotes","Igualitari i sortejat, molt semblant en tot al model d'Atenes"],"x":"Estava dissenyat per a mantindre l'ordre i el control sobre la població hilota.","id":"c7-31"},{"t":"mc","q":"Quin avantatge tenia que la llei estiguera escrita i exposada públicament?","o":["Que tothom podia conéixer per endavant què estava prohibit i quina pena hi havia","Que els nobles podien adaptar la pena a la condició social de cada un dels acusats","Que els condemnats podien recórrer la sentència davant d'un tribunal superior","Que els esclaus i els metecs adquirien la mateixa capacitat jurídica que els ciutadans"],"x":"","id":"c7-32"},{"t":"mc","q":"Quins dos legisladors marquen a Atenes el camí cap a la llei escrita?","o":["Dracó i Soló","Dracó i Pèricles","Soló i Lísies","Lísies i Pèricles"],"x":"Va ser una de les grans conquistes de l'època arcaica.","id":"c7-33"},{"t":"mc","q":"Quin gran text legal conservat cita el tema a l'illa de Creta?","o":["El de Gortina","El de la ciutat de Cnossos","El de Delfos","El de Milet"],"x":"","id":"c7-34"},{"t":"mc","q":"Què no existia en el procediment judicial atenés?","o":["Ni ministeri fiscal ni advocats en el sentit actual","Ni jurats populars ni votació secreta amb fitxes","Ni acusació particular ni causes de caràcter públic","Ni penes de desterrament ni confiscació de béns"],"x":"","id":"c7-35"},{"t":"mc","q":"Qui havia de presentar l'acusació i qui defenia l'acusat?","o":["L'acusació la presentava un particular i cada part es defenia personalment","L'acusació la presentava un magistrat i un advocat defenia cada part","L'acusació la presentava el jurat sortejat i un logògraf defenia cada part","L'acusació la presentava l'areòpag i el kýrios defenia cada una de les parts"],"x":"","id":"c7-36"},{"t":"mc","q":"Què eren les díkai?","o":["Causes privades que només podia iniciar la part perjudicada","Causes públiques que podia iniciar qualsevol ciutadà de ple dret","Causes de sang reservades al consell de l'areòpag","Causes d'impietat que jutjaven directament els arconts"],"x":"","id":"c7-37"},{"t":"mc","q":"Per què podia qualsevol ciutadà presentar una graphé?","o":["Perquè eixes causes afectaven l'interés de la comunitat","Perquè la part perjudicada no podia acusar ningú","Perquè eixes causes no comportaven cap pena greu","Perquè el jurat no podia iniciar cap acusació"],"x":"Ho eren, per exemple, la impietat o la traïció.","id":"c7-38"},{"t":"mc","q":"Per què el jurat atenés era tan nombrós?","o":["Per a dificultar el suborn","Per a accelerar les votacions","Per a repartir millor el misthós","Per a substituir els arconts"],"x":"","id":"c7-39"},{"t":"mc","q":"Com votava el jurat atenés?","o":["En secret amb fitxes, primer sobre la culpabilitat i després sobre la pena","A mà alçada, primer sobre la pena i després sobre la culpabilitat de l'acusat","Per aclamació, en una sola votació sobre la culpabilitat i la pena","Amb sufragis escrits sobre ceràmica, en dos votacions successives"],"x":"","id":"c7-40"},{"t":"mc","q":"Quines penes es podien imposar en un judici atenés?","o":["La multa, la privació de drets civils, el desterrament, la confiscació i la mort","La multa, l'ostracisme de deu anys, la tortura, la confiscació de tots els béns i la mort","La presó per deutes, els treballs forçats, el desterrament i la mort","La privació de drets civils, la venda com a esclau i la confiscació"],"x":"","id":"c7-41"},{"t":"mc","q":"Qui era el logògraf?","o":["L'escriptor professional que redactava el discurs perquè el client se l'aprenguera","L'orador professional que acusava en nom de tota la comunitat davant del jurat sortejat","El funcionari públic que comptava els vots del jurat en cada una de les votacions","El magistrat sortejat que presidia les causes privades i també les públiques"],"x":"D'esta pràctica naixen bona part dels discursos judicials conservats, com els de Lísies.","id":"c7-42"},{"t":"mc","q":"Quin grup de paraules deriva del vocabulari polític grec, segons el tema?","o":["Política, democràcia, tirania i dèspota","República, senat, cònsol i tribú","Ciutat, poble, llei i justícia","Imperi, província, edicte i cens"],"x":"","id":"c7-43"},{"t":"mc","q":"Quina idea grega recull el tema com a fonament de les democràcies actuals?","o":["Que el poder ha d'estar sotmés a lleis conegudes i els governants han de retre comptes","Que el poder ha de residir en un sol home que siga capaç de garantir l'ordre dins de la ciutat","Que les lleis han de ser interpretades pels nobles i pels sacerdots de la comunitat","Que la comunitat política és cosa d'un déu o d'un rei i no pas dels ciutadans"],"x":"","id":"c7-44"},{"t":"tf","q":"La democràcia atenesa era representativa: els ciutadans elegien diputats que decidien en nom seu.","a":false,"x":"Era directa: els ciutadans decidien ells mateixos en l'assemblea.","id":"c7-45"},{"t":"tf","q":"A Atenes no hi havia jutges professionals: el mateix jurat decidia la culpabilitat i la pena per votació.","a":true,"x":"","id":"c7-46"},{"t":"tf","q":"L'ostracisme comportava el desterrament durant deu anys i també la confiscació dels béns.","a":false,"x":"El desterrat conservava els seus béns.","id":"c7-47"},{"t":"tf","q":"En els processos atenesos el testimoni d'un esclau només s'admetia sota tortura.","a":true,"x":"Els esclaus no tenien capacitat jurídica pròpia.","id":"c7-48"},{"t":"tf","q":"Les sentències dels tribunals atenesos es podien recórrer davant del consell de l'areòpag.","a":false,"x":"Eren inapel·lables; l'areòpag només jutjava els delictes de sang.","id":"c7-49"},{"t":"tf","q":"L'apel·la espartana votava per aclamació.","a":true,"x":"Es limitava a aprovar o rebutjar el que li presentaven.","id":"c7-50"},{"t":"tf","q":"A Esparta els delictes greus els jutjaven jurats populars sortejats, com a Atenes.","a":false,"x":"En jutjava la gerusía; de la resta de causes s'ocupaven els èfors.","id":"c7-51"},{"t":"in","q":"Quina paraula grega designa alhora la llei escrita i el costum acceptat per la comunitat?","ans":"nómos","acc":["nomos","nómos","el nomos","el nómos","nomoi"],"x":"Abans de la llei escrita, la norma era el costum, interpretat pels nobles: per això una mateixa paraula designa les dos coses.","id":"c7-52"},{"t":"in","q":"En quin turó d'Atenes es reunia l'assemblea?","ans":"la Pnix","acc":["pnix","la pnix","pnyx","la pnyx","el turo de la pnix"],"x":"","id":"c7-53"},{"t":"in","q":"Amb quin instrument es mesurava el temps de paraula en els judicis atenesos?","ans":"clepsidra","acc":["clepsidra","la clepsidra","clepsidres","rellotge d'aigua","rellotge d aigua"],"x":"El judici era oral i ràpid.","id":"c7-54"},{"t":"in","q":"Quin nom rep l'escriptor professional que redactava discursos per als litigants?","ans":"logògraf","acc":["logograf","logògraf","el logograf","el logògraf","logografo","logògrafs"],"x":"","id":"c7-55"},{"t":"in","q":"Quin nom rep la població sotmesa sobre la qual Esparta volia mantindre el control?","ans":"hilota","acc":["hilota","hilotes","els hilotes","ilota","ilotes","poblacio hilota"],"x":"","id":"c7-56"},{"t":"ord","q":"Ordena els passos d'un judici a Atenes:","items":["Un particular presenta l'acusació davant del tribunal","Cada part es defén personalment amb el temps mesurat per la clepsidra","El jurat vota en secret amb fitxes sobre la culpabilitat","El jurat vota la pena triant entre la proposta de l'acusador i la de l'acusat"],"x":"La sentència era inapel·lable.","id":"c7-57"},{"t":"ord","q":"Ordena els passos d'una votació d'ostracisme:","items":["Es convoca una votació especial contra un ciutadà considerat perillós","Cada votant escriu un nom sobre un fragment de ceràmica","Es comprova si s'ha arribat al mínim de sufragis exigit","El ciutadà és desterrat deu anys sense perdre els seus béns"],"x":"","id":"c7-58"},{"t":"ord","q":"Ordena les fases del pas del costum a la llei escrita:","items":["La comunitat es regix pel costum, interpretat pels nobles","Les normes es posen per escrit","El text de la llei s'exposa públicament","Tothom pot saber per endavant què està prohibit i quina pena li correspon"],"x":"Va ser una de les grans conquistes de l'època arcaica.","id":"c7-59"},{"t":"ord","q":"Ordena els passos perquè l'assemblea atenesa prenga una decisió:","items":["El consell dels Cinc-cents prepara l'ordre del dia","L'assemblea es reunix al turó de la Pnix","Qualsevol assistent pot demanar la paraula","L'assemblea vota i decidix sobre l'assumpte"],"x":"Sense l'ordre del dia preparat per la boulé, res no podia ser votat.","id":"c7-60"},{"t":"mat","q":"Emparella cada forma de govern amb la seua definició:","pairs":[["Monarquia","El govern d'un de sol"],["Aristocràcia","El govern de les famílies nobles"],["Oligarquia","El govern d'uns pocs, els més rics"],["Democràcia","El govern del conjunt del poble"]],"x":"","id":"c7-61"},{"t":"mat","q":"Emparella cada institució atenesa amb el seu paper:","pairs":[["Ekklesía","L'assemblea sobirana, on tothom podia demanar la paraula"],["Boulé","Preparava l'ordre del dia i supervisava l'administració diària"],["Heliaía","Els tribunals de ciutadans sortejats que decidien les causes"],["Areòpag","Tribunal per als delictes de sang des del 462 aC"]],"x":"","id":"c7-62"},{"t":"mat","q":"Emparella cada institució espartana amb la seua composició:","pairs":[["Diarquia","Dos reis simultanis de dos famílies distintes"],["Gerusía","Vint-i-huit ancians majors de seixanta anys i els dos reis"],["Apel·la","Tots els ciutadans de ple dret"],["Èfors","Cinc magistrats elegits cada any"]],"x":"","id":"c7-63"},{"t":"mat","q":"Emparella cada grup amb la seua situació jurídica:","pairs":[["El ciutadà adult masculí","Era el subjecte de dret"],["Les dones i els menors","Actuaven a través del seu kýrios"],["Els metecs","Actuaven a través d'un patró"],["Els esclaus","No tenien capacitat jurídica pròpia"]],"x":"","id":"c7-64"}],"8":[{"t":"mc","q":"Quins gèneres ha establit la literatura grega per a classificar els textos?","o":["Èpica, lírica, tragèdia, comèdia, història, oratòria, diàleg filosòfic i novel·la","Èpica, sàtira, elegia, sermó, crònica, epistolari, assaig i conte popular tradicional","Lírica, epigrama, faula, memòries, tractat, discurs, biografia i llegenda hagiogràfica","Tragèdia, misteri, poema èpic, novel·la de cavalleries, oda, carta i faula moralitzant"],"x":"Amb estos gèneres classifiquem encara hui els textos, perquè cap tradició posterior no ha deixat de dialogar amb la grega.","id":"c8-0"},{"t":"mc","q":"A partir de quins segles es van començar a copiar els textos grecs en còdexs de pergamí?","o":["A partir dels segles III i IV dC","A partir dels segles VIII i VII aC","A partir dels segles I i II aC","A partir dels segles VIII i IX dC"],"x":"Abans s'havien transmés en rotles de papir.","id":"c8-1"},{"t":"mc","q":"Qui va assegurar la conservació dels textos grecs durant l'edat mitjana?","o":["Els monestirs bizantins","Les escoles d'Alexandria","Les biblioteques de Roma","Els tallers de Jònia"],"x":"","id":"c8-2"},{"t":"mc","q":"Quin és el gènere més antic que s'ha conservat de la literatura grega?","o":["L'èpica","La lírica","La tragèdia","La historiografia"],"x":"Són narracions extenses en vers sobre les gestes dels herois.","id":"c8-3"},{"t":"mc","q":"Quina llengua utilitza l'èpica grega?","o":["Un dialecte artificial que no es corresponia amb cap parla real","El dialecte jònic tal com es parlava a les ciutats d'Àsia Menor","El dialecte àtic depurat pels filòlegs d'època alexandrina","Una barreja de dialecte dori i de llengua popular de Beòcia"],"x":"","id":"c8-4"},{"t":"mc","q":"Quin episodi narra la Ilíada?","o":["La còlera d'Aquil·les en el desé any del setge de Troia","La causa del conflicte i el rapte d'Hèlena per part de Paris","L'estratagema del cavall de fusta i la caiguda final de Troia","El retorn dels cabdills grecs a les seues cases després de la guerra"],"x":"Inclou les conseqüències de la còlera per a l'exèrcit grec i la mort d'Hèctor.","id":"c8-5"},{"t":"mc","q":"Què relata l'Odissea?","o":["El retorn accidentat d'Odisseu a Ítaca i la recuperació de la seua casa","El viatge d'Odisseu cap a Troia i la seua participació en el setge de la ciutat","L'exili d'Odisseu a Ítaca i la fundació d'una ciutat nova a l'extrem d'Occident","La disputa d'Odisseu amb Agamèmnon i la seua tornada al campament de l'exèrcit"],"x":"","id":"c8-6"},{"t":"mc","q":"Com es contraposen els dos poemes homèrics?","o":["La Ilíada és un poema de guerra, d'honor i de mort; l'Odissea, de viatge, d'astúcia i de reconeixement","La Ilíada és un poema de viatge, d'aventura i de mar; l'Odissea, de guerra, de venjança i de conquista","La Ilíada és un poema de déus, de sacrificis i de festes; l'Odissea, de reis, de lleis i de justícia","La Ilíada és un poema d'amor, de família i de pau; l'Odissea, de treball, de camp i de resignació"],"x":"","id":"c8-7"},{"t":"mc","q":"En què consistix la qüestió homèrica?","o":["En el debat sobre qui va compondre els poemes homèrics i com","En el debat sobre si la guerra de Troia va arribar a existir","En el debat sobre l'ordre en què cal llegir els dos poemes","En el debat sobre quina ciutat grega era la pàtria d'Homer"],"x":"És un debat encara obert.","id":"c8-8"},{"t":"mc","q":"Què han mostrat els estudis sobre la poesia oral a propòsit dels poemes homèrics?","o":["Que els epítets repetits, les escenes tipus i les fórmules són recursos d'aedes que improvisaven","Que els poemes són obra d'un sol autor que els va compondre i escriure sencers de memòria","Que els poemes es van redactar a partir de documents antics guardats als arxius dels reis","Que els epítets i les fórmules són afegits tardans dels copistes bizantins de l'edat mitjana"],"x":"«Aquil·les el de peus lleugers» n'és un exemple d'epítet.","id":"c8-9"},{"t":"mc","q":"Entre quins segles degueren cristal·litzar les versions dels poemes homèrics que llegim?","o":["Entre els segles VIII i VII aC","Entre els segles XII i XI aC","Entre els segles V i IV aC","Entre els segles III i II aC"],"x":"","id":"c8-10"},{"t":"mc","q":"Quina branca de l'èpica representa Hesíode?","o":["L'èpica didàctica","L'èpica heroica","L'èpica burlesca","L'èpica religiosa"],"x":"La Teogonia ordena la genealogia dels déus i Els treballs i els dies dona consells sobre l'agricultura i la justícia.","id":"c8-11"},{"t":"mc","q":"A partir de quin segle apareix la poesia lírica grega?","o":["A partir del segle VII aC","A partir del segle IX aC","A partir del segle V aC","A partir del segle IV aC"],"x":"És una poesia més breu, cantada amb acompanyament musical.","id":"c8-12"},{"t":"mc","q":"Quina és la novetat més important que aporta la lírica respecte de l'èpica?","o":["Davant de l'anonimat èpic, sorgix la veu individual","Davant del vers èpic, s'imposa definitivament l'ús de la prosa","Davant del tema heroic, s'imposa exclusivament el tema religiós","Davant del cant èpic, s'imposa la lectura silenciosa i privada"],"x":"L'autor parla en primera persona dels seus sentiments, de la política, del vi o de l'amor.","id":"c8-13"},{"t":"mc","q":"Quin poeta elegíac anima els espartans al combat?","o":["Tirteu","Teognis","Soló","Arquíloc"],"x":"Teognis exposa la moral aristocràtica i Soló justifica les seues reformes.","id":"c8-14"},{"t":"mc","q":"Qui és la figura principal del iambe?","o":["Arquíloc","Alceu","Anacreont","Baquílides"],"x":"El iambe és de to satíric i de llenguatge directe; Alceu i Anacreont conreen la mèlica monòdica, i Baquílides, la coral.","id":"c8-15"},{"t":"mc","q":"De què són les odes de Píndar?","o":["En honor dels vencedors dels jocs","En honor dels déus dels grans santuaris","En honor dels caiguts en les guerres mèdiques","En honor dels tirans que el van acollir"],"x":"Píndar conrea la mèlica coral, com Simònides i Baquílides.","id":"c8-16"},{"t":"mc","q":"De quina ciutat és una creació el teatre grec?","o":["D'Atenes","De Corint","D'Esparta","De Milet"],"x":"Naix a Atenes lligat a les festes en honor de Dionís, sobretot a les Grans Dionísies de primavera, i és un fet cívic abans que artístic.","id":"c8-17"},{"t":"mc","q":"En quines festes s'inserien les representacions teatrals a Atenes?","o":["En les festes en honor de Dionís","En les festes en honor d'Atena","En les festes en honor d'Apol·lo","En les festes en honor de Demèter"],"x":"Especialment en les Grans Dionísies de primavera.","id":"c8-18"},{"t":"mc","q":"Quina és l'estructura habitual d'una tragèdia grega?","o":["Pròleg, pàrodos, alternança d'episodis i estàsims, i èxode","Pròleg, pàrodos, tres episodis seguits i ditirambe final","Pàrodos, pròleg, alternança de cants i danses, i estàsim final","Pròleg, èxode, alternança d'episodis i estàsims, i pàrodos"],"x":"Els estàsims els canta el cor; l'èxode és l'eixida final.","id":"c8-19"},{"t":"mc","q":"Qui interpretava els papers femenins en el teatre grec?","o":["Homes, com tots els altres papers","Dones escollides entre les sacerdotesses","Xiquets educats especialment per a fer-ho","Membres del cor que no portaven màscara"],"x":"Els actors portaven màscara i calçat alt, i interpretaven diversos papers.","id":"c8-20"},{"t":"mc","q":"Quins conflictes planteja la tragèdia grega?","o":["Entre la llei de la ciutat i el deure familiar, la voluntat i el destí, la justícia i la venjança","Entre els rics i els pobres, els ciutadans i els metecs, els grecs i els pobles bàrbars veïns","Entre els déus i els homes, els vells i els jóvens, els homes lliures i els esclaus de la casa","Entre la ciutat i el camp, la guerra i la pau, la raó humana i la superstició dels antics"],"x":"Són conflictes sense solució còmoda.","id":"c8-21"},{"t":"mc","q":"Quina trilogia va escriure Èsquil?","o":["L'Orestea","L'Antígona","Les bacants","Les troianes"],"x":"També són seues Els perses i Prometeu encadenat.","id":"c8-22"},{"t":"mc","q":"Quin origen té la comèdia grega?","o":["Ritual, en processons festives i cants burlescos","Popular, en les faules i els contes de les places","Escolar, en els exercicis de retòrica dels sofistes","Religiós, en els himnes cantats als grans santuaris"],"x":"","id":"c8-23"},{"t":"mc","q":"De quin segle és la comèdia antiga, política i obscena?","o":["Del segle V aC","Del segle VII aC","Del segle IV aC","De l'època hel·lenística"],"x":"Barreja la fantasia desbordada amb la sàtira d'actualitat.","id":"c8-24"},{"t":"mc","q":"Qui és el representant de la comèdia antiga?","o":["Aristòfanes","Menandre","Eurípides","Terenci"],"x":"Són seues Els núvols, Lisístrata, Les granotes i Els ocells.","id":"c8-25"},{"t":"mc","q":"En què es fixa la comèdia mitjana del segle IV aC?","o":["En els tipus socials i en les paròdies literàries","En els conflictes familiars i en els reconeixements finals","En els atacs personals i en la sàtira de l'actualitat","En els temes mítics i en els cors de sàtirs burlescos"],"x":"Abandona l'atac personal característic de la comèdia antiga.","id":"c8-26"},{"t":"mc","q":"Quins personatges fixos apareixen en la comèdia nova?","o":["El jove enamorat, el pare avar, l'esclau enginyós i el militar fanfarró","El rei just, el missatger fidel, el vell savi i el mercader vingut de fora","El sacerdot venal, la sacerdotessa muda, l'atleta vençut i el poeta pobre","El tirà cruel, l'hoplita valent, el pagés astut i la dida vella i xarradora"],"x":"És la comèdia d'embolics domèstics, amb reconeixements finals.","id":"c8-27"},{"t":"mc","q":"Què escrivien els logògrafs?","o":["Relats geogràfics i genealògics","Discursos judicials i polítics","Tractats mèdics i astronòmics","Diàlegs filosòfics i morals"],"x":"Amb ells naix la prosa a Jònia; el més destacat és Hecateu de Milet.","id":"c8-28"},{"t":"mc","q":"Quin historiador rep el nom de pare de la història?","o":["Heròdot d'Halicarnàs","Tucídides d'Atenes","Xenofont d'Atenes","Hecateu de Milet"],"x":"Va narrar les guerres mèdiques.","id":"c8-29"},{"t":"mc","q":"Quins trets caracteritzen l'obra d'Heròdot?","o":["Una curiositat immensa per les cultures estrangeres i una gran capacitat narrativa","Una crítica rigorosa de les fonts i una cronologia extremadament precisa dels fets","Una atenció exclusiva als fets militars i un estil molt sec i esquemàtic de relat","Una defensa constant de la unió de tots els grecs i un domini ple de la retòrica"],"x":"","id":"c8-30"},{"t":"mc","q":"En què consistix el mètode de Tucídides?","o":["Crítica de les fonts, cronologia precisa i recerca de les causes profundes","Recollida d'oracles, relat dels prodigis i explicació per la voluntat divina","Compilació de llegendes locals, genealogies i descripcions de països llunyans","Selecció de discursos famosos, retrats morals i sentències breus i memorables"],"x":"Busca les causes en el comportament humà i en les relacions de poder; va escriure la guerra del Peloponés.","id":"c8-31"},{"t":"mc","q":"Quins gèneres va conrear Xenofont a més de continuar el relat històric?","o":["La biografia, el tractat i el llibre de memòries","La tragèdia, el discurs judicial i el diàleg breu","L'epopeia, l'elegia i el tractat de retòrica antic","La novel·la, la comèdia i el relat de viatges llunyans"],"x":"L'Anàbasi és el seu llibre de memòries.","id":"c8-32"},{"t":"mc","q":"Quins són els tres tipus de discurs de l'oratòria grega?","o":["Judicial, deliberatiu i epidíctic","Narratiu, descriptiu i argumentatiu","Polític, religiós i militar","Públic, privat i escolar"],"x":"El judicial és per als tribunals; el deliberatiu, per a l'assemblea; l'epidíctic, per a ocasions solemnes.","id":"c8-33"},{"t":"mc","q":"Quin orador és model de senzillesa i de caracterització dels seus clients?","o":["Lísies","Isòcrates","Demòstenes","Hecateu"],"x":"","id":"c8-34"},{"t":"mc","q":"Quin orador va ser mestre de retòrica i defensor de la unió dels grecs?","o":["Isòcrates","Lísies","Demòstenes","Tucídides"],"x":"","id":"c8-35"},{"t":"mc","q":"Contra qui va dirigir Demòstenes la seua veu més poderosa?","o":["Contra Filip de Macedònia","Contra el gran rei de Pèrsia","Contra els Trenta Tirans","Contra els sofistes d'Atenes"],"x":"","id":"c8-36"},{"t":"mc","q":"Quin personatge és el centre dels diàlegs de Plató?","o":["Sòcrates","Aristòtil","Isòcrates","Xenofont"],"x":"Els diàlegs són alhora pensament i literatura de primer ordre.","id":"c8-37"},{"t":"mc","q":"Quina obra d'Aristòtil ha determinat durant segles la manera d'entendre la tragèdia?","o":["La Poètica","La Retòrica","La Política","L'Ètica"],"x":"L'obra d'Aristòtil ens ha arribat sobretot en forma de tractats.","id":"c8-38"},{"t":"mc","q":"En quina època apareix la novel·la grega?","o":["En època imperial","En època arcaica","En època clàssica","En els inicis de l'hel·lenisme"],"x":"És el gènere en prosa més pròxim a la narrativa moderna.","id":"c8-39"},{"t":"mc","q":"Quin esquema comú conserven les novel·les gregues?","o":["Una parella s'enamora, la separen circumstàncies adverses i finalment es retroben","Un heroi ix de casa, supera un seguit de proves difícils i funda una ciutat nova","Un jove és acusat injustament, fuig del seu país i hi torna per a venjar-se'n","Una família es divideix per una herència i es reconcilia al cap de molts anys"],"x":"Naufragis, pirates, malentesos i morts aparents en són els obstacles típics.","id":"c8-40"},{"t":"mc","q":"Qui és l'autor de les Etiòpiques?","o":["Heliodor","Caritó","Longus","Menandre"],"x":"","id":"c8-41"},{"t":"mc","q":"En quines literatures va influir el model de la novel·la grega?","o":["En la novel·la bizantina i en la narrativa d'aventures del Renaixement i del Barroc","En la comèdia llatina i en el teatre classicista francés dels segles XVII i XVIII","En l'èpica de Roma i en la poesia trobadoresca de tota l'edat mitjana europea","En la historiografia romana i en les cròniques medievals de tot l'Occident llatí"],"x":"","id":"c8-42"},{"t":"mc","q":"Quin moviment va recuperar la literatura grega després de l'edat mitjana?","o":["El Renaixement","El Romanticisme","La Il·lustració","El Barroc"],"x":"La influència de la literatura grega no s'ha interromput mai: primer havia passat a Roma i, després del Renaixement, va inspirar el teatre classicista francés.","id":"c8-43"},{"t":"mc","q":"Quin origen tenen els noms dels gèneres i de les figures literàries que fem servir hui?","o":["Són grecs","Són llatins","Són bizantins","Són renaixentistes"],"x":"","id":"c8-44"},{"t":"tf","q":"La literatura grega no era, en origen, literatura per a llegir en silenci.","a":true,"x":"L'èpica es cantava, la lírica s'acompanyava d'instruments, el teatre es representava i l'oratòria es pronunciava.","id":"c8-45"},{"t":"tf","q":"Es conserven totes les tragèdies que els antics atribuïen a Èsquil.","a":false,"x":"Se'n conserven set de les setanta o noranta que li atribuïen: cada pas de la transmissió va suposar una selecció.","id":"c8-46"},{"t":"tf","q":"Els poemes homèrics estan compostos en el dialecte que realment es parlava a Jònia.","a":false,"x":"El dialecte de l'èpica és artificial i no es corresponia amb cap parla real.","id":"c8-47"},{"t":"tf","q":"La tradició atribuïx a Tespis la innovació de separar un actor del cor per a dialogar-hi.","a":true,"x":"Èsquil hi va afegir el segon actor i Sòfocles el tercer.","id":"c8-48"},{"t":"tf","q":"El públic atenés desconeixia l'argument de les tragèdies que anava a vore.","a":false,"x":"Els temes procedien del mite i ja els coneixia: el que importava era el sentit que se'ls donava.","id":"c8-49"},{"t":"tf","q":"El drama satíric es representava abans de les tres tragèdies per a preparar el públic.","a":false,"x":"Es representava després, amb un cor de sàtirs, per a alleugerir el to.","id":"c8-50"},{"t":"tf","q":"La comèdia antiga atacava per nom polítics, intel·lectuals i institucions.","a":true,"x":"Tenia una llibertat de crítica sorprenent.","id":"c8-51"},{"t":"in","q":"Quin nom rep el metre fix en què està composta l'èpica grega?","ans":"hexàmetre","acc":["hexametre","hexàmetre","hexametre dactilic","hexàmetre dactílic","l'hexametre","l'hexàmetre"],"x":"","id":"c8-52"},{"t":"in","q":"Quin cant coral dionisíac es considera l'origen de la tragèdia?","ans":"ditirambe","acc":["ditirambe","el ditirambe","ditiramb","ditirambo"],"x":"","id":"c8-53"},{"t":"in","q":"Quin nom rep l'entrada del cor en l'estructura de la tragèdia?","ans":"pàrodos","acc":["parodos","pàrodos","el parodos","el pàrodos","parode"],"x":"","id":"c8-54"},{"t":"in","q":"Quina poetessa canta la passió amorosa amb una precisió psicològica extraordinària?","ans":"Safo","acc":["safo","sappho","sapfo","safo de lesbos"],"x":"","id":"c8-55"},{"t":"in","q":"Qui és l'autor principal de la comèdia nova?","ans":"Menandre","acc":["menandre","menander","menandro"],"x":"","id":"c8-56"},{"t":"ord","q":"Ordena les etapes per les quals han arribat fins a nosaltres els textos grecs:","items":["La transmissió oral","La fixació per escrit en rotles de papir","Les versions depurades dels filòlegs d'Alexandria","La còpia en còdexs de pergamí i la conservació als monestirs bizantins"],"x":"Cada pas va suposar una selecció: el que llegim és una part xicoteta del que hi va haver.","id":"c8-57"},{"t":"ord","q":"Ordena els passos de la formació de la tragèdia grega:","items":["El ditirambe, cant coral dionisíac","Tespis separa un actor del cor per a dialogar-hi","Èsquil introduïx el segon actor","Sòfocles introduïx el tercer actor"],"x":"La hipòtesi més acceptada relaciona l'origen de la tragèdia amb el ditirambe; d'un cant coral es passa al diàleg entre actors.","id":"c8-58"},{"t":"ord","q":"Ordena les etapes de la comèdia i la seua pervivència:","items":["La comèdia antiga, política i obscena, d'Aristòfanes","La comèdia mitjana, de tipus socials i paròdies literàries","La comèdia nova d'embolics domèstics, de Menandre","L'adaptació llatina de Plaute i de Terenci"],"x":"D'ahí passa a Molière, a la comèdia europea i al guió de comèdia actual.","id":"c8-59"},{"t":"ord","q":"Ordena estos autors de prosa segons l'ordre en què els presenta el tema:","items":["Hecateu de Milet","Heròdot d'Halicarnàs","Tucídides","Xenofont"],"x":"Hecateu és el logògraf amb qui naix la prosa; després, Heròdot narra les guerres mèdiques, Tucídides la del Peloponés i Xenofont en continua el relat.","id":"c8-60"},{"t":"mat","q":"Emparella cada autor amb la seua obra:","pairs":[["Hesíode","Els treballs i els dies"],["Sòfocles","Antígona"],["Aristòfanes","Lisístrata"],["Longus","Dafnis i Cloe"]],"x":"","id":"c8-61"},{"t":"mat","q":"Emparella cada modalitat lírica amb el seu tret:","pairs":[["Elegia","Composta en dístics, de to exhortatiu o reflexiu"],["Iambe","De to satíric i de llenguatge directe"],["Mèlica monòdica","Cantada amb lira per una veu sola"],["Mèlica coral","Interpretada per un grup, com les odes de Píndar"]],"x":"","id":"c8-62"},{"t":"mat","q":"Emparella cada tràgic amb la seua caracterització:","pairs":[["Èsquil","Solemne i centrat en la justícia divina"],["Sòfocles","Mestre de la construcció dramàtica"],["Eurípides","Crític amb la tradició i atent a la psicologia"],["Tespis","Va separar un actor del cor per a dialogar-hi"]],"x":"","id":"c8-63"},{"t":"mat","q":"Emparella cada autor de la pervivència amb el model grec que seguix:","pairs":[["Virgili","Escriu una epopeia a partir d'Homer"],["Sèneca","Escriu tragèdies a partir d'Eurípides"],["Plaute i Terenci","Adapten la comèdia nova de Menandre"],["Molière","Rep el model de la comèdia d'embolics"]],"x":"","id":"c8-64"}],"9":[{"t":"mc","q":"En què consistix la bellesa, segons la convicció que travessa tota la cultura grega?","o":["En l'ordre, la proporció i la mesura","En la grandària, la riquesa i la força","En la sorpresa, la novetat i el luxe","En el color, la llum i el contrast"],"x":"L'equilibri entre les parts i el conjunt es calculava sovint amb relacions numèriques.","id":"c9-0"},{"t":"mc","q":"Per què es diu que l'art grec és profundament antropocèntric?","o":["Perquè la figura humana n'és el tema central, fins i tot quan representa déus","Perquè l'artista signava sempre les obres amb el seu propi nom","Perquè representava sobretot escenes de treball i de vida quotidiana dels ciutadans","Perquè estava destinat a decorar les cases dels particulars rics"],"x":"Els déus grecs tenen forma d'home.","id":"c9-1"},{"t":"mc","q":"Què vol dir que l'art grec és un art públic?","o":["Que temples, estàtues i teatres es fan per a la comunitat i s'exhibixen en espais oberts","Que qualsevol ciutadà podia intervindre lliurement en la decoració dels temples de la seua ciutat","Que els artistes cobraven un sou de l'estat i només treballaven per encàrrec oficial","Que les obres es guardaven en edificis tancats administrats pels magistrats cívics"],"x":"","id":"c9-2"},{"t":"mc","q":"Com estava concebut el temple grec?","o":["Com a casa de la divinitat, no com a lloc de reunió dels fidels","Com a sala coberta on tots els fidels assistien junts als sacrificis","Com a tresor públic on la ciutat guardava els seus diners","Com a residència dels sacerdots que regien el santuari"],"x":"El nucli de l'edifici és la naos o cel·la, la sala on hi havia l'estàtua de culte.","id":"c9-3"},{"t":"mc","q":"Quin tipus d'estructura té l'arquitectura grega?","o":["Arquitravada: columnes i llindes, sense arcs ni voltes","Abovedada: arcs de mig punt i grans voltes de canó de pedra","Mixta: arcs recolzats damunt de columnes estriades","Adintellada amb cúpules i arcs de descàrrega"],"x":"","id":"c9-4"},{"t":"mc","q":"En època de quin governant es va reconstruir l'Acròpoli d'Atenes?","o":["De Pèricles","De Fídies","De Policlet","D'Hipòdam de Milet"],"x":"","id":"c9-5"},{"t":"mc","q":"Com és la columna de l'ordre dòric?","o":["Sense base, amb el fust estriat i un capitell de coixí circular i àbac quadrat","Amb una base motllurada, el fust completament llis i un capitell de fulles d'acant","Amb base alta, el fust molt prim i un capitell rematat per dos volutes","Sense base, amb el fust llis i un capitell format per un àbac circular"],"x":"És el més antic i sobri, i transmet solidesa.","id":"c9-6"},{"t":"mc","q":"Com és el fris de l'ordre dòric?","o":["Alterna tríglifs i mètopes esculpides","És corregut i pot dur un relleu continu","Es decora amb volutes i fulles d'acant","Alterna cariàtides i columnes estriades"],"x":"","id":"c9-7"},{"t":"mc","q":"Quin element caracteritza el capitell de l'ordre jònic?","o":["Dos volutes","Un coixí circular","Unes fulles d'acant","Un àbac quadrat"],"x":"La columna jònica és més esvelta i té base, i el fris és corregut.","id":"c9-8"},{"t":"mc","q":"Quin ordre, més tardà, es distingix pel capitell de fulles d'acant i serà el preferit pels romans?","o":["El corinti","El dòric","El jònic","L'ordre toscà"],"x":"","id":"c9-9"},{"t":"mc","q":"A quin ordre pertany el Partenó i a quina divinitat estava dedicat?","o":["Al dòric, i estava dedicat a Atena","Al jònic, i estava dedicat a Atena","Al dòric, i estava dedicat a Zeus","Al corinti, i estava dedicat a Nike"],"x":"","id":"c9-10"},{"t":"mc","q":"Sota la direcció de quin artista es va decorar el Partenó?","o":["De Fídies","De Míron","De Praxíteles","D'Escopes"],"x":"","id":"c9-11"},{"t":"mc","q":"Quin edifici servia d'entrada monumental a l'Acròpoli d'Atenes?","o":["Els Propileus","L'Erectèon","El temple d'Atena Nike","El Partenó"],"x":"","id":"c9-12"},{"t":"mc","q":"Quin edifici de l'Acròpoli té la tribuna de les cariàtides?","o":["L'Erectèon","El Partenó","Els Propileus","El temple d'Atena Nike"],"x":"És un edifici d'ordre jònic, com el temple d'Atena Nike.","id":"c9-13"},{"t":"mc","q":"Per a què servien les correccions òptiques del Partenó?","o":["Per a compensar les deformacions de la visió i donar sensació de regularitat","Per a repartir millor el pes de la coberta damunt de cada columna","Per a evitar que l'aigua de la pluja s'acumulara sobre el basament","Per a fer que l'edifici semblara molt més gran i més alt del que era en realitat"],"x":"Les columnes s'inclinen lleugerament i s'engrossixen al centre, i el basament és una mica corbat.","id":"c9-14"},{"t":"mc","q":"A quins segles correspon l'època arcaica de l'escultura grega?","o":["Als segles VII-VI aC","Als segles VIII-VII aC","Als segles VI-V aC","Als segles V-IV aC"],"x":"","id":"c9-15"},{"t":"mc","q":"Quina diferència hi ha entre el kuros i la kore?","o":["El kuros és un jove nu i dret; la kore, una jove vestida","El kuros és una figura asseguda; la kore, una figura dempeus","El kuros representa un déu; la kore, una dona mortal","El kuros és sempre de marbre; la kore, sempre de bronze"],"x":"","id":"c9-16"},{"t":"mc","q":"Com són les figures de l'escultura arcaica?","o":["Frontals i rígides, amb els braços enganxats al cos i un peu avançat","Girades i flexibles, amb els dos braços ben separats i les cames creuades","Assegudes i simètriques, amb els braços damunt dels genolls","Frontals i rígides, amb els dos braços alçats i els peus junts"],"x":"","id":"c9-17"},{"t":"mc","q":"Quin valor té el somriure arcaic?","o":["És més convencional que expressiu","Expressa l'alegria individual del retratat","Assenyala que la figura representa un déu","Indica que es tracta d'un atleta vencedor"],"x":"","id":"c9-18"},{"t":"mc","q":"Quin problema resol l'escultura de l'època clàssica?","o":["El del moviment i el de l'equilibri","El de la perspectiva i el del color","El del retrat i el de la individualitat","El de la grandària i el del material"],"x":"","id":"c9-19"},{"t":"mc","q":"En què consistix el contrapost que fixa Policlet amb el Dorífor?","o":["El pes del cos recau sobre una cama, amb la compensació de malucs i espatles","El pes del cos es repartix exactament per igual entre les dos cames de la figura","El tronc es gira amb violència en sentit contrari al del cap i el coll","Tots els membres del cos es mouen alhora en una mateixa direcció"],"x":"Amb este joc l'escultura clàssica resol el problema de l'equilibri i del moviment; Policlet va formular a més un cànon de proporcions ideals.","id":"c9-20"},{"t":"mc","q":"De quins déus va fer Fídies les grans estàtues criselefantines?","o":["D'Atena i de Zeus","D'Apol·lo i d'Àrtemis","De Zeus i de Posidó","D'Atena i d'Hera"],"x":"","id":"c9-21"},{"t":"mc","q":"Com és el rostre en l'escultura clàssica del segle V aC?","o":["Serè i sense emoció individual: representa l'ideal, no la persona","Crispat pel dolor i la passió: representa el patiment humà","Individualitzat i precís: reproduïx els trets exactes del model real","Somrient de manera convencional, igual que en l'època arcaica"],"x":"","id":"c9-22"},{"t":"mc","q":"Quins temes, fins llavors marginals, incorpora l'escultura hel·lenística?","o":["La vellesa, el dolor físic i la infantesa","Els déus, els herois i els atletes vencedors","La guerra, la caça i el banquet","El treball, el comerç i el camp"],"x":"Porta el moviment, el dramatisme i el realisme a l'extrem.","id":"c9-23"},{"t":"mc","q":"Quines obres són representatives de l'època hel·lenística?","o":["El Laocoont, la Victòria de Samotràcia i la Venus de Milo","El Discòbol, el Dorífor i les mètopes esculpides del Partenó","El Dorífor, l'Atena de Fídies i el gran Zeus d'Olímpia","El kuros arcaic, la kore vestida i el Discòbol de Míron"],"x":"També el gran altar de Pèrgam.","id":"c9-24"},{"t":"mc","q":"Per què la ceràmica decorada és tan important per a conéixer la pintura grega?","o":["Perquè de la pintura sobre taula no se n'ha conservat pràcticament res","Perquè era l'únic producte que els grecs exportaven a occident","Perquè const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YPO='\u0345';
/* normalització PERMISSIVA: lleva accents, esperits i iota subscrita. Per a buscar. */
const sm = s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').normalize('NFC').toLowerCase().replace(/\u03c2/g,'\u03c3');
/* normalització ESTRICTA: lleva accents i esperits però CONSERVA la iota subscrita. Per a corregir. */
const sg = s=>s.normalize('NFD').split('').filter(c=>!/[\u0300-\u036f]/.test(c)||c===YPO).join('')
              .normalize('NFC').toLowerCase().replace(/\u03c2/g,'\u03c3');
const RN = ['','I','II','III','IV','V','VI','VII','VIII','IX'];
const GREEK_RE=/[\u0370-\u03ff\u1f00-\u1fff]/;
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample = (a,n)=>shuffle(a.slice()).slice(0,n);

  ['#theme','#theme2'].forEach(s=>{const b=$(s); if(b) b.innerHTML=lbl;});

function toggleTheme(){

  document.documentElement.setAttribute('data-theme',nx);
  try{localStorage.setItem(KEY+'.theme',nx);}catch(e){}

}

/* ================= LECTOR DE TEXTOS ================= */
const TOKRE = /[\u0370-\u03ff\u1f00-\u1fff]+/g;

function markWord(w){
  let ids = DATA.exact[w];
  if(!ids){
    const k=sm(w);
    ids = DATA.forms[k] || DATA.forms[k.replace(/\u03bd$/,'')] || DATA.forms[k+'\u03bd'];
  }
  if(!ids || !ids.length) return esc(w);
  return `<span class="w" data-e="${ids.join(',')}" data-w="${esc(w)}" tabindex="0" role="button">${esc(w)}</span>`;
}
function renderLatin(paras){
  return paras.map(p=>{
    let out='',last=0,m;
    TOKRE.lastIndex=0;
    while((m=TOKRE.exec(p))!==null){
      out += esc(p.slice(last,m.index)) + markWord(m[0]);
      last = m.index+m[0].length;
    }
    out += esc(p.slice(last));
    return `<p>${out}</p>`;
  }).join('');
}
function entryHTML(id){
  const e = DATA.entries[id];
  // separa el marcador gramatical entre parèntesi
  let t = e.t.replace(/^\(([^)]+)\)\s*/,'<em>($1)</em> ');
  return `<div class="enun">${esc(e.e).replace(/&amp;/g,'&')}</div><div class="trad">${t}</div>`;
}
const TT = ()=>document.getElementById('tt');
let ttOpen=null;
function showTip(node){
  const tt=TT(); if(!tt) return;
  const ids = node.dataset.e.split(',').map(Number);
  let h = `<div class="form">${esc(node.dataset.w)}</div>` + entryHTML(ids[0]);
  for(let k=1;k<ids.length;k++) h += `<div class="alt">${entryHTML(ids[k])}</div>`;
  tt.querySelector('.in').innerHTML = h;
  tt.classList.add('show');
  place(tt,node);
  if(ttOpen&&ttOpen!==node) ttOpen.classList.remove('open');
  node.classList.add('open'); ttOpen=node;
}
function place(tt,node){
  const r=node.getBoundingClientRect();
  tt.style.left='0px'; tt.style.top='0px';
  const w=tt.offsetWidth,h=tt.offsetHeight, m=10;
  let x = r.left + r.width/2 - w/2;
  x = Math.max(m, Math.min(x, innerWidth - w - m));
  let y = r.top - h - 9;
  if(y < m) y = r.bottom + 9;
  if(y + h > innerHeight - m) y = Math.max(m, innerHeight - h - m);
  tt.style.left = x+'px'; tt.style.top = y+'px';
}
function hideTip(){
  const tt=TT(); if(tt) tt.classList.remove('show');
  if(ttOpen){ttOpen.classList.remove('open');ttOpen=null;}
}
function bindReader(root){
  const hover = matchMedia('(hover:hover)').matches;
  root.addEventListener('pointerover',e=>{
    if(!hover) return;
    const t=e.target.closest('.w'); if(t) showTip(t);
  });
  root.addEventListener('pointerout',e=>{
    if(!hover) return;
    const t=e.target.closest('.w');
    if(t && !e.relatedTarget?.closest?.('#tt')) hideTip();
  });
  root.addEventListener('click',e=>{
    const t=e.target.closest('.w');
    if(!t){hideTip();return;}
    e.preventDefault();
    if(ttOpen===t && TT().classList.contains('show')) hideTip(); else showTip(t);
  });
  root.addEventListener('keydown',e=>{
    const t=e.target.closest('.w'); if(!t) return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();ttOpen===t?hideTip():showTip(t);}
    if(e.key==='Escape') hideTip();
  });
}
document.addEventListener('click',e=>{ if(!e.target.closest('.w')&&!e.target.closest('#tt')) hideTip(); });
addEventListener('scroll',()=>{ if(ttOpen) hideTip(); },{passive:true});
addEventListener('resize',hideTip);

/* ================= TECLAT GREC EN PANTALLA =================
   24 lletres + sigma final + iota subscrita. Sense esperits ni accents.
   La iota s'aplica DARRERE de la vocal i funciona com a interruptor.      */
const KB_ROWS=[
 ['α','β','γ','δ','ε','ζ'],
 ['η','θ','ι','κ','λ','μ'],
 ['ν','ξ','ο','π','ρ','σ'],
 ['τ','υ','φ','χ','ψ','ω']
];
const YPO_MAP={'α':'ᾳ','η':'ῃ','ω':'ῳ','ᾳ':'α','ῃ':'η','ῳ':'ω'};
let kbTarget=null;

function kbHTML(){
  const key=(ch,cls='',lbl=null)=>`<button type="button" class="k ${cls}" data-k="${ch}">${lbl||ch}</button>`;
  return `<div class="kbtop">
      <span class="kbttl">Teclat grec · sense esperits ni accents</span>
      <button type="button" class="kbx" data-k="__hide" aria-label="Amagar el teclat">Amagar</button>
    </div>
    ${KB_ROWS.map(r=>`<div class="kbrow">${r.map(c=>key(c)).join('')}</div>`).join('')}
    <div class="kbrow">
      ${key('ς','wide')}
      ${key('__ypo','ypo','ᾳ  iota')}
      ${key('__bs','wide','⌫')}
    </div>`;
}
function kbInit(){
  const k=document.getElementById('kbd'); if(!k) return;
  k.innerHTML=kbHTML();
  k.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.k,.kbx'); if(!b) return;
    e.preventDefault();                     // no perdre el focus del camp
    kbPress(b.dataset.k);
  });
}
function kbPress(ch){
  if(ch==='__hide') return kbHide();
  const t=kbTarget; if(!t) return;
  let v=t.value;
  if(ch==='__bs'){ t.value=v.slice(0,-1); }
  else if(ch==='__ypo'){
    const last=v.slice(-1), rep=YPO_MAP[last];
    if(rep) t.value=v.slice(0,-1)+rep;      // afig o lleva la iota de l'última vocal
  }
  else t.value=v+ch;
  t.dispatchEvent(new Event('input',{bubbles:true}));
  t.focus({preventScroll:true});
}
function kbShow(input){
  const k=document.getElementById('kbd'); if(!k) return;
  kbTarget=input; k.hidden=false;
  document.body.classList.add('kbopen');
}
function kbHide(){
  const k=document.getElementById('kbd'); if(!k) return;
  k.hidden=true; kbTarget=null;
  document.body.classList.remove('kbopen');
}

/* ================= MEMÒRIA DE CICLE =================
   Cada banc de preguntes recorda quines ha vist l'alumne. Es trien sempre
   preguntes no vistes; quan s'acaben, el cicle es tanca i torna a començar.  */
function cycleState(key,ids){
  ST.seen = ST.seen||{};
  let seen = (ST.seen[key]||[]).filter(id=>ids.includes(id));
  return {seen, total:ids.length};
}
function cyclePick(key,ids,n){
  ST.seen = ST.seen||{};
  let seen = (ST.seen[key]||[]).filter(id=>ids.includes(id));
  let unseen = ids.filter(id=>!seen.includes(id));
  let pick = shuffle(unseen.slice()).slice(0,n);
  if(pick.length < n){                    // el cicle es tanca: recomencem
    const rest = shuffle(ids.filter(id=>!pick.includes(id))).slice(0, n-pick.length);
    seen = pick.concat(rest);             // el cicle nou només conté estes
    pick = pick.concat(rest);
  } else {
    seen = seen.concat(pick);
  }
  ST.seen[key] = seen; save();
  return shuffle(pick);
}
function cycleBadge(key,ids){
  const {seen,total}=cycleState(key,ids);
  return `<div class="cyc"><span class="cycbar"><i style="width:${total?seen.length/total*100:0}%"></i></span>
    Has vist <b>${seen.length}</b> de ${total} preguntes d'este bloc</div>`;
}

function runQuiz(mount,{title,questions,onEnd,badge}){
  let i=0, right=0;
  const box = el('div','quiz');
  mount.innerHTML=''; mount.appendChild(box);
  const badgeEl = badge? el('div','',badge) : null;
  if(badgeEl) mount.appendChild(badgeEl);
  draw();

  function shell(inner,foot){
    const q=questions[i];
    box.innerHTML = `
      <div class="qhead"><span>${esc(title)}</span><span>${i+1} / ${questions.length}</span></div>
      <div class="bar"><i style="width:${(i/questions.length)*100}%"></i></div>
      <div class="qtext">${q.q}</div>
      ${inner}
      <div class="fb" id="fb"></div>
      <div class="qfoot"><span class="score">Encerts: ${right} de ${i}</span>
        <button class="btn pri" id="nx"${foot?'':' hidden'}>${foot||'Següent'}</button></div>`;
  }
  function feedback(ok,x){
    const fb=$('#fb',box);
    fb.className='fb on '+(ok?'ok':'no');
    fb.innerHTML = `<span class="fbt">${ok?'Recte!':'No hi és'}</span>${x||(ok?'':'Damunt tens la resposta correcta.')}`;
    const n=$('#nx',box); n.hidden=false; n.dataset.n='1';
    n.textContent = (i+1>=questions.length)?'Veure el resultat':'Següent';
    n.onclick=next; n.focus();
  }
  function draw(){
    if(i>=questions.length) return finish();
    const q=questions[i];
    if(q.type==='input') return drawInput(q);
    if(q.type==='order') return drawOrder(q);
    if(q.type==='match') return drawMatch(q);
    if(q.type==='build') return drawBuild(q);
    return drawChoice(q);
  }
  /* --- opció múltiple i vertader/fals --- */
  function drawChoice(q){
    shell(`<div class="opts">${q.opts.map((o,k)=>
      `<button type="button" class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>`);
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      box.querySelectorAll('.opt').forEach((el2,idx)=>{
        el2.disabled=true;
        if(idx===q.a) el2.classList.add('ok'); else if(idx===k) el2.classList.add('no');
      });
      const ok=k===q.a; if(ok) right++;
      feedback(ok,q.x);
    });
  }
  /* --- resposta escrita --- */
  function drawInput(q){
    shell(`<input class="ans" id="ai" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escriu la resposta…">
           <div class="hintrow">${q.hint?esc(q.hint):'No cal posar les marques de quantitat.'}</div>`,'Comprovar');
    const inp=$('#ai',box), nx=$('#nx',box);
    const go=()=>{
      const norm=s=>sm(s).replace(/[^a-z0-9]/g,'');
      const ok=(q.accept||[q.answer]).map(norm).includes(norm(inp.value));
      inp.classList.add(ok?'ok':'no'); inp.disabled=true;
      if(ok) right++;
      feedback(ok, ok? q.x : `La resposta correcta és <b>${esc(q.answer)}</b>. `+(q.x||''));
    };
    nx.onclick=()=>{ nx.dataset.n?next():go(); };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ nx.dataset.n?next():go(); }});
    inp.focus();
  }
  /* --- ordenar --- */
  function drawOrder(q){
    const items=q.shuffled;
    shell(`<div class="ordwrap">
        <div class="ordpool" id="pool">${items.map((t,k)=>`<button type="button" class="orditem" data-k="${k}">${t}</button>`).join('')}</div>
        <ol class="ordpick" id="pick"></ol>
        <div class="hintrow">Toca els elements en l'ordre correcte. <button type="button" class="lnk" id="undo">desfer</button></div>
      </div>`);
    const chosen=[];
    const pick=$('#pick',box);
    const paint=()=>{
      pick.innerHTML=chosen.map(k=>`<li>${items[k]}</li>`).join('');
      box.querySelectorAll('.orditem').forEach(b=>b.classList.toggle('used',chosen.includes(+b.dataset.k)));
      if(chosen.length===items.length) check();
    };
    box.querySelectorAll('.orditem').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; if(chosen.includes(k)) return; chosen.push(k); paint();
    });
    $('#undo',box).onclick=()=>{ chosen.pop(); paint(); };
    function check(){
      const ok = chosen.every((k,idx)=>q.order[k]===idx);
      box.querySelectorAll('.orditem').forEach(b=>b.disabled=true);
      $('#undo',box).disabled=true;
      pick.querySelectorAll('li').forEach((li,idx)=>li.className = q.order[chosen[idx]]===idx?'ok':'no');
      if(ok) right++;
      const correct=items.map((t,k)=>[q.order[k],t]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
      feedback(ok, ok? (q.x||'') : `L'ordre correcte és: ${correct.map(c=>'<b>'+c+'</b>').join(' → ')}. `+(q.x||''));
    }
  }
  /* --- emparellar --- */
  function drawMatch(q){
    shell(`<div class="matgrid">
      <div class="matcol" id="L">${q.left.map((t,k)=>`<button type="button" class="matitem" data-s="L" data-k="${k}">${t}</button>`).join('')}</div>
      <div class="matcol" id="R">${q.right.map((t,k)=>`<button type="button" class="matitem" data-s="R" data-k="${k}">${t}</button>`).join('')}</div>
      </div><div class="hintrow">Toca un element de l'esquerra i després la seua parella de la dreta.</div>`);
    let selL=null, done=0, wrong=0;
    box.querySelectorAll('.matitem').forEach(b=>b.onclick=()=>{
      if(b.disabled) return;
      const s=b.dataset.s, k=+b.dataset.k;
      if(s==='L'){
        box.querySelectorAll('[data-s="L"]').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel'); selL=k; return;
      }
      if(selL===null) return;
      const lb=box.querySelector(`[data-s="L"][data-k="${selL}"]`);
      if(q.map[selL]===k){
        lb.classList.remove('sel'); lb.classList.add('ok'); b.classList.add('ok');
        lb.disabled=true; b.disabled=true; done++;
        if(done===q.left.length){
          if(!wrong) right++;
          feedback(!wrong, wrong? `Has fet ${wrong} ${wrong===1?'intent errat':'intents errats'}. ${q.x||''}` : (q.x||''));
        }
      } else {
        wrong++; b.classList.add('no'); setTimeout(()=>b.classList.remove('no'),450);
      }
      selL=null; lb.classList.remove('sel');
    });
  }
  /* --- construir tocant: arrel fixa + desinència triada --- */
  function drawBuild(q){
    shell(`<div class="build">
        <span class="bstem">${q.stem}</span><span class="bslot" id="slot">?</span>
      </div>
      <div class="bends" id="bends">${q.options.map((o,k)=>
        `<button type="button" class="bend" data-k="${k}">${o}</button>`).join('')}</div>
      ${q.hint?`<div class="hintrow">${q.hint}</div>`:''}`);
    box.querySelectorAll('.bend').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, chosen=q.options[k];
      $('#slot',box).textContent=chosen.replace(/^-/,'');
      $('#slot',box).classList.add(k===q.a?'ok':'no');
      box.querySelectorAll('.bend').forEach((x,idx)=>{
        x.disabled=true;
        if(idx===q.a) x.classList.add('ok'); else if(idx===k) x.classList.add('no');
      });
      const ok=k===q.a; if(ok) right++;
      feedback(ok,q.x);
    });
  }
  function next(){ i++; draw(); }
  function finish(){
    kbHide();
    const pct=Math.round(right/questions.length*100);
    box.innerHTML=`<div class="result">
      <div class="big">${right}<span style="color:var(--ink-3);font-size:.5em"> / ${questions.length}</span></div>
      <div class="lbl">${pct>=90?'Optime!':pct>=70?'Bene!':pct>=50?'Satis bene':'Cal repassar'}</div>
      <button class="btn acc" id="again">Un altre bloc de preguntes</button></div>`;
    $('#again',box).onclick=()=>{ if(onEnd) onEnd(); };
  }
}

  const opts=shuffle([correct,...distractors]);

/* accentuació recessiva (verbs): la mateixa regla que s'ha verificat en Python */
const VOWG='αεηιουω';
function nucleiG(w){
  const d=w.normalize('NFD'); const out=[]; let i=0;
  while(i<d.length){
    if(VOWG.includes(d[i])){
      let j=i+1;
      while(j<d.length && /[̀-ͯ]/.test(d[j])) j++;
      if(j<d.length && VOWG.includes(d[j])){
        const base=d[i]+d[j];
        if(['αι','ει','οι','υι','αυ','ευ','ου','ηυ'].includes(base)){
          let k=j+1; while(k<d.length && /[̀-ͯ]/.test(d[k])) k++;
          out.push([i,k]); i=k; continue;
        }
      }
      out.push([i,j]); i=j;
    } else i++;
  }
  return [d,out];
}
function setAccent(w,pos){
  let [d,nu]=nucleiG(w);
  d=d.split('').filter(c=>!'́̀͂'.includes(c)).join('');
  [d,nu]=nucleiG(d);
  if(nu.length<=pos) pos=nu.length-1;
  const ins=nu[nu.length-1-pos][1];
  return (d.slice(0,ins)+'́'+d.slice(ins)).normalize('NFC');
}
const SHORT_END=new Set(['ομεν','ετε','ον','ες','ε','εν','ουσι','ουσιν','ετω','α','ας','αν',
                         'αι','οι','ομην','ετο','οντο','εσθε','ου'].map(sm));
function accentVerb(stem,end){
  const w=stem+end, n=nucleiG(w)[1].length;
  let pos = SHORT_END.has(sm(end)) ? 2 : 1;
  return setAccent(w,Math.min(pos,n-1));
}

function pool(u){ const a=[]; for(let k=2;k<=u;k++) a.push(...(PAR[k]||[])); return a; }
const NT=['n2m','n2n','n1a','n1h','n1i','n1m'];
function nouns(u,only){ return pool(u).filter(x=>NT.includes(x.t)&&(!only||only.includes(x.t))); }
function verbs(u,c){ return pool(u).filter(x=>x.t==='v'&&(!c||(c==='w'?x.c==='w':x.c!=='w'))); }
/* l'arrel es mostra sense accent (l'accent depén del cas) però conservant l'esperit */
const bareStem = w => w.normalize('NFD').split('').filter(c=>!'\u0301\u0300\u0342'.includes(c)).join('').normalize('NFC');
function stemOf(it){
  const h=bareStem(it.e.split(',')[0].trim());
  if(it.t==='n2m'||it.t==='n2n') return h.slice(0,-2);
  if(it.t==='n1m') return h.slice(0,-2);
  return h.slice(0,-1);
}
/* --- construir tocant: tria la desinència --- */
function qBuild(items){
  if(!items.length) return null;
  const it=sample(items,1)[0], d=DECL[it.t];
  const ci=Math.floor(Math.random()*5), ni=Math.random()<.5?0:1;
  const correct=d.e[ci][ni];
  const all=[...new Set([].concat(...d.e))].filter(x=>x!==correct);
  if(all.length<3) return null;
  const opts=shuffle([correct,...sample(all,3)]);
  return {type:'build', stem:esc(stemOf(it)),
    q:`De <span class="gr big">${esc(it.e)}</span> «${esc(it.tr)}», tria la desinència del <b>${CASES[ci].toLowerCase()} ${NUMS[ni]}</b>`,
    options:opts.map(esc), a:opts.indexOf(correct),
    x:`És de la <b>${d.l}</b>. Model: <em>${esc(d.model)}</em>.`};
}
/* --- quina declinació --- */
function qDeclKind(items){
  if(!items.length) return null;
  const it=sample(items,1)[0];
  const correct=DECL[it.t].l;
  const others=[...new Set(Object.values(DECL).map(d=>d.l))].filter(x=>x!==correct);
  return mcq(`A quina declinació pertany <span class="gr big">${esc(it.e)}</span>?`,esc(correct),
    sample(others,3).map(esc),`El genitiu singular és la clau del tipus.`);
}
/* --- l'article --- */
function qArticle(){
  const ci=Math.floor(Math.random()*4), col=Math.floor(Math.random()*6);
  const correct=ARTICLE[ci][col];
  const all=[...new Set([].concat(...ARTICLE))].filter(x=>x!==correct);
  return mcq(`Quina forma de l'article correspon al <b>${ART_CASES[ci].toLowerCase()} ${ART_COLS[col]}</b>?`,
    esc(correct),sample(all,3).map(esc),
    `L'article grec es declina i acompanya sempre el substantiu; ajuda a reconéixer-ne el cas.`);
}
function qArticleAnalyse(){
  const ci=Math.floor(Math.random()*4), col=Math.floor(Math.random()*6);
  const form=ARTICLE[ci][col];
  const same=[],diff=[];
  for(let c=0;c<4;c++) for(let j=0;j<6;j++){
    const lbl=`${ART_CASES[c]} ${ART_COLS[j]}`;
    (ARTICLE[c][j]===form?same:diff).push(lbl);
  }
  if(diff.length<3) return null;
  return mcq(`Quin cas, gènere i nombre pot ser l'article <span class="gr big">${esc(form)}</span>?`,
    sample(same,1)[0],sample([...new Set(diff)],3),
    same.length>1?`Esta forma és ambigua: té ${same.length} valors possibles.`:'');
}
/* --- present i imperfet --- */
function qVerbPres(items){
  const V=items.filter(x=>x.c==='w'); if(!V.length) return null;
  const it=sample(V,1)[0], p=Math.floor(Math.random()*6);
  const stem=it.stem.slice(0,-1);
  const impf=Math.random()<.4;
  const ends=impf?['ον','ες','ε','ομεν','ετε','ον']:['ω','εις','ει','ομεν','ετε','ουσι'];
  const aug=impf?augmentJS(stem):stem;
  const ans=accentVerb(aug,ends[p]);
  const other=ends.map(e=>accentVerb(aug,e));
  const alt=(impf?['ω','εις','ει','ομεν','ετε','ουσι']:['ον','ες','ε','ομεν','ετε','ον'])
              .map(e=>accentVerb(impf?it.stem.slice(0,-1):aug,e));
  const pool2=[...new Set(other.concat(alt))].filter(o=>o!==ans);
  if(pool2.length<3) return null;
  return mcq(`De <span class="gr big">${esc(it.e)}</span> «${esc(it.tr)}»: <b>${PERS[p]} del ${impf?'pretèrit imperfet':'present'} d'indicatiu actiu</b>`,
    esc(ans),sample(pool2,3).map(esc),
    impf?`L'imperfet afig l'augment <b>ἐ-</b> davant del tema i usa les desinències secundàries.`
        :`Desinències del present: ${PRES_END.join(' · ')}.`);
}
function augmentJS(stem){
  const first=stem.normalize('NFD')[0];
  if('αεοιυηω'.includes(first)) return stem;      // augment temporal: el deixem fora
  return 'ἐ'+stem;
}
function qVerbEnding(items){
  const V=items.filter(x=>x.c==='w'); if(!V.length) return null;
  const it=sample(V,1)[0], p=Math.floor(Math.random()*6);
  const impf=Math.random()<.4;
  const ends=impf?IMPF_END:PRES_END;
  const correct=ends[p];
  const opts=shuffle([...new Set(ends)]);
  const stem=bareStem(impf?augmentJS(it.stem.slice(0,-1)):it.stem.slice(0,-1));
  return {type:'build', stem:esc(stem),
    q:`De <span class="gr big">${esc(it.e)}</span> «${esc(it.tr)}», tria la desinència de la <b>${PERS[p]} del ${impf?'pretèrit imperfet':'present'} d'indicatiu actiu</b>`,
    options:opts.map(esc), a:opts.indexOf(correct),
    x:impf?`L'imperfet porta augment <b>ἐ-</b> i desinències secundàries: ${IMPF_END.join(' · ')}.`:`Present: ${PRES_END.join(' · ')}.`};
}
/* --- verbs contractes --- */
function qContract(items){
  const V=items.filter(x=>x.c&&x.c!=='w'); if(!V.length) return null;
  const it=sample(V,1)[0], p=Math.floor(Math.random()*6);
  const stem=it.stem.slice(0,-2);
  const C=CONTRACT[it.c];
  const ans=stem+C.pres[p];
  const others=['α','ε','ο'].filter(c=>c!==it.c).map(c=>stem+CONTRACT[c].pres[p]);
  const extra=C.pres.map(x=>stem+x);
  const pool2=[...new Set(others.concat(extra))].filter(o=>o!==ans);
  if(pool2.length<3) return null;
  return mcq(`De <span class="gr big">${esc(it.e)}</span> «${esc(it.tr)}»: <b>${PERS[p]} del present d'indicatiu</b>`,
    esc(ans),sample(pool2,3).map(esc),
    `Verb contracte en <b>-${it.c}ω</b>, com <em>${esc(C.model)}</em>. La contracció porta sempre l'accent.`);
}
/* --- εἰμί --- */
function qEimi(){
  const p=Math.floor(Math.random()*6), impf=Math.random()<.45;
  const set=impf?EIMI.impf:EIMI.pres;
  const ans=set[p];
  const all=[...new Set(EIMI.pres.concat(EIMI.impf))].filter(x=>x!==ans);
  return mcq(`Del verb <span class="gr big">εἰμί</span> «ser, estar, haver-hi»: <b>${PERS[p]} del ${impf?'pretèrit imperfet':'present'} d'indicatiu</b>`,
    esc(ans),sample(all,3).map(esc),`És el verb més irregular del grec i cal saber-lo de memòria.`);
}
/* --- imperatius atestats als textos --- */
function qImperative(){
  if(!DATA.impv||DATA.impv.length<4) return null;
  const it=sample(DATA.impv,1)[0];
  const others=DATA.impv.filter(x=>x.e!==it.e);
  return mcq(`Quina d'estes formes dels textos és l'imperatiu de <span class="gr big">${esc(it.e)}</span> «${esc(it.tr)}»?`,
    esc(it.f),sample(others,3).map(o=>esc(o.f)),
    `L'imperatiu de present actiu acaba en <b>-ε</b> (singular) i <b>-ετε</b> (plural); el mitjà, en <b>-ου</b> i <b>-εσθε</b>.`);
}

  if(q.t==='in'){
    return {type:'input',q:esc(q.q),answer:q.ans,accept:q.acc,x:q.x?esc(q.x):'',
            hint:'Escriu el terme. Si és grec, tens el teclat de baix.'};
  }
  if(q.t==='ord'){
    const idx=q.items.map((_,k)=>k);
    const sh=shuffle(idx.slice());
    return {type:'order',q:esc(q.q),shuffled:sh.map(k=>esc(q.items[k])),
            order:sh.map(k=>k), x:q.x?esc(q.x):''};
  }
  // emparellar
  const li=shuffle(q.pairs.map((_,k)=>k)), ri=shuffle(q.pairs.map((_,k)=>k));
  return {type:'match',q:esc(q.q),
          left:li.map(k=>esc(q.pairs[k][0])), right:ri.map(k=>esc(q.pairs[k][1])),
          map:li.map(k=>ri.indexOf(k)), x:q.x?esc(q.x):''};
}

function runDrill(mount,d){
  const qs=[]; let guard=0; const seen=new Set();
  while(qs.length<10 && guard++<600){
    const q=d.gen(); if(!q) continue;
    const sig=(q.q||'')+'|'+(q.answer||'');
    if(seen.has(sig)) continue;
    seen.add(sig); qs.push(q);
  }
  runQuiz(mount,{title:d.name,questions:qs,onEnd:()=>runDrill(mount,d)});
}

const lemmaOf = e => sm(e.e.split(',')[0]);
function closeWords(target,poolArr,n){
  const t=lemmaOf(target);
  const score=w=>{
    const a=lemmaOf(w); let i=0;
    while(i<a.length&&i<t.length&&a[i]===t[i]) i++;
    let j=0;
    while(j<a.length&&j<t.length&&a[a.length-1-j]===t[t.length-1-j]) j++;
    return i*2+j;                       // prefix compartit compta doble
  };
  return poolArr.filter(w=>w.e!==target.e).map(w=>[score(w),w])
    .filter(p=>p[0]>=4).sort((a,b)=>b[0]-a[0]).slice(0,6).map(p=>p[1]).slice(0,n);
}
function pickDistractors(target,poolArr,n){
  // 20% de les vegades, mots formalment pròxims (servus/serva)
  if(Math.random()<0.2){
    const close=closeWords(target,poolArr,n);
    if(close.length===n) return close;
  }
  // la resta, sempre de la mateixa categoria gramatical
  const same=poolArr.filter(w=>w.e!==target.e && w.c===target.c);
  if(same.length>=n) return sample(same,n);
  // si la unitat no en té prou, s'òmpli amb el més pròxim que hi haja
  const rest=poolArr.filter(w=>w.e!==target.e && w.c!==target.c);
  return shuffle(same.concat(sample(rest,Math.min(n-same.length,rest.length))));
}

function flash(mount,words){
  let order=shuffle(words.slice()), i=0, flipped=false;
  mount.innerHTML=`<div class="fc" id="fc"><div class="fcin">
      <div class="fcf"><div class="gr big" id="ff"></div><div class="hint">Toca per a girar</div></div>

      <span class="score" id="fs"></span>

      <button class="btn" id="fsh">Barallar</button>
      <button class="btn pri" id="fn">Següent</button></span>
    </div>`;
  const card=$('#fc',mount);
  const draw=()=>{ flipped=false; card.classList.remove('flip');
    $('#ff',mount).textContent=order[i].e; $('#fb2',mount).innerHTML=order[i].t;
    $('#fs',mount).textContent=`${i+1} / ${order.length}`; };
  card.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flip',flipped);});
  $('#fn',mount).onclick=()=>{ i=(i+1)%order.length; draw(); };
  $('#fp',mount).onclick=()=>{ i=(i-1+order.length)%order.length; draw(); };
  $('#fsh',mount).onclick=()=>{ order=shuffle(order); i=0; draw(); };
  draw();
}
function vocQuiz(mount,words,dir,un){
  const clean=t=>t.replace(/^\([^)]*\)\s*:?\s*/,'').split(/[·;]/)[0].replace(/^:\s*/,'').trim();
  const key='voc'+un+dir, ids=words.map(w=>w.e);
  const byId={}; words.forEach(w=>byId[w.e]=w);
  const qs=cyclePick(key,ids,Math.min(10,ids.length)).map(id=>{
    const w=byId[id];
    const d=pickDistractors(w,words,3);
    if(dir==='lv') return mcq(`Què significa <span class="gr big">${esc(w.e)}</span>?`,
      esc(clean(w.t)), d.map(o=>esc(clean(o.t))),'');
    return mcq(`Quin mot grec significa «${esc(clean(w.t))}»?`, `<span class="gr">${esc(w.e)}</span>`, d.map(o=>`<span class="gr">${esc(o.e)}</span>`),'');
  });
  runQuiz(mount,{title:dir==='lv'?'Grec → Valencià':'Valencià → Grec',questions:qs,
    badge:cycleBadge(key,ids), onEnd:()=>vocQuiz(mount,words,dir,un)});
}
