":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φθείρω, φθερῶ, ἔφθειρα","t":"destruir, arruïnar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φοβέομαι, φοβήσομαι, ἐφοβήθην","t":"témer, tindre por de (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"γάρ","t":"(conj. postposada): doncs, perquè, en efecte","g":"Preposicions i conjuncions"},{"e":"αὔριον","t":"demà","g":"Adverbis i partícules"},{"e":"ἐκεῖ","t":"allí, allà (indica situació / repòs)","g":"Adverbis i partícules"},{"e":"ἔτι","t":"encara","g":"Adverbis i partícules"},{"e":"μάλα","t":"molt (intensificador d'adjectius i verbs)","g":"Adverbis i partícules"},{"e":"ναί","t":"sí","g":"Adverbis i partícules"},{"e":"οὕτως","t":"així, d'esta manera","g":"Adverbis i partícules"},{"e":"πάλιν","t":"de nou, una altra vegada","g":"Adverbis i partícules"}]},{"n":5,"title":"La religió i el mite","cultura":"<h3>La religió i el mite<\/h3>\n<h4>1. Com era la religió grega<\/h4>\n<p>La religió grega es diferencia en punts essencials de les religions monoteistes que ens són familiars.<\/p>\n<p>És <strong>politeista<\/strong>: hi ha una multitud de divinitats amb funcions repartides. És <strong>antropomòrfica<\/strong>: els déus tenen forma humana i, sobretot, caràcter humà, amb enveges, favoritismes i enuigs; es diferencien dels mortals perquè són immortals i poderosos, no perquè siguen moralment superiors. <strong>No té llibre sagrat ni dogma<\/strong>: no existix una revelació ni una veritat oficial, i per això no hi ha heretgies. <strong>No té una casta sacerdotal professional<\/strong>: els sacerdocis solen ser càrrecs cívics, temporals i sovint sortejats, i qualsevol cap de família pot fer un sacrifici. Finalment, és una <strong>religió cívica<\/strong>: cada polis té els seus déus protectors, i participar en el culte forma part de ser ciutadà. La impietat no era només un pecat privat, sinó un delicte contra la comunitat.<\/p>\n<p>El que s'exigia al fidel no era creure una doctrina, sinó complir els ritus. La relació amb la divinitat es basava en un intercanvi: l'home oferix, el déu concedix.<\/p>\n<h4>2. Els déus olímpics<\/h4>\n<p>La tradició fixa en dotze els grans déus que habiten l'Olimp:<\/p>\n<ul><li><strong>Zeus<\/strong>, sobirà, déu del cel i del llamp, garant de l'hospitalitat i dels juraments.<\/li><li><strong>Hera<\/strong>, esposa de Zeus, protectora del matrimoni.<\/li><li><strong>Posidó<\/strong>, déu de la mar, dels terratrémols i dels cavalls.<\/li><li><strong>Demèter<\/strong>, deessa dels cereals i de l'agricultura.<\/li><li><strong>Atena<\/strong>, nascuda del cap de Zeus, deessa de la saviesa, de l'artesania i de la guerra estratègica; patrona d'Atenes.<\/li><li><strong>Apol·lo<\/strong>, déu de la llum, de la música, de la profecia i de la medicina.<\/li><li><strong>Àrtemis<\/strong>, la seua germana, deessa de la caça i dels espais salvatges.<\/li><li><strong>Ares<\/strong>, déu de la guerra en el seu vessant violent.<\/li><li><strong>Afrodita<\/strong>, deessa de l'amor i de la bellesa.<\/li><li><strong>Hermes<\/strong>, missatger, protector dels camins, dels comerciants i dels lladres.<\/li><li><strong>Hefest<\/strong>, déu del foc i de la metal·lúrgia.<\/li><li><strong>Hèstia<\/strong> o <strong>Dionís<\/strong>, segons les llistes: la deessa de la llar o el déu del vi, de l'èxtasi i del teatre.<\/li><\/ul>\n<p>Fora de l'Olimp hi ha <strong>Hades<\/strong>, senyor del món subterrani, i una multitud de divinitats menors: nimfes, sàtirs, rius, les Muses, les Erínies o les Moires.<\/p>\n<h4>3. El culte: temples, sacrificis i festes<\/h4>\n<p>El <strong>temple<\/strong> no era un lloc de reunió dels fidels, sinó la casa del déu: guardava l'estàtua de culte i les ofrenes. Els ritus es feien a l'aire lliure, davant de l'altar situat a l'exterior.<\/p>\n<p>L'acte central era el <strong>sacrifici<\/strong>. S'oferien libacions de vi, oli o llet, pastissos i, en les grans ocasions, animals. La víctima es cremava en part per al déu i la resta es repartia i es menjava en comunitat, de manera que el sacrifici era també un àpat col·lectiu.<\/p>\n<p>Cada ciutat tenia un calendari de <strong>festes<\/strong>. A Atenes destaquen les <strong>Panatenees<\/strong>, en honor d'Atena, amb processó, competicions i lliurament d'un peple nou a la deessa, i les <strong>Grans Dionísies<\/strong>, on es representaven les tragèdies i comèdies.<\/p>\n<p>Alguns santuaris tenien caràcter <strong>panhel·lènic<\/strong>: hi acudien grecs de tot arreu i durant els jocs es proclamava una treva sagrada. Els principals van ser <strong>Olímpia<\/strong>, consagrada a Zeus, i <strong>Delfos<\/strong>, seu de l'oracle d'Apol·lo, on la sacerdotessa Pítia responia les consultes de particulars i de ciutats senceres. També era famós l'oracle de Zeus a <strong>Dodona<\/strong>.<\/p>\n<h4>4. Misteris i religiositat personal<\/h4>\n<p>Al costat del culte oficial hi havia cultes que oferien una experiència més íntima i una esperança de salvació. Els <strong>misteris d'Eleusis<\/strong>, vinculats al mite de Demèter i Persèfone, admetien homes i dones, lliures i esclaus, i prometien als iniciats un destí millor després de la mort; els seus ritus estaven protegits per un secret rigorós. L'<strong>orfisme<\/strong> predicava la puresa, l'abstinència i la transmigració de les ànimes. El culte a <strong>Dionís<\/strong> incloïa formes d'èxtasi col·lectiu que trencaven momentàniament les normes socials.<\/p>\n<h4>5. Les creences sobre el Més Enllà<\/h4>\n<p>En els poemes homèrics, el destí dels morts és poc envejable: les ànimes descendixen a l'<strong>Hades<\/strong>, un regne subterrani on porten una existència d'ombres sense consciència plena. El difunt havia de ser enterrat amb els ritus deguts; si no, la seua ànima vagava sense repòs. La tradició posterior va desenrotllar una geografia detallada: els rius Estix i Aqueront, el barquer <strong>Caront<\/strong>, que cobrava un òbol per travessar-los, el gos Cèrber com a guardià i tres jutges que assignaven el destí de cadascú. Els justos anaven als <strong>Camps Elisis<\/strong> i els grans criminals al <strong>Tàrtar<\/strong>. Esta idea de premi i càstig, reforçada pels misteris i per la filosofia, va anar guanyant pes al llarg de l'època clàssica.<\/p>\n<h4>6. Què és un mite<\/h4>\n<p>El mite és un relat tradicional, anònim i transmés oralment, que explica l'origen del món, dels déus i dels homes, i que dona sentit a institucions, rituals i llocs. No és una doctrina religiosa ni una crònica històrica, però es relaciona amb totes dos coses: es narra en el marc del culte i sovint conserva el record deformat de fets antics. La seua flexibilitat és característica: un mateix mite té versions diferents segons l'època, la ciutat i l'autor.<\/p>\n<p><strong>Cosmogonia i teogonia.<\/strong> La versió més influent és la d'Hesíode. Al principi hi ha el Caos; després apareix Gea (la Terra), que engendra Urà (el Cel). De la unió dels dos naixen els Titans, un dels quals, Cronos, destrona el pare. Cronos devora els seus fills fins que Rea salva Zeus, el qual, ja adult, venç el pare i els Titans en una llarga guerra i establix l'ordre olímpic definitiu.<\/p>\n<p><strong>Antropogonia.<\/strong> Els relats sobre l'origen humà giren al voltant de <strong>Prometeu<\/strong>, que enganya Zeus en el repartiment del sacrifici i roba el foc per als homes; el càstig és el suplici del titan i l'enviament de <strong>Pandora<\/strong>, la primera dona, amb la gerra dels mals. Hesíode narra a més una successió d'edats —d'or, de plata, de bronze, dels herois i de ferro— que degrada progressivament la humanitat, i el diluvi del qual se salven <strong>Deucalió i Pirra<\/strong>.<\/p>\n<h4>7. Els grans cicles heroics<\/h4>\n<p>Els mites d'herois s'agrupen en conjunts vinculats a una regió:<\/p>\n<ul><li><strong>Cicle argòlic<\/strong>: <strong>Perseu<\/strong>, que mata la Medusa, i sobretot <strong>Hèracles<\/strong>, l'heroi panhel·lènic per excel·lència, sotmés als dotze treballs i divinitzat després de la mort.<\/li><li><strong>Cicle tebà<\/strong>: la fundació de Tebes per <strong>Cadme<\/strong>, la història d'<strong>Èdip<\/strong> i el conflicte fratricida dels seus fills, amb la figura d'<strong>Antígona<\/strong>.<\/li><li><strong>Cicle argonàutic<\/strong>: l'expedició de <strong>Jàson<\/strong> i els argonautes a la Còlquida a la recerca del velló d'or, i la figura tràgica de <strong>Medea<\/strong>.<\/li><li><strong>Cicle troià<\/strong>: el rapte d'Hèlena, els deu anys de setge, la còlera d'Aquil·les, l'estratagema del cavall i el retorn dels herois, amb el viatge d'<strong>Odisseu<\/strong> com a episodi més cèlebre.<\/li><li><strong>Cicle àtic<\/strong>: <strong>Teseu<\/strong>, vencedor del Minotaure i unificador mític de l'Àtica.<\/li><\/ul>\n<h4>8. La pervivència del mite<\/h4>\n<p>Els mites grecs han sigut matèria primera de la literatura, de la pintura, de l'escultura, de l'òpera i del cinema durant més de dos mil·lennis, i han donat noms a planetes, marques, malalties i conceptes. Expressions com «taló d'Aquil·les», «caixa de Pandora», «complex d'Èdip» o «treball d'Hèrcules» demostren que continuen sent una llengua compartida per a parlar de l'experiència humana.<\/p>","gram":"<h3>La tercera declinació (II) i l'aspecte puntual (L'Aorist)<\/h3>\n<p>En este tema completarem l'estudi de la tercera declinació, abordant aquells mots l'arrel dels quals acaba en sibilant (sigma) o en vocal suau/diftong. A continuació, donarem un pas fonamental per a entendre la mentalitat grega: el concepte d'aspecte verbal, que ens obrirà les portes al temps del passat més utilitzat en la narració històrica i mitològica: l'Aorist.<\/p>\n<h4>1. La tercera declinació (II): Temes en sibilant i vocal<\/h4>\n<p>En este segon grup de la tercera declinació trobarem paraules on la unió de l'arrel amb la desinència provoca canvis fonètics importants, fonamentalment la caiguda de consonants i la consegüent contracció de vocals.<\/p>\n<p><strong>1.1. Temes en sibilant (-εσ / -οσ)<\/strong><\/p>\n<p>Estos substantius tenien una arrel que originalment acabava en sibilant (sigma, -σ). El problema és que en grec la sigma intervocàlica (entre dues vocals) és molt dèbil: cau i desapareix. En desaparéixer, les dues vocals que queden juntes es fusionen en una de sola (contracció vocàlica).<\/p>\n<p>(Regles de contracció d'este grup: ε+ο = ου / ε+α = η / ε+ε = ει).<\/p>\n<p><strong>Model neutre: τὸ τεῖχος (el mur)<\/strong><\/p>\n<p>La majoria de les paraules d'este grup són neutres que en el nominatiu canvien la -ε- de l'arrel per una -ο- (com τὸ γένος, \"el llinatge\", o τὸ τεῖχος, \"el mur\").<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Singular<\/strong><\/td><td><strong>Explicació de la contracció<\/strong><\/td><td><strong>Plural<\/strong><\/td><\/tr><tr><td>Nom / Voc / Acus<\/td><td>τὸ τεῖχος<\/td><td>(arrel pura amb grau -o)<\/td><td>τὰ τείχη (ε+α)<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ τείχους<\/td><td>(de τείχεσ-ος &gt; τείχε-ος &gt; ε+ο=ου)<\/td><td>τῶν τειχῶν (ε+ων)<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ τείχει<\/td><td>(de τείχεσ-ι &gt; τείχε-ι &gt; ε+ι=ει)<\/td><td>τοῖς τείχε-σι(ν)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>NOTA SOBRE MASCULINS PROPIS EN -ΗΣ.<\/strong> Noms històrics molt famosos com Sòcrates (Σωκράτης) o Pèricles (Περικλῆς) són temes en sibilant que només tenen singular.<\/p>\n<p>Ex. Nom: Σωκράτης, Voc: Σώκρατες, Acus: Σωκράτη (ε+α=η), Gen: Σωκράτους, Dat: Σωκράτει.<\/p>\n<p><strong>1.2. Temes en vocal suau (-ι, -υ) i diftong (-ευ)<\/strong><\/p>\n<p>Es caracteritzen per tindre alternança vocàlica: la vocal de l'arrel canvia a -ε- en tots els casos excepte en el nominatiu, vocatiu i acusatiu singular.<\/p>\n<p><strong>Model en -ι (Femenins): ἡ πόλις (la ciutat)<\/strong><\/p>\n<p>És un dels models més freqüents i importants de tot el grec clàssic (d'ací deriven paraules com política o metròpolis).<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Singular<\/strong><\/td><td><strong>Plural<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>ἡ πόλι-ς<\/td><td>αἱ πόλει-ς (ε+ες)<\/td><\/tr><tr><td>Vocatiu<\/td><td>ὦ πόλι<\/td><td>ὦ πόλει-ς<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὴν πόλι-ν<\/td><td>τὰς πόλει-ς (igual al nom.)<\/td><\/tr><tr><td>Genitiu<\/td><td>τῆς πόλε-ως<\/td><td>τῶν πόλε-ων<\/td><\/tr><tr><td>Datiu<\/td><td>τῇ πόλει (ε+ι)<\/td><td>ταῖς πόλε-σι(ν)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> El genitiu \"àtic\".<\/p>\n<p>Segons la llei de limitació, si l'última síl·laba és llarga (-ως ho és), l'accent no pot remuntar-se a l'avantpenúltima. I no obstant això, s'escriu πόλεως i πόλεων (amb accent a la tercera començant pel final). Açò es diu Genitiu Àtic, i s'explica per un intercanvi de quantitat vocàlica que va ocórrer antigament. Considera-ho una excepció visual establida.<\/p>\n<p><strong>Model en diftong (-ευ): ὁ βασιλεύς (el rei)<\/strong><\/p>\n<p>Majoritàriament masculins. La -υ- del diftong desapareix davant de les vocals de les desinències. L'acusatiu singular afig una alfa llarga (-α).<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Singular<\/strong><\/td><td><strong>Plural<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>ὁ βασιλεύ-ς<\/td><td>οἱ βασιλεῖ-ς (ε+ες)<\/td><\/tr><tr><td>Vocatiu<\/td><td>ὦ βασιλεῦ<\/td><td>ὦ βασιλεῖ-ς<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὸν βασιλέ-α<\/td><td>τοὺς βασιλέ-ας<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ βασιλέ-ως (gen. àtic)<\/td><td>τῶν βασιλέ-ων<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ βασιλεῖ (ε+ι)<\/td><td>τοῖς βασιλεῦ-σι(ν)<\/td><\/tr><\/table><\/div>\n<h4>2. Adjectius de la Segona Classe (3a declinació)<\/h4>\n<p>Són adjectius que es declinen exclusivament per la tercera declinació. Són adjectius de dues terminacions: el masculí i el femení compartixen la mateixa forma, mentres que el neutre té la seua pròpia. N'estudiarem els dos tipus principals:<\/p>\n<p><strong>2.1. Tipus en -ης, -ες (Tema en sibilant)<\/strong><\/p>\n<p>Model: ἀληθής, ἀληθές (vertader, de veritat).<\/p>\n<p>Es declinen exactament com els substantius Σωκράτης (però amb plural) i τὸ τεῖχος. L'arrel acaba en -εσ, la sigma cau i les vocals es contrauen.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. / Fem. Sg.<\/strong><\/td><td><strong>Neutre Sg.<\/strong><\/td><td><strong>Masc. / Fem. Pl.<\/strong><\/td><td><strong>Neutre Pl.<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>ἀληθής<\/td><td>ἀληθές<\/td><td>ἀληθεῖς<\/td><td>ἀληθῆ<\/td><\/tr><tr><td>Vocatiu<\/td><td>ἀληθές<\/td><td>ἀληθές<\/td><td>ἀληθεῖς<\/td><td>ἀληθῆ<\/td><\/tr><tr><td>Acusatiu<\/td><td>ἀληθῆ (-έα &gt; -ῆ)<\/td><td>ἀληθές<\/td><td>ἀληθεῖς<\/td><td>ἀληθῆ<\/td><\/tr><tr><td>Genitiu<\/td><td>ἀληθοῦς (ambdós iguals)<\/td><td>ἀληθοῦς (ambdós iguals)<\/td><td>ἀληθῶν<\/td><td>ἀληθῶν<\/td><\/tr><tr><td>Datiu<\/td><td>ἀληθεῖ (ambdós iguals)<\/td><td>ἀληθεῖ (ambdós iguals)<\/td><td>ἀληθέσι(ν)<\/td><td>ἀληθέσι(ν)<\/td><\/tr><\/table><\/div>\n<p><strong>2.2. Tipus en -ων, -ον (Tema en nasal)<\/strong><\/p>\n<p>Model: σώφρων, σῶφρον (prudent, sensat).<\/p>\n<p>Es declinen com els substantius nasals que vam vore al tema anterior (tipus δαίμων, sense sigma al nominatiu). El neutre fa el nominatiu/vocatiu/acusatiu singular amb l'arrel pura.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. / Fem. Sg.<\/strong><\/td><td><strong>Neutre Sg.<\/strong><\/td><td><strong>Masc. / Fem. Pl.<\/strong><\/td><td><strong>Neutre Pl.<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>σώφρων<\/td><td>σῶφρον<\/td><td>σώφρον-ες<\/td><td>σώφρον-α<\/td><\/tr><tr><td>Vocatiu<\/td><td>σῶφρον<\/td><td>σῶφρον<\/td><td>σώφρον-ες<\/td><td>σώφρον-α<\/td><\/tr><tr><td>Acusatiu<\/td><td>σώφρον-α<\/td><td>σῶφρον<\/td><td>σώφρον-ας<\/td><td>σώφρον-α<\/td><\/tr><tr><td>Genitiu<\/td><td>σώφρον-ος<\/td><td>σώφρον-ος<\/td><td>σωφρόν-ων<\/td><td>σωφρόν-ων<\/td><\/tr><tr><td>Datiu<\/td><td>σώφρον-ι<\/td><td>σώφρον-ι<\/td><td>σώφρο-σι(ν) (cau la ν)<\/td><td>σώφρο-σι(ν)<\/td><\/tr><\/table><\/div>\n<h4>3. El sistema verbal grec: Temps vs. Aspecte<\/h4>\n<p>Per a comprendre la narració grega cal entendre com pensaven l'acció. En valencià donem molta importància al temps (quan ocorre: ahir, hui, demà). El grec antic, en canvi, dóna una importància cabdal a l'aspecte verbal, és a dir, com concep el parlant el desenvolupament intern de l'acció.<\/p>\n<ul><li><strong>Aspecte Duratiu:<\/strong> Expressa l'acció en el seu desenvolupament, com un procés inacabat, de durada o repetitiu. S'expressa amb el sistema de Present i Imperfet. (Ex: El xiquet deslligava el gos / El xiquet està deslligant).<\/li><li><strong>Aspecte Puntual:<\/strong> Expressa l'acció com un fet simple, tancat en si mateix, com un punt en el temps, sense importar-ne la durada ni el resultat. S'expressa amb el sistema d'Aorist. (Ex: El xiquet deslligà / va deslligar el gos).<\/li><\/ul>\n<p>En el mode Indicatiu, l'Aorist indica sempre passat (per això porta augment). Serà el temps per excel·lència de la narració i el relat mitològic o històric per a fer avançar l'acció ràpidament.<\/p>\n<h4>4. L'Aorist d'indicatiu (Veu Activa i Mitjana)<\/h4>\n<p>S'utilitza per a narrar accions concloses en el passat (traduïble pel nostre pretèrit perfet simple: vaig cantar, aní).<\/p>\n<p>Es forma de dues maneres diferents, depenent de la naturalesa de cada verb. Són excloents: un verb fa aorist dèbil o aorist fort, però no tots dos.<\/p>\n<p><strong>4.1. L'Aorist dèbil o sigmàtic<\/strong><\/p>\n<p>És la forma regular, utilitzada per la majoria de verbs. La seua marca característica és el sufix -σα- (d'ací el nom de \"sigmàtic\").<\/p>\n<p>Fórmula: Augment + Arrel del verb + -σα- + Desinències secundàries<\/p>\n<div class=\"tw\"><table><tr><td><strong>Persona<\/strong><\/td><td><strong>Aorist Actiu (ἔλυσα)<\/strong><\/td><td><strong>Aorist Mitjà (ἐλυσάμην)<\/strong><\/td><\/tr><tr><td>1a sg.<\/td><td>ἔ-λυ-σα (jo vaig deslligar)<\/td><td>ἐ-λυ-σά-μην (jo em vaig deslligar)<\/td><\/tr><tr><td>2a sg.<\/td><td>ἔ-λυ-σα-ς<\/td><td>ἐ-λύ-σω (*ἐ-λυ-σα-σο)<\/td><\/tr><tr><td>3a sg.<\/td><td>ἔ-λυ-σε(ν)<\/td><td>ἐ-λύ-σα-το<\/td><\/tr><tr><td>1a pl.<\/td><td>ἐ-λύ-σα-μεν<\/td><td>ἐ-λυ-σά-μεθα<\/td><\/tr><tr><td>2a pl.<\/td><td>ἐ-λύ-σα-τε<\/td><td>ἐ-λύ-σα-σθε<\/td><\/tr><tr><td>3a pl.<\/td><td>ἔ-λυ-σα-ν<\/td><td>ἐ-λύ-σα-ντο<\/td><\/tr><\/table><\/div>\n<p><strong>Canvis ortogràfics (Oclusives + sigma):<\/strong> Com que afigen una sigma (-σ-), els verbs l'arrel dels quals acaba en oclusiva patixen els mateixos xocs fonètics que a la 3a declinació o al futur:<\/p>\n<ul><li>Labials (π, β, φ) + σ = ψ (πέμπω ➞ ἔπεμψα).<\/li><li>Guturals (κ, γ, χ) + σ = ξ (διώκω ➞ ἐδίωξα).<\/li><li>Dentals (τ, δ, θ) + σ = σ (cau la dental: πείθω ➞ ἔπεισα).<\/li><\/ul>\n<p><strong>4.2. L'Aorist fort o temàtic<\/strong><\/p>\n<p>Molts dels verbs d'ús més freqüent, en lloc de posar el sufix -σα-, canvien la seua arrel per a marcar l'aorist (bé per pèrdua d'una vocal, o per utilitzar una arrel completament diferent).<\/p>\n<p>Com que l'arrel ja ha canviat, no necessiten afegir cap -σ-. Es conjuguen exactament amb les mateixes terminacions que l'imperfet d'indicatiu (amb vocal temàtica ο/ε), però aplicades sobre la nova arrel d'aorist.<\/p>\n<p>Model: El verb λείπω (abandonar, deixar). La seua arrel d'aorist perd l'èpsilon: λιπ-. Per tant, l'aorist es forma afegint l'augment i les desinències a -λιπ-.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Persona<\/strong><\/td><td><strong>Aorist Actiu (ἔλιπον)<\/strong><\/td><td><strong>Aorist Mitjà (ἐλιπόμην)<\/strong><\/td><\/tr><tr><td>1a sg.<\/td><td>ἔ-λιπ-ο-ν (jo vaig deixar)<\/td><td>ἐ-λιπ-ό-μην (jo em vaig deixar)<\/td><\/tr><tr><td>2a sg.<\/td><td>ἔ-λιπ-ε-ς<\/td><td>ἐ-λίπ-ου (*ἐλιπεσο)<\/td><\/tr><tr><td>3a sg.<\/td><td>ἔ-λιπ-ε(ν)<\/td><td>ἐ-λίπ-ε-το<\/td><\/tr><tr><td>1a pl.<\/td><td>ἐ-λίπ-ο-μεν<\/td><td>ἐ-λιπ-ό-μεθα<\/td><\/tr><tr><td>2a pl.<\/td><td>ἐ-λίπ-ε-τε<\/td><td>ἐ-λίπ-ε-σθε<\/td><\/tr><tr><td>3a pl.<\/td><td>ἔ-λιπ-ο-ν<\/td><td>ἐ-λίπ-ο-ντο<\/td><\/tr><\/table><\/div>\n<p><strong>Llista d'Aorists Forts d'alta freqüència (a memoritzar):<\/strong><\/p>\n<ul><li>βάλλω (llançar) ➞ arrel βαλ- ➞ ἔβαλον<\/li><li>λαμβάνω (agafar) ➞ arrel λαβ- ➞ ἔλαβον<\/li><li>μανθάνω (aprendre) ➞ arrel μαθ- ➞ ἔμαθον<\/li><li>φεύγω (fugir) ➞ arrel φυγ- ➞ ἔφυγον<\/li><li>εὑρίσκω (trobar) ➞ arrel εὑρ- ➞ ηὗρον / εὗρον<\/li><li>λέγω (dir) ➞ arrel εἰπ- ➞ εἶπον (polirrizisme)<\/li><li>ὁράω (vore) ➞ arrel ἰδ- ➞ εἶδον (polirrizisme)<\/li><li>ἔρχομαι (anar, vindre) ➞ arrel ἐλθ- ➞ ἦλθον (polirrizisme)<\/li><\/ul>","lexicon":[{"e":"βασιλεύς, -έως, ὁ","t":"rei","g":"Substantius"},{"e":"Ἕλλην, -ηνος, ὁ","t":"grec","g":"Substantius"},{"e":"ἡμέρα, -ας, ἡ","t":"dia","g":"Substantius"},{"e":"ἱερεύς, -έως, ὁ","t":"sacerdot","g":"Substantius"},{"e":"ἱππεύς, -έως, ὁ","t":"genet, soldat de cavalleria","g":"Substantius"},{"e":"πόλις, -εως, ἡ","t":"ciutat, estat","g":"Substantius"},{"e":"πολίτης, -ου, ὁ","t":"ciutadà","g":"Substantius"},{"e":"τεῖχος, -ους, τό","t":"mur, muralla","g":"Substantius"},{"e":"Λαοκόων, -οωντος, ὁ","t":"Laocoont","g":"Noms propis"},{"e":"Πρίαμος, -ου, ὁ","t":"Príam","g":"Noms propis"},{"e":"Τροία, -ας, ἡ","t":"Troia","g":"Noms propis"},{"e":"Τρώς, Τρωός, ὁ","t":"troià (habitant de Troia)","g":"Noms propis"},{"e":"ἀληθής, -ές","t":"vertader, cert, de veritat","g":"Adjectius"},{"e":"ἀσφαλής, -ές","t":"segur, ferm","g":"Adjectius"},{"e":"ἄφρων, -ον","t":"insensat, boig, sense trellat","g":"Adjectius"},{"e":"ξύλινος, -η, -ον","t":"de fusta","g":"Adjectius"},{"e":"παλαιός, -ά, -όν","t":"antic, vell (l'expressió τὸ παλαιόν es traduïx com \"antigament\" o \"en l'antiguitat\")","g":"Adjectius"},{"e":"πολέμιος, -α, -ον","t":"enemic, hostil (sostantivat en plural οἱ πολέμιοι = els enemics)","g":"Adjectius"},{"e":"σώφρων, -ον","t":"prudent, assenyat, amb trellat","g":"Adjectius"},{"e":"ὑψηλός, -ή, -όν","t":"alt, elevat","g":"Adjectius"},{"e":"ψευδής, -ές","t":"fals, mentider","g":"Adjectius"},{"e":"ἐθέλω, ἐθελήσω, ἠθέλησα","t":"voler, desitjar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"εἰσέρχομαι, εἰσελεύσομαι, εἰσῆλθον","t":"entrar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐλεέω, ἐλεήσω, ἠλέησα","t":"compadir, tindre pietat de","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐξέρχομαι, ἐξελεύσομαι, ἐξῆλθον","t":"eixir, sortir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"θαυμάζω, θαυμάσομαι, ἐθαύμασα","t":"admirar, sorprendre's, meravellar-se","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"λαμβάνω, λήψομαι, ἔλαβον","t":"agafar, prendre, rebre, capturar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"λύω, λύσω, ἔλυσα","t":"deslligar, soltar, destruir (ex: ἔλυσαν τὰ τείχη = van destruir els murs)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πιστεύω, πιστεύσω, ἐπίστευσα","t":"creure, confiar en (+ cas Datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"(Nota","t":"Alguns verbs com ὁράω, ἔρχομαι o ἀποθνῄσκω, que ja van aparéixer en temes anteriors, presenten ací per primera vegada als textos la seua forma d'Aorist Fort: εἶδον, ἦλθον, ἀπέθανον).","g":"Verbs (Enunciats: Present, Futur, Aorist)"}]},{"n":6,"title":"La societat grega","cultura":"<h3>La societat grega: grups socials, família i educació<\/h3>\n<h4>1. Una societat desigual<\/h4>\n<p>Cap ciutat grega va conéixer la igualtat entre tots els seus habitants. La distinció fonamental és entre <strong>lliures<\/strong> i <strong>esclaus<\/strong>, i entre els lliures es diferencien els <strong>ciutadans<\/strong>, amb drets polítics plens, i els <strong>estrangers residents<\/strong>, que en queden exclosos. Les dones, encara que foren filles i esposes de ciutadans, no participaven en la vida política de cap polis.<\/p>\n<p>Esta desigualtat no era percebuda com una anomalia. Aristòtil va arribar a justificar l'esclavitud com una condició natural, i tampoc les democràcies més avançades no van qüestionar-la. Reconéixer-ho és necessari per a valorar amb precisió el que la cultura grega ens ha llegat i el que no.<\/p>\n<h4>2. L'estructura social d'Atenes<\/h4>\n<p><strong>Els ciutadans.<\/strong> Era ciutadà l'home nascut de pare ciutadà i, després de la llei de Pèricles del 451 aC, també de mare filla de ciutadà. Als díhuit anys s'inscrivia en el registre del seu <em>demos<\/em>; als vint podia assistir a l'assemblea, i per a formar part del consell i dels tribunals calia tindre'n trenta. Tenia dret a votar en l'assemblea, a ocupar magistratures, a posseir terra a l'Àtica i a acudir als tribunals; a canvi, havia de servir en l'exèrcit i contribuir als costos públics. Els ciutadans adults masculins eren una minoria de la població total: al segle V aC podien ser uns 40.000 sobre unes 300.000 persones.<\/p>\n<p><strong>Els metecs.<\/strong> Eren estrangers lliures instal·lats a la ciutat, molts d'ells grecs d'altres poleis. Pagaven un impost específic, servien en l'exèrcit i necessitaven un ciutadà com a patró per a actuar davant dels tribunals. No podien votar ni comprar terra, però tenien un pes econòmic considerable com a artesans, comerciants i banquers. Alguns intel·lectuals cèlebres, com Aristòtil, van viure a Atenes en esta condició.<\/p>\n<p><strong>Els esclaus.<\/strong> Constituïen una part molt àmplia de la població. Es podia ser esclau per naixement, per captura en guerra, per pirateria o per compra en els mercats. Treballaven en el camp, en els tallers, en el servei domèstic i, en les condicions més dures, en les mines de plata del Làurion. També hi havia esclaus públics que feien tasques administratives o de policia. Jurídicament eren propietat del seu amo, però podien estalviar i, ocasionalment, comprar la llibertat i passar a ser lliberts, sense arribar mai a ciutadans.<\/p>\n<h4>3. L'estructura social d'Esparta<\/h4>\n<p>Esparta presenta un esquema diferent i molt rígid.<\/p>\n<p>Els <strong>hòmoioi<\/strong> o «iguals» eren els ciutadans de ple dret. Rebien un lot de terra i havien de contribuir als àpats col·lectius; qui no podia fer-ho perdia la condició de ciutadà. No exercien ni artesania ni comerç: la seua única ocupació era la guerra.<\/p>\n<p>Els <strong>periecs<\/strong>, «els qui viuen al voltant», eren lliures, habitaven en poblacions pròpies de Lacònia, s'ocupaven de l'artesania i del comerç i servien en l'exèrcit, però no tenien drets polítics.<\/p>\n<p>Els <strong>hilotes<\/strong> eren la població sotmesa, sobretot messènia. No pertanyien a un amo particular, sinó a l'Estat, que els adscrivia a les terres dels ciutadans; havien de lliurar una part de la collita. Eren molt més nombrosos que els espartans i esta desproporció explica la militarització permanent de la ciutat i pràctiques de control com la <em>krypteia<\/em>, una mena de servei secret format per jóvens.<\/p>\n<h4>4. La família i la casa<\/h4>\n<p>La unitat bàsica era l'<em>oîkos<\/em>, que designava alhora la casa, la família i el patrimoni. Estava sota l'autoritat del <em>kýrios<\/em>, el cap de família, que representava jurídicament tots els seus membres.<\/p>\n<p>El matrimoni no era un acte d'elecció personal sinó un pacte entre famílies, negociat pel pare de la núvia, amb una <strong>dot<\/strong> que acompanyava la dona i que se li havia de tornar si el matrimoni es dissolia. L'objectiu declarat era la procreació de fills legítims que continuaren l'oîkos i el culte als avantpassats. Les xiques es casaven molt jóvens, sovint cap als quinze anys, amb homes que en podien tindre trenta.<\/p>\n<p>L'habitatge urbà era senzill, de tova i fusta, organitzat al voltant d'un pati. En les cases benestants es distingia una zona reservada a les dones, el <strong>gineceu<\/strong>, situada normalment a la part interior o superior.<\/p>\n<h4>5. La condició de la dona<\/h4>\n<p>A Atenes, la dona era jurídicament menor d'edat tota la vida: passava de la tutela del pare a la del marit. No podia votar, ni ocupar càrrecs, ni fer contractes de certa quantia. La seua funció reconeguda era administrar la casa, filar i teixir, i educar els fills xicotets. La seua presència pública s'admetia sobretot en el terreny religiós: les sacerdotesses, les processons i les festes exclusivament femenines com les Tesmofòries eren espais on les dones tenien un paper reconegut.<\/p>\n<p>A Esparta la situació era notablement diferent. Com que els homes vivien en règim militar, les dones administraven les propietats i podien heretar; feien exercici físic perquè es considerava que així tindrien fills més forts, i tenien fama entre els altres grecs —que ho veien amb escàndol— de gaudir de molta llibertat.<\/p>\n<p>Cal esmentar també les <strong>heteres<\/strong>, dones sovint estrangeres i cultivades que participaven en banquets i reunions dels quals les esposes quedaven excloses; Aspàsia, companya de Pèricles, n'és el cas més conegut. I cal recordar que la poesia grega compta amb una veu femenina de primer nivell, <strong>Safo<\/strong> de Lesbos.<\/p>\n<h4>6. L'educació<\/h4>\n<p><strong>A Esparta<\/strong>, l'educació era pública, obligatòria i controlada per l'Estat. Als set anys els xiquets eren separats de la família i incorporats a l'<em>agogé<\/em>: vivien en grups, rebien una alimentació escassa i una disciplina duríssima, aprenien a suportar el fred, el dolor i la fam, i s'exercitaven en la lluita i en el maneig de les armes. La instrucció intel·lectual es limitava a la lectura, l'escriptura, el cant coral i la memorització de poesia patriòtica. L'ideal era formar un soldat obedient. Les xiquetes també rebien formació física.<\/p>\n<p><strong>A Atenes<\/strong>, en canvi, l'educació era privada i de pagament, cosa que la reservava de fet a les famílies benestants. Els xiquets acudien a tres mestres: el <em>gramatista<\/em>, que ensenyava lletres i càlcul i feia memoritzar Homer; el <em>citarista<\/em>, encarregat de la música i de la poesia; i el <em>pedotriba<\/em>, responsable de la gimnàstica a la palestra. Un esclau de confiança, el <strong>pedagog<\/strong>, acompanyava el xiquet i vigilava el seu comportament. Als díhuit anys els jóvens entraven en l'<strong>efebia<\/strong>, un servei militar de dos anys. Els qui volien seguir estudiant recorrien als <strong>sofistes<\/strong>, mestres itinerants de retòrica i argumentació, i més tard a escoles com l'Acadèmia de Plató o el Liceu d'Aristòtil.<\/p>\n<p><strong>En època hel·lenística<\/strong>, l'ensenyament es va institucionalitzar més: el <strong>gimnàs<\/strong> va esdevindre el centre educatiu i cultural de la ciutat, i es va consolidar un programa d'estudis, l'<em>enkýklios paideía<\/em>, precedent directe de les arts liberals medievals i, en darrer terme, de la idea moderna de cultura general.<\/p>\n<h4>7. La vida quotidiana<\/h4>\n<p>L'alimentació era frugal: pa d'ordi o de blat, olives, formatge, verdures, peix salat i poca carn, que en general es menjava en el context dels sacrificis; el vi es bevia sempre rebaixat amb aigua. El vestit era senzill i sense cosir: la túnica (<em>khitón<\/em>) i el mantell (<em>himátion<\/em>), subjectats amb agulles i cinturons. La jornada començava prompte; els homes passaven bona part del dia a l'àgora, a la palestra o als tribunals, i el gran espai de sociabilitat masculina era el <strong>simposi<\/strong>, la reunió de després del sopar on es bevia, es conversava, es recitava poesia i es jugava.<\/p>","gram":"<h3>L'Infinitiu i les oracions completives<\/h3>\n<p>En este tema ens endinsarem en l'estudi de l'infinitiu grec. L'infinitiu és una forma nominal del verb (funciona com un substantiu verbal) que té una presència constant en els textos. A diferència del valencià, el grec té infinitius per a diferents temps i aspectes (present, aorist i futur) i fa un ús molt ric de la seua capacitat per a substantivar-se posant-li un article al davant. A més, aprendrem com es construïxen les oracions subordinades substantives, una estructura clau que compartix amb el llatí.<\/p>\n<h4>1. Morfologia de l'Infinitiu<\/h4>\n<p>L'infinitiu no té persona ni nombre, però sí que presenta veu (activa i mitjana) i temps/aspecte (present, aorist, futur).<\/p>\n<p class=\"quadre\"><strong>REGLA D'OR DE L'AORIST.<\/strong> L'infinitiu d'aorist MAI porta augment, ja que l'augment és una marca exclusiva del mode indicatiu per a assenyalar el temps passat. En l'infinitiu, l'aorist només indica que l'acció és puntual (feta d'una vegada), sense importar en quin moment va ocórrer.<\/p>\n<p><strong>1.1. Infinitius del verb regular (model λύω)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Temps / Aspecte<\/strong><\/td><td><strong>Veu Activa<\/strong><\/td><td><strong>Veu Mitjana<\/strong><\/td><\/tr><tr><td>Present (Aspecte Duratiu)<\/td><td>λύ-ειν (deslligar)<\/td><td>λύ-εσθαι (deslligar-se)<\/td><\/tr><tr><td>Aorist Dèbil (Aspecte Puntual)<\/td><td>λῦ-σαι (deslligar)<\/td><td>λύ-σασθαι (deslligar-se)<\/td><\/tr><tr><td>Futur (Posterioritat)<\/td><td>λύ-σειν (haver de deslligar)<\/td><td>λύ-σεσθαι (haver-se de deslligar)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong><\/p>\n<p class=\"quadre\">• L'infinitiu de present actiu i mitjà i el de futur porten l'accent \"recessiu\" on caiga per defecte (normalment a l'avantpenúltima o penúltima síl·laba: λύειν, λύεσθαι).<\/p>\n<p class=\"quadre\">• L'infinitiu d'aorist dèbil actiu (-σαι) s'accentua SEMPRE en la penúltima síl·laba (ex: λῦσαι, παιδεῦσαι).<\/p>\n<p class=\"quadre\">• L'infinitiu d'aorist dèbil mitjà (-σασθαι) s'accentua SEMPRE en l'avantpenúltima síl·laba (ex: λύσασθαι, παιδεύσασθαι).<\/p>\n<p><strong>1.2. Infinitius d'Aorist Fort (model λείπω, arrel λιπ-)<\/strong><\/p>\n<p>Recordem que els aorists forts no utilitzen la sigma (-σ-), sinó que canvien la seua arrel (de λείπω ➞ λιπ-). Afigen les mateixes desinències que el present, però l'accent canvia obligatòriament per a diferenciar-los visualment i acústica del present.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Veu Activa (Aorist Fort)<\/strong><\/td><td><strong>Veu Mitjana (Aorist Fort)<\/strong><\/td><\/tr><tr><td>λιπ-εῖν (Sempre accent circumflex a la darrera síl · laba)<\/td><td>λιπ-έσθαι (Sempre accent agut a la penúltima síl · laba)<\/td><\/tr><\/table><\/div>\n<p>Altres exemples molt freqüents: λαβεῖν (agafar), εὑρεῖν (trobar), ἰδεῖν (vore), εἰπεῖν (dir), ἐλθεῖν (anar/vindre).<\/p>\n<h4>2. L'infinitiu substantivat amb l'article<\/h4>\n<p>El grec té una característica molt peculiar i útil: pot posar un article neutre singular (τό, τοῦ, τῷ) davant de qualsevol infinitiu per a substantivar-lo completament. Això permet declinar l'infinitiu en qualsevol cas, convertint l'acció en un concepte teòric o en un autèntic sintagma nominal.<\/p>\n<ul><li><strong>Nominatiu/Acusatiu:<\/strong> τὸ μανθάνειν χαλεπόν ἐστιν (El fet d'aprendre és difícil / Aprendre és difícil).<\/li><li><strong>Genitiu (C. del Nom):<\/strong> Ἐπιθυμία τοῦ μανθάνειν (El desig d'aprendre).<\/li><li><strong>Datiu (C. de preposició / Mitjà):<\/strong> ἐν τῷ μανθάνειν (En el fet d'aprendre / Mentre aprenem) / ὁ ἄνθρωπος ἄριστος γίγνεται τῷ μανθάνειν (L'home es fa excel·lent per mitjà de l'aprenentatge).<\/li><\/ul>\n<h4>3. Sintaxi de l'Infinitiu (Oracions completives)<\/h4>\n<p>Igual que en valencià i en llatí, l'infinitiu s'utilitza àmpliament per a formar oracions subordinades substantives (o completives), és a dir, oracions que fan la funció de Subjecte o de Complement Directe del verb principal.<\/p>\n<p>Depenent de la relació entre el subjecte del verb principal i el subjecte de l'infinitiu, trobem dues construccions diferents:<\/p>\n<p><strong>3.1. Infinitiu Concertat<\/strong><\/p>\n<p>Es produïx quan el subjecte del verb principal i el subjecte de l'infinitiu són la mateixa persona o cosa. En este cas, el subjecte no es repetix i el verb principal va seguit directament per l'infinitiu.<\/p>\n<p>Esta construcció és molt freqüent com a:<\/p>\n<ul><li><strong>Subjecte:<\/strong> Amb verbs impersonals (δεῖ = cal, χρή = és necessari, καλόν ἐστι = és bell…).<\/li><\/ul>\n<p>Ex: Δεῖ τοὺς πολίτας ἀγαθοὺς εἶναι. (Cal que els ciutadans siguen bons).<\/p>\n<ul><li><strong>Complement Directe:<\/strong> Amb verbs de voluntat, desig, poder o deure (βούλομαι = voler, ἐθέλω = desitjar, δύναμαι = poder…).<\/li><\/ul>\n<p>Ex: Ὁ παῖς βούλεται παίζειν. (El xiquet vol jugar).<\/p>\n<p><strong>3.2. Infinitiu No Concertat (Subjecte en Acusatiu)<\/strong><\/p>\n<p>Esta és l'estructura estrela de la subordinació completiva. Igual que la construcció llatina d'\"Acusatiu amb Infinitiu\", es produïx quan el subjecte del verb principal i el de l'infinitiu són diferents.<\/p>\n<p>En grec, el subjecte de la subordinada es posa en cas Acusatiu i el verb va en Infinitiu. Com que en valencià no tenim esta estructura de manera tan extensa, l'hem de traduir sempre introduint la conjunció \"que\" i conjugant l'infinitiu en forma personal.<\/p>\n<p>Es construïx fonamentalment darrere de verbs de:<\/p>\n<ul><li><strong>Enteniment / Opinió:<\/strong> νομίζω (creure/pensar), γιγνώσκω (conéixer).<\/li><li><strong>Llengua:<\/strong> λέγω (dir), φημί (afirmar).<\/li><li><strong>Percepció:<\/strong> ὁράω (vore), ἀκούω (sentir).<\/li><\/ul>\n<p><strong>Exemple pas a pas:<\/strong><\/p>\n<ul><li><strong>Grec:<\/strong> Ὁ διδάσκαλος νομίζει τὸν παῖδα μανθάνειν.<\/li><li><strong>Traducció literal (errònia):<\/strong> El mestre creu al xiquet aprendre.<\/li><li><strong>Traducció correcta:<\/strong> El mestre creu que el xiquet aprén.<\/li><\/ul>\n<p><strong>3.3. El Temps Relatiu en l'Infinitiu No Concertat<\/strong><\/p>\n<p>Com traduïm exactament el verb en infinitiu quan introduïm el \"que\"? El temps que hem de triar en valencià depén de dos factors: el temps del verb principal i l'aspecte/temps relatiu de l'infinitiu grec.<\/p>\n<ul><li>L'infinitiu de <strong>Present<\/strong> expressa una acció <strong>simultània<\/strong> (al mateix temps que el verb principal).<\/li><li>L'infinitiu d'<strong>Aorist<\/strong> expressa una acció <strong>anterior<\/strong> (que ja ha passat respecte al verb principal).<\/li><li>L'infinitiu de <strong>Futur<\/strong> expressa una acció <strong>posterior<\/strong> (que passarà després del verb principal).<\/li><\/ul>\n<p><strong>Quadre de traducció pràctica (Verbs de pensament/llengua):<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Tipus d'Infinitiu (Grec)<\/strong><\/td><td><strong>Amb verb principal en PRESENT (Creu que...)<\/strong><\/td><td><strong>Amb verb principal en PASSAT (Creia que...)<\/strong><\/td><\/tr><tr><td><strong>Present (Simultaneïtat)<\/strong> · νομίζει αὐτὸν μανθάνειν<\/td><td>...que ell aprén.<\/td><td>...que ell aprenia.<\/td><\/tr><tr><td><strong>Aorist (Anterioritat)<\/strong> · νομίζει αὐτὸν μαθεῖν<\/td><td>...que ell va aprendre / ha aprés.<\/td><td>...que ell havia aprés.<\/td><\/tr><tr><td><strong>Futur (Posterioritat)<\/strong> · νομίζει αὐτὸν μαθήσεσθαι<\/td><td>...que ell aprendrà.<\/td><td>...que ell aprendria.<\/td><\/tr><\/table><\/div>","lexicon":[{"e":"ἀγορά, -ᾶς, ἡ","t":"àgora, plaça pública, mercat","g":"Substantius"},{"e":"ἀνάγκη, -ης, ἡ","t":"necessitat (l'expressió ἀνάγκη ἐστί es traduïx com \"és necessari\" o \"és forçós\")","g":"Substantius"},{"e":"ἄχθος, -ους, τό","t":"càrrega, pes","g":"Substantius"},{"e":"γυνή, γυναικός, ἡ","t":"dona","g":"Substantius"},{"e":"δίκη, -ης, ἡ","t":"justícia, judici, càstig (l'expressió δίκην λαβεῖν significa \"rebre el càstig\" o \"pagar la pena\")","g":"Substantius"},{"e":"ἑταῖρος, -ου, ὁ","t":"company, camarada","g":"Substantius"},{"e":"ἡγεμών, -όνος, ὁ","t":"guia, líder, cap","g":"Substantius"},{"e":"ἡδονή, -ῆς, ἡ","t":"plaer, goig","g":"Substantius"},{"e":"ἥρως, -ωος, ὁ","t":"heroi","g":"Substantius"},{"e":"ἱστός, -οῦ, ὁ","t":"pal (d'un vaixell), màstil","g":"Substantius"},{"e":"κηρός, -οῦ, ὁ","t":"cera","g":"Substantius"},{"e":"ναῦς, νεώς, ἡ","t":"nau, vaixell (substantiu amb declinaci ἐν τοῖς ὑστέροις χρόνοις = en els temps posteriors)","g":"Adjectius i pronoms"},{"e":"ᾄδω, ᾄσομαι, ᾖσα","t":"cantar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀναγκάζω, ἀναγκάσω, ἠνάγκασα","t":"obligar, forçar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀνίσταμαι, ἀναστήσομαι, ἀνέστην","t":"alçar-se, posar-se dret (l'aorist ἀνέστην és fort i intransitiu; ací apareix en el seu infinitiu ἀναστῆναι)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀπέρχομαι, ἀπελεύσομαι, ἀπῆλθον","t":"anar-se'n, allunyar-se, marxar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βάλλω, βαλῶ, ἔβαλον","t":"llançar, tirar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βούλομαι, βουλήσομαι, ἐβουλήθην","t":"voler, desitjar (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"γιγνώσκω, γνώσομαι, ἔγνων","t":"conéixer, saber, adonar-se","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"διαφθείρω, διαφθερῶ, διέφθειρα","t":"destruir, corrompre, arruïnar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"εἶμι","t":"anar (és el verb anar per excel·lència; ací el tens en el seu infinitiu de present ἰέναι)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐλπίζω, ἐλπιῶ, ἤλπισα","t":"esperar, tindre esperança","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐπανέρχομαι, ἐπανελεύσομαι, ἐπανῆλθον","t":"tornar, regressar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐργάζομαι, ἐργάσομαι, ἠργασάμην","t":"treballar (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"θέλγω, θέλξω, ἔθελξα","t":"encantar, fetillar, seduir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"θεραπεύω, θεραπεύσω, ἐθεράπευσα","t":"cuidar, atendre, cultivar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"καταδέω, καταδήσω, κατέδησα","t":"lligar, amarrar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"κελεύω, κελεύσω, ἐκέλευσα","t":"ordenar, manar (regeix una construcció d'Acusatiu + Infinitiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"μανθάνω, μαθήσομαι, ἔμαθον","t":"aprendre, comprendre","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"νομίζω, νομίσω, ἐνόμισα","t":"creure, pensar, considerar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ὁμολογέω, ὁμολογήσω, ὡμολόγησα","t":"estar d'acord, admetre, confessar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ὀνομάζω, ὀνομάσω, ὠνόμασα","t":"anomenar, nomenar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"παρέχω, παρέξω, παρέσχον","t":"proporcionar, oferir, donar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πείθομαι, πείσομαι, ἐπιθόμην","t":"obeir, fer cas (es construïx amb cas Datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πείθω, πείσω, ἔπεισα [ἐπείσθην]","t":"convéncer (mitjana: obeir)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"περιμένω, περιμενῶ, περιέμεινα","t":"esperar, aguardar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ὑπισχνέομαι, ὑποσχήσομαι, ὑπεσχόμην","t":"prometre","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φημί, φήσω, ἔφησα","t":"dir, afirmar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ψεύδομαι, ψεύσομαι, ἐψευσάμην","t":"mentir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"δεῖ","t":"cal, és necessari (+ Acusatiu i Infinitiu)","g":"Verbs i expressions impersonals"},{"e":"ἔξεστι(ν)","t":"és possible, és lícit, es pot (+ Datiu i Infinitiu)","g":"Verbs i expressions impersonals"},{"e":"οἷός τέ εἰμι","t":"ser capaç de, poder (+ Infinitiu)","g":"Verbs i expressions impersonals"},{"e":"ἐνταῦθα","t":"ací, en este lloc","g":"Adverbis"},{"e":"ἤδη","t":"ja, ara mateix","g":"Adverbis"},{"e":"ἴσως","t":"potser, tal vegada","g":"Adverbis"},{"e":"ταχέως","t":"ràpidament","g":"Adverbis"}]},{"n":7,"title":"Institucions polítiques, llei i justícia","cultura":"<h3>Institucions polítiques, llei i justícia<\/h3>\n<h4>1. Les formes de govern<\/h4>\n<p>Els grecs van ser els primers a analitzar sistemàticament les formes de govern i a posar-los nom, i eixa terminologia continua vigent.<\/p>\n<p>La <strong>monarquia<\/strong> és el govern d'un de sol; en l'època micènica i en els poemes homèrics el rei concentra funcions militars, judicials i religioses, però a partir de l'època arcaica desapareix en gran part del món grec o queda reduïda a funcions cerimonials. L'<strong>aristocràcia<\/strong> és el govern dels «millors», és a dir, de les famílies nobles; quan el criteri deixa de ser el naixement i passa a ser la riquesa, es parla d'<strong>oligarquia<\/strong>, el govern d'uns pocs. La <strong>tirania<\/strong> és el poder personal aconseguit al marge de la llei. La <strong>democràcia<\/strong> és el govern del <em>demos<\/em>, del conjunt del poble.<\/p>\n<p>Estes formes no es van succeir de manera igual a tot arreu. Atenes i Esparta representen els dos models de referència i, alhora, dos maneres oposades d'organitzar la comunitat.<\/p>\n<h4>2. La democràcia atenesa: com funcionava<\/h4>\n<p>La democràcia d'Atenes no era representativa sinó <strong>directa<\/strong>: els ciutadans no elegien diputats, sinó que decidien ells mateixos. Es fonamentava en tres principis: la <em>isonomía<\/em> o igualtat davant de la llei, la <em>isegoría<\/em> o igual dret a parlar en l'assemblea, i la selecció de la majoria de càrrecs per <strong>sorteig<\/strong>, considerat el procediment més democràtic perquè no afavoria els rics ni els populars.<\/p>\n<p><strong>L'assemblea (<\/strong><strong><em>ekklesía<\/em><\/strong><strong>)<\/strong> era l'òrgan sobirà. Podien assistir-hi tots els ciutadans majors de vint anys. Es reunia unes quaranta vegades a l'any al turó de la Pnix i decidia sobre la guerra i la pau, els tractats, les lleis, les finances i el nomenament d'alguns càrrecs. Qualsevol assistent podia demanar la paraula.<\/p>\n<p><strong>El consell (<\/strong><strong><em>boulé<\/em><\/strong><strong>)<\/strong> estava format per cinc-cents membres sortejats, cinquanta per cada una de les deu tribus, per un any i amb un màxim de dos mandats no consecutius en tota la vida. Preparava l'ordre del dia de l'assemblea, sense el qual res no podia ser votat, i supervisava l'administració diària. Cada tribu exercia la presidència durant una desena part de l'any.<\/p>\n<p><strong>Els tribunals populars (<\/strong><strong><em>heliaía<\/em><\/strong><strong>)<\/strong> reunien un cos de sis mil ciutadans sortejats anualment, distribuïts en jurats nombrosos per a cada causa. No hi havia jutges professionals: el jurat decidia la culpabilitat i la pena per votació.<\/p>\n<p><strong>Les magistratures.<\/strong> Els <strong>arconts<\/strong>, antics caps de la ciutat, van conservar funcions religioses i judicials i es designaven per sorteig. Els <strong>estrategs<\/strong>, en canvi, es triaven per <strong>elecció<\/strong> i podien ser reelegits indefinidament, perquè el comandament militar exigia competència tècnica; per això el càrrec va ser la via d'influència de Pèricles. L'antic consell de l'<strong>areòpag<\/strong>, format per exarconts, va perdre poder polític el 462 aC i va quedar reduït a tribunal per a delictes de sang.<\/p>\n<p>Existien mecanismes de control: tot magistrat era examinat abans d'entrar en el càrrec i havia de retre comptes en acabar. L'<strong>ostracisme<\/strong> permetia desterrar durant deu anys, sense confiscació de béns, un ciutadà considerat perillós, si en una votació especial s'aconseguia un mínim de sufragis escrits sobre fragments de ceràmica.<\/p>\n<h4>3. Els límits de la democràcia atenesa<\/h4>\n<p>Este sistema, notable per a la seua època, excloïa la majoria de la població: dones, metecs i esclaus no hi tenien cap veu. A més, la participació efectiva depenia del temps disponible, motiu pel qual es va introduir el <em>misthós<\/em>, una indemnització diària per l'exercici de càrrecs i pel servei als tribunals. Els contemporanis també li van retraure defectes reals: la volubilitat de les decisions, la influència dels oradors demagogs i la possibilitat de condemnes col·lectives injustes, com la dels generals de les Arginuses. Reconéixer estes limitacions no resta valor a la innovació: per primera vegada un col·lectiu ampli de ciutadans corrents va governar-se a si mateix.<\/p>\n<h4>4. Les institucions d'Esparta<\/h4>\n<p>Esparta combinava elements de totes les formes de govern, cosa que va admirar molts autors antics.<\/p>\n<p>La <strong>diarquia<\/strong>: dos reis simultanis, procedents de dos famílies distintes, amb funcions sobretot militars i religioses, que es vigilaven mútuament.<\/p>\n<p>La <strong>gerusía<\/strong>: un consell de vint-i-huit ancians majors de seixanta anys, elegits amb caràcter vitalici, més els dos reis. Preparava els assumptes i actuava com a tribunal en les causes greus.<\/p>\n<p>L'<strong>apel·la<\/strong>: l'assemblea de tots els ciutadans de ple dret. Votava per aclamació i tenia una capacitat de deliberació molt limitada: aprovava o rebutjava el que li presentaven.<\/p>\n<p>Els <strong>èfors<\/strong>: cinc magistrats elegits anualment amb poders molt amplis. Controlaven els reis, dirigien la política exterior, supervisaven l'educació i podien detindre i jutjar qualsevol ciutadà. Eren, de fet, l'òrgan més poderós de l'Estat.<\/p>\n<p>El conjunt formava un sistema estable i conservador, dissenyat per a mantindre l'ordre i el control sobre la població hilota, però amb escàs marge per a la iniciativa individual.<\/p>\n<h4>5. La llei<\/h4>\n<p>La paraula <em>nómos<\/em> designa alhora la llei escrita i el costum acceptat per la comunitat. El pas de la norma consuetudinària, interpretada pels nobles, a la llei escrita i exposada públicament va ser una de les grans conquistes de l'època arcaica: a partir d'eixe moment tothom podia conéixer per endavant què estava prohibit i quina pena corresponia. A Atenes eixe camí el marquen Dracó i Soló; a Creta, el gran text conservat de Gortina.<\/p>\n<p>El <strong>subjecte de dret<\/strong> era el ciutadà adult masculí. Les dones i els menors actuaven a través del seu <em>kýrios<\/em>; els metecs, a través d'un patró; els esclaus no tenien capacitat jurídica pròpia i, en els processos, el seu testimoni només s'admetia sota tortura, una pràctica que mostra els límits del sistema.<\/p>\n<h4>6. El procediment judicial a Atenes<\/h4>\n<p>No existia ni ministeri fiscal ni advocats en el sentit actual. L'acusació l'havia de presentar un particular, i cada part havia de defendre's personalment davant del jurat.<\/p>\n<p>Es distingien dos grans tipus de causes: les <strong>díkai<\/strong>, de caràcter privat, que només podia iniciar la part perjudicada, i les <strong>graphaí<\/strong>, de caràcter públic, que podia presentar qualsevol ciutadà perquè afectaven l'interés de la comunitat, com la impietat o la traïció.<\/p>\n<p>El judici era oral i ràpid, amb el temps de paraula mesurat per una clepsidra o rellotge d'aigua. El jurat, molt nombrós per a dificultar el suborn, votava en secret amb fitxes, primer sobre la culpabilitat i després sobre la pena, triant entre la proposta de l'acusador i la de l'acusat. Les sentències eren inapel·lables. Les penes anaven de la multa i la privació de drets civils al desterrament, la confiscació i la mort.<\/p>\n<p>Com que parlar bé davant del tribunal era decisiu, va sorgir la figura del <strong>logògraf<\/strong>, l'escriptor professional que redactava el discurs perquè el client se l'aprenguera de memòria: d'esta pràctica naixen bona part dels discursos judicials conservats, com els de Lísies.<\/p>\n<p>A <strong>Esparta<\/strong>, en canvi, la justícia estava en mans de la gerusía per als delictes greus i dels èfors per a la resta, sense jurats populars.<\/p>\n<h4>7. El llegat polític<\/h4>\n<p>Del vocabulari polític grec deriven paraules com política, democràcia, aristocràcia, monarquia, tirania, anarquia o dèspota. Més important encara és el conjunt d'idees que van formular per primera vegada: que el poder ha d'estar sotmés a lleis conegudes, que els governants han de retre comptes, que les decisions col·lectives es prenen després d'un debat obert i que la comunitat política és cosa dels ciutadans i no d'un déu ni d'un rei. Este marc conceptual, revisat i ampliat al llarg dels segles, continua sent el fonament de les democràcies contemporànies.<\/p>","gram":"<h3>Els pronoms, el participi i les construccions absolutes<\/h3>\n<p>En este tema consolidarem un element clau per a la cohesió dels textos: els pronoms. El grec fa un ús extensíssim dels pronoms demostratius i d'identitat per a enllaçar oracions. D'altra banda, ens endinsarem en una de les estructures més riques de la llengua grega: el participi. Veurem com esta forma nominal del verb ens permet estalviar moltes oracions subordinades i com, al costat del cas genitiu, forma la construcció absoluta per excel·lència del grec.<\/p>\n<h4>1. Els pronoms<\/h4>\n<p>Igual que en llatí, els pronoms i adjectius pronominals presenten algunes particularitats en la seua declinació, encara que la majoria seguixen models molt semblants a la primera i segona declinació (tipus 2-1-2).<\/p>\n<p><strong>1.1. Pronoms personals<\/strong><\/p>\n<p>Expressen la persona gramatical. En grec, el subjecte ja va marcat pel verb, per la qual cosa l'ús del pronom en nominatiu (ἐγώ, σύ) només es fa per a donar èmfasi.<\/p>\n<p>El grec clàssic no té un pronom personal específic de 3a persona per al nominatiu (\"ell / ella\"). Per a suplir-ho, empra pronoms demostratius. Per a la resta de casos (\"el/la\", \"li\", \"d'ell\"), utilitza el pronom αὐτός, com veurem més avant.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>1a Persona (Jo, em, mi...)<\/strong><\/td><td><strong>2a Persona (Tu, et, tu...)<\/strong><\/td><\/tr><tr><td>Nominatiu Sg.<\/td><td>ἐγώ<\/td><td>σύ<\/td><\/tr><tr><td>Acusatiu Sg.<\/td><td>ἐμέ / με<\/td><td>σέ / σε<\/td><\/tr><tr><td>Genitiu Sg.<\/td><td>ἐμοῦ / μου<\/td><td>σοῦ / σου<\/td><\/tr><tr><td>Datiu Sg.<\/td><td>ἐμοί / μοι<\/td><td>σοί / σοι<\/td><\/tr><tr><td>Nominatiu Pl.<\/td><td>ἡμεῖς (nosaltres)<\/td><td>ὑμεῖς (vosaltres)<\/td><\/tr><tr><td>Acusatiu Pl.<\/td><td>ἡμᾶς<\/td><td>ὑμᾶς<\/td><\/tr><tr><td>Genitiu Pl.<\/td><td>ἡμῶν<\/td><td>ὑμῶν<\/td><\/tr><tr><td>Datiu Pl.<\/td><td>ἡμῖν<\/td><td>ὑμῖν<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> Formes tòniques i enclítiques.<\/p>\n<p>Fixa't que en el singular hi ha dues formes per a l'acusatiu, genitiu i datiu. Les primeres (ἐμέ, σέ…) són tòniques i s'usen amb preposicions o per a donar molt d'èmfasi (Ex: ἐμοὶ δίδως, οὐκ αὐτῷ = A MI m'ho dónes, no a ELL). Les segones (με, σε, μου, σου…) són enclítiques, no porten accent i es pronuncien recolzant-se en la paraula anterior (Ex: ἄκουσόν μου = escolta'm).<\/p>\n<p><strong>1.2. Pronoms i adjectius demostratius<\/strong><\/p>\n<p>Assenyalen la distància de la persona o cosa respecte a qui parla. Si acompanyen un substantiu, el substantiu ha de portar obligatòriament l'article (posició predicativa: οὗτος ὁ ἀνήρ = este home).<\/p>\n<p><strong>A) Proximitat (\"este\"): ὅδε, ἥδε, τόδε<\/strong><\/p>\n<p>És facilíssim de declinar: només cal declinar l'article definit (ὁ, ἡ, τό, τὸν…) i afegir-li al final la partícula invariable -δε.<\/p>\n<p>Exemples: Acusatiu (τόνδε, τήνδε, τόδε), Genitiu (τοῦδε, τῆσδε, τοῦδε).<\/p>\n<p><strong>B) Distància mitjana / Referència (\"eixe\", \"este d'ací\"): οὗτος, αὕτη, τοῦτο<\/strong><\/p>\n<p>Té una arrel duplicada. L'arrel utilitza el diftong \"ου\" quan la desinència té sons \"o/ω\"; i utilitza \"αυ\" quan la desinència té \"α/η\".<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nom.<\/td><td>οὗτος<\/td><td>αὕτη<\/td><td>τοῦτο<\/td><td>οὗτοι<\/td><td>αὗται<\/td><td>ταῦτα<\/td><\/tr><tr><td>Acus.<\/td><td>τοῦτον<\/td><td>ταύτην<\/td><td>τοῦτο<\/td><td>τούτους<\/td><td>ταύτας<\/td><td>ταῦτα<\/td><\/tr><tr><td>Gen.<\/td><td>τούτου<\/td><td>ταύτης<\/td><td>τούτου<\/td><td>τούτων<\/td><td>τούτων<\/td><td>τούτων<\/td><\/tr><tr><td>Dat.<\/td><td>τούτῳ<\/td><td>ταύτῃ<\/td><td>τούτῳ<\/td><td>τούτοις<\/td><td>ταύταις<\/td><td>τούτοις<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>NOTA D'ACCENTUACIÓ.<\/strong> Observa l'alternança entre l'accent circumflex i l'agut segons la llei de limitació: τοῦτο (última breu = circumflex a la penúltima), però τούτου (última llarga = agut a la penúltima).<\/p>\n<p><strong>C) Llunyania (\"aquell\"): ἐκεῖνος, ἐκείνη, ἐκεῖνο<\/strong><\/p>\n<p>Es declina exactament igual que un adjectiu de tipus 2-1-2 (καλός), amb l'única excepció que el nominatiu i acusatiu singular neutre acaba en -ο (i no en -ον).<\/p>\n<p><strong>1.3. El pronom d'identitat / anafòric (αὐτός, αὐτή, αὐτό)<\/strong><\/p>\n<p>La seua declinació és idèntica a la de ἐκεῖνος (acabament neutre en -ο). És una de les paraules més freqüents del grec perquè complix tres funcions totalment diferents depenent de la sintaxi:<\/p>\n<ul><li><strong>Pronom personal de 3a persona (ell, la seua, a ell…):<\/strong> Quan va SENSE article i en casos oblics (Acusatiu, Genitiu, Datiu).<\/li><\/ul>\n<p>Ex: Ὁρῶ αὐτόν (Jo el veig [a ell]). / Τὸ δῶρον αὐτῆς (El regal d'ella).<\/p>\n<ul><li><strong>Adjectiu d'Identitat (el mateix):<\/strong> Quan va precedit immediatament per l'article (posició atributiva).<\/li><\/ul>\n<p>Ex: Ὁ αὐτὸς ἄνθρωπος (El mateix home).<\/p>\n<ul><li><strong>Pronom Intensiu (ell mateix, en persona):<\/strong> Quan va sense article actuant com a aposició d'un substantiu o pronom.<\/li><\/ul>\n<p>Ex: Ὁ ἄνθρωπος αὐτός (L'home mateix / L'home en persona).<\/p>\n<p><strong>1.4. Pronoms Interrogatius i Indefinits (τίς / τις)<\/strong><\/p>\n<p>En grec, la mateixa paraula servix per a preguntar (\"Qui?\") i per a indicar indefinició (\"Algú\"). Ambdues es declinen per la 3a declinació (tema en dental: arrel τιν-), però es diferencien per l'accent:<\/p>\n<ul><li><strong>Interrogatiu (τίς, τί):<\/strong> És tònic i sempre porta accent agut a la primera síl·laba, sense convertir-se mai en greu. (Ex: τίς; τίνα; τίνος; τίνι;).<\/li><\/ul>\n<p>Ex: Τίς ταῦτα λέγει; (Qui diu açò?).<\/p>\n<ul><li><strong>Indefinit (τις, τι):<\/strong> És enclític, no porta accent propi i es recolza en la paraula anterior. Significa \"algú, un cert, algun\".<\/li><\/ul>\n<p>Ex: Ἄνθρωπός τις ταῦτα λέγει. (Un cert home / algú diu açò).<\/p>\n<h4>2. Morfologia del Participi<\/h4>\n<p>El participi és un adjectiu verbal. Com a verb, té veu (activa/mitjana) i temps/aspecte (present, aorist, futur), i pot portar complements propis. Com a adjectiu, es declina en gènere, nombre i cas.<\/p>\n<p class=\"quadre\"><strong>REGLA D'OR DE L'AORIST.<\/strong> El participi d'aorist MAI porta augment. L'augment és marca de temps passat en l'indicatiu. En el participi, l'aorist només indica que l'acció s'entén de forma \"puntual\", no continuada.<\/p>\n<p><strong>2.1. Participis Actius (Tipus 3-1-3)<\/strong><\/p>\n<p>El masculí i el neutre es declinen per la 3a declinació (temes en -ντ), i el femení per la 1a declinació (alfa impura).<\/p>\n<p><strong>A) Present Actiu: λύων, λύουσα, λῦον (el que deslliga)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nom.<\/td><td>λύων<\/td><td>λύουσα<\/td><td>λῦον<\/td><td>λύοντες<\/td><td>λύουσαι<\/td><td>λύοντα<\/td><\/tr><tr><td>Acus.<\/td><td>λύοντα<\/td><td>λύουσαν<\/td><td>λῦον<\/td><td>λύοντας<\/td><td>λυούσας<\/td><td>λύοντα<\/td><\/tr><tr><td>Gen.<\/td><td>λύοντος<\/td><td>λυούσης<\/td><td>λύοντος<\/td><td>λυόντων<\/td><td>λυουσῶν<\/td><td>λυόντων<\/td><\/tr><tr><td>Dat.<\/td><td>λύοντι<\/td><td>λυούσῃ<\/td><td>λύοντι<\/td><td>λύουσι(ν)<\/td><td>λυούσαις<\/td><td>λύουσι(ν)<\/td><\/tr><\/table><\/div>\n<p><strong>B) Aorist Dèbil Actiu: λύσας, λύσασα, λῦσαν (el que va deslligar)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><\/tr><tr><td>Nom.<\/td><td>λύσας<\/td><td>λύσασα<\/td><td>λῦσαν<\/td><\/tr><tr><td>Gen.<\/td><td>λύσαντος<\/td><td>λυσάσης<\/td><td>λύσαντος<\/td><\/tr><\/table><\/div>\n<p><strong>C) Futur Actiu: λύσων, λύσουσα, λῦσον (el que deslligarà)<\/strong><\/p>\n<p>Es declina exactament igual que el present, però afegint la sigma -σ- de futur abans de la desinència.<\/p>\n<p class=\"quadre\"><strong>NOTA D'ACCENTUACIÓ.<\/strong> El genitiu plural femení actiu porta sempre accent circumflex a l'última síl·laba (ex: λυουσῶν, λυσασῶν) per pertànyer a la 1a declinació. L'aorist actiu masculí singular manté l'accent a la penúltima (λύσας).<\/p>\n<p><strong>2.2. Participis Mitjans (Tipus 2-1-2)<\/strong><\/p>\n<p>Són molt més senzills. Utilitzen sempre el sufix -μενος, -μένη, -μενον i es declinen completament com un adjectiu regular (com δίκαιος).<\/p>\n<ul><li><strong>Present:<\/strong> λυ-ό-μενος, -μένη, -μενον (el que es deslliga).<\/li><li><strong>Aorist (sense augment!):<\/strong> λυ-σά-μενος, -μένη, -μενον (el que es va deslligar).<\/li><li><strong>Futur:<\/strong> λυ-σό-μενος, -μένη, -μενον (el que es deslligarà).<\/li><\/ul>\n<p class=\"quadre\"><strong>NOTA D'ACCENTUACIÓ.<\/strong> L'accent en els participis mitjans és sempre proparoxíton (fuig fins a l'avantpenúltima síl·laba si l'última és breu: λυόμενος, però λυομένου).<\/p>\n<h4>3. Sintaxi del Participi<\/h4>\n<p>El grec fa un ús extraordinari del participi, convertint-lo en una eina que permet estalviar múltiples oracions subordinades de relatiu o adverbials. Segons l'ús de l'article, fa tres funcions diferents:<\/p>\n<p><strong>3.1. Participi Atributiu (Amb article + substantiu)<\/strong><\/p>\n<p>Quan el participi va just darrere de l'article, funciona com un adjectiu normal qualificant el nom. En valencià se sol traduir mitjançant una oració de relatiu (\"que + verb\").<\/p>\n<ul><li><strong>Grec:<\/strong> Ὁ λύων παῖς τὸν ἵππον ἔχει.<\/li><li><strong>Traducció literal:<\/strong> El deslligant xiquet té el cavall.<\/li><li><strong>Traducció natural:<\/strong> El xiquet que deslliga té el cavall.<\/li><\/ul>\n<p><strong>3.2. Participi Apositiu o Predicatiu (Sense article)<\/strong><\/p>\n<p>Concorda amb un substantiu de l'oració (subjecte, CD…), però NO porta article propi. Expressa les circumstàncies en les quals es produïx l'acció principal, equivalent a una oració subordinada adverbial (temporal, causal…). Es pot traduir per un gerundi o per una oració temporal (\"quan…\", \"com que…\").<\/p>\n<ul><li><strong>Grec:<\/strong> Ὁ παῖς, λύων τὸν ἵππον, ᾄδει.<\/li><li><strong>Traducció natural:<\/strong> El xiquet, deslligant / mentre deslliga el cavall, canta.<\/li><\/ul>\n<p><strong>3.3. Participi Substantivat (Article + Participi solitari)<\/strong><\/p>\n<p>Si escrivim l'article i el participi, però ometem el substantiu, el participi se substantiva. Es traduïx per \"el qui\", \"la qui\", \"les coses que\".<\/p>\n<ul><li><strong>Grec:<\/strong> Ὁ λύων τὸν ἵππον ἔχει.<\/li><li><strong>Traducció:<\/strong> El qui deslliga té el cavall.<\/li><li><strong>Grec:<\/strong> Οἱ ἀποθανόντες.<\/li><li><strong>Traducció:<\/strong> Els morts / Els qui van morir (participi d'aorist).<\/li><\/ul>\n<h4>4. El Genitiu Absolut<\/h4>\n<p>El Genitiu Absolut és l'equivalent directe de la construcció d'ablatiu absolut del llatí. Com que el grec antic va perdre el cas ablatiu en la seua evolució, les seues funcions van ser assumides pel genitiu (i el datiu).<\/p>\n<p>Consistix en un substantiu i un participi, ambdós en cas Genitiu, que formen una clàusula independent (absoluta) de la resta de l'oració principal. No concorden gramaticalment amb cap element de la frase principal.<\/p>\n<p><strong>Com es traduïx?<\/strong><\/p>\n<p>Igual que en llatí, sol traduir-se per un participi/gerundi absolut, o bé per una oració temporal introduïda per \"en + infinitiu\" o \"quan/mentre\". Cal fixar-se molt en el temps del participi per a indicar l'aspecte relatiu (simultani si és present, anterior si és aorist).<\/p>\n<ul><li><strong>Exemple amb participi de present (Simultaneïtat):<\/strong><\/li><\/ul>\n<p><strong>Grec:<\/strong> Τοῦ παιδὸς λύοντος τὸν ἵππον, ὁ ἀνὴρ ἀπῆλθεν.<\/p>\n<p><strong>Traducció:<\/strong> Deslligant el xiquet el cavall, l'home se'n va anar. (O bé: Mentre el xiquet deslligava…).<\/p>\n<ul><li><strong>Exemple amb participi d'aorist (Anterioritat):<\/strong><\/li><\/ul>\n<p><strong>Grec:<\/strong> Τοῦ παιδὸς λύσαντος τὸν ἵππον, ὁ ἀνὴρ ἀπῆλθεν.<\/p>\n<p><strong>Traducció:<\/strong> Havent deslligat el xiquet el cavall, l'home se'n va anar. (O bé: Quan el xiquet va haver deslligat…).<\/p>","lexicon":[{"e":"ἀνδρεία, -ας, ἡ","t":"coratge, valentia","g":"Substantius"},{"e":"δέρας, δέρατος, τό","t":"velló (la pell d'un corder)","g":"Substantius"},{"e":"δόξα, -ης, ἡ","t":"glòria, fama, opinió","g":"Substantius"},{"e":"δράκων, -οντος, ὁ","t":"drac, serp gegant","g":"Substantius"},{"e":"ἐχθρός, -οῦ, ὁ","t":"enemic","g":"Substantius"},{"e":"κόρη, -ης, ἡ","t":"xiqueta, jove, filla","g":"Substantius"},{"e":"λῃστής, -οῦ, ὁ","t":"lladre, bandit","g":"Substantius"},{"e":"λίθος, -ου, ὁ","t":"pedra","g":"Substantius"},{"e":"ξίφος, -ους, τό","t":"espasa (3a declinació, tema en sibilant)","g":"Substantius"},{"e":"ὁδοιπόρος, -ου, ὁ","t":"viatger, caminant","g":"Substantius"},{"e":"πλοῦτος, -ου, ὁ","t":"riquesa","g":"Substantius"},{"e":"πρόσωπον, -ου, τό","t":"rostre, cara","g":"Substantius"},{"e":"πῦρ, πυρός, τό","t":"foc","g":"Substantius"},{"e":"ῥῆμα, -ατος, τό","t":"paraula, expressió","g":"Substantius"},{"e":"σιγή, -ῆς, ἡ","t
