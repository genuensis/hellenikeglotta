<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Material de suport de Grec I (1r de Batxillerat) — textos amb vocabulari emergent, alfabet, cultura i gramàtica.">
<meta name="theme-color" content="#1B5E6E">
<title>Hellenike Glotta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --stone-0:#F7F7F4; --stone-1:#EDEEEA; --stone-2:#E1E3DE; --stone-3:#CFD2CC;
  --bg:#EFF0EC;
  --surface:#FBFBF9;
  --surface-2:#F2F3EF;
  --line:#D6D9D2;
  --line-soft:#E4E6E0;
  --ink:#1A2129;
  --ink-2:#46525C;
  --ink-3:#6E7A83;
  --blue:#1B5E6E;        /* blau egipci */
  --blue-2:#2A8296;
  --blue-wash:#DFEBEA;
  --minium:#8E3B5E;      /* mini, el pigment de les inscripcions */
  --minium-2:#A94C74;
  --minium-wash:#F2E3EA;
  --good:#2E6B4F; --good-wash:#E0EDE5;
  --bad:#A33224;  --bad-wash:#F7E2DE;
  --shadow:0 1px 2px rgba(26,33,41,.05),0 8px 24px -12px rgba(26,33,41,.18);
  --shadow-lg:0 2px 6px rgba(26,33,41,.08),0 24px 48px -20px rgba(26,33,41,.3);
  --r:10px; --r-lg:16px;
  --serif:"Gentium Book Plus","Gentium Plus","Palatino Linotype","Book Antiqua",Palatino,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --nav-h:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#161E25; --surface-2:#1C262E;
    --line:#2A3640; --line-soft:#222D36;
    --ink:#E6EAEC; --ink-2:#AEBAC2; --ink-3:#7F8D97;
    --blue:#6FBDC4; --blue-2:#93D2D6; --blue-wash:#12333A;
    --minium:#D98BAE; --minium-2:#E8A6C2; --minium-wash:#33202B;
    --good:#6FC29A; --good-wash:#16302A; --bad:#E5836F; --bad-wash:#341E1C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#161E25; --surface-2:#1C262E;
  --line:#2A3640; --line-soft:#222D36;
  --ink:#E6EAEC; --ink-2:#AEBAC2; --ink-3:#7F8D97;
  --blue:#6FBDC4; --blue-2:#93D2D6; --blue-wash:#12333A;
  --minium:#D98BAE; --minium-2:#E8A6C2; --minium-wash:#33202B;
  --good:#6FC29A; --good-wash:#16302A; --bad:#E5836F; --bad-wash:#341E1C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:var(--serif);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--minium);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>
/* ============ SHELL ============ */
.shell{display:flex;min-height:100vh}
.rail{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line-soft)}
.brand .mark{font-family:var(--serif);font-size:1.45rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;line-height:1.05;display:block}
.brand .mark span{color:var(--minium)}
.brand .sub{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.navlist{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.navlist a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;
  text-decoration:none;color:var(--ink-2);font-size:.9rem;font-weight:500;transition:background .15s,color .15s}
.navlist a:hover{background:var(--surface-2);color:var(--ink)}
.navlist a.on{background:var(--blue-wash);color:var(--blue)}
.navlist a.on .ic{color:var(--blue)}
.ic{width:18px;height:18px;flex:0 0 18px;color:var(--ink-3)}
.railfoot{padding:12px 14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.tbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;
  font-size:.75rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tbtn:hover{background:var(--surface-2);color:var(--ink)}
main{flex:1;min-width:0}
.wrap{max-width:940px;margin:0 auto;padding:34px 26px 90px}
.wrap.narrow{max-width:720px}

/* mobile */
.topbar{display:none}
.tabbar{display:none}
@media(max-width:860px){
  .shell{display:block}
  .rail{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
    padding:10px 14px;min-height:54px}
  .topbar .mark{font-family:var(--serif);font-size:1.05rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
  .topbar .mark span{color:var(--minium)}
  .wrap{padding:20px 16px calc(var(--nav-h) + 40px)}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:8px 2px 7px;text-decoration:none;color:var(--ink-3);font-size:.6rem;font-weight:500;
    letter-spacing:.02em;min-height:var(--nav-h)}
  .tabbar a.on{color:var(--minium)}
  .tabbar a.on .ic{color:var(--minium)}
}

/* ============ COMMON ============ */
.eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--minium);
  font-weight:600;margin-bottom:10px}
.eyebrow.b{color:var(--blue)}
h1.page{font-size:clamp(1.8rem,4.6vw,2.7rem);letter-spacing:-.015em;margin-bottom:8px}
.lede{color:var(--ink-2);font-size:1.02rem;max-width:62ch;margin:0 0 26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
hr.rule{border:0;border-top:1px solid var(--line);margin:30px 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  text-transform:none;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-3)}
.pill.lec{background:var(--blue-wash);color:var(--blue)}
.pill.fab{background:var(--minium-wash);color:var(--minium)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-size:.88rem;font-weight:500;
  transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn.acc{background:var(--minium);border-color:var(--minium);color:#fff}
.btn.acc:hover{background:var(--minium-2);border-color:var(--minium-2)}
.btn[disabled]{opacity:.45;cursor:default}
.btn[hidden]{display:none}
.unitpicker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.unitpicker button{border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:7px 15px;cursor:pointer;font-size:.83rem;font-weight:500;color:var(--ink-2);transition:.15s}
.unitpicker button:hover{border-color:var(--ink-3)}
.unitpicker button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* prose from the book */
.prose{font-size:1rem;line-height:1.72;color:var(--ink-2)}
.prose h2{font-size:1.55rem;margin:34px 0 10px;color:var(--ink);letter-spacing:-.01em}
.prose h3{font-size:1.24rem;margin:28px 0 8px;color:var(--ink)}
.prose h4{font-size:1.02rem;margin:22px 0 6px;color:var(--ink);font-family:var(--sans);font-weight:600}
.prose h5{font-size:.94rem;margin:18px 0 6px;color:var(--ink);font-family:var(--sans);font-weight:600}
.prose p{margin:0 0 14px;max-width:66ch}
.prose ul{margin:0 0 16px;padding-left:20px;max-width:66ch}
.prose li{margin-bottom:6px}
.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose .quadre{background:var(--blue-wash);border-left:3px solid var(--blue);padding:12px 16px;
  border-radius:0 8px 8px 0;color:var(--ink-2);max-width:66ch}
.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;font-size:.9rem}
.prose td{border-bottom:1px solid var(--line-soft);padding:9px 13px;vertical-align:top}
.prose tr:first-child td{background:var(--surface-2);font-weight:600;color:var(--ink);
  font-family:var(--sans);font-size:.78rem;letter-spacing:.05em}
/* el grec majúscul no porta accents: no transformem mai el contingut de les taules */
.prose td,.prose th{text-transform:none}
.prose tr:last-child td{border-bottom:0}
</style>
<style>
/* ============ TEXT MENU ============ */
.tlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tcard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 18px 16px;transition:border-color .18s,transform .18s,box-shadow .18s;
  position:relative;overflow:hidden}
.tcard:hover{border-color:var(--ink-3);transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard .num{position:absolute;top:10px;right:16px;font-family:var(--serif);font-size:2.6rem;
  color:var(--line);line-height:1;font-weight:600;pointer-events:none}
.tcard h3{font-size:1.12rem;margin:10px 0 6px;color:var(--ink);padding-right:44px}
.tcard p{margin:0;font-size:.82rem;color:var(--ink-3)}
.tcard .meta{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.74rem;color:var(--ink-3)}

/* ============ READER ============ */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(20px,4vw,42px);box-shadow:var(--shadow)}
.reader h2{font-size:clamp(1.4rem,3.4vw,2rem);margin-bottom:4px}
.reader .sub{font-family:var(--sans);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:22px}
.latin{font-family:var(--serif);font-size:clamp(1.06rem,2.4vw,1.19rem);line-height:1.9;color:var(--ink);
  max-width:62ch;hyphens:none}
@media(max-width:640px){
  .latin{line-height:1.78;font-size:1.05rem}
  .toggle{font-size:.75rem;padding:5px 11px}
  .readbar{gap:6px}
}
.latin p{margin:0 0 1.15em}
.w{cursor:help;border-radius:2px;position:relative;
  transition:background-color .12s,box-shadow .12s;
  box-shadow:inset 0 -1px 0 0 transparent}
@media(hover:hover){
  .w:hover{background:var(--minium-wash);box-shadow:inset 0 -1.5px 0 0 var(--minium)}
}
.w.open{background:var(--minium-wash);box-shadow:inset 0 -1.5px 0 0 var(--minium)}
.readbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.readbar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-2);cursor:pointer;
  border:1px solid var(--line);border-radius:99px;padding:6px 13px;background:var(--surface);user-select:none}
.toggle input{accent-color:var(--minium);margin:0;width:14px;height:14px}
.toggle:hover{border-color:var(--ink-3)}
.hidemac .mac{display:none}
.hidemac .nomac[hidden]{display:inline}

/* tooltip */
#tt{position:fixed;z-index:120;max-width:330px;min-width:190px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:0;opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .13s,transform .13s;
  overflow:hidden}
#tt.show{opacity:1;transform:none;pointer-events:auto}
#tt .bar{height:3px;background:var(--minium)}
#tt .in{padding:12px 15px 13px}
#tt .form{font-family:var(--serif);font-size:.94rem;letter-spacing:.01em;
  color:var(--ink-3);margin-bottom:5px}
#tt .enun{font-family:var(--serif);font-size:1.06rem;font-weight:600;color:var(--ink);line-height:1.3}
#tt .enun em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:.92em}
#tt .trad{font-size:.88rem;color:var(--ink-2);margin-top:5px;line-height:1.45}
#tt .note{font-size:.72rem;color:var(--minium);margin-top:8px;font-weight:500}
#tt .alt{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}

/* per-text vocabulary */
.vocgrid{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.vrow{padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:.9rem;display:flex;gap:10px}
.vrow b{font-family:var(--serif);font-weight:600;color:var(--ink);white-space:nowrap}
.vrow span{color:var(--ink-2);font-size:.85rem}

/* ============ EXERCISES ============ */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(18px,3.5vw,30px);box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;
  font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.bar{height:4px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.qtext{font-size:1.14rem;line-height:1.45;color:var(--ink);margin-bottom:18px;font-family:var(--serif);
  font-weight:500;text-wrap:balance}
.qtext .lat{font-style:italic;color:var(--minium)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:12px 15px;cursor:pointer;font-size:.94rem;line-height:1.4;transition:.14s;display:flex;gap:11px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--blue);background:var(--blue-wash)}
.opt .k{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--ink-3);
  border:1px solid var(--line);border-radius:5px;width:20px;height:20px;display:flex;align-items:center;
  justify-content:center;flex:0 0 20px;margin-top:1px}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .k{border-color:var(--good);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-wash)}
.opt.no .k{border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;padding:12px 15px;border-radius:10px;font-size:.88rem;line-height:1.5;display:none}
.fb.on{display:block}
.fb.ok{background:var(--good-wash);color:var(--good)}
.fb.no{background:var(--bad-wash);color:var(--bad)}
.fb .fbt{display:block;margin-bottom:3px;font-weight:600}
.fb b{font-weight:600}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
.score{font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
input.ans{font-family:var(--serif);font-size:1.15rem;padding:11px 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%;max-width:330px}
input.ans:focus{outline:none;border-color:var(--blue);background:var(--surface)}
input.ans.ok{border-color:var(--good)} input.ans.no{border-color:var(--bad)}
.hintrow{font-size:.8rem;color:var(--ink-3);margin-top:10px}
.result{text-align:center;padding:26px 10px}
.result .big{font-family:var(--serif);font-size:3.4rem;font-weight:600;line-height:1;color:var(--blue)}
.result .lbl{font-size:.76rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 20px}

/* flashcard */
.fc{perspective:1200px;margin:0 auto 18px;max-width:420px}
.fcin{position:relative;height:210px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;
  box-shadow:var(--shadow)}
.fcf.back{transform:rotateY(180deg);background:var(--surface-2)}
.fcf .lat{font-family:var(--serif);font-size:1.55rem;font-weight:600;color:var(--ink)}
.fcf .val{font-size:1.1rem;color:var(--ink);font-weight:500}
.fcf .hint{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:14px}

/* dictionary */
.search{width:100%;padding:13px 16px 13px 42px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface);color:var(--ink);font-size:.98rem;font-family:var(--sans)}
.search:focus{outline:none;border-color:var(--blue)}
.searchwrap{position:relative;margin-bottom:6px}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.dlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-top:16px}
.dent{padding:11px 16px;border-bottom:1px solid var(--line-soft);display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.dent:last-child{border-bottom:0}
.dent b{font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--ink)}
.dent span{color:var(--ink-2);font-size:.9rem}
.dent .tag{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.empty{padding:36px;text-align:center;color:var(--ink-3);font-size:.9rem}

/* home */
.hero{padding:8px 0 26px}
.hero .disp{font-family:var(--serif);font-size:clamp(2.4rem,8vw,4.4rem);font-weight:600;
  letter-spacing:-.02em;line-height:.98;margin-bottom:14px}
.hero .disp em{font-style:italic;color:var(--minium);font-weight:500}
.hero p{max-width:56ch;color:var(--ink-2);font-size:1.05rem;margin:0 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.stat .n{font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--blue);line-height:1;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;
  display:flex;flex-direction:column;gap:6px;text-decoration:none;transition:.18s}
.ucard:hover{border-color:var(--ink-3);transform:translateY(-2px);box-shadow:var(--shadow)}
.ucard .rn{font-family:var(--serif);font-size:.85rem;letter-spacing:.2em;color:var(--minium);font-weight:600}
.ucard h3{font-size:1.1rem;color:var(--ink)}
.ucard p{margin:0;font-size:.82rem;color:var(--ink-3)}

.mode b{display:block;font-size:.93rem;color:var(--ink);font-weight:600;margin-bottom:2px}

.dot{display:inline-block;width:5px;height:5px;border-radius:99px;background:var(--minium);

.drillnote{font-size:.76rem;color:var(--ink-3);margin:-10px 0 18px;display:flex;align-items:center;gap:7px}
.unitsel{margin-bottom:22px}

.homefoot b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.tbtn.warn{border-color:var(--minium);color:var(--minium);background:var(--minium-wash)}

<style>
/* comptador de cicle */
.cyc{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.78rem;color:var(--ink-3)}
.cyc b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cycbar{flex:0 0 90px;height:4px;background:var(--line-soft);border-radius:99px;overflow:hidden}
.cycbar i{display:block;height:100%;background:var(--minium);transition:width .35s ease}

/* ordenar */
.ordwrap{display:flex;flex-direction:column;gap:12px}
.ordpool{display:flex;flex-wrap:wrap;gap:8px}
.orditem{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;
  cursor:pointer;font-size:.9rem;text-align:left;transition:.14s;line-height:1.35}
.orditem:hover:not(:disabled):not(.used){border-color:var(--blue);background:var(--blue-wash)}

.orditem:disabled{cursor:default}
.ordpick{margin:0;padding:0 0 0 26px;display:flex;flex-direction:column;gap:6px;min-height:4px}
.ordpick li{font-size:.9rem;padding:7px 12px;border-radius:8px;background:var(--surface-2);

.ordpick li.ok{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.ordpick li.no{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.ordpick li::marker{color:var(--ink-3);font-size:.8rem}
.lnk{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;font-size:inherit}
.lnk:disabled{color:var(--ink-3);cursor:default}

/* emparellar */
.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.matcol{display:flex;flex-direction:column;gap:8px}
.matitem{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 13px;

<style>

<style>

itle":"Οἱ ἄνθρωποι καὶ οἱ λόγοι","paras":["Ἀλέξανδρος· Ἐγώ εἰμι Ἀλέξανδρος. Ἐγώ εἰμι κύριος καὶ δεσπότης. Ἐγὼ ἀγαθὸς κύριός εἰμι. Ὁ οἶκός μου ἐν τῇ κώμῃ ἐστίν. Ὁ οἶκος μέγας καὶ καλός ἐστιν. Ἐγὼ πολλοὺς δούλους ἔχω. Καὶ ἵππον καὶ ὄνον καὶ κύνα ἔχω. Ἐγὼ τὴν κώμην καὶ τὸν ἀγρὸν φιλῶ.","Ἑλένη· Ἐγώ εἰμι Ἑλένη. Ἐγώ εἰμι δέσποινα. Ἐγὼ ἀγαθὴ δέσποινά εἰμι. Ὁ Ἀλέξανδρος κύριός ἐστιν, καὶ ἐγὼ γυνὴ τοῦ Ἀλεξάνδρου εἰμί. Ἐγὼ καλὰ ῥόδα ἐν τῷ κήπῳ ἔχω. Ἡ οἰκία ἡμῶν ἀσφαλής ἐστιν. Ἐγὼ τοὺς ἀγαθοὺς δούλους φιλῶ, ἀλλὰ τοὺς κακοὺς δούλους μισῶ.","Δάος· Ἐγώ εἰμι Δάος. Ἐγὼ δοῦλός εἰμι. Ἐγὼ ἀγαθὸς δοῦλός εἰμι καὶ ἄοκνός εἰμι. Ὁ Ἀλέξανδρος δεσπότης μού ἐστιν, καὶ ἡ Ἑλένη δέσποινά μού ἐστιν. Ἐγὼ ἐν τῷ ἀγρῷ ἐργάζομαι. Ὁ ἥλιος θερμός ἐστιν, ἀλλὰ ἐγὼ τὸν πόνον οὐ φεύγω. Ἐγὼ τὸν κύριον φιλῶ.","Ξάνθος· Ἐγώ εἰμι Ξάνθος. Ἐγὼ καὶ δοῦλός εἰμι. Ἀλλὰ ἐγὼ ἀγαθὸς δοῦλος οὐκ εἰμί! Ἐγὼ κακὸς δοῦλός εἰμι. Ἐγὼ ἀργός εἰμι καὶ ἀεὶ καθεύδω. Ἐγὼ ὑπὸ τῷ δένδρῳ ἐν τῇ σκιᾷ καθεύδω. Τὸ γὰρ ἔργον χαλεπόν ἐστιν. Ἐγὼ τὸν πόνον μισῶ. Ὁ δεσπότης πολλάκις ὀργὴν ἔχει καὶ ἐμὲ παίει.","ΑΛΕΞΑΝΔΡΟΣ· Χαῖρε, ὦ Ἑλένη.","ΕΛΕΝΗ· Χαῖρε, Ἀλέξανδρε. Ποῦ εἰσιν οἱ δοῦλοι;","ΑΛΕΞΑΝΔΡΟΣ· Ὦ δοῦλοι, χαίρετε! Δεῦρο ἔλθετε!","ΔΑΟΣ ΚΑΙ ΞΑΝΘΟΣ· Χαῖρε, ὦ δεσπότα.","ΑΛΕΞΑΝΔΡΟΣ· (βλέπει τὸν Δάον) Τίς εἶ σύ; ΔΑΟΣ· Ἐγώ εἰμι Δάος. Ἐγὼ ἀγαθὸς καὶ ἄοκνος δοῦλός εἰμι.","ΑΛΕΞΑΝΔΡΟΣ· Ναί, σὺ ἀγαθὸς εἶ. Σὺ ἀεὶ ἐν τῷ ἀγρῷ ἐργάζει. (βλέπει τὸν Ξάνθον) Καὶ τίς εἶ σύ;","ΞΑΝΘΟΣ· Ἐγώ εἰμι Ξάνθος.","ΑΛΕΞΑΝΔΡΟΣ· Ἆρα σὺ ἀγαθὸς δοῦλος εἶ; Ἆρα σὺ τὸ ἔργον φιλεῖς;","ΞΑΝΘΟΣ· Ναί, ὦ δέσποτα, ἐγὼ ἀγαθὸς δοῦλός εἰμι! Ἐγὼ τὸν ἀγρὸν φιλῶ.","ΔΑΟΣ· Οὔ! Σὺ ἀγαθὸς οὐκ εἶ. Σὺ ψευδὴς καὶ ἀργὸς εἶ! Σὺ ἀεὶ καθεύδεις ὑπὸ τῷ δένδρῳ!","ΑΛΕΞΑΝΔΡΟΣ· Ὁ Δάος ἀληθῆ λέγει. Σὺ μωρὸς εἶ, ὦ Ξάνθε. Μὴ ψεύδου! Ἔρρωσθε, ὦ δοῦλοι. Ἄγετε τοὺς ἵππους.","ΔΑΟΣ ΚΑΙ ΞΑΝΘΟΣ· Ἔρρωσο, ὦ δεσπότα.","(Xicotet vocabulari d'ajuda visual: ἐγώ = jo / εἰμι = sóc / σύ = tu / εἶ = eres / κύριος, δεσπότης = senyor / δέσποινα = senyora / γυνή = dona, esposa / δοῦλος = esclau / ἀγαθός = bo / κακός = roí / ἄοκνος = actiu, treballador / ἀργός = gandul / καθεύδω = dorm / ἐργάζομαι = treballe / ψευδής = mentider / χαῖρε, χαίρετε = hola / ἔρρωσο, ἔρρωσθε = adéu / τίς εἶ σύ; = qui eres tu? / ναί = sí / οὔ = no)."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<p><em>(Exercicis del primer tema: Escriptura, ortografia i pronúncia)<\/em><\/p>\n<h4>I. Ἀνάγνωσις.<\/h4>\n<p><em>Prepara la teua part de lectura per al professor. Has de parar especial atenció a:<\/em><\/p>\n<ul><li><em>Pronunciar clarament les consonants dobles com la lletra ksi (ξ) en Ἀλέ<\/em><strong><em>ξ<\/em><\/strong><em>ανδρος i <\/em><strong><em>Ξ<\/em><\/strong><em>άνθος.<\/em><\/li><li><em>Aspirar suaument la primera lletra d'<\/em><strong><em>Ἑ<\/em><\/strong><em>λένη i <\/em><strong><em>ἥ<\/em><\/strong><em>λιος, perquè porten esperit aspre.<\/em><\/li><li><em>Pronunciar la theta (θ) de Ξάν<\/em><strong><em>θ<\/em><\/strong><em>ος o ἀγα<\/em><strong><em>θ<\/em><\/strong><em>ός com una \"z\" castellana o \"th\" anglesa.<\/em><\/li><li><em>Llegir amb fluïdesa els diftongs (ει, αι, ου).<\/em><\/li><li><em>Ignorar (no pronunciar) la iota subscrita que trobaràs baix d'algunes vocals (com a δένδρ<\/em><strong><em>ῳ<\/em><\/strong><em>).<\/em><\/li><\/ul>\n<h4>II. Μεταγραφή.<\/h4>\n<p><em>Llig estes paraules extretes del text i transcriu-les al nostre alfabet per a demostrar que saps exactament quina lletra és cadascuna (per exemple: δοῦλος ➞ doulos / φίλος ➞ philos). Fixa't molt bé en les lletres dobles (ξ, ψ, ζ), les aspirades (θ, φ, χ) i en transcriure la \"ρ\" inicial amb esperit aspre com a \"rh\" (Ex: ῥήτωρ ➞ rhetor).<\/em><\/p>\n<ul><li>Ἀλέξανδρος ➞<\/li><li>Ξάνθος ➞<\/li><li>Ἑλένη ➞<\/li><li>Δάος ➞<\/li><li>δοῦλος ➞<\/li><li>δέσποινα ➞<\/li><li>ἀγαθός ➞<\/li><li>χαῖρε ➞<\/li><li>καθεύδω ➞<\/li><li>ἄοκνος ➞<\/li><li>οἶκος ➞<\/li><li>δεσπότης ➞<\/li><li>ἆρα ➞<\/li><li>ἔρρωσο ➞<\/li><li>ἀληθῆ ➞<\/li><li>ἐργάζομαι ➞<\/li><li>ψευδής ➞<\/li><li>ἥλιος ➞<\/li><li>ἵππους ➞<\/li><li>δένδρῳ <em>(compte amb la iota subscrita!)<\/em> ➞<\/li><li>ῥόδα ➞<\/li><li>σχίζω ➞<\/li><li>θεοί ➞<\/li><li>εὗρον ➞<\/li><li>υἱός ➞<\/li><\/ul>\n<h4>III. Γράμματα μεγάλα.<\/h4>\n<p><em>El grec antic s'escrivia originalment tot en lletres MAJÚSCULES monumentals i sense accents ni esperits. Transforma estes oracions. Recorda llevar-hi tots els accents i els esperits! (Pista: recorda que la lletra sigma \"σ / ς\" en majúscula és \"Σ\").<\/em><\/p>\n<ul><li>ἐγώ εἰμι Ἀλέξανδρος. ➞<\/li><li>τίς εἶ σύ; ➞<\/li><li>ὁ Ξάνθος κακὸς δοῦλός ἐστιν. ➞<\/li><li>ἆρα σὺ ἀγαθὸς εἶ; ➞<\/li><li>χαῖρε, ὦ Ἑλένη. ➞<\/li><li>ὁ ἥλιος θερμός ἐστιν. ➞<\/li><li>ἐγὼ ὑπὸ τῷ δένδρῳ ἐν τῇ σκιᾷ καθεύδω. ➞<\/li><\/ul>\n<h4>IV. Γράμματα μικρά.<\/h4>\n<p><em>Ara farem el pas invers, simulant com els monjos medievals copiaven els textos antics. Passa estes oracions de MAJÚSCULA a minúscula. Com que encara no saps les regles d'accentuació, <\/em><strong><em>busca estes mateixes frases en els textos de dalt<\/em><\/strong><em> i copia-les posant molta atenció a dibuixar correctament cada accent, esperit i signe de puntuació.<\/em><\/p>\n<ul><li>ΕΓΩ ΕΙΜΙ ΔΑΟΣ. ➞<\/li><li>ΣΥ ΑΓΑΘΟΣ ΟΥΚ ΕΙ. ➞<\/li><li>Ο ΔΑΟΣ ΑΛΗΘΗ ΛΕΓΕΙ. ➞<\/li><li>ΕΡΡΩΣΘΕ, Ω ΔΟΥΛΟΙ. ➞<\/li><li>ΑΛΛΑ ΕΓΩ ΑΓΑΘΟΣ ΔΟΥΛΟΣ ΟΥΚ ΕΙΜΙ. ➞<\/li><li>ΕΓΩ ΤΗΝ ΚΩΜΗΝ ΚΑΙ ΤΟΝ ΑΓΡΟΝ ΦΙΛΩ. ➞<\/li><\/ul>\n<h4>V. Τὰ πνεύματα.<\/h4>\n<p><em>En grec, tota paraula que comença per vocal o diftong ha de portar un esperit obligatòriament. Cerca al text i copia ací baix:<\/em><\/p>\n<ul><li><strong>Set<\/strong> paraules que comencen amb <strong>esperit suau<\/strong> ( ᾿ ) [la vocal es llig normal, no s'aspira]: ___________ , ___________ , ___________ , ___________ , ___________ , ___________ , ___________ .<\/li><li><strong>Cinc<\/strong> paraules que comencen amb <strong>esperit aspre<\/strong> ( ῾ ) [es pronuncia amb una aspiració, com una \"h\" anglesa]: ___________ , ___________ , ___________ , ___________ , ___________ .<\/li><\/ul>\n<h4>VI. Οἱ τόνοι.<\/h4>\n<p><em>El grec clàssic empra tres tipus d'accent gràfic per a marcar la síl·laba tònica. Observa les paraules d'esta llista i classifica-les segons el tipus d'accent que porten dibuixat:<\/em><\/p>\n<p>Llista: <strong>Ἀλέξανδρος, ἐγὼ, δοῦλός, κακὸς, χαῖρε, τίς, ἀγαθός, οἶκός, μωρὸς, ἀληθῆ, σύ, δένδρῳ, ἔχω, φιλῶ, καθεύδω.<\/strong><\/p>\n<ul><li>Paraules amb <strong>Accent Agut ( ´ )<\/strong>:<\/li><li>Paraules amb <strong>Accent Greu ( ` )<\/strong> (substituïx l'agut a final de paraula quan no hi ha pausa):<\/li><li>Paraules amb <strong>Accent Circumflex ( ῀ )<\/strong>:<\/li><\/ul>\n<h4>VII. Τὰ σημεῖα τῆς στίξεως.<\/h4>\n<p><em>Alerta! En grec clàssic no existix el nostre signe d'interrogació (?). Per a fer una pregunta directa, s'utilitza el punt i coma grec ( ; ) al final de l'oració. El punt alt ( · ) equival als nostres dos punts o al punt i coma valencià.<\/em><\/p>\n<p><em>Afig el signe de puntuació adequat al final d'estes frases (punt [ . ] o interrogació [ ; ]) fixant-te en si afirmen/neguen una cosa o si fan una pregunta:<\/em><\/p>\n<ul><li>Ἐγώ εἰμι Δάος __<\/li><li>Τίς εἶ σύ __<\/li><li>Ἆρα σὺ ἀγαθὸς δοῦλος εἶ __<\/li><li>Ὁ Δάος ἀληθῆ λέγει __<\/li><li>Ποῦ εἰσιν οἱ δοῦλοι __<\/li><li>Ὁ οἶκός μου ἐν τῇ κώμῃ ἐστίν __<\/li><\/ul>\n<h4>VIII. Σὺ τίς εἶ;<\/h4>\n<p><em>Ara et toca a tu. Fes com els personatges del text i presenta't en grec.<\/em> <em>1. Utilitza l'estructura Ἐγώ εἰμι… i escriu el teu nom propi transcrit a l'alfabet grec (pregunta al professor com s'adapta).<\/em> <em>2. Afig què eres (μαθητής = alumne / μαθήτρια = alumna).<\/em> <em>3. Afig com eres (ἀγαθός = bo / ἀγαθή = bona / ἄοκνος = treballador/a).<\/em><\/p>\n<ul><li>(Jo sóc [el teu nom]): __________________________________________________<\/li><li>(Jo sóc alumne/a): _____________________________________________________<\/li><li>(Jo sóc bo/bona…): ____________________________________________________<\/li><\/ul>"},{"id":"t2a","unit":2,"kind":"a","title":"Ὁ οἶκος, ὁ ἀγρὸς καὶ ὁ ἀργὸς δοῦλος","paras":["Ὁ Ἀλέξανδρος ἄνθρωπός ἐστιν. Ἆρα ὁ Φίλιππος δοῦλός ἐστιν; Οὔ, ὁ Φίλιππος δοῦλος οὐκ ἔστιν, ἀλλὰ τέκνον ἐστίν. Ὁ Νέαρχος καὶ (també) τέκνον ἐστίν. Ὁ Φίλιππος καὶ ὁ Νέαρχος τέκνα εἰσίν. Τὰ τέκνα μικρά ἐστιν. Ὁ Ἀλέξανδρος κύριος τοῦ οἴκου ἐστίν. Ὁ Ἀλέξανδρος κύριός ἐστιν. Ὁ Φίλιππος καὶ ὁ Νέαρχος τέκνα τοῦ κυρίου εἰσίν. Ὁ Ἀλέξανδρος καλὸς κύριός ἐστιν.","Ὁ οἶκος καλός ἐστιν. Ὁ οἶκος μακρός ἐστιν. Ποῦ ἐστιν ὁ οἶκος; Ὁ οἶκος ἐν τῷ πεδίῳ ἐστίν. Τὸ πεδίον καλόν ἐστιν. Ἐν τῷ πεδίῳ καλὸς ἀγρός ἐστιν. Ποῦ ἐστιν ὁ ἀγρός; Ὁ ἀγρὸς περὶ τὸν οἶκόν ἐστιν. Ἐν τῷ ἀγρῷ δένδρα ἐστίν. Τὸ δένδρον καλόν ἐστιν. Τὰ δένδρα οὐ μικρά, ἀλλὰ μακρά ἐστιν. Τὸ δένδρον ἐν τῷ ἀγρῷ ἐστιν.","Ὁ Ἀλέξανδρος ἵππον καὶ ὄνον ἔχει. Τί ἐστιν ἵππος; Ὁ ἵππος ζῷόν ἐστιν. Ὁ ὄνος καὶ ζῷόν ἐστιν. Οἱ ἵπποι καὶ οἱ ὄνοι ζῷά εἰσιν. Ποῦ ἐστι τὰ ζῷα; Τὰ ζῷα ἐν τῷ ἀγρῷ ἐστιν. Ὁ Ἀλέξανδρος κύριος τῶν ζῴων ἐστίν. Ὁ Ἀλέξανδρος τὸν ἵππον καὶ τὸν ὄνον ἔχει.","Ὁ Δάος δοῦλός ἐστιν. Ὁ Ξάνθος καὶ δοῦλός ἐστιν. Ὁ Ἀλέξανδρος κύριος τῶν δούλων ἐστίν. Τὸ τῶν δούλων ἔργον ἐν τῷ ἀγρῷ ἐστιν. Τὸ ἔργον χαλεπόν ἐστιν. Ὁ ἥλιος θερμός ἐστιν καὶ ὁ πόνος χαλεπός ἐστιν.","Ὁ Δάος ἄοκνός ἐστιν. Ὁ Δάος ἀγαθὸς δοῦλός ἐστιν. Ὁ ἀγαθὸς δοῦλος τὸν πόνον οὐ φεύγει. Ὁ ἀγαθὸς δοῦλος τὸ ἔργον ἔχει. Ὁ δὲ Ξάνθος ἄοκνος οὐκ ἔστιν. Ὁ Ξάνθος ἀργός ἐστιν. Ὁ Ξάνθος κακὸς δοῦλός ἐστιν. Ὁ κακὸς δοῦλος τὸν πόνον φεύγει καὶ ὕπνον ἔχει. Ποῦ ἐστιν ὁ Ξάνθος; Ὁ ἀργὸς δοῦλος ἐν τῷ ἀγρῷ ὑπὸ τῷ δένδρῳ ἐστίν. Ὁ Ξάνθος ὑπὸ τῷ δένδρῳ καθεύδει.","Ὁ Ἀλέξανδρος εἰς τὸν ἀγρὸν βαίνει. Ὁ Ἀλέξανδρος ἐν τῷ ἀγρῷ ἐστιν. Ὁ κύριος τὸν Δάον βλέπει. Τί ἄγει ὁ Δάος; Ὁ Δάος τὸν ἵππον ἄγει. Ὁ Ἀλέξανδρος λέγει· «Ὦ Δάε, χαῖρε. Σὺ ἀγαθὸς δοῦλος εἶ. Ἀλλὰ ποῦ ἐστιν ὁ Ξάνθος; Ὁ Ξάνθος τὸν ὄνον ἄγει;».","Ὁ Δάος τὸν κύριον ἀκούει καὶ λέγει· «Ὦ κύριε, ὁ Ξάνθος οὐκ ἄγει τὸν ὄνον. Ὁ Ξάνθος τὸ ἔργον φεύγει. Ὁ κακὸς δοῦλος τὸν πόνον φεύγει. Ὁ Ξάνθος ὑπὸ τῷ δένδρῳ ἐστίν. Ὁ κακὸς δοῦλος καθεύδει!».","Ὁ Ἀλέξανδρος πρὸς τὸ δένδρον βαίνει. Ὁ κύριος τὸν Ξάνθον βλέπει. Ὁ ἀργὸς δοῦλος ὑπὸ τῷ δένδρῳ καθεύδει. Ὁ κύριος τὸν ἀργὸν δοῦλον παίει! Ὁ Ξάνθος τοὺς ὀφθαλμοὺς ἀνοίγει. Ὁ Ἀλέξανδρος λέγει· «Ὦ Ξάνθε, ἄκουε! Μὴ καθεῦδε, ἀλλὰ βλέπε τὸ ἔργον! Ὦ δοῦλε, παύου! Ἄγε τὸν ὄνον καὶ φέρε τὰ ξύλα! Μὴ φεῦγε τὸν πόνον! Μὴ καθεῦδε ὑπὸ τῷ δένδρῳ!».","Ὁ Ξάνθος φόβον ἔχει. Ὁ κακὸς δοῦλος κλαίει καὶ λέγει· «Ὦ κύριε, μὴ παῖε τὸν δοῦλον! Ὁ ἥλιος θερμός ἐστιν. Ὁ πόνος χαλεπός ἐστιν καὶ τὸ ἔργον χαλεπόν ἐστιν. Ἀλλὰ ἐγὼ τὸν ὄνον ἄγω.» Ὁ Ξάνθος πρὸς τὸν ὄνον βαίνει. Ὁ Ἀλέξανδρος λέγει· «Βλέπε τὸν ἀγρόν, ὦ Ξάνθε! Ὁ λύκος κίνδυνός ἐστι τοῖς ζῴοις! Βλέπε τὸν λύκον καὶ σῴζε τὰ ζῷα!»."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta.<\/em><\/p>\n<ul><li>Ἆρα ὁ Φίλιππος δοῦλός ἐστιν;<\/li><li>Ποῦ ἐστιν ὁ οἶκος;<\/li><li>Τί ἔχει ὁ Ἀλέξανδρος;<\/li><li>Τίς κύριος τῶν δούλων ἐστίν;<\/li><li>Τί φεύγει ὁ κακὸς δοῦλος;<\/li><li>Ποῦ καθεύδει ὁ Ξάνθος;<\/li><li>Ποῖ (cap a on) βαίνει ὁ Ἀλέξανδρος;<\/li><li>Τίνα βλέπει ὁ Ἀλέξανδρος ἐν τῷ ἀγρῷ;<\/li><li>Τί ἄγει ὁ Δάος;<\/li><li>Τί ἔχει ὁ Ξάνθος;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος δοῦλός ἐστιν.<\/li><li>Ὁ ἀγρὸς περὶ τὸν οἶκόν ἐστιν.<\/li><li>Τὰ δένδρα μικρά ἐστιν.<\/li><li>Ὁ Δάος ἄοκνος καὶ ἀγαθὸς δοῦλός ἐστιν.<\/li><li>Ὁ Ξάνθος τὸ ἔργον ἔχει.<\/li><li>Ὁ Ξάνθος ὑπὸ τῷ δένδρῳ καθεύδει.<\/li><li>Ὁ Δάος τὸν ὄνον ἄγει.<\/li><li>Ὁ Ἀλέξανδρος τὸν Δάον παίει.<\/li><li>Ὁ ἥλιος θερμός ἐστιν.<\/li><li>Ὁ λύκος φίλος τοῖς ζῴοις ἐστίν.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίς ἐστιν ὁ Ἀλέξανδρος; (_______________)<\/li><li>Τίνος τέκνα εἰσὶν ὁ Φίλιππος καὶ ὁ Νέαρχος; (_______________)<\/li><li>Ποῦ ἐστιν ὁ οἶκος; (_______________)<\/li><li>Τίνα ἔχει ὁ Ἀλέξανδρος; [un cavall i un ase] (_______________)<\/li><li>Τίνων κύριός ἐστιν ὁ Ἀλέξανδρος; [dels animals] (_______________)<\/li><li>Ὑπὸ τίνι καθεύδει ὁ Ξάνθος; (_______________)<\/li><li>Ποῖ βαίνει ὁ Ἀλέξανδρος; [cap al camp] (_______________)<\/li><li>Τίνα βλέπει ὁ κύριος πρῶτον (primer); (_______________)<\/li><li>Τίνα παίει ὁ κύριος; [a l'esclau gandul] (_______________)<\/li><li>Τίνι κίνδυνός ἐστιν ὁ λύκος; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος κύριος τοῦ ________ ἐστίν.<\/li><li>Ὁ ἀγρὸς ________ τὸν οἶκόν ἐστιν.<\/li><li>Ὁ Ἀλέξανδρος τὸν ἵππον καὶ τὸν ________ ἔχει.<\/li><li>Τὸ τῶν δούλων ἔργον ________ τῷ ἀγρῷ ἐστιν.<\/li><li>Ὁ ἀγαθὸς δοῦλος τὸν ________ οὐ φεύγει.<\/li><li>Ὁ Ξάνθος ________ τῷ δένδρῳ καθεύδει.<\/li><li>Ὁ Δάος τὸν ἵππον ________.<\/li><li>Ὁ Ξάνθος τοὺς ________ ἀνοίγει.<\/li><li>Ὦ Ξάνθε, ________ τὸ ἔργον!<\/li><li>Ὁ λύκος ________ ἐστι τοῖς ζῴοις!<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: De singular a plural i viceversa.<\/em> <em>Canvia els elements de l'oració (subjectes, complements i verbs) de singular a plural, o de plural a singular. Para molta atenció a la regla del neutre plural subjecte!<\/em><\/p>\n<ul><li>Ὁ δοῦλος τὸν ἵππον ἄγει. ➞<\/li><li>Τὸ τέκνον μικρόν ἐστιν. ➞<\/li><li>Οἱ κύριοι τοὺς κακοὺς δούλους βλέπουσιν. ➞<\/li><li>Ὁ λύκος κίνδυνός ἐστι τῷ ζῴῳ. ➞<\/li><li>Ὁ ἄνθρωπος τὸ δένδρον βλέπει. ➞<\/li><\/ul>\n<p><em>Exercici B: L'Imperatiu.<\/em> <em>Transforma l'oració descriptiva (indicatiu) en una orde o prohibició directa (imperatiu) dirigida al subjecte.<\/em> <em>Exemple: Ὁ Ἀλέξανδρος τὸν ἵππον ἄγει ➞ Ὦ Ἀλέξανδρε, ἄγε τὸν ἵππον.<\/em><\/p>\n<ul><li>Ὁ Δάος τὸν ἵππον ἄγει. ➞<\/li><li>Ὁ δοῦλος τὸ ξύλον φέρει. ➞<\/li><li>Ὁ Ξάνθος τὸ ἔργον βλέπει. ➞<\/li><li>Ὁ κακὸς δοῦλος καθεύδει. ➞ (Prohibició)<\/li><li>Οἱ ἄνθρωποι τὸν πόνον φεύγουσιν. ➞ (Prohibició)<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Conjuguen, declinen i ordenen les paraules donades per a formar oracions correctes en grec, respectant l'orde regular de la sintaxi grega (S-O-V).<\/em><\/p>\n<ul><li>ὁ δοῦλος / ὑπό / τὸ δένδρον / καθεύδειν.<\/li><li>ὁ Ἀλέξανδρος / ὁ ἵππος / καὶ / ὁ ὄνος / ἔχειν.<\/li><li>ὦ Ξάνθος / μή / φεύγειν / τὸ ἔργον.<\/li><li>τὸ τέκνον / μικρός / εἶναι.<\/li><li>ὁ λύκος / ὁ ὄνος / βλέπειν.<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text.<\/em><\/p>\n<ul><li>Ὁ Φίλιππος καὶ ὁ Νέαρχος τέκνα τοῦ κυρίου εἰσίν.<\/li><li>Ὁ ἀγρὸς περὶ τὸν οἶκόν ἐστιν.<\/li><li>Ὁ Ἀλέξανδρος κύριος τῶν ζῴων ἐστίν.<\/li><li>Τὸ τῶν δούλων ἔργον χαλεπόν ἐστιν.<\/li><li>Ὁ κακὸς δοῦλος τὸν πόνον φεύγει καὶ ὕπνον ἔχει.<\/li><li>Ὁ ἀργὸς δοῦλος ὑπὸ τῷ δένδρῳ καθεύδει.<\/li><li>Ὁ Ἀλέξανδρος πρὸς τὸ δένδρον βαίνει καὶ τὸν Ξάνθον βλέπει.<\/li><li>Ὁ Δάος τὸν κύριον ἀκούει καὶ λέγει.<\/li><li>Μὴ καθεῦδε, ἀλλὰ βλέπε τὸ ἔργον!<\/li><li>Ὁ λύκος κίνδυνός ἐστι τοῖς ζῴοις!<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 2 i respectant l'estructura S-O-V i l'ortografia politònica.<\/em><\/p>\n<ul><li>El camp és bonic i la casa és llarga (gran).<\/li><li>Alexandre té esclaus i animals.<\/li><li>El bon esclau guia el cavall cap al camp.<\/li><li>L'esclau gandul dorm davall de l'arbre.<\/li><li>Els xiquets miren el cavall. <em>(Alerta: recorda la regla de concordança del neutre plural!)<\/em><\/li><li>Dau no fuig de l'esforç.<\/li><li>Alexandre camina cap a l'arbre i colpeja Xantos.<\/li><li>Oh, esclau, no dormes!<\/li><li>Guia l'ase i porta la fusta (els troncs)!<\/li><li>El llop és un perill per als ases.<\/li><\/ul>"},{"id":"t2b","unit":2,"kind":"b","title":"Ὁ Δαίδαλος καὶ ὁ Ἴκαρος","paras":["Ὁ Δαίδαλος ἄνθρωπός ἐστιν. Ὁ Ἴκαρος ἄνθρωπός ἐστιν. Ὁ Ἴκαρος υἱὸς τοῦ Δαιδάλου ἐστίν. Ὁ Ἴκαρος τέκνον ἐστίν. Ποῦ εἰσιν ὁ Δαίδαλος καὶ ὁ Ἴκαρος; Ὁ Δαίδαλος καὶ ὁ Ἴκαρος ἐν τῷ λαβυρίνθῳ εἰσίν.","Ὁ λαβύρινθος θαυμαστὸν ἔργον τοῦ Δαιδάλου ἐστίν. Ἐν τῷ λαβυρίνθῳ κίνδυνός ἐστιν. Ὁ Μινώταυρος ἐν τῷ λαβυρίνθῳ ἐστίν. Ὁ Μινώταυρος ἄνθρωπός ἐστιν; Οὔ, ὁ Μινώταυρος ἄνθρωπος οὐκ ἔστιν. Ὁ Μινώταυρος δεινὸν θηρίον ἐστίν. Τὸ θηρίον τὸν ἄνθρωπον ἐσθίει! Ὁ Μινώταυρος κίνδυνός ἐστι τοῖς ἀνθρώποις. Ὁ λαβύρινθος δεσμωτήριόν ἐστιν. Ὁ Δαίδαλος καὶ ὁ Ἴκαρος ἐν τῷ δεσμωτηρίῳ εἰσίν. Οἱ ἄνθρωποι τὸ θηρίον φεύγουσιν.","Ὁ Δαίδαλος δεινὸς ἄνθρωπός ἐστιν. Ὁ Δαίδαλος πτερὰ ἔχει. Τὰ πτερὰ ὅπλον ἐστὶ τοῖς ἀνθρώποις. Τὰ πτερὰ ἔργον τοῦ Δαιδάλου ἐστίν. Ὁ Δαίδαλος τὰ πτερὰ τῷ Ἰκάρῳ φέρει. Ὁ Δαίδαλος λέγει· «Ὦ Ἴκαρε, βλέπε τὰ πτερά. Τὰ πτερὰ καλὸν δῶρόν ἐστιν.» Τὰ πτερὰ καλὸν δῶρόν ἐστι τῷ Ἰκάρῳ.","Οἱ ἄνθρωποι τὸν λαβύρινθον φεύγουσιν. Νῦν ὁ Δαίδαλος καὶ ὁ Ἴκαρος ἐν τῷ οὐρανῷ εἰσιν. Ποῦ εἰσιν; Ἐν τῷ οὐρανῷ! Ὁ οὐρανὸς καλός ἐστιν. Οἱ ἄνθρωποι ὥσπερ θεοί εἰσιν. Οἱ ἄνθρωποι τὰ πτερὰ ἔχουσιν καὶ τὸν κίνδυνον φεύγουσιν.","Ὁ Δαίδαλος βλέπει τὸν ἥλιον καὶ λέγει· «Ὦ Ἴκαρε, ἄκουε! Ὁ ἥλιος θερμός ἐστιν. Ὁ θερμὸς ἥλιος κίνδυνός ἐστι τοῖς πτεροῖς. Τὰ πτερὰ ἐν κινδύνῳ ἐστίν! Μὴ βαῖνε πρὸς τὸν ἥλιον! Φεῦγε τὸν ἥλιον! Ὦ τέκνον, ἄκουε τοὺς λόγους (les paraules)!».","Ἀλλὰ ὁ Ἴκαρος τὸν Δαίδαλον οὐκ ἀκούει. Ὁ Ἴκαρος μωρός ἐστιν. Ὁ Ἴκαρος λέγει· «Ἐγὼ μωρὸς οὐκ εἰμί! Ὁ ἥλιος φίλος ἐστίν. Ὁ ἥλιος κίνδυνος οὐκ ἔστιν. Ἐγὼ ὥσπερ θεός εἰμι!» Ὁ Ἴκαρος πρὸς τὸν ἥλιον βαίνει.","Ἀλλὰ ὁ ἥλιος φίλος οὐκ ἔστιν. Τὰ πτερὰ τοῦ Ἰκάρου ἐγγὺς τοῦ ἡλίου ἐστίν. Ὁ θερμὸς ἥλιος τὸν ὄλεθρον φέρει. Τὰ πτερὰ τοῦ Ἰκάρου πίπτει!.","Νῦν ὁ Ἴκαρος ἐν τῷ οὐρανῷ οὐκ ἔστιν. Ὁ Ἴκαρος εἰς τὸν πόντον πίπτει. Ὁ Ἴκαρος ἐν τῷ πόντῳ ἐστίν. Ὁ πόντος θάνατός ἐστι τῷ Ἰκάρῳ. Ὁ Ἴκαρος νεκρός ἐστιν. Ὁ Δαίδαλος τὸν Ἴκαρον βλέπει. Ὁ Δαίδαλος τὸ τέκνον βλέπει καὶ κλαίει. Ὁ Δαίδαλος μόνος ἐστίν. Ὁ πόνος τοῦ Δαιδάλου χαλεπός ἐστιν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta.<\/em><\/p>\n<ul><li>Τίς ἐστιν ὁ Ἴκαρος;<\/li><li>Ποῦ εἰσιν ὁ Δαίδαλος καὶ ὁ Ἴκαρος;<\/li><li>Ἆρα ὁ Μινώταυρος ἄνθρωπός ἐστιν;<\/li><li>Ὁ Μινώταυρος τί ἐσθίει;<\/li><li>Ὁ Δαίδαλος τί ἔχει;<\/li><li>Οἱ ἄνθρωποι νῦν ποῦ εἰσιν;<\/li><li>Ὁ Δαίδαλος τί λέγει τῷ Ἰκάρῳ;<\/li><li>Ἆρα ὁ Ἴκαρος τὸν Δαίδαλον ἀκούει;<\/li><li>Ὁ θερμὸς ἥλιος τί φέρει;<\/li><li>Ὁ Ἴκαρος ποῖ (cap a on) πίπτει;<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge o element del mite les realitza. (Opcions: Ὁ Δαίδαλος, Ὁ Ἴκαρος, Ὁ Μινώταυρος, Ὁ ἥλιος, Οἱ ἄνθρωποι).<\/em><\/p>\n<ul><li>Ἐν τῷ λαβυρίνθῳ τὸν ἄνθρωπον ἐσθίει. (_______________)<\/li><li>Τὰ πτερὰ τῷ Ἰκάρῳ φέρει. (_______________)<\/li><li>Τὸν λαβύρινθον φεύγουσιν καὶ ἐν τῷ οὐρανῷ εἰσιν. (_______________)<\/li><li>Τοῖς πτεροῖς κίνδυνός ἐστιν. (_______________)<\/li><li>Τὸν Δαίδαλον οὐκ ἀκούει. (_______________)<\/li><li>Λέγει· «Ἐγὼ ὥσπερ θεός εἰμι!». (_______________)<\/li><li>Τὸν ὄλεθρον φέρει. (_______________)<\/li><li>Πρὸς τὸν θερμὸν ἥλιον βαίνει. (_______________)<\/li><li>Εἰς τὸν πόντον πίπτει καὶ νεκρός ἐστιν. (_______________)<\/li><li>Τὸ τέκνον βλέπει καὶ κλαίει. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ θερμὸς ἥλιος τὸν ὄλεθρον φέρει καὶ τὰ πτερὰ πίπτει.<\/li><li>☐ Ὁ Ἴκαρος εἰς τὸν πόντον πίπτει καὶ νεκρός ἐστιν.<\/li><li>☐ Ὁ Δαίδαλος λέγει· «Φεῦγε τὸν ἥλιον, ὦ Ἴκαρε!».<\/li><li>☐ Ὁ Δαίδαλος καὶ ὁ Ἴκαρος ἐν τῷ λαβυρίνθῳ εἰσίν.<\/li><li>☐ Ὁ Μινώταυρος δεινὸν θηρίον ἐστὶ καὶ τὸν ἄνθρωπον ἐσθίει.<\/li><li>☐ Οἱ ἄνθρωποι τὸν λαβύρινθον φεύγουσιν καὶ ἐν τῷ οὐρανῷ εἰσιν.<\/li><li>☐ Ὁ Δαίδαλος τὸ τέκνον βλέπει καὶ κλαίει.<\/li><li>☐ Ὁ Δαίδαλος τὰ πτερὰ ἔχει καὶ τῷ Ἰκάρῳ φέρει.<\/li><li>☐ Ἀλλὰ ὁ Ἴκαρος μωρός ἐστι καὶ τὸν Δαίδαλον οὐκ ἀκούει.<\/li><li>☐ Ὁ Ἴκαρος πρὸς τὸν θερμὸν ἥλιον βαίνει.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite.<\/em><\/p>\n<ul><li>Ὁ Ἴκαρος υἱὸς τοῦ Δαιδάλου ἐστίν.<\/li><li>Ὁ λαβύρινθος θαυμαστὸν ἔργον τοῦ Δαιδάλου ἐστίν.<\/li><li>Ὁ Μινώταυρος δεινὸν θηρίον ἐστὶ καὶ τὸν ἄνθρωπον ἐσθίει!<\/li><li>Ὁ Δαίδαλος τὰ πτερὰ τῷ Ἰκάρῳ φέρει.<\/li><li>Οἱ ἄνθρωποι τὰ πτερὰ ἔχουσιν καὶ τὸν κίνδυνον φεύγουσιν.<\/li><li>Ὁ θερμὸς ἥλιος κίνδυνός ἐστι τοῖς πτεροῖς.<\/li><li>Ὦ Ἴκαρε, μὴ βαῖνε πρὸς τὸν ἥλιον!<\/li><li>Ἀλλὰ ὁ Ἴκαρος τὸν Δαίδαλον οὐκ ἀκούει.<\/li><li>Ὁ θερμὸς ἥλιος τὸν ὄλεθρον φέρει καὶ τὰ πτερὰ πίπτει.<\/li><li>Ὁ Ἴκαρος εἰς τὸν πόντον πίπτει καὶ νεκρός ἐστιν.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu les paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>ἄνθρωπος<\/strong> (home, ésser humà): ____________________<\/li><li><strong>θεός<\/strong> (déu): ____________________<\/li><li><strong>ἥλιος<\/strong> (sol): ____________________<\/li><li><strong>θερμός<\/strong> (calent): ____________________<\/li><li><strong>λόγος<\/strong> (paraula, raó): ____________________<\/li><li><strong>θάνατος<\/strong> (mort): ____________________<\/li><li><strong>νεκρός<\/strong> (cadàver, mort): ____________________<\/li><li><strong>μόνος<\/strong> (sol, únic): ____________________<\/li><li><strong>πτερόν<\/strong> (ala): ____________________<\/li><li><strong>ἔργον<\/strong> (treball, obra): ____________________<\/li><\/ul>"},{"id":"t3a","unit":3,"kind":"a","title":"Ὁ λύκος καὶ ἡ φυγὴ τοῦ Ξάνθου","paras":["Ὁ Ἀλέξανδρος δεσπότης ἐστίν. Ἡ Ἑλένη δέσποινά ἐστιν. Ὁ Ἀλέξανδρος ἀγαθὸς δεσπότης ἐστίν, καὶ ἡ Ἑλένη ἀγαθὴ δέσποινά ἐστιν. Ὁ δεσπότης καὶ ἡ δέσποινα οἰκίαν ἔχουσιν. Ἡ οἰκία καλή ἐστιν. Ποῦ ἐστιν ἡ οἰκία; Ἡ καλὴ οἰκία ἐν τῇ κώμῃ ἐστίν. Ὁ Ἀλέξανδρος καὶ ἡ Ἑλένη τὴν κώμην φιλοῦσιν. Οἱ ἄνθρωποι τὴν κώμην φιλοῦσιν καὶ τὴν οἰκίαν φιλοῦσιν.","Ὁ δεσπότης δούλους ἔχει. Ὁ Δάος ἀγαθὸς δοῦλός ἐστιν. Ὁ δὲ Ξάνθος κακὸς δοῦλος καὶ κλέπτης ἐστίν. Ὁ Ξάνθος τὸν πόνον μισεῖ. Ὁ ἀργὸς δοῦλος τὸ ἔργον μισεῖ καὶ ἀεὶ καθεύδει.","Χθὲς (ahir) ὁ ἥλιος θερμὸς ἦν. Ὁ Ξάνθος ἐν τῷ ἀγρῷ ἦν. Τί ἐποίει (què feia) ὁ Ξάνθος; Ὁ δοῦλος τὰ μικρὰ πρόβατα ἐφύλαττεν. Ἆρα (partícula interrogativa) ὁ Ξάνθος καλῶς ἐφύλαττεν; Οὔ! Ὁ ἀργὸς δοῦλος ὑπὸ τῷ δένδρῳ ἦν. Ὑπὸ τῷ δένδρῳ σκιὰ ἦν. Ὁ Ξάνθος ἐν τῇ σκιᾷ ἐκάθευδεν.","Ἡ ὕλη ἐγγύς ἐστιν. Ἡ ὕλη σκοτεινή ἐστιν. Ἐν τῇ ὕλῃ κίνδυνός ἐστιν. Ξαίφνης, ἐκ τῆς ὕλης ἄγριος λύκος ἔβαινεν. Πόθεν (d'on) ἔβαινεν ὁ λύκος; Ἐκ τῆς ὕλης! Ὁ λύκος ἐκ τῆς σκοτεινῆς ὕλης ἔβαινεν. Ποῖ (cap a on) ἔτρεχεν ὁ λύκος; Ὁ λύκος πρὸς τὸν ἀγρὸν ἔτρεχεν.","Ὁ λύκος τὰ πρόβατα ὁρᾷ. Ὁ λύκος πρόβατόν τι ἁρπάζει. Ὁ Ξάνθος τοὺς ὀφθαλμοὺς ἀνοίγει καὶ τὸν λύκον ὁρᾷ. Ὁ δοῦλος φόβον ἔχει καὶ βοᾷ· «Ὦ δεσπότα! Ὁ λύκος ἐν τῷ ἀγρῷ ἐστιν!». Ὁ Ξάνθος τὸν λύκον οὐ παίει. Ὁ δοῦλος φεύγει. Ποῖ φεύγει ὁ Ξάνθος; Ὁ κακὸς δοῦλος ἐκ τοῦ ἀγροῦ πρὸς τὴν ὕλην φεύγει! Ὁ κλέπτης εἰς τὴν σκοτεινὴν ὕλην βαίνει.","Σήμερον (hui) ὁ Ἀλέξανδρος εἰς τὸν ἀγρὸν βαίνει. Ἐν τῷ ἀγρῷ νεκρὰ πρόβατά ἐστιν. Ὁ Ἀλέξανδρος τὸν Ξάνθον ζητεῖ, ἀλλὰ τὸν δοῦλον οὐχ ὁρᾷ. Ποῦ ἐστιν ὁ δοῦλος; Ὁ δοῦλος ἐν τῷ ἀγρῷ οὐκ ἔστιν. Ὁ δεσπότης μεγάλην ὀργὴν ἔχει. Ὁ δεσπότης τὴν ὀργὴν οὐ κρύπτει, ἀλλὰ τὴν ὀργὴν δηλοῖ. Ὁ Ἀλέξανδρος τὸν Δάον καλεῖ καὶ λέγει· «Ὦ Δάε, ἄκουε! Ὁ κακὸς δοῦλος φεύγει! Ὁ Ξάνθος τὴν ἐμὴν ὀργὴν φεύγει. Ἡμεῖς τὸν δοῦλον διώκομεν!» Ὁ Ἀλέξανδρος καὶ ὁ Δάος ἀπὸ τῆς κώμης πρὸς τὴν ὕλην βαίνουσιν. Ὁ δεσπότης καὶ ὁ δοῦλος εἰς τὴν ὕλην βαίνουσιν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Τίς ἐστιν ἡ δέσποινα;<\/li><li>Ποῦ ἐστιν ἡ καλὴ οἰκία;<\/li><li>Ἆρα ὁ Ξάνθος τὸν πόνον φιλεῖ;<\/li><li>Τί ἐποίει (què feia) ὁ Ξάνθος χθές;<\/li><li>Πόθεν ἔβαινεν ὁ ἄγριος λύκος;<\/li><li>Ποῖ (cap a on) ἔτρεχεν ὁ λύκος;<\/li><li>Τί ἁρπάζει ὁ λύκος ἐν τῷ ἀγρῷ;<\/li><li>Ποῖ φεύγει ὁ κακὸς δοῦλος;<\/li><li>Τί ὁρᾷ ὁ Ἀλέξανδρος ἐν τῷ ἀγρῷ σήμερον (hui);<\/li><li>Τίνα καλεῖ ὁ δεσπότης;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec.<\/em><\/p>\n<ul><li>Ἡ Ἑλένη ἀγαθὴ δέσποινά ἐστιν.<\/li><li>Ἡ καλὴ οἰκία ἐν τῇ ὕλῃ ἐστίν.<\/li><li>Ὁ Δάος κακὸς δοῦλος καὶ κλέπτης ἐστίν.<\/li><li>Χθὲς ὁ Ξάνθος ἐν τῇ σκιᾷ ἐκάθευδεν.<\/li><li>Ὁ λύκος ἐκ τῆς κώμης ἔβαινεν.<\/li><li>Ὁ Ξάνθος τὸν ἄγριον λύκον παίει.<\/li><li>Ὁ Ἀλέξανδρος σήμερον εἰς τὸν ἀγρὸν βαίνει.<\/li><li>Ὁ δεσπότης τὸν Ξάνθον ἐν τῷ ἀγρῷ ὁρᾷ.<\/li><li>Ὁ Ἀλέξανδρος τὴν ὀργὴν κρύπτει.<\/li><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος εἰς τὴν ὕλην βαίνουσιν.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίς τὴν κώμην καὶ τὴν οἰκίαν φιλεῖ; [els hòmens] (_______________)<\/li><li>Ποῦ ἐστιν ἡ οἰκία; (_______________)<\/li><li>Τί μισεῖ ὁ Ξάνθος; (_______________)<\/li><li>Τίνα ἐφύλαττεν ὁ Ξάνθος χθές; (_______________)<\/li><li>Πόθεν ἔβαινεν ὁ λύκος; (_______________)<\/li><li>Τίνα ἁρπάζει ὁ λύκος; (_______________)<\/li><li>Ποῖ φεύγει ὁ Ξάνθος; (_______________)<\/li><li>Ποῖ βαίνει ὁ Ἀλέξανδρος σήμερον; (_______________)<\/li><li>Τί δηλοῖ ὁ Ἀλέξανδρος; [la (seua) ira] (_______________)<\/li><li>Τίνα διώκουσιν ὁ δεσπότης καὶ ὁ Δάος; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ἡ Ἑλένη ἀγαθὴν ________ ἔχουσιν.<\/li><li>Ἡ καλὴ οἰκία ἐν τῇ ________ ἐστίν.<\/li><li>Ὁ Ξάνθος τὸν πόνον ________ καὶ ἀεὶ καθεύδει.<\/li><li>Χθὲς ὁ Ξάνθος τὰ μικρὰ πρόβατα ________.<\/li><li>Ὁ λύκος ἐκ τῆς σκοτεινῆς ________ ἔβαινεν.<\/li><li>Ὁ Ξάνθος τοὺς ὀφθαλμοὺς ἀνοίγει καὶ τὸν ________ ὁρᾷ.<\/li><li>Ὁ κακὸς δοῦλος ἐκ τοῦ ________ πρὸς τὴν ὕλην φεύγει.<\/li><li>Σήμερον ὁ Ἀλέξανδρος ________ πρόβατα ἐν τῷ ἀγρῷ ὁρᾷ.<\/li><li>Ὁ δεσπότης μεγάλην ________ ἔχει καὶ αὐτὴν δηλοῖ.<\/li><li>Ὁ Ἀλέξανδρος τὸν Δάον ________ καὶ λέγει.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Ἀπὸ τοῦ ἑνικοῦ εἰς τὸν πληθυντικόν (1a Declinació i Verbs Contractes).<\/em> <em>Canvia els subjectes, complements i verbs de singular a plural o de plural a singular, parant molta atenció a les contraccions verbals i al genitiu plural de la 1a declinació (-ῶν).<\/em><\/p>\n<ul><li>Ὁ ἄνθρωπος τὴν κώμην φιλεῖ. ➞<\/li><li>Ὁ λύκος τὸ πρόβατον ὁρᾷ. ➞<\/li><li>Ὁ δεσπότης τὴν ὀργὴν δηλοῖ. ➞<\/li><li>Ἡ οἰκία καλή ἐστιν. ➞<\/li><li>Ἡ ὕλη σκοτεινή ἐστιν. ➞<\/li><\/ul>\n<p><em>Exercici B: Ὁ παρατατικός (L'Imperfet).<\/em> <em>Transforma els verbs en present a temps passat (Imperfet d'indicatiu), aplicant correctament l'augment sil·làbic o temporal.<\/em> <em>Exemple: Ὁ δοῦλος βαίνει ➞ Ὁ δοῦλος ἔβαινεν.<\/em><\/p>\n<ul><li>Ὁ Ξάνθος τὰ πρόβατα φυλάττει. ➞<\/li><li>Ὁ λύκος ἐκ τῆς ὕλης βαίνει. ➞<\/li><li>Ὁ κύριος ὀργὴν ἔχει. ➞<\/li><li>Ὁ λύκος πρὸς τὸν ἀγρὸν τρέχει. ➞<\/li><li>Ὁ Ξάνθος ἐν τῇ σκιᾷ καθεύδει. ➞<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Conjuguen els verbs (en present actiu o imperfet, segons els marcadors temporals de \"hui\" o \"ahir\"), declinen els substantius/adjectius i ordenen les paraules per a formar oracions correctes en grec (S-C-V).<\/em><\/p>\n<ul><li>ἡ / δέσποινα / ὁ / δοῦλος / καλεῖν.<\/li><li>χθές / ὁ / λύκος / πρὸς / ὁ / ἀγρός / τρέχειν.<\/li><li>ὁ / ἄνθρωπος / ἡ / καλός / κώμη / φιλεῖν.<\/li><li>σήμερον / ὁ / Ἀλέξανδρος / ἡ / ὀργή / οὐ / κρύπτειν.<\/li><li>ὁ / κακός / δοῦλος / εἰς / ἡ / σκοτεινός / ὕλη / βαίνειν.<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ἡ Ἑλένη τὴν κώμην φιλοῦσιν.<\/li><li>Ὁ Ξάνθος τὸν πόνον μισεῖ καὶ ἀεὶ καθεύδει.<\/li><li>Χθὲς ὁ Ξάνθος τὰ μικρὰ πρόβατα ἐφύλαττεν.<\/li><li>Ὁ λύκος ἐκ τῆς σκοτεινῆς ὕλης ἔβαινεν.<\/li><li>Ὁ δοῦλος φόβον ἔχει καὶ βοᾷ.<\/li><li>Ὁ κλέπτης ἐκ τοῦ ἀγροῦ πρὸς τὴν ὕλην φεύγει.<\/li><li>Σήμερον ὁ Ἀλέξανδρος εἰς τὸν ἀγρὸν βαίνει.<\/li><li>Ὁ δεσπότης τὸν Ξάνθον ζητεῖ, ἀλλὰ τὸν δοῦλον οὐχ ὁρᾷ.<\/li><li>Ὁ Ἀλέξανδρος τὴν ὀργὴν οὐ κρύπτει, ἀλλὰ τὴν ὀργὴν δηλοῖ.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος ἀπὸ τῆς κώμης πρὸς τὴν ὕλην βαίνουσιν.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 3 i respectant l'estructura S-C-V i l'ortografia politònica. (Presta atenció a l'accentuació de la 1a declinació i les preposicions).<\/em><\/p>\n<ul><li>La casa bona està en la bella aldea.<\/li><li>L'esclau roí odia el treball i fuig.<\/li><li>Ahir el llop salvatge corria cap al camp.<\/li><li>El llop eixia (βαίνω) de l'ombra i de la fosca selva.<\/li><li>Alexandre veu els xicotets animals morts. <em>(Alerta a la concordança!)<\/em><\/li><li>Alexandre crida Dau i mostra la (seua) ira.<\/li><li>Oh esclau, no amagues les (teues) ovelles!<\/li><li>El senyor i l'esclau busquen el lladre a la selva.<\/li><li>Els hòmens estimen les cases belles.<\/li><li>Per què <em>(useu l'adverbi τί)<\/em> no guardaves les ovelles ahir?<\/li><\/ul>"},{"id":"t3b","unit":3,"kind":"b","title":"Ἡ Περσεφόνη καὶ ὁ Ἅιδης","paras":["Ἡ Περσεφόνη θεά ἐστιν. Ἡ Περσεφόνη καλὴ θεά ἐστιν. Ἆρα ἡ θεὰ ἄνθρωπός ἐστιν; Οὔ, ἡ θεὰ ἄνθρωπος οὐκ ἔστιν. Ἡ θεὰ ἀθάνατός ἐστιν. Ποῦ οἰκεῖ (habita) ἡ Περσεφόνη; Ἡ Περσεφόνη ἐν τῇ Σικελίᾳ οἰκεῖ. Ἡ Σικελία οὐ μικρὰ νῆσός ἐστιν. Ἡ Σικελία καλὴ καὶ μεγάλη νῆσός ἐστιν. Ἡ Περσεφόνη τὰ καλὰ ῥόδα φιλεῖ.","Χθὲς ἡ θεὰ ἐν τῷ πεδίῳ ἦν. Ἡ καλὴ θεὰ ῥόδα εἶχεν. Ἡ Περσεφόνη τὴν γῆν καὶ τὴν θάλατταν ἐφίλει.","Ὁ Ἅιδης ἄγριος καὶ κακὸς θεός ἐστιν. Ποῦ οἰκεῖ ὁ κακὸς θεός; Ὁ θεὸς ἐν τῷ οὐρανῷ οὐκ οἰκεῖ. Ὁ θεὸς ὑπὸ τῇ γῇ οἰκεῖ. Ξαίφνης, ὁ Ἅιδης ἐκ τῆς γῆς ἀναβαίνει. Πόθεν ἀναβαίνει ὁ Ἅιδης; Ἐκ τῆς γῆς! Ὁ θεὸς τὴν καλὴν Περσεφόνην ὁρᾷ. Ὁ Ἅιδης τὴν θεὰν φιλεῖ. Ὁ ἄγριος θεὸς τὴν θεὰν ἁρπάζει! Ὁ Ἅιδης ὥσπερ κλέπτης τὴν θεὰν ἁρπάζει.","Ἡ Περσεφόνη φόβον ἔχει. Ἡ θεὰ βοᾷ καὶ κλαίει. Ἀλλὰ ὁ Ἅιδης τὴν θεὰν ἄγει. Ποῖ ἄγει ὁ θεὸς τὴν Περσεφόνην; Ὁ ἄδικος θεὸς τὴν θεὰν ἀπὸ τοῦ πεδίου ὑπὸ τὴν γῆν ἄγει. Νῦν ἡ καλὴ θεὰ ὑπὸ τῇ γῇ ἐστιν.","Ἡ ἄλλη θεά, ἡ Δημήτηρ, τὴν Περσεφόνην οὐχ ὁρᾷ. Ἡ Δημήτηρ τὴν Περσεφόνην ζητεῖ. Ἡ θεὰ τὴν καλὴν θεὰν ζητεῖ, ἀλλὰ οὐχ ὁρᾷ. Ἡ Δημήτηρ μεγάλην ὀργὴν ἔχει. Ἡ θεὰ οὐ μόνον ὀργὴν ἔχει, ἀλλὰ καὶ λύπην ἔχει. Ἡ θεὰ τὴν ὀργὴν δηλοῖ. Ἡ Δημήτηρ ἐν τῇ γῇ τὴν Περσεφόνην ζητεῖ. Ἀλλὰ ἡ Περσεφόνη οὐκέτι ἐν τῇ γῇ ἐστιν. Ἡ Περσεφόνη ὑπὸ τῇ γῇ ἐστιν. Ὁ Ἅιδης τὴν καλὴν θεὰν ἔχει. Ὁ Ἅιδης ἄδικός ἐστιν. Ἡ λύπη τῆς θεᾶς μακρά ἐστιν."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Τίς ἐστιν ἡ Περσεφόνη;<\/li><li>Ποῦ οἰκεῖ ἡ καλὴ θεά;<\/li><li>Τί φιλεῖ ἡ Περσεφόνη ἐν τῇ Σικελίᾳ;<\/li><li>Τίς ἐστιν ὁ Ἅιδης καὶ ποῦ οἰκεῖ (habita);<\/li><li>Πόθεν (d'on) ἀναβαίνει ὁ Ἅιδης;<\/li><li>Τί ποιεῖ (què fa) ὁ Ἅιδης ἐν τῷ πεδίῳ;<\/li><li>Ποῖ (cap a on) ἄγει ὁ ἄδικος θεὸς τὴν Περσεφόνην;<\/li><li>Τίς ζητεῖ τὴν Περσεφόνην ἐν τῇ γῇ;<\/li><li>Τί ἔχει ἡ Δημήτηρ;<\/li><li>Ἆρα ἡ Περσεφόνη ἔτι (encara) ἐν τῇ γῇ ἐστιν;<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge del mite les realitza. (Opcions: Ἡ Περσεφόνη, Ὁ Ἅιδης, Ἡ Δημήτηρ).<\/em><\/p>\n<ul><li>Ἐν τῇ Σικελίᾳ οἰκεῖ καὶ τὰ ῥόδα φιλεῖ. (_______________)<\/li><li>Ὑπὸ τῇ γῇ οἰκεῖ. (_______________)<\/li><li>Ἐκ τῆς γῆς ἀναβαίνει καὶ τὴν καλὴν θεὰν ὁρᾷ. (_______________)<\/li><li>Ὥσπερ κλέπτης τὴν θεὰν ἁρπάζει. (_______________)<\/li><li>Φόβον ἔχει καὶ βοᾷ καὶ κλαίει. (_______________)<\/li><li>Τὴν θεὰν ἀπὸ τοῦ πεδίου ὑπὸ τὴν γῆν ἄγει. (_______________)<\/li><li>Τὴν καλὴν θεὰν ζητεῖ, ἀλλὰ οὐχ ὁρᾷ. (_______________)<\/li><li>Μεγάλην ὀργὴν καὶ μακρὰν λύπην ἔχει. (_______________)<\/li><li>Νῦν ὑπὸ τῇ γῇ ἐστιν. (_______________)<\/li><li>Ἄδικός ἐστιν καὶ τὴν καλὴν θεὰν ἔχει. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ Ἅιδης τὴν θεὰν ἀπὸ τοῦ πεδίου ὑπὸ τὴν γῆν ἄγει.<\/li><li>☐ Ἡ Περσεφόνη οὐκέτι ἐν τῇ γῇ ἐστιν, ἀλλὰ ὁ Ἅιδης αὐτὴν ἔχει.<\/li><li>☐ Ἡ Περσεφόνη καλὴ θεά ἐστιν καὶ ἐν τῇ Σικελίᾳ οἰκεῖ.<\/li><li>☐ Ἡ ἄλλη θεά, ἡ Δημήτηρ, τὴν Περσεφόνην οὐχ ὁρᾷ καὶ αὐτὴν ζητεῖ.<\/li><li>☐ Ὁ Ἅιδης, ὃς ὑπὸ τῇ γῇ οἰκεῖ, ἐκ τῆς γῆς ἀναβαίνει.<\/li><li>☐ Ἡ Δημήτηρ μεγάλην ὀργὴν καὶ λύπην ἔχει.<\/li><li>☐ Χθὲς ἡ θεὰ ἐν τῷ πεδίῳ ἦν καὶ τὴν γῆν ἐφίλει.<\/li><li>☐ Ἡ Περσεφόνη φόβον ἔχει καὶ κλαίει.<\/li><li>☐ Ὁ θεὸς τὴν καλὴν Περσεφόνην ὁρᾷ καὶ ὥσπερ κλέπτης ἁρπάζει.<\/li><li>☐ Ἡ Δημήτηρ ἐν τῇ γῇ τὴν Περσεφόνην ζητεῖ.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite.<\/em><\/p>\n<ul><li>Ἡ Περσεφόνη καλὴ θεά ἐστι καὶ ἐν τῇ Σικελίᾳ οἰκεῖ.<\/li><li>Ἡ Σικελία καλὴ καὶ μεγάλη νῆσός ἐστιν.<\/li><li>Χθὲς ἡ θεὰ ἐν τῷ πεδίῳ ἦν καὶ ῥόδα εἶχεν.<\/li><li>Ὁ Ἅιδης ἄγριος καὶ κακὸς θεός ἐστιν.<\/li><li>Ξαίφνης, ὁ Ἅιδης ἐκ τῆς γῆς ἀναβαίνει καὶ τὴν θεὰν ὁρᾷ.<\/li><li>Ὁ ἄγριος θεὸς τὴν θεὰν ὥσπερ κλέπτης ἁρπάζει.<\/li><li>Ὁ ἄδικος θεὸς τὴν θεὰν ἀπὸ τοῦ πεδίου ὑπὸ τὴν γῆν ἄγει.<\/li><li>Ἡ Δημήτηρ τὴν καλὴν θεὰν ζητεῖ, ἀλλὰ οὐχ ὁρᾷ.<\/li><li>Ἡ θεὰ οὐ μόνον ὀργὴν ἔχει, ἀλλὰ καὶ λύπην ἔχει.<\/li><li>Ἡ Περσεφόνη οὐκέτι ἐν τῇ γῇ ἐστιν, ἀλλὰ ὑπὸ τῇ γῇ ἐστιν.<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>οἰκία<\/strong> (casa): ____________________<\/li><li><strong>ὀφθαλμός<\/strong> (ull): ____________________<\/li><li><strong>κλέπτης<\/strong> (lladre): ____________________<\/li><li><strong>λύκος<\/strong> (llop): ____________________<\/li><li><strong>φόβος<\/strong> (por): ____________________<\/li><li><strong>μισέω<\/strong> (odiar): ____________________<\/li><li><strong>γῆ<\/strong> (terra): ____________________<\/li><li><strong>μέγας, μεγάλη<\/strong> (gran): ____________________<\/li><li><strong>μικρός, μικρά<\/strong> (xicotet, menut): ____________________<\/li><li><strong>αὐτός, αὐτή<\/strong> (ell mateix, si mateix): ____________________<\/li><\/ul>"},{"id":"t4a","unit":4,"kind":"a","title":"Ἡ νὺξ καὶ ὁ ποιμήν","paras":["Ὁ Ἀλέξανδρος καὶ ὁ Δάος ἐκ τῆς κώμης ἔρχονται. Ἆρα οἱ ἄνθρωποι ἐν τῇ κώμῃ μένουσιν; Οὔ, οἱ ἄνθρωποι ἐν τῇ κώμῃ οὐ μένουσιν, ἀλλ' ἐκ τῆς κώμης ἔρχονται. Διὰ τί ἐκ τῆς κώμης ἔρχονται; Ὅτι τὸν κακὸν δοῦλον ζητοῦσιν. Ὁ Ξάνθος ὁ κακὸς δοῦλός ἐστιν. Ὁ Ξάνθος φεύγει, ὁ δὲ Ἀλέξανδρος τὸν Ξάνθον διώκει. Ὁ δεσπότης λέγει· «Ἐγὼ τὸν κακὸν παῖδα διώξω καὶ αὐτὸν εὑρήσω! Ὁ Ξάνθος τὴν ἐμὴν ὀργὴν οὐ φεύξεται!» Ὁ Δάος τῷ δεσπότῃ ἕπεται. Ὁ ἀγαθὸς δοῦλος τῷ κυρίῳ ἕπεται. Οἱ ἄνθρωποι διὰ τοῦ ἀγροῦ πορεύονται. Ποῖ πορεύονται οἱ ἄνθρωποι; Οἱ ἄνθρωποι πρὸς τὴν ὕλην πορεύονται.","Μετὰ δὲ ταῦτα ἡ νὺξ γίγνεται. Τί γίγνεται; Ἡ νὺξ γίγνεται. Ἆρα ἡ νὺξ λαμπρά ἐστιν; Οὔ, ἡ νὺξ λαμπρὰ οὐκ ἔστιν, ἀλλὰ ἡ νὺξ σκοτεινή ἐστιν. Ἐν τῇ νυκτὶ οἱ ἄνθρωποι τὸν Ξάνθον οὐ βλέπουσιν. Ἆρα τὸν παῖδα βλέπουσιν; Οὐχ ὁρῶσιν αὐτόν, ἡ γὰρ νὺξ σκοτεινή ἐστιν. Ἡ νὺξ τοὺς ἀνθρώπους παύει. Ὁ Ἀλέξανδρος λέγει· «Νῦν νύξ ἐστιν. Ἡ νὺξ σκοτεινή ἐστιν. Ἡμεῖς ὑπὸ τῷ δένδρῳ ἀναπαυσόμεθα. Αὔριον ὁ ἥλιος θερμὸς ἔσται καὶ ἡμεῖς πάλιν πορευσόμεθα.» Ὁ δεσπότης καὶ ὁ δοῦλος ὑπὸ τῷ δένδρῳ ἀναπαύονται.","Ξαίφνης ὁ Δάος γέροντα ὁρᾷ. Τίνα ὁρᾷ ὁ Δάος; Ὁ δοῦλος γέροντα ὁρᾷ. Ὁ γέρων ποιμήν ἐστιν. Ὁ ποιμὴν ἐν τῷ ἀγρῷ ἐστιν. Τί ποιεῖ ὁ ποιμήν; Ὁ ποιμὴν τὰ πρόβατα φυλάττει. Ὁ γέρων ποιμὴν ἀγαθὸς ἀνήρ ἐστιν. Ὁ Ἀλέξανδρος πρὸς τὸν ποιμένα ἔρχεται. Ἆρα ὁ ποιμὴν φεύγει; Ὁ ποιμὴν οὐ φεύγει. Ὁ Ἀλέξανδρος λέγει· «Ὦ γέρον, χαῖρε.» Ὁ ποιμὴν τὸν δεσπότην ἀκούει καὶ ἀποκρίνεται· «Χαῖρε, ὦ δεσπότα.».","Ὁ Ἀλέξανδρος λέγει· «Ὦ ποιμήν, ἐγὼ τὸν ἐμὸν δοῦλον ζητῶ. Ὁ παῖς τὸν πόνον φεύγει. Ἆρα σὺ τὸν παῖδα ἐν τῷ ἀγρῷ ἢ ἐν τῇ ὕλῃ βλέπεις;» Ὁ γέρων ποιμὴν ἀποκρίνεται· «Ὦ δεσπότα, ἐγὼ γέρων εἰμὶ καὶ οἱ ὀφθαλμοί μου κακοί εἰσιν, ἀλλ' ἄνθρωπον ἐν τῇ ὁδῷ βλέπω. Ὁ παῖς ἐκ τοῦ ἀγροῦ ἔβαινεν καὶ νῦν διὰ τῆς ὁδοῦ πορεύεται. Ποῖ πορεύεται ὁ παῖς; Ὁ παῖς πρὸς τὰς Ἀθήνας πορεύεται. Ἡ δὲ ὁδὸς πρὸς τὰς Ἀθήνας μακρά ἐστι καὶ κίνδυνον ἔχει. Ἆρα ὑμεῖς τὸν παῖδα διώξετε;».","Ὁ Ἀλέξανδρος χαίρει καὶ λέγει· «Ναί! Ἡμεῖς τὸν παῖδα διώξομεν! Αὔριον πρὸς τὰς Ἀθήνας πορευσόμεθα. Ἐκεῖ τὸν παῖδα εὑρήσομεν καὶ αὐτὸν πρὸς τὸν οἶκον ἄξομεν. Ἐν ταῖς Ἀθήναις φύλακές εἰσιν. Οἱ φύλακες τὸν κακὸν δοῦλον παύσουσιν. Οὕτως ὁ Ξάνθος τὴν ἡμετέραν οἰκίαν πάλιν βλέψει!» Οἱ ἄνθρωποι χαίρουσιν. Ἡ νὺξ τὸν ἀγρὸν ἔχει. Ὁ δεσπότης, ὁ δοῦλος καὶ ὁ γέρων ποιμὴν καθεύδουσιν. Ὁ δὲ Ξάνθος ἔτι διὰ τῆς ὁδοῦ φεύγει, ἀλλὰ τὸν δεσπότην οὐ φεύξεται."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Πόθεν (d'on) ἔρχονται ὁ Ἀλέξανδρος καὶ ὁ Δάος;<\/li><li>Τίνα διώκει ὁ δεσπότης;<\/li><li>Ποῖ (cap a on) πορεύονται οἱ ἄνθρωποι διὰ τοῦ ἀγροῦ;<\/li><li>Ἆρα ἡ νὺξ λαμπρά ἐστιν;<\/li><li>Ὑπὸ τίνι ἀναπαύονται ὁ δεσπότης καὶ ὁ δοῦλος;<\/li><li>Τίνα ὁρᾷ ὁ Δάος ἐν τῷ ἀγρῷ;<\/li><li>Τί ποιεῖ (què fa) ὁ γέρων ποιμήν;<\/li><li>Ποῖ πορεύεται ὁ κακὸς παῖς διὰ τῆς ὁδοῦ;<\/li><li>Τίνες (qui, en plural) εἰσὶν ἐν ταῖς Ἀθήναις;<\/li><li>Τί ποιήσουσιν (què faran) οἱ φύλακες;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (S-C-V).<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος ἐν τῇ κώμῃ μένουσιν.<\/li><li>Ὁ Δάος, ὁ ἀγαθὸς δοῦλος, τῷ δεσπότῃ ἕπεται.<\/li><li>Ἡ νὺξ λαμπρά ἐστι καὶ τοὺς ἀνθρώπους οὐ παύει.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος ὑπὸ τῷ δένδρῳ ἀναπαύονται.<\/li><li>Ὁ γέρων, ὃν ὁ Δάος ὁρᾷ, κλέπτης ἐστίν.<\/li><li>Ὁ γέρων ποιμὴν τὸν Ἀλέξανδρον φοβεῖται καὶ φεύγει.<\/li><li>Ὁ Ξάνθος ἐκ τοῦ ἀγροῦ ἔβαινεν καὶ πρὸς τὰς Ἀθήνας πορεύεται.<\/li><li>Ἡ πρὸς τὰς Ἀθήνας ὁδὸς μικρά ἐστι καὶ ἀσφαλής ἐστιν.<\/li><li>Αὔριον ὁ Ἀλέξανδρος καὶ ὁ Δάος τὸν παῖδα διώξουσιν καὶ εὑρήσουσιν.<\/li><li>Ὁ Ξάνθος τὸν δεσπότην φεύξεται.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τίνες ἐκ τῆς κώμης ἔρχονται; (_______________)<\/li><li>Τίνα διώκει ὁ Ἀλέξανδρος; (_______________)<\/li><li>Τίνι ἕπεται ὁ ἀγαθὸς δοῦλος; (_______________)<\/li><li>Τί γίγνεται μετὰ ταῦτα; (_______________)<\/li><li>Ὑπὸ τίνι ἀναπαύονται οἱ ἄνθρωποι; (_______________)<\/li><li>Τίνα ὁρᾷ ὁ Δάος ἐν τῷ ἀγρῷ; (_______________)<\/li><li>Τί φυλάττει ὁ γέρων ποιμήν; (_______________)<\/li><li>Ποῖ πορεύεται ὁ παῖς; (_______________)<\/li><li>Τίνες εἰσὶν ἐν ταῖς Ἀθήναις; [els guardes] (_______________)<\/li><li>Τίνα παύσουσιν οἱ φύλακες; (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (para atenció als deponents i als substantius de la 3a declinació).<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος ἐκ τῆς κώμης _____.<\/li><li>Ὁ ἀγαθὸς δοῦλος τῷ δεσπότῃ _____.<\/li><li>Ἡ _____ σκοτεινή ἐστιν καὶ τοὺς ἀνθρώπους παύει.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος ὑπὸ τῷ δένδρῳ _____.<\/li><li>Ὁ Δάος γέροντα ὁρᾷ· ὁ γέρων _____ ἐστιν.<\/li><li>Ὁ ποιμὴν τὰ _____ φυλάττει.<\/li><li>Ὁ κακὸς παῖς διὰ τῆς ὁδοῦ _____.<\/li><li>Αὔριον ὁ Ἀλέξανδρος τὸν παῖδα _____.<\/li><li>Ἐν ταῖς Ἀθήναις _____ εἰσίν.<\/li><li>Ὁ δὲ Ξάνθος ἔτι φεύγει, ἀλλὰ τὸν δεσπότην οὐ _____.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Ἡ τρίτη κλίσις (De singular a plural i viceversa).<\/em> <em>Canvia els elements de l'oració (subjectes, complements i verbs) de singular a plural, o de plural a singular, parant atenció als substantius de la 3a declinació (νύξ, ποιμήν, γέρων, φύλαξ).<\/em><\/p>\n<ul><li>Ἡ νὺξ σκοτεινή ἐστιν. ➞<\/li><li>Ὁ ποιμὴν τὸ πρόβατον φυλάττει. ➞<\/li><li>Ὁ δοῦλος τὸν γέροντα ὁρᾷ. ➞<\/li><li>Ὁ φύλαξ τὸν κλέπτην παύει. ➞<\/li><li>Ὁ γέρων ἀγαθὸς ἀνήρ ἐστιν. ➞<\/li><\/ul>\n<p><em>Exercici B: Ὁ μέλλων χρόνος (El Futur).<\/em> <em>Transforma els verbs, que ara estan en present, a temps futur d'indicatiu (actiu o mitjà segons pertoque), parant atenció a les alteracions de les consonants davant la sigma (-σ-).<\/em> <em>Exemple: Ὁ δοῦλος τὰς Ἀθήνας βλέπει ➞ Ὁ δοῦλος τὰς Ἀθήνας βλέψει.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος τὸν Ξάνθον διώκει. ➞<\/li><li>Ἡμεῖς τὸν κακὸν παῖδα εὑρίσκομεν. ➞ <em>(Usa la forma explícita del text: εὑρήσομεν).<\/em><\/li><li>Ἡμεῖς ὑπὸ τῷ δένδρῳ ἀναπαυόμεθα. ➞<\/li><li>Ὁ ἥλιος θερμός ἐστιν. ➞<\/li><li>Ὁ Ξάνθος τὸν δεσπότην φεύγει. ➞ <em>(Usa la forma del text).<\/em><\/li><\/ul>\n<p><em>Exercici C: Τὰ ἀποθετικὰ ῥήματα (Verbs Deponents).<\/em> <em>Canvia el nombre (de singular a plural o viceversa) d'estos verbs que es conjuguen en veu mitjana però tenen significat actiu.<\/em><\/p>\n<ul><li>Ὁ ἄνθρωπος ἐκ τῆς κώμης ἔρχεται. ➞ Οἱ ἄνθρωποι…<\/li><li>Ὁ δοῦλος τῷ κυρίῳ ἕπεται. ➞ Οἱ δοῦλοι…<\/li><li>Ὁ παῖς διὰ τῆς ὁδοῦ πορεύεται. ➞ Οἱ παῖδες…<\/li><li>Ὁ ποιμὴν ἀποκρίνεται. ➞ Οἱ ποιμένες…<\/li><li>Ἡμεῖς ὑπὸ τῷ δένδρῳ ἀναπαυόμεθα. ➞ Ἐγώ…<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Conjuguen els verbs (en present o futur d'indicatiu, segons indique l'adverbi temporal), declinen els substantius i adjectius i ordenen les paraules per a formar oracions correctes en grec (S-C-V).<\/em><\/p>\n<ul><li>ὁ / ποιμήν / τὰ πρόβατα / φυλάττειν (present).<\/li><li>ὁ / Δάος / ὁ / δεσπότης / ἕπεσθαι (present).<\/li><li>ἡ / νύξ / σκοτεινός / εἶναι (present).<\/li><li>αὔριον / ἡμεῖς / ὁ / παῖς / διώκειν (futur).<\/li><li>αὔριον / ὁ / φύλαξ / ὁ / κακός / δοῦλος / παύειν (futur).<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος ἐκ τῆς κώμης ἔρχονται.<\/li><li>Ὁ ἀγαθὸς δοῦλος τῷ δεσπότῃ ἕπεται.<\/li><li>Ἡ νὺξ σκοτεινή ἐστι καὶ τοὺς ἀνθρώπους παύει.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος ὑπὸ τῷ δένδρῳ ἀναπαύονται.<\/li><li>Ὁ Δάος γέροντα ὁρᾷ· ὁ γέρων ποιμήν ἐστιν.<\/li><li>Ὁ παῖς ἐκ τοῦ ἀγροῦ ἔβαινεν καὶ νῦν διὰ τῆς ὁδοῦ πορεύεται.<\/li><li>Ἡ δὲ ὁδὸς πρὸς τὰς Ἀθήνας μακρά ἐστι καὶ κίνδυνον ἔχει.<\/li><li>Αὔριον τὸν παῖδα εὑρήσομεν καὶ αὐτὸν πρὸς τὸν οἶκον ἄξομεν.<\/li><li>Ἐν ταῖς Ἀθήναις φύλακές εἰσιν.<\/li><li>Ὁ δὲ Ξάνθος ἔτι διὰ τῆς ὁδοῦ φεύγει, ἀλλὰ τὸν δεσπότην οὐ φεύξεται.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 4 i respectant l'estructura S-C-V i l'ortografia politònica. Para atenció especial als deponents i a la tercera declinació.<\/em><\/p>\n<ul><li>Alexandre i Dau ixen de l'aldea.<\/li><li>El bon esclau seguix el senyor. <em>(Atenció: ἕπομαι regeix datiu!)<\/em><\/li><li>La nit és fosca i els hòmens descansen sota l'arbre.<\/li><li>Dau veu un ancià en el camp.<\/li><li>L'ancià és pastor i vigila les ovelles.<\/li><li>El xic camina (πορεύομαι) per (διὰ + genitiu) el camí.<\/li><li>Demà perseguirem el xiquet i el trobarem.<\/li><li>Els guardes aturaran l'esclau a Atenes.<\/li><li>Així Xantos veurà de nou la (seua) casa.<\/li><li>El xiquet fuig, però no fugirà (s'escaparà) del senyor.<\/li><\/ul>"},{"id":"t4b","unit":4,"kind":"b","title":"Ὁ λέων καὶ ὁ Ἡρακλῆς","paras":["Ἐν τῇ Νεμέᾳ ἄγριος λέων ἦν. Τί ἦν ἐν τῇ Νεμέᾳ; Ἄγριος λέων ἦν! Ἆρα ὁ λέων μικρὸς ἦν; Οὔ, ὁ λέων μικρὸς οὐκ ἦν, ἀλλὰ μέγας λέων ἦν. Ὁ λέων δεινὸν θηρίον ἦν. Τὸ θηρίον τὴν ὕλην καὶ τὸν ἀγρὸν ἔφθειρεν. Ἐν τῇ Νεμέᾳ πολλοὶ ποιμένες ἦσαν. Οἱ ποιμένες, οἱ γέροντες καὶ οἱ παῖδες ἐν τῇ Νεμέᾳ ᾤκουν. Ἆρα οἱ ποιμένες τὸν λέοντα φιλοῦσιν; Οὔ, οἱ ποιμένες τὸ θηρίον μισοῦσιν καὶ φοβοῦνται. Διὰ τί ἐφοβοῦντο τὸν λέοντα; Ὅτι ὁ λέων πρὸς τοὺς ποιμένας ἤρχετο καὶ τοὺς ἵππους ἥρπαζεν καὶ τοὺς παῖδας ἤσθιεν! Οἱ παῖδες καὶ τὰ πρόβατα ἐν μεγάλῳ κινδύνῳ ἦσαν. Ὁ γὰρ λέων μέγας ὄλεθρος ἦν τοῖς ἀνθρώποις.","Διὰ τοῦτο οἱ ποιμένες πρὸς τὸν Ἡρακλέα ἐπορεύοντο. Τίς ἦν ὁ Ἡρακλῆς; Ὁ Ἡρακλῆς ἰσχυρὸς ἀνήρ ἦν. Ἆρα ἀσθενὴς γέρων ἦν; Οὔ, ἀσθενὴς γέρων οὐκ ἦν, ἀλλὰ ἰσχυρὸς καὶ ἀνδρεῖος ἀνήρ. Γέρων τις πρὸς τὸν Ἡρακλέα ἤρχετο καὶ ἔκλαιεν. Διὰ τί ἐκλαιεν ὁ γέρων; Ὁ γέρων ἔκλαιεν ὅτι ὁ λέων τὸν αὐτοῦ παῖδα ἤσθιεν. Ὁ γέρων μετὰ δακρύων ἔλεγεν· «Ὦ Ἡράκλεις, ἰσχυρὲ ἀνήρ! Ὁ λέων τὸν ἡμέτερον βίον φθείρει. Ὁ ἐμὸς παῖς νεκρός ἐστιν. Ἡμεῖς τὸν ὄλεθρον δεχόμεθα. Ἆρα σὺ τὸ κακὸν θηρίον παύσεις; Ἆρα σὺ τοὺς ποιμένας σώσεις;».","Ὁ Ἡρακλῆς τὸν γέροντα ποιμένα ἀκούει καὶ ἀποκρίνεται· «Μὴ κλαῖε, ὦ γέρον! Μὴ φοβοῦ τὸ θηρίον. Ἐγὼ ἀνδρεῖος ἀνήρ εἰμι. Αὔριον πρὸς τὴν ὕλην πορεύσομαι. Ἐγὼ τὸν λέοντα ζητήσω καὶ αὐτὸν εὑρήσω. Ἐγὼ τὸ θηρίον διώξω καὶ μαχέσομαι. Ἐγὼ τὸν λέοντα τῷ ῥοπάλῳ παίσω καὶ αὐτὸν νικήσω! Ὁ κακὸς λέων τοὺς παῖδας καὶ τὰ πρόβατα οὐκέτι βλάψει. Ἐγὼ τὴν Νεμέαν σώσω!».","Τῇ ὑστεραίᾳ ὁ Ἡρακλῆς πρὸς τὴν ὕλην ἐπορεύετο. Ὁ ἀνὴρ τὸ θηρίον ἐζήτει. Ἆρα ὁ λέων ἐκρύπτετο; Ξαίφνης ὁ λέων ἐκ τῆς ὕλης ἐφαίνετο. Τὸ μέγα θηρίον τὸν ἰσχυρὸν ἄνδρα ἔβλεπεν. Ὁ λέων ἐβόα καὶ ἐμάχετο. Ἆρα ὁ Ἡρακλῆς τὸν λέοντα ἐφοβεῖτο; Οὔ, ὁ ἰσχυρὸς ἀνὴρ τὸ θηρίον οὐκ ἐφοβεῖτο. Ὁ ἀνὴρ τὸν λέοντα τῷ ῥοπάλῳ ἔπαιεν, ἀλλὰ τὸ ῥόπαλον τὸ θηρίον οὐκ ἔκτεινεν. Διὰ τοῦτο ὁ Ἡρακλῆς τὰ ὅπλα ἐν τῇ γῇ ἔλειπεν. Ὁ ἰσχυρὸς ἀνὴρ τὸν λέοντα τοῖς ἰσχυροῖς βραχίοσιν ἥρπαζεν. Ὁ ἀνὴρ τὸν τοῦ λέοντος τράχηλον ἰσχυρῶς ἔπνιγεν.","Ὁ λέων εἰς τὴν γῆν ἔπιπτεν καὶ ἀπέθνῃσκεν. Νῦν τὸ θηρίον νεκρὸν ἦν. Οἱ ποιμένες τὸ νεκρὸν σῶμα τοῦ λέοντος ἔβλεπον καὶ μάλα ἔχαιρον. Ὁ γέρων ἔλεγεν· «Χαῖρε, ὦ ἀνδρεῖε ἀνήρ! Νῦν ὁ κίνδυνος παύεται. Ἡμεῖς ἐν εἰρήνῃ ἀναπαυσόμεθα. Ὁ γὰρ Ἡρακλῆς ἀεὶ τοὺς ἀνθρώπους φυλάξει καὶ σώσει!»."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes sobre el mite amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i utilitzant exclusivament les paraules del text.<\/em><\/p>\n<ul><li>Ποῦ ἦν ὁ ἄγριος λέων;<\/li><li>Τί ἔφθειρεν τὸ δεινὸν θηρίον;<\/li><li>Ἆρα οἱ ποιμένες τὸν λέοντα ἐφίλουν;<\/li><li>Τί ἥρπαζεν καὶ τί ἤσθιεν ὁ λέων;<\/li><li>Τίς ἦν ὁ Ἡρακλῆς;<\/li><li>Διὰ τί ἔκλαιεν ὁ γέρων;<\/li><li>Ποῖ (cap a on) ἐπορεύετο ὁ Ἡρακλῆς τῇ ὑστεραίᾳ (l'endemà);<\/li><li>Ἆρα τὸ ῥόπαλον τὸ θηρίον ἔκτεινεν;<\/li><li>Τίνι (amb què) ἥρπαζεν ὁ Ἡρακλῆς τὸν λέοντα;<\/li><li>Τί ἔβλεπον οἱ ποιμένες μετὰ τὴν μάχην (després de la lluita);<\/li><\/ul>\n<h4>II. Τίς ταῦτα ποιεῖ;<\/h4>\n<p><em>Llig les accions següents i escriu en cas nominatiu quin personatge del mite les realitza. (Opcions: Ὁ λέων, Ὁ Ἡρακλῆς, Οἱ ποιμένες, Ὁ γέρων).<\/em><\/p>\n<ul><li>Ἄγριος ἦν καὶ τὴν ὕλην ἔφθειρεν. (_______________)<\/li><li>Τὸ θηρίον ἐμίσουν καὶ ἐφοβοῦντο. (_______________)<\/li><li>Πρὸς τὸν Ἡρακλέα ἤρχετο καὶ ἔκλαιεν μετὰ δακρύων. (_______________)<\/li><li>Τοὺς ἵππους ἥρπαζεν καὶ τοὺς παῖδας ἤσθιεν. (_______________)<\/li><li>Ἀνδρεῖος ἀνήρ ἐστιν καὶ τὸν λέοντα τῷ ῥοπάλῳ παίσει. (_______________)<\/li><li>Ἐκ τῆς ὕλης ἐφαίνετο καὶ ἐβόα καὶ ἐμάχετο. (_______________)<\/li><li>Τὰ ὅπλα ἐν τῇ γῇ ἔλειπεν. (_______________)<\/li><li>Τὸν τοῦ λέοντος τράχηλον ἰσχυρῶς ἔπνιγεν. (_______________)<\/li><li>Εἰς τὴν γῆν ἔπιπτεν καὶ ἀπέθνῃσκεν. (_______________)<\/li><li>Τὸ νεκρὸν σῶμα τοῦ λέοντος ἔβλεπον καὶ μάλα ἔχαιρον. (_______________)<\/li><\/ul>\n<h4>III. Τάξις τοῦ μύθου.<\/h4>\n<p><em>Numera del I al X estes oracions en grec segons l'orde cronològic dels fets del mite.<\/em><\/p>\n<ul><li>☐ Ὁ λέων ἐκ τῆς ὕλης ἐφαίνετο καὶ ἐμάχετο.<\/li><li>☐ Ὁ λέων ἀπέθνῃσκεν καὶ οἱ ποιμένες μάλα ἔχαιρον.<\/li><li>☐ Ὁ Ἡρακλῆς ἀποκρίνεται· «Ἐγὼ τὸ θηρίον διώξω καὶ μαχέσομαι!».<\/li><li>☐ Γέρων τις ἔκλαιεν ὅτι ὁ λέων τὸν αὐτοῦ παῖδα ἤσθιεν.<\/li><li>☐ Ἐν τῇ Νεμέᾳ ἄγριος λέων ἦν καὶ τὴν ὕλην ἔφθειρεν.<\/li><li>☐ Ὁ Ἡρακλῆς τὸν τοῦ λέοντος τράχηλον ἰσχυρῶς ἔπνιγεν.<\/li><li>☐ Τῇ ὑστεραίᾳ ὁ Ἡρακλῆς πρὸς τὴν ὕλην ἐπορεύετο.<\/li><li>☐ Οἱ ποιμένες, οἱ γέροντες καὶ οἱ παῖδες τὸν λέοντα ἐφοβοῦντο.<\/li><li>☐ Ὁ ἀνὴρ τὸν λέοντα τῷ ῥοπάλῳ ἔπαιεν, ἀλλὰ τὸ ῥόπαλον τὸ θηρίον οὐκ ἔκτεινεν.<\/li><li>☐ Ὁ ἰσχυρὸς ἀνὴρ τὰ ὅπλα ἔλειπεν καὶ τὸν λέοντα τοῖς βραχίοσιν ἥρπαζεν.<\/li><\/ul>\n<h4>IV. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions clau següents extretes del mite.<\/em><\/p>\n<ul><li>Ἐν τῇ Νεμέᾳ ἄγριος λέων ἦν καὶ τὴν ὕλην ἔφθειρεν.<\/li><li>Οἱ ποιμένες τὸ θηρίον μισοῦσιν καὶ φοβοῦνται.<\/li><li>Ὁ γέρων ἔκλαιεν ὅτι ὁ λέων τὸν αὐτοῦ παῖδα ἤσθιεν.<\/li><li>Ἆρα σὺ τὸ κακὸν θηρίον παύσεις καὶ τοὺς ποιμένας σώσεις;<\/li><li>Ἐγὼ τὸν λέοντα τῷ ῥοπάλῳ παίσω καὶ αὐτὸν νικήσω!<\/li><li>Ξαίφνης ὁ λέων ἐκ τῆς ὕλης ἐφαίνετο.<\/li><li>Ὁ ἀνὴρ τὸν λέοντα τῷ ῥοπάλῳ ἔπαιεν, ἀλλὰ τὸ θηρίον οὐκ ἔκτεινεν.<\/li><li>Ὁ ἰσχυρὸς ἀνὴρ τὸν λέοντα τοῖς ἰσχυροῖς βραχίοσιν ἥρπαζεν.<\/li><li>Ὁ λέων εἰς τὴν γῆν ἔπιπτεν καὶ ἀπέθνῃσκεν.<\/li><li>Ἡμεῖς ἐν εἰρήνῃ ἀναπαυσόμεθα· ὁ γὰρ Ἡρακλῆς τοὺς ἀνθρώπους σώσει!<\/li><\/ul>\n<h4>V. Ἐτυμολογία.<\/h4>\n<p><strong>Γράφε τὰς τῆς Βαλενθιανῆς γλώσσης λέξεις αἳ ἐκ τῶνδε τῶν Ἑλληνικῶν λέξεων γίγνονται<\/strong> <em>(Escriu la paraula o paraules d'ús quotidià en valencià que deriven d'estos vocables grecs):<\/em><\/p>\n<ul><li><strong>παῖς, παιδός<\/strong> (xiquet, xic): ____________________<\/li><li><strong>γέρων, γέροντος<\/strong> (vell, ancià): ____________________<\/li><li><strong>βίος<\/strong> (vida): ____________________<\/li><li><strong>σῶμα, σώματος<\/strong> (cos): ____________________<\/li><li><strong>ὁδός<\/strong> (camí): ____________________<\/li><li><strong>ἀνήρ, ἀνδρός<\/strong> (home, mascle): ____________________<\/li><li><strong>πολύς, πολλοί<\/strong> (molt, abundant): ____________________<\/li><li><strong>κακός<\/strong> (roí, dolent): ____________________<\/li><li><strong>κρύπτω<\/strong> (amagar): ____________________<\/li><li><strong>ἵππος<\/strong> (cavall): ____________________<\/li><\/ul>"},{"id":"t5a","unit":5,"kind":"a","title":"Ἡ ἀσφαλὴς πόλις καὶ ὁ ἄφρων δοῦλος","paras":["Μετὰ δὲ τὴν νύκτα ἡ ἡμέρα ἐγένετο. Ἆρα νύξ ἐστιν; Οὔ, νὺξ οὐκέτι ἐστίν, ἀλλὰ ἡμέρα ἐγένετο. Ὁ Ἀλέξανδρος καὶ ὁ Δάος πρὸς τὰς Ἀθήνας ἦλθον. Ποῖ ἦλθον οἱ ἄνθρωποι; Πρὸς τὰς Ἀθήνας ἦλθον! Αἱ Ἀθῆναι μεγάλη πόλις εἰσίν. Ἆρα αἱ Ἀθῆναι μικρὰ κώμη εἰσίν; Οὔ, μικρὰ κώμη οὐκ εἰσίν, ἀλλὰ μεγάλη καὶ καλὴ πόλις.","Ἡ πόλις ἀσφαλῆ τείχη ἔχει. Τί ἔχει ἡ πόλις; Ἡ πόλις τείχη ἔχει! Τὰ τείχη μεγάλα καὶ ἀσφαλῆ ἐστιν. Ὁ Ἀλέξανδρος τὰ τῆς πόλεως τείχη εἶδεν. Τί εἶδεν ὁ δεσπότης; Τὰ τῆς πόλεως τείχη εἶδεν καὶ μεγάλως ἐθαύμασεν. Πρὸ τῶν τειχῶν ἱππεῖς ἦσαν. Τίνες ἦσαν πρὸ τῶν τειχῶν; Ἱππεῖς ἦσαν! Οἱ ἱππεῖς ἵππους ἔχουσιν. Ὁ δεσπότης καὶ ὁ δοῦλος τοὺς ἱππέας εἶδον καὶ εἰς τὴν πόλιν εἰσῆλθον.","Ἐν δὲ τῇ πόλει πολλοὶ ἄνθρωποι ἦσαν. Ὁ Ἀλέξανδρος τὸν Ξάνθον ἐζήτει, ἀλλὰ αὐτὸν οὐχ ἑώρα. Ξαίφνης, ὁ Δάος τὸν ἀργὸν δοῦλον εὗρεν. Τίνα εὗρεν ὁ Δάος; Τὸν Ξάνθον ηὗρεν! Ὁ Ξάνθος ἄφρων παῖς ἐστιν. Ὁ ἄφρων παῖς τὸν δεσπότην εἶδεν. Ἆρα ὁ ἄφρων παῖς πρὸς τὸν δεσπότην ἦλθεν; Οὔ! Ὁ παῖς τὸν δεσπότην εἶδεν καὶ εὐθὺς ἔφυγεν! Διὰ τί ἔφυγεν ὁ παῖς; Ὅτι τὴν τοῦ δεσπότου ὀργὴν ἐφοβεῖτο. Ὁ παῖς ἄφρων ἦν.","Ἀλλὰ ὁ Ἀλέξανδρος καὶ ὁ Δάος τὸν παῖδα ἐδίωξαν. Ὁ Ξάνθος ἔπεσεν. Ποῦ ἔπεσεν ὁ παῖς; Εἰς τὴν γῆν ἔπεσεν! Ὁ δὲ Ἀλέξανδρος αὐτὸν ἔλαβεν. Ὁ δεσπότης τὸν δοῦλον ἔλαβεν! Ὁ Ξάνθος ἔκλαυσεν καὶ εἶπεν· «Ὦ δεσπότα, ἐλέησόν με! Ἐγὼ τὸν ἀγρὸν ἔλιπον, ὅτι τὸν λύκον ἐφοβούμην. Οἱ λόγοι μου ἀληθεῖς εἰσιν! Ἆρα τοὺς ἐμοὺς λόγους ἀκούεις; Ἐγὼ ἀληθῆ λέγω!».","Ὁ δὲ Ἀλέξανδρος ἀπεκρίνατο· «Οἱ σοὶ λόγοι ἀληθεῖς οὐκ εἰσίν! Οἱ σοὶ λόγοι ψευδεῖς εἰσιν! Σὺ ψευδὴς καὶ ἄφρων δοῦλος εἶ. Ὁ σώφρων δοῦλος τὸν πόνον οὐ φεύγει. Σὺ δὲ ἄφρων εἶ καὶ τὸν ἀγρὸν ἔλιπες. Νῦν ἐγώ σε ἔλαβον καὶ πρὸς τὴν ἡμετέραν κώμην πάλιν ἄξω.» Οὕτως ὁ Ἀλέξανδρος τὸν δοῦλον ηὗρεν καὶ ἡ τοῦ Ξάνθου φυγὴ ἐπαύσατο."],"ask":"<h3>Ἀσκήσεις<\/h3>\n<h4>I. Ἀπάντει Ἑλληνιστί.<\/h4>\n<p><em>Respon a estes preguntes amb oracions completes en grec clàssic, copiant l'estructura sintàctica de la pregunta i usant exclusivament el lèxic del text.<\/em><\/p>\n<ul><li>Τί ἐγένετο μετὰ τὴν νύκτα;<\/li><li>Ποῖ (cap a on) ἦλθον ὁ Ἀλέξανδρος καὶ ὁ Δάος;<\/li><li>Ἆρα αἱ Ἀθῆναι μικρὰ κώμη εἰσίν;<\/li><li>Τί ἔχει ἡ μεγάλη πόλις;<\/li><li>Τίνες (qui, en plural) ἦσαν πρὸ τῶν τειχῶν;<\/li><li>Τίνα ηὗρεν (o εὗρεν) ὁ Δάος ἐν τῇ πόλει;<\/li><li>Τί ἐποίησεν (què va fer) ὁ ἄφρων παῖς ὅτε τὸν δεσπότην εἶδεν;<\/li><li>Ποῦ (on / cap a on) ἔπεσεν ὁ Ξάνθος;<\/li><li>Τί εἶπεν ὁ Ἀλέξανδρος περὶ τῶν τοῦ δούλου λόγων;<\/li><li>Ἆρα ὁ Ἀλέξανδρος τὸν ἄφρονα παῖδα ἔλαβεν;<\/li><\/ul>\n<h4>II. Ἀληθὲς ἢ ψευδές.<\/h4>\n<p><em>Escriu 'Ἀληθές' (Veritable) o 'Ψευδές' (Fals). Si l'afirmació és falsa, corregix-la escrivint l'oració correcta en grec (respectant l'estructura S-C-V).<\/em><\/p>\n<ul><li>Μετὰ τὴν ἡμέραν ἡ νὺξ ἐγένετο.<\/li><li>Αἱ Ἀθῆναι μεγάλη καὶ καλὴ πόλις εἰσίν.<\/li><li>Τὰ τῆς πόλεως τείχη μικρὰ καὶ κακά ἐστιν.<\/li><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος τοὺς ἱππέας εἶδον.<\/li><li>Ὁ Δάος τὸν Ἀλέξανδρον ἐν τῇ πόλει ηὗρεν.<\/li><li>Ὁ Ξάνθος, ὃς ἄφρων δοῦλός ἐστιν, τὸν δεσπότην εἶδεν καὶ εὐθὺς ἔφυγεν.<\/li><li>Ὁ Ξάνθος τὴν τοῦ δεσπότου ὀργὴν οὐκ ἐφοβεῖτο.<\/li><li>Ὁ δεσπότης τὸν δοῦλον οὐκ ἔλαβεν, ἀλλὰ ὁ δοῦλος ἔφυγεν.<\/li><li>Οἱ τοῦ Ξάνθου λόγοι ἀληθεῖς εἰσιν.<\/li><li>Ὁ σώφρων δοῦλος τὸν πόνον οὐ φεύγει.<\/li><\/ul>\n<h4>III. Τίς, τίνα, τίνος…;<\/h4>\n<p><em>Respon a estes preguntes directes amb la paraula exacta del text declinada en el cas corresponent.<\/em><\/p>\n<ul><li>Τί ἐγένετο μετὰ τὴν νύκτα; (_______________)<\/li><li>Ποῖ ἦλθον ὁ δεσπότης καὶ ὁ δοῦλος; (_______________)<\/li><li>Τί ἔχει ἡ μεγάλη πόλις; [els murs segurs] (_______________)<\/li><li>Τίνα ἐζήτει ὁ Ἀλέξανδρος ἐν τῇ πόλει; (_______________)<\/li><li>Τί ἐφοβεῖτο ὁ ἄφρων παῖς; [la ira del senyor] (_______________)<\/li><li>Ποῖ ἔπεσεν ὁ Ξάνθος φεύγων; (_______________)<\/li><li>Τίνα ἔλαβεν ὁ Ἀλέξανδρος; (_______________)<\/li><li>Τίνι εἶπεν ὁ Ξάνθος «ἐλέησόν με»; [al senyor] (_______________)<\/li><li>Τί ἔλιπεν (va abandonar) ὁ κακὸς δοῦλος; (_______________)<\/li><li>Ποῖ ἄξει ὁ Ἀλέξανδρος τὸν δοῦλον; [cap a la nostra aldea] (_______________)<\/li><\/ul>\n<h4>IV. Πλήρου τὰς ὁδούς.<\/h4>\n<p><em>Ompli els buits de les oracions següents deduint la paraula i la seua forma exacta exclusivament a través del context (presta atenció a la tercera declinació i als aorists forts).<\/em><\/p>\n<ul><li>Μετὰ δὲ τὴν νύκτα ἡ _____ ἐγένετο.<\/li><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος πρὸς τὰς _____ ἦλθον.<\/li><li>Ἡ μεγάλη πόλις _____ τείχη ἔχει.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος τοὺς _____ εἶδον καὶ εἰς τὴν πόλιν εἰσῆλθον.<\/li><li>Ὁ ἄφρων παῖς τὸν δεσπότην εἶδεν καὶ _____ ἔφυγεν.<\/li><li>Ὁ Ξάνθος _____ παῖς ἐστιν, ἀλλὰ ὁ Δάος _____ ἐστιν.<\/li><li>Ὁ δὲ Ἀλέξανδρος καὶ ὁ Δάος τὸν παῖδα _____.<\/li><li>Ὁ φεύγων Ξάνθος εἰς τὴν γῆν _____.<\/li><li>Ὁ δὲ Ἀλέξανδρος αὐτὸν (a ell) _____.<\/li><li>Οἱ τοῦ Ξάνθου λόγοι _____ οὐκ εἰσίν, ἀλλὰ _____ εἰσιν.<\/li><\/ul>\n<h4>V. Μεταβολαί.<\/h4>\n<p><em>Exercici A: Ἡ τρίτη κλίσις (De singular a plural i viceversa).<\/em> <em>Canvia els elements de l'oració (subjectes, complements i verbs) de singular a plural, o de plural a singular, parant especial atenció als substantius i adjectius de la 3a declinació (πόλις, τεῖχος, ἱππεύς, ἀσφαλής, ἀληθής, ἄφρων).<\/em><\/p>\n<ul><li>Ἡ πόλις μεγάλη ἐστίν. ➞<\/li><li>Τὸ τεῖχος ἀσφαλές ἐστιν. ➞<\/li><li>Ὁ ἱππεὺς τὸν ἵππον ἔχει. ➞<\/li><li>Ὁ λόγος ἀληθής ἐστιν. ➞<\/li><li>Ὁ δοῦλος ἄφρων ἐστίν. ➞<\/li><\/ul>\n<p><em>Exercici B: Ὁ ἀόριστος χρόνος (L'Aorist d'indicatiu).<\/em> <em>Transforma els verbs (que ara estan en present o imperfet) al temps passat puntual: L'Aorist. Vigila bé si el verb fa l'aorist dèbil (amb -σ-) o si és un aorist fort (canvi d'arrel i desinències temàtiques ο/ε). Recorda posar l'augment!<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος εἰς τὴν πόλιν ἔρχεται (vindre/anar ➞ aorist fort arrel ἐλθ-). ➞<\/li><li>Ὁ ἄφρων παῖς φεύγει (fugir ➞ aorist fort arrel φυγ-). ➞<\/li><li>Ὁ Ἀλέξανδρος τὸν παῖδα διώκει (aorist dèbil sigmàtic). ➞<\/li><li>Ὁ δεσπότης τὸν δοῦλον λαμβάνει (agafar ➞ aorist fort arrel λαβ-). ➞<\/li><li>Ὁ δοῦλος εἰς τὴν γῆν πίπτει (caure ➞ aorist fort arrel πεσ-). ➞<\/li><\/ul>\n<h4>VI. Ποίει προτάσεις.<\/h4>\n<p><em>Conjuguen els verbs (en present o aorist d'indicatiu segons s'indique), declinen els substantius i adjectius i ordenen les paraules per a formar oracions correctes en grec, respectant l'estructura de l'ordo rectus (S-C-V).<\/em><\/p>\n<ul><li>ὁ / Ἀλέξανδρος / πρὸς / ἡ / πόλις / ἔρχομαι (aorist fort).<\/li><li>ἡ / πόλις / ἀσφαλής / τεῖχος / ἔχειν (present).<\/li><li>ὁ / Δάος / ὁ / ἄφρων / δοῦλος / εὑρίσκω (aorist fort).<\/li><li>ὁ / δεσπότης / ὁ / παῖς / λαμβάνω (aorist fort).<\/li><li>οἱ / λόγοι / ἀληθής / οὐ / εἶναι (present).<\/li><\/ul>\n<h4>VII. Ἀνάλυσις καὶ Μετάφρασις.<\/h4>\n<p><em>Analitza sintàcticament i traduïx al valencià les oracions següents extretes del text.<\/em><\/p>\n<ul><li>Ὁ Ἀλέξανδρος καὶ ὁ Δάος πρὸς τὰς Ἀθήνας ἦλθον.<\/li><li>Ἡ πόλις ἀσφαλῆ τείχη ἔχει.<\/li><li>Ὁ δεσπότης καὶ ὁ δοῦλος τοὺς ἱππέας εἶδον καὶ εἰς τὴν πόλιν εἰσῆλθον.<\/li><li>Ξαίφνης ὁ Δάος τὸν ἄφρονα δοῦλον ηὗρεν.<\/li><li>Ὁ ἄφρων παῖς τὸν δεσπότην εἶδεν καὶ εὐθὺς ἔφυγεν.<\/li><li>Ὁ Ξάνθος τὴν τοῦ δεσπότου ὀργὴν ἐφοβεῖτο.<\/li><li>Ὁ Ξάνθος εἰς τὴν γῆν ἔπεσεν καὶ ὁ Ἀλέξανδρος αὐτὸν ἔλαβεν.<\/li><li>Ἐγὼ τὸν ἀγρὸν ἔλιπον, ὅτι τὸν λύκον ἐφοβούμην.<\/li><li>Οἱ σοὶ λόγοι ψευδεῖς εἰσιν, ἀλλὰ ὁ σώφρων δοῦλος ἀληθῆ λέγει.<\/li><li>Οὕτως ὁ Ἀλέξανδρος τὸν δοῦλον ηὗρεν καὶ ἡ τοῦ Ξάνθου φυγὴ ἐπαύσατο.<\/li><\/ul>\n<h4>VIII. Εἰς τὴν Ἑλληνικὴν γλῶτταν.<\/h4>\n<p><em>Traduïx estes oracions al grec clàssic aplicant el vocabulari del Tema 5 i respectant l'estructura S-C-V i l'ortografia politònica. Para atenció espec
