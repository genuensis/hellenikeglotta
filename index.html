a politeista?","o":["Que hi havia una multitud de divinitats amb funcions repartides","Que cada ciutat adorava un únic déu propi que la protegia","Que els homes més virtuosos podien convertir-se en déus","Que hi havia un déu suprem amb uns quants ajudants seus"],"x":"Els dotze olímpics ho mostren: Posidó té la mar; Demèter, els cereals; Hefest, el foc i la metal·lúrgia.","id":"c5-0"},{"t":"mc","q":"Què vol dir que la religió grega era antropomòrfica?","o":["Que els déus tenien forma i caràcter humans","Que els déus podien adoptar forma de qualsevol animal","Que els homes eren creats a imatge i semblança divina","Que els déus vivien barrejats entre els mortals"],"x":"Tenien enveges, favoritismes i enuigs; es diferenciaven dels mortals per la immortalitat i el poder, no per una superioritat moral.","id":"c5-1"},{"t":"mc","q":"Per què en la religió grega no hi havia heretgies?","o":["Perquè no existia una revelació ni una veritat oficial","Perquè els sacerdots castigaven de seguida els dissidents","Perquè tots els grecs adoraven exactament els mateixos déus","Perquè cada mite es transmetia sempre en una única versió"],"x":"No hi havia llibre sagrat ni dogma que es poguera contradir.","id":"c5-2"},{"t":"mc","q":"Qui podia oferir un sacrifici en la religió grega?","o":["Qualsevol cap de família","Només els sacerdots consagrats","Només els magistrats de la polis","Només els homes ja iniciats"],"x":"Els sacerdocis no formaven una casta professional.","id":"c5-3"},{"t":"mc","q":"Què vol dir que la religió grega era cívica?","o":["Cada polis tenia els seus déus protectors i el culte formava part de ser ciutadà","Els sacerdots dirigien la política de la ciutat i nomenaven tots els magistrats","Només els ciutadans de ple dret podien entrar en els temples oficials de la polis","Totes les ciutats gregues compartien un mateix culte oficial estrictament obligatori"],"x":"Per això la impietat era també un delicte contra la comunitat.","id":"c5-4"},{"t":"mc","q":"En què es basava la relació entre l'home i la divinitat?","o":["En un intercanvi: l'home oferix i el déu concedix","En una aliança escrita entre el déu i el poble triat","En la fe personal i en la pregària feta en silenci","En l'obediència a un codi moral revelat pel déu"],"x":"El que s'exigia al fidel no era creure una doctrina, sinó complir els ritus.","id":"c5-5"},{"t":"mc","q":"En quants déus fixa la tradició els grans habitants de l'Olimp?","o":["Dotze","Nou","Set","Vint"],"x":"La tradició fixa este nombre, encara que la composició de la llista pot variar.","id":"c5-6"},{"t":"mc","q":"De què és garant Zeus, a més de ser déu del cel i del llamp?","o":["De l'hospitalitat i dels juraments","De la collita i de l'abundància","Del matrimoni i de la descendència","Dels camins i dels mercats"],"x":"Com a sobirà dels déus, protegia l'hoste i el jurament; el matrimoni era cosa d'Hera, i els camins i els mercaders, d'Hermes.","id":"c5-7"},{"t":"mc","q":"Quins àmbits corresponen a Posidó?","o":["La mar, els terratrémols i els cavalls","Els rius, les fonts i els ramats salvatges","La mar, els vents i els naufragis","Les illes, els ports i els mercaders"],"x":"","id":"c5-8"},{"t":"mc","q":"De què és deessa Atena?","o":["De la saviesa, de l'artesania i de la guerra estratègica","De la justícia, de la profecia i de la guerra defensiva","De la caça, de la metal·lúrgia i de la guerra violenta","De la saviesa, de la medicina i de la guerra naval"],"x":"Va nàixer del cap de Zeus i era la patrona d'Atenes.","id":"c5-9"},{"t":"mc","q":"De quins àmbits és déu Apol·lo?","o":["De la llum, de la música, de la profecia i de la medicina","Del foc, de la dansa, dels ramats i de la fertilitat","Del cel, del llamp, dels juraments i de l'hospitalitat","De la mar, dels vents, dels viatges i del comerç"],"x":"A ell corresponia la profecia: l'oracle de Delfos, on responia la sacerdotessa Pítia, era el seu.","id":"c5-10"},{"t":"mc","q":"Qui era Àrtemis i de què era deessa?","o":["La germana d'Apol·lo, deessa de la caça i dels espais salvatges","L'esposa de Zeus, deessa del matrimoni i de la descendència","La filla de Demèter, deessa dels cereals i de l'agricultura","La germana d'Ares, deessa de l'amor, de la bellesa i de la dansa"],"x":"","id":"c5-11"},{"t":"mc","q":"Quines dos divinitats alternen en les llistes dels dotze olímpics?","o":["Hèstia i Dionís","Hèstia i Demèter","Dionís i Hades","Hades i Hefest"],"x":"La deessa de la llar o el déu del vi, de l'èxtasi i del teatre.","id":"c5-12"},{"t":"mc","q":"Què era, en realitat, un temple grec?","o":["La casa del déu, on es guardaven l'estàtua de culte i les ofrenes","El lloc on es reunien els fidels per a escoltar els sacerdots","L'edifici on el poble votava les decisions religioses de la polis","El recinte on s'enterraven els sacerdots i els ciutadans il·lustres"],"x":"","id":"c5-13"},{"t":"mc","q":"On es feien els ritus del culte?","o":["A l'aire lliure, davant de l'altar exterior","A l'interior del temple, davant de l'estàtua","En criptes subterrànies sota el temple","A les cases particulars dels sacerdots"],"x":"","id":"c5-14"},{"t":"mc","q":"Què s'oferia en les libacions?","o":["Vi, oli o llet","Pa, mel o sal","Aigua, sang o cendra","Gra, incens o fruita"],"x":"També s'oferien pastissos i, en les grans ocasions, animals.","id":"c5-15"},{"t":"mc","q":"Què es feia amb la víctima animal del sacrifici?","o":["Se'n cremava una part per al déu i la resta es repartia i es menjava","Es cremava sencera sobre l'altar davant de tota la comunitat reunida","S'oferia viva al déu i es deixava en llibertat dins del recinte sagrat","Es lliurava sencera als sacerdots, que després la venien al mercat"],"x":"El sacrifici era, per tant, també un àpat col·lectiu.","id":"c5-16"},{"t":"mc","q":"Quina festa atenesa incloïa una processó i el lliurament d'un peple nou a la deessa?","o":["Les Panatenees","Les Grans Dionísies","Els misteris d'Eleusis","Els jocs d'Olímpia"],"x":"Se celebraven en honor d'Atena i incloïen també competicions.","id":"c5-17"},{"t":"mc","q":"Què es representava en les Grans Dionísies?","o":["Tragèdies i comèdies","Curses de carros","Concursos de rapsodes","Processons amb ofrenes"],"x":"","id":"c5-18"},{"t":"mc","q":"Què es proclamava durant els jocs dels grans santuaris?","o":["Una treva sagrada","Una amnistia general","Una lleva obligatòria","Una nova aliança"],"x":"Els santuaris panhel·lènics eren els que atreien grecs de tot arreu.","id":"c5-19"},{"t":"mc","q":"Què oferien els cultes mistèrics al costat del culte oficial?","o":["Una experiència més íntima i una esperança de salvació","Un calendari de festes i unes competicions esportives","Un sacerdoci professional i una doctrina posada per escrit","Una protecció oficial de la polis i dels seus magistrats"],"x":"","id":"c5-20"},{"t":"mc","q":"Com estaven protegits els ritus dels misteris d'Eleusis?","o":["Per un secret rigorós","Per un mur i una guàrdia armada","Per un jurament dels sacerdots","Per una prohibició de l'oracle"],"x":"","id":"c5-21"},{"t":"mc","q":"Què predicava l'orfisme?","o":["La puresa, l'abstinència i la transmigració de les ànimes","L'èxtasi col·lectiu, la dansa i el trencament de les normes","El sacrifici animal, el banquet comú i la treva sagrada","La consulta de l'oracle, el silenci ritual i la iniciació"],"x":"","id":"c5-22"},{"t":"mc","q":"Què incloïa el culte a Dionís?","o":["Formes d'èxtasi col·lectiu que trencaven momentàniament les normes socials","Un secret rigorós que protegia els ritus dels iniciats i de les iniciades","Una abstinència estricta i una vida sencera de puresa i de contenció ritual","Una processó cívica amb competicions, ofrenes i grans sacrificis d'animals"],"x":"","id":"c5-23"},{"t":"mc","q":"Segons els poemes homèrics, quin és el destí dels morts?","o":["Una existència d'ombres sense consciència plena","Un premi o un càstig segons la conducta en vida","Una nova vida dins d'un cos completament diferent","Un banquet etern al costat dels déus de l'Olimp"],"x":"Les ànimes descendixen a l'Hades, un regne subterrani gens envejable.","id":"c5-24"},{"t":"mc","q":"Què li passava a l'ànima del difunt que no era enterrat amb els ritus deguts?","o":["Vagava sense repòs","Tornava a nàixer en un altre cos","Era jutjada immediatament","Baixava directament al Tàrtar"],"x":"","id":"c5-25"},{"t":"mc","q":"Quins rius de l'Hades va fixar la tradició posterior?","o":["L'Estix i l'Aqueront","L'Alfeu i l'Eurotes","El Meandre i l'Hermos","L'Ilissos i el Cefís"],"x":"","id":"c5-26"},{"t":"mc","q":"Quants jutges assignaven el destí de cada difunt?","o":["Tres","Dos","Nou","Dotze"],"x":"Els justos anaven als Camps Elisis i els grans criminals al Tàrtar.","id":"c5-27"},{"t":"mc","q":"Què va reforçar la idea de premi i càstig després de la mort?","o":["Els misteris i la filosofia","Els oracles i les festes cíviques","Els poemes homèrics i l'èpica","Els sacrificis i les libacions"],"x":"Va anar guanyant pes al llarg de l'època clàssica.","id":"c5-28"},{"t":"mc","q":"Com es definix un mite?","o":["Com un relat tradicional, anònim i transmés oralment","Com un poema d'autor conegut escrit per a les festes","Com una crònica històrica conservada pels sacerdots","Com un text sagrat fixat per l'autoritat de la polis"],"x":"","id":"c5-29"},{"t":"mc","q":"Què explica el mite?","o":["L'origen del món, dels déus i dels homes","El calendari de les festes de cada polis","Les lleis i els costums de cada ciutat","La successió dels reis més antics de Grècia"],"x":"A més, dona sentit a institucions, rituals i llocs.","id":"c5-30"},{"t":"mc","q":"Quina relació té el mite amb la història?","o":["Sovint conserva el record deformat de fets antics","Reproduïx amb exactitud els fets més antics de Grècia","No té cap mena de relació amb els fets del passat","Va ser escrit pels historiadors per a explicar el passat"],"x":"No és una crònica històrica, però tampoc no n'és del tot independent.","id":"c5-31"},{"t":"mc","q":"Quina és una característica pròpia del mite?","o":["La flexibilitat: un mateix mite té versions diferents","La fixesa: cada mite té una sola versió autoritzada i oficial","L'anonimat: cap mite no s'atribuïx a cap autor conegut","La brevetat: cada mite es limita a un únic episodi breu"],"x":"Les versions canvien segons l'època, la ciutat i l'autor.","id":"c5-32"},{"t":"mc","q":"Qui va donar la versió més influent de la cosmogonia i la teogonia gregues?","o":["Hesíode","Homer","Orfeu","Heròdot"],"x":"","id":"c5-33"},{"t":"mc","q":"Qui va salvar Zeus de ser devorat pel seu pare?","o":["Rea","Gea","Hera","Demèter"],"x":"Cronos, que havia destronat Urà, devorava els seus fills; gràcies a Rea, Zeus va poder véncer-lo ja adult.","id":"c5-34"},{"t":"mc","q":"Qui era Pandora i què portava?","o":["La primera dona, amb la gerra dels mals","La mare dels titans, amb el foc robat","La primera sacerdotessa, amb l'aigua pura","L'esposa de Prometeu, amb el velló d'or"],"x":"Zeus la va enviar com a part del càstig pel robatori del foc.","id":"c5-35"},{"t":"mc","q":"Quantes edats de la humanitat narra Hesíode i quina és l'última?","o":["Cinc edats, l'última de ferro","Quatre edats, l'última de bronze","Tres edats, l'última dels herois","Cinc edats, l'última de plata"],"x":"D'or, de plata, de bronze, dels herois i de ferro: una degradació progressiva.","id":"c5-36"},{"t":"mc","q":"Qui se salva del diluvi en la tradició grega?","o":["Deucalió i Pirra","Cadme i Harmonia","Jàson i Medea","Perseu i Andròmeda"],"x":"","id":"c5-37"},{"t":"mc","q":"Amb quin criteri s'agrupen els mites d'herois en cicles?","o":["Segons la regió a què estan vinculats","Segons l'època en què van viure els herois","Segons el déu que protegia cada heroi","Segons l'autor que els va posar per escrit"],"x":"","id":"c5-38"},{"t":"mc","q":"Quin heroi del cicle argòlic mata la Medusa?","o":["Perseu","Hèracles","Teseu","Cadme"],"x":"","id":"c5-39"},{"t":"mc","q":"Per què Hèracles és l'heroi panhel·lènic per excel·lència?","o":["Perquè el seu cicle és comú a tot el món grec i acaba amb la seua divinització","Perquè és l'únic heroi que apareix en tots els poemes conservats d'Hesíode","Perquè va fundar les ciutats més importants de tota la Grècia continental","Perquè va ser l'únic heroi que va combatre a Troia i en va tornar amb vida"],"x":"El seu cicle inclou els dotze treballs.","id":"c5-40"},{"t":"mc","q":"Quins episodis formen el cicle troià?","o":["El rapte d'Hèlena, els deu anys de setge, la còlera d'Aquil·les i el cavall","La fundació de Tebes, la història d'Èdip i el conflicte dels seus dos fills","L'expedició a la Còlquida, la conquista del velló d'or i la fugida de Medea","La victòria sobre el Minotaure i la unificació mítica de tota la regió de l'Àtica"],"x":"El retorn dels herois inclou el viatge d'Odisseu, l'episodi més cèlebre.","id":"c5-41"},{"t":"mc","q":"Durant quant de temps han sigut els mites matèria primera de la literatura i de l'art?","o":["Durant més de dos mil·lennis","Durant tota l'època clàssica","Durant prop de cinc segles","Durant tot el segle passat"],"x":"De la pintura i l'escultura antigues fins a l'òpera i el cinema.","id":"c5-42"},{"t":"mc","q":"Quina expressió cita el tema com a prova de la pervivència del mite?","o":["«Caixa de Pandora»","«Espasa de Dàmocles»","«Creuar el Rubicó»","«Nus gordià»"],"x":"Junt amb «taló d'Aquil·les», «complex d'Èdip» o «treball d'Hèrcules».","id":"c5-43"},{"t":"tf","q":"La religió grega no tenia ni llibre sagrat ni dogma.","a":true,"x":"Per això no existien ni una veritat oficial ni les heretgies.","id":"c5-44"},{"t":"tf","q":"El temple grec era el lloc on es reunien els fidels per a celebrar el culte.","a":false,"x":"Era la casa del déu: guardava l'estàtua i les ofrenes, i els ritus es feien fora, davant de l'altar.","id":"c5-45"},{"t":"tf","q":"Els sacerdocis grecs eren càrrecs professionals reservats a una casta hereditària.","a":false,"x":"Solien ser càrrecs cívics, temporals i sovint sortejats.","id":"c5-46"},{"t":"tf","q":"La impietat es considerava un assumpte privat que no afectava la comunitat.","a":false,"x":"Era un delicte contra la ciutat, perquè el culte formava part de ser ciutadà.","id":"c5-47"},{"t":"tf","q":"Els misteris d'Eleusis admetien homes i dones, lliures i esclaus.","a":true,"x":"Al costat del culte oficial, oferien una experiència més íntima i prometien un destí millor després de la mort a tots els iniciats, sense distinció de sexe ni de condició.","id":"c5-48"},{"t":"tf","q":"Hades era un dels dotze déus que habitaven l'Olimp.","a":false,"x":"El senyor del món subterrani quedava fora de la llista olímpica.","id":"c5-49"},{"t":"tf","q":"En els poemes homèrics els justos ja rebien un premi després de la mort.","a":false,"x":"Allí totes les ànimes porten una existència d'ombres; el premi i el càstig són una idea posterior.","id":"c5-50"},{"t":"in","q":"Com s'anomenava la sacerdotessa que responia les consultes de l'oracle de Delfos?","ans":"Pítia","acc":["pitia","pítia","la pitia","la pítia","pythia","pitonissa"],"x":"Responia consultes de particulars i de ciutats senceres.","id":"c5-51"},{"t":"in","q":"Quina moneda cobrava Caront per travessar els rius de l'Hades?","ans":"òbol","acc":["obol","òbol","un obol","un òbol","obolo","óbol"],"x":"","id":"c5-52"},{"t":"in","q":"Quin vestit nou es lliurava a Atena durant les Panatenees?","ans":"peple","acc":["peple","peplo","un peple","el peple","peplos"],"x":"","id":"c5-53"},{"t":"in","q":"Quin corrent religiós predicava la puresa, l'abstinència i la transmigració de les ànimes?","ans":"orfisme","acc":["orfisme","l'orfisme","orfismo","orfic","òrfic"],"x":"","id":"c5-54"},{"t":"in","q":"Quin titan roba el foc per als homes i enganya Zeus en el repartiment del sacrifici?","ans":"Prometeu","acc":["prometeu","prometeo","prometheus","prometheu"],"x":"El seu càstig va ser el suplici i l'enviament de Pandora als homes.","id":"c5-55"},{"t":"ord","q":"Ordena la successió divina segons la cosmogonia d'Hesíode:","items":["Al principi hi ha el Caos","Apareix Gea, la Terra, que engendra Urà, el Cel","De la unió dels dos naixen els Titans i Cronos destrona el pare","Zeus venç Cronos i els Titans i establix l'ordre olímpic"],"x":"Rea havia salvat Zeus de ser devorat pel seu pare.","id":"c5-56"},{"t":"ord","q":"Ordena els episodis del mite de Prometeu:","items":["Prometeu enganya Zeus en el repartiment del sacrifici","Prometeu roba el foc i el dona als homes","Zeus castiga el titan amb el suplici","Zeus envia Pandora amb la gerra dels mals"],"x":"","id":"c5-57"},{"t":"ord","q":"Ordena els passos d'un sacrifici grec:","items":["Els fidels es reunixen davant de l'altar, a l'exterior del temple","S'ofereixen libacions de vi, oli o llet i pastissos","Es crema una part de la víctima per al déu","La resta es repartix i es menja en comunitat"],"x":"El sacrifici era alhora una ofrena i un àpat col·lectiu.","id":"c5-58"},{"t":"ord","q":"Ordena el recorregut del difunt segons la tradició posterior:","items":["Els seus reben el cos i li fan els ritus funeraris deguts","Caront li cobra un òbol per a travessar els rius","Cèrber guarda l'entrada del regne subterrani","Tres jutges li assignen els Camps Elisis o el Tàrtar"],"x":"Sense enterrament, l'ànima vagava sense repòs.","id":"c5-59"},{"t":"mat","q":"Emparella cada déu amb el seu àmbit:","pairs":[["Demèter","Els cereals i l'agricultura"],["Hefest","El foc i la metal·lúrgia"],["Ares","La guerra en el seu vessant violent"],["Hermes","Els camins, els comerciants i els lladres"]],"x":"","id":"c5-60"},{"t":"mat","q":"Emparella cada santuari amb el que s'hi feia:","pairs":[["Olímpia","El gran santuari consagrat a Zeus"],["Delfos","L'oracle d'Apol·lo que responia la Pítia"],["Dodona","Un oracle famós de Zeus"],["Eleusis","Els misteris de Demèter i Persèfone"]],"x":"","id":"c5-61"},{"t":"mat","q":"Emparella cada cicle heroic amb la seua figura principal:","pairs":[["Cicle argòlic","Hèracles i els dotze treballs"],["Cicle tebà","Èdip i la seua filla Antígona"],["Cicle argonàutic","Jàson a la recerca del velló d'or"],["Cicle àtic","Teseu, vencedor del Minotaure"]],"x":"","id":"c5-62"},{"t":"mat","q":"Emparella cada element de l'Hades amb la seua funció:","pairs":[["Caront","El barquer que cobra un òbol"],["Cèrber","El gos que guarda el regne"],["Camps Elisis","El destí reservat als justos"],["Tàrtar","El destí dels grans criminals"]],"x":"","id":"c5-63"}],"6":[{"t":"mc","q":"Quina és la distinció fonamental dins de la societat grega?","o":["La que separa els lliures dels esclaus","La que separa els rics dels pobres de la ciutat","La que separa els grecs dels bàrbars estrangers","La que separa la gent del camp de la de la ciutat"],"x":"Cap ciutat grega no va conéixer la igualtat entre tots els seus habitants.","id":"c6-0"},{"t":"mc","q":"Quina diferència hi havia entre els ciutadans i els estrangers residents?","o":["Els ciutadans tenien drets polítics plens i els estrangers en quedaven exclosos","Els ciutadans vivien a la ciutat i els estrangers en les terres del voltant","Els ciutadans podien casar-se lliurement i els estrangers ho tenien prohibit","Els ciutadans havien nascut a la polis i els estrangers hi havien sigut comprats"],"x":"Tots dos grups eren lliures, però només uns tenien veu en la vida política.","id":"c6-1"},{"t":"mc","q":"Quin filòsof va justificar l'esclavitud com una condició natural?","o":["Aristòtil","Protàgores","Sòcrates","Plató"],"x":"La desigualtat no era percebuda com una anomalia pels mateixos grecs.","id":"c6-2"},{"t":"mc","q":"Quina era la situació política de les dones filles i esposes de ciutadans?","o":["No participaven en la vida política de cap polis","Votaven en l'assemblea però no podien ser magistrades","Tenien drets polítics només en les ciutats democràtiques","Participaven en la vida política a través del seu patró"],"x":"La ciutadania es transmetia també per elles —després de la llei de Pèricles calia ser fill de mare filla de ciutadà—, però això no els donava cap dret polític.","id":"c6-3"},{"t":"mc","q":"Qui era ciutadà atenés després de la llei de Pèricles?","o":["L'home nascut de pare ciutadà i de mare filla de ciutadà","L'home nascut a l'Àtica de pare lliure i de mare lliure","L'home que posseïa terra a l'Àtica i pagava els impostos","L'home inscrit en un demos que servia en l'exèrcit atenés"],"x":"Abans n'hi havia prou amb ser fill de pare ciutadà.","id":"c6-4"},{"t":"mc","q":"De quin any és la llei de Pèricles sobre la ciutadania?","o":["Del 451 aC","Del 431 aC","Del 480 aC","Del 404 aC"],"x":"","id":"c6-5"},{"t":"mc","q":"Quina edat calia tindre per a formar part del consell i dels tribunals?","o":["Trenta anys","Vint anys","Díhuit anys","Quaranta anys"],"x":"Als vint ja es podia assistir a l'assemblea.","id":"c6-6"},{"t":"mc","q":"Quins drets tenia el ciutadà atenés?","o":["Votar, ocupar magistratures, posseir terra i acudir als tribunals","Votar, cobrar un sou, viatjar lliurement i heretar de la seua mare","Elegir el seu demos, pagar menys impostos i no fer el servei militar","Comerciar sense taxes, tindre esclaus públics i exercir de patró"],"x":"","id":"c6-7"},{"t":"mc","q":"A canvi dels seus drets, què havia de fer el ciutadà atenés?","o":["Servir en l'exèrcit i contribuir als costos públics","Pagar un impost específic i buscar-se un ciutadà com a patró","Lliurar una part de la collita anual a l'Estat","Participar en els àpats col·lectius de la ciutat"],"x":"","id":"c6-8"},{"t":"mc","q":"Quina proporció de la població d'Atenes formaven els ciutadans adults masculins al segle V aC?","o":["Uns 40.000 sobre unes 300.000 persones","Uns 150.000 sobre unes 300.000 persones","Uns 40.000 sobre unes 60.000 persones","Uns 5.000 sobre unes 300.000 persones"],"x":"Eren, doncs, una minoria del total dels habitants.","id":"c6-9"},{"t":"mc","q":"Què necessitava un metec per a actuar davant dels tribunals?","o":["Un ciutadà que en fera de patró","Un permís especial de l'assemblea","Un any de residència a la ciutat","Un lot de terra inscrit al seu nom"],"x":"A més, pagava un impost específic i servia en l'exèrcit.","id":"c6-10"},{"t":"mc","q":"En quines activitats tenien els metecs un pes considerable?","o":["Com a artesans, comerciants i banquers","Com a mestres, sacerdots i endevins de la ciutat","Com a mariners, remers i pescadors del port","Com a jutges, escrivans i policies"],"x":"Eren estrangers lliures, molts d'ells grecs d'altres poleis, que no podien posseir terra a l'Àtica.","id":"c6-11"},{"t":"mc","q":"Per quines vies es podia arribar a ser esclau?","o":["Per naixement, per captura en guerra, per pirateria o per compra","Per naixement, per deutes, per desterrament o per condemna","Per condemna judicial, per herència, per pobresa o per abandonament","Per traïció, per conquista, per matrimoni o per malaltia greu"],"x":"","id":"c6-12"},{"t":"mc","q":"On treballaven els esclaus en les condicions més dures?","o":["En les mines de plata del Làurion","En els tallers d'artesania del Ceràmic","En els vaixells de guerra del Pireu","En les terres comunals de l'Àtica"],"x":"També treballaven en el camp, en els tallers i en el servei domèstic.","id":"c6-13"},{"t":"mc","q":"Quines tasques feien els esclaus públics d'Atenes?","o":["Tasques administratives o de policia","Tasques de sacerdoci o d'endevinació","Tasques d'ensenyament o de medicina","Tasques de govern o de judicatura"],"x":"","id":"c6-14"},{"t":"mc","q":"Què rebia cada hòmoios i a què estava obligat?","o":["Rebia un lot de terra i havia de contribuir als àpats col·lectius","Rebia un sou de l'Estat i havia de mantindre un cavall de guerra","Rebia una casa a Lacònia i havia de pagar un impost sobre la collita","Rebia un taller d'artesania i havia de lliurar-ne part dels guanys"],"x":"","id":"c6-15"},{"t":"mc","q":"Què li passava a l'espartà que no podia contribuir als àpats col·lectius?","o":["Perdia la condició de ciutadà","Perdia el lot de terra però seguia sent ciutadà","Passava a ser periec de Lacònia","Havia de servir un any més en l'exèrcit"],"x":"","id":"c6-16"},{"t":"mc","q":"Quina era l'única ocupació dels hòmoioi?","o":["La guerra","El comerç","L'artesania","L'agricultura"],"x":"No exercien ni artesania ni comerç: eren els «iguals», ciutadans de ple dret.","id":"c6-17"},{"t":"mc","q":"Què havien de lliurar els hilotes?","o":["Una part de la collita","Un impost anual en plata","La meitat del bestiar","Un fill per a l'exèrcit"],"x":"Estaven adscrits a les terres dels ciutadans espartans.","id":"c6-18"},{"t":"mc","q":"De quin territori procedia sobretot la població hilota?","o":["De Messènia","De la Tessàlia","De Lacònia","De l'Àtica"],"x":"","id":"c6-19"},{"t":"mc","q":"Què explica la militarització permanent d'Esparta?","o":["Que els hilotes eren molt més nombrosos que els espartans","Que els periecs es revoltaven contra els hòmoioi cada any","Que la ciutat no tenia muralles ni cap defensa natural","Que els hòmoioi vivien lluny de les seues terres de cultiu"],"x":"","id":"c6-20"},{"t":"mc","q":"Què era el matrimoni grec?","o":["Un pacte entre famílies negociat pel pare de la núvia","Una elecció personal ratificada davant dels tribunals","Un contracte inscrit en el registre del demos","Un acte religiós celebrat pel sacerdot del barri"],"x":"","id":"c6-21"},{"t":"mc","q":"Què passava amb la dot si el matrimoni es dissolia?","o":["S'havia de tornar","Es quedava al marit","Passava a l'Estat","Es repartia entre els fills"],"x":"La dot acompanyava la dona i la protegia econòmicament.","id":"c6-22"},{"t":"mc","q":"Quin era l'objectiu declarat del matrimoni grec?","o":["La procreació de fills legítims que continuaren l'oîkos i el culte als avantpassats","L'aliança política entre dos famílies influents de la mateixa polis i del mateix demos","La unió de dos patrimonis familiars per a formar una hisenda més gran i més rendible","La protecció jurídica de la dona, que passava a dependre del seu marit i dels fills"],"x":"","id":"c6-23"},{"t":"mc","q":"A quina edat es casaven sovint les xiques gregues?","o":["Cap als quinze anys","Cap als vint anys","Cap als díhuit anys","Cap als trenta anys"],"x":"Els marits en podien tindre trenta.","id":"c6-24"},{"t":"mc","q":"Com era l'habitatge urbà grec?","o":["Senzill, de tova i fusta, organitzat al voltant d'un pati","Ampli, de pedra i marbre, organitzat al voltant d'un jardí","Alt, de rajola i teula, organitzat al voltant d'una escala","Baix, de fusta i palla, organitzat al voltant d'una llar de foc"],"x":"","id":"c6-25"},{"t":"mc","q":"Quina condició jurídica tenia la dona a Atenes?","o":["Era menor d'edat tota la vida","Era major d'edat a partir del matrimoni","Era ciutadana sense drets polítics","Era lliure però sotmesa a un patró"],"x":"Passava de la tutela del pare a la del marit.","id":"c6-26"},{"t":"mc","q":"Quina era la funció reconeguda de la dona atenesa?","o":["Administrar la casa, filar i teixir, i educar els fills xicotets","Assistir als banquets, recitar poesia i cantar en els cors de la ciutat","Vendre en el mercat, cuidar el bestiar i portar els comptes de la casa","Cultivar l'hort familiar, moldre el gra i pastar el pa per a la família"],"x":"","id":"c6-27"},{"t":"mc","q":"En quin terreny s'admetia sobretot la presència pública de la dona?","o":["En el terreny religiós","En el terreny judicial","En el terreny comercial","En el terreny militar"],"x":"Hi havia sacerdotesses, processons i festes exclusivament femenines, com les Tesmofòries.","id":"c6-28"},{"t":"mc","q":"Per què les espartanes administraven les propietats?","o":["Perquè els homes vivien en règim militar","Perquè els homes no sabien llegir ni escriure","Perquè les terres eren propietat de l'Estat","Perquè els hilotes es negaven a obeir els hòmoioi"],"x":"A més d'administrar les propietats, les espartanes podien heretar-les.","id":"c6-29"},{"t":"mc","q":"Per què feien exercici físic les xiques espartanes?","o":["Perquè es considerava que així tindrien fills més forts","Perquè havien de combatre al costat dels seus marits en la guerra","Perquè els jocs religiosos de la ciutat les hi obligaven cada any","Perquè així podien substituir els homes en les feines del camp"],"x":"La formació física de les xiquetes formava part de l'educació espartana, controlada per l'Estat; els altres grecs veien amb escàndol la llibertat de les espartanes.","id":"c6-30"},{"t":"mc","q":"Qui eren les heteres?","o":["Dones sovint estrangeres i cultivades que participaven en banquets i reunions","Dones lliures que administraven els tallers i els negocis del seu marit difunt","Dones que exercien de sacerdotesses en els grans santuaris de la seua ciutat","Dones espartanes que heretaven i gestionaven les terres de la seua família"],"x":"Les esposes en quedaven excloses. Aspàsia, companya de Pèricles, n'és el cas més conegut.","id":"c6-31"},{"t":"mc","q":"Quina poetessa esmenta el tema com a veu femenina de primer nivell?","o":["Safo de Lesbos","Aspàsia de Milet","Diotima de Mantinea","Corinna de Tanagra"],"x":"","id":"c6-32"},{"t":"mc","q":"Com era l'educació a Esparta?","o":["Pública, obligatòria i controlada per l'Estat","Privada, voluntària i pagada per les famílies","Pública, voluntària i dirigida pels sacerdots","Privada, obligatòria i vigilada pels magistrats"],"x":"","id":"c6-33"},{"t":"mc","q":"A què es limitava la instrucció intel·lectual a Esparta?","o":["A la lectura, l'escriptura, el cant coral i la poesia patriòtica","Al càlcul, la geometria, la retòrica i la poesia d'Homer","A la lectura, la música, l'astronomia i la filosofia natural","A l'escriptura, el dibuix, la medicina i la història de la ciutat"],"x":"L'ideal era formar un soldat obedient.","id":"c6-34"},{"t":"mc","q":"Com era l'educació a Atenes?","o":["Privada i de pagament","Pública i gratuïta","Obligatòria i estatal","Religiosa i col·lectiva"],"x":"De fet, quedava reservada a les famílies benestants.","id":"c6-35"},{"t":"mc","q":"Què era l'efebia?","o":["Un servei militar de dos anys que començava als díhuit","Una escola de retòrica que durava dos anys i acabava als vint","Una festa d'iniciació dels jóvens de díhuit anys","Un registre on s'inscrivien els
