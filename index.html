omèrics, la publicació de les lleis en pedra o el debat polític de la democràcia. D'eixe alfabet grec deriven, a través de l'etrusc i el llatí, les lletres amb què està escrit este text.<\/p>\n<h4>6. Del mite a l'arqueologia<\/h4>\n<p>Durant segles, Minos, Micenes o Troia van ser considerats només literatura. Les excavacions de Schliemann a Troia i Micenes (dècades de 1870 i 1880), les d'Arthur Evans a Cnossos (a partir del 1900) i el desxiframent del lineal B van demostrar que darrere dels relats hi havia un fons històric real. El mite grec no és una crònica, però conserva la memòria deformada d'un passat que l'arqueologia ha pogut recuperar.<\/p>","gram":"<h3>Els fonaments del grec antic. Lletres, sons i pronúncia<\/h3>\n<p>L'objectiu d'este primer tema és familiaritzar-nos amb l'escriptura i la pronúncia del grec antic. A diferència del llatí o del valencià, el grec utilitza un alfabet propi que va servir de base per a altres alfabets moderns, com el llatí o el ciríl·lic. En esta primera fase no estudiarem declinacions ni flexió verbal; ens centrarem únicament a reconéixer les lletres, llegir amb fluïdesa, pronunciar correctament i familiaritzar-nos amb els primers diàlegs bàsics per a poder comunicar-nos a l'aula des del primer dia.<\/p>\n<h4>1. L'alfabet grec: minúscules, majúscules i transcripció<\/h4>\n<p>L'alfabet grec clàssic consta de 24 lletres. Cal dominar-les tant en la seua forma majúscula com minúscula. A continuació, presentem la llista completa amb la seua transcripció al nostre alfabet i la pronúncia recomanada per a la classe.<\/p>\n<div class=\"tw\"><table><tr><td>Majúscula<\/td><td>Minúscula<\/td><td>Nom de la lletra<\/td><td>Transcripció<\/td><td>Pronúncia pràctica<\/td><\/tr><tr><td>Α<\/td><td>α<\/td><td>Alfa<\/td><td>a<\/td><td>Com la \"a\" en valencià<\/td><\/tr><tr><td>Β<\/td><td>β<\/td><td>Beta<\/td><td>b<\/td><td>Com la \"b\"<\/td><\/tr><tr><td>Γ<\/td><td>γ<\/td><td>Gamma<\/td><td>g<\/td><td>Sempre suau (ga, gue, gui, go, gu)<\/td><\/tr><tr><td>Δ<\/td><td>δ<\/td><td>Delta<\/td><td>d<\/td><td>Com la \"d\"<\/td><\/tr><tr><td>Ε<\/td><td>ε<\/td><td>Èpsilon<\/td><td>e<\/td><td>\"e\" breu i tancada<\/td><\/tr><tr><td>Ζ<\/td><td>ζ<\/td><td>Zeta<\/td><td>z<\/td><td>So doble, com \"ds\" o \"zd\"<\/td><\/tr><tr><td>Η<\/td><td>η<\/td><td>Eta<\/td><td>e<\/td><td>\"e\" llarga i oberta<\/td><\/tr><tr><td>Θ<\/td><td>θ<\/td><td>Theta<\/td><td>th<\/td><td>Com la \"z\" castellana o \"th\" anglesa<\/td><\/tr><tr><td>Ι<\/td><td>ι<\/td><td>Iota<\/td><td>i<\/td><td>Com la \"i\"<\/td><\/tr><tr><td>Κ<\/td><td>κ<\/td><td>Kappa<\/td><td>k, c<\/td><td>Sempre forta (ca, que, qui, co, cu)<\/td><\/tr><tr><td>Λ<\/td><td>λ<\/td><td>Lambda<\/td><td>l<\/td><td>Com la \"l\"<\/td><\/tr><tr><td>Μ<\/td><td>μ<\/td><td>Mi<\/td><td>m<\/td><td>Com la \"m\"<\/td><\/tr><tr><td>Ν<\/td><td>ν<\/td><td>Ni<\/td><td>n<\/td><td>Com la \"n\"<\/td><\/tr><tr><td>Ξ<\/td><td>ξ<\/td><td>Ksi (Xi)<\/td><td>x<\/td><td>So doble, com \"ks\" o la \"x\" de taxi<\/td><\/tr><tr><td>Ο<\/td><td>ο<\/td><td>Òmicron<\/td><td>o<\/td><td>\"o\" breu i tancada<\/td><\/tr><tr><td>Π<\/td><td>π<\/td><td>Pi<\/td><td>p<\/td><td>Com la \"p\"<\/td><\/tr><tr><td>Ρ<\/td><td>ρ<\/td><td>Ro<\/td><td>r<\/td><td>Com la \"r\" forta si va a l'inici, suau al mig<\/td><\/tr><tr><td>Σ<\/td><td>σ, ς<\/td><td>Sigma<\/td><td>s<\/td><td>Sorda. La \"ς\" només s'usa a final de paraula<\/td><\/tr><tr><td>Τ<\/td><td>τ<\/td><td>Tau<\/td><td>t<\/td><td>Com la \"t\"<\/td><\/tr><tr><td>Υ<\/td><td>υ<\/td><td>Ípsilon<\/td><td>y, u<\/td><td>Com la \"u\" francesa o la \"ü\" alemanya<\/td><\/tr><tr><td>Φ<\/td><td>φ<\/td><td>Fi<\/td><td>ph, f<\/td><td>Com la \"f\"<\/td><\/tr><tr><td>Χ<\/td><td>χ<\/td><td>Khi (Chi)<\/td><td>ch<\/td><td>Com la \"j\" castellana o \"ch\" alemanya<\/td><\/tr><tr><td>Ψ<\/td><td>ψ<\/td><td>Psi<\/td><td>ps<\/td><td>So doble, com \"ps\" a psicologia<\/td><\/tr><tr><td>Ω<\/td><td>ω<\/td><td>Omega<\/td><td>o<\/td><td>\"o\" llarga i oberta<\/td><\/tr><\/table><\/div>\n<h4>2. Classificació dels sons<\/h4>\n<p><strong>Vocals i diftongs<\/strong><\/p>\n<p>El grec antic distingix la quantitat de les vocals, és a dir, la durada amb què es pronuncien. Esta diferència és molt important per a comprendre les regles d'accentuació posteriors.<\/p>\n<ul><li>Sempre breus: ε, ο<\/li><li>Sempre llargues: η, ω<\/li><li>Indiferents (ancípits): α, ι, υ (poden ser breus o llargues depenent de la paraula).<\/li><\/ul>\n<p>Els diftongs són la unió de dues vocals en una mateixa síl·laba.<\/p>\n<ul><li><strong>Diftongs propis:<\/strong> Es formen unint una vocal forta (α, ε, ο) amb una de feble (ι, υ). Són αι, ει, οι, αυ, ευ, ου. El diftong \"ου\" es pronuncia com una \"u\" normal.<\/li><li><strong>Diftongs impropis:<\/strong> Es formen quan una vocal llarga (α, η, ω) s'unix amb una iota. En estos casos, la iota no es pronuncia i s'escriu baixet de la lletra; és el que anomenem iota subscrita (ᾳ, ῃ, ῳ). Si la paraula s'escriu en majúscula, la iota es posa al costat (Aι, Hι, Ωι) i s'anomena iota adscrita, però tampoc es pronuncia.<\/li><\/ul>\n<p><strong>Consonants<\/strong><\/p>\n<p>El grup consonàntic més important per a la morfologia que estudiarem en els pròxims temes és el de les consonants oclusives. Es classifiquen segons el punt d'articulació i la sonoritat:<\/p>\n<div class=\"tw\"><table><tr><td>Tipus (Punt d'articulació)<\/td><td>Sordes<\/td><td>Sonores<\/td><td>Aspirades<\/td><\/tr><tr><td>Labials (pels llavis)<\/td><td>π (pi)<\/td><td>β (beta)<\/td><td>φ (fi)<\/td><\/tr><tr><td>Dentals (per les dents)<\/td><td>τ (tau)<\/td><td>δ (delta)<\/td><td>θ (theta)<\/td><\/tr><tr><td>Guturals (des de la gola)<\/td><td>κ (kappa)<\/td><td>γ (gamma)<\/td><td>χ (khi)<\/td><\/tr><\/table><\/div>\n<p>La resta de consonants es dividixen en:<\/p>\n<ul><li>Líquides: λ, ρ<\/li><li>Nasals: μ, ν (i la γ quan va davant d'una altra gutural: ἄγγελος es llig \"ánguelos\").<\/li><li>Sibilant: σ, ς<\/li><li>Dobles: ζ (δ+σ), ξ (κ+σ), ψ (π+σ)<\/li><\/ul>\n<h4>3. Signes ortogràfics i de lectura<\/h4>\n<p><strong>Els Esperits<\/strong><\/p>\n<p>En grec, tota paraula que comença per vocal o diftong ha de dur un signe diacrític sobre la lletra inicial anomenat esperit. També el porta la lletra \"ρ\" inicial.<\/p>\n<ul><li><strong>Esperit suau ( ᾿ ):<\/strong> Té la forma d'una coma menudeta mirant cap a l'esquerra (ex. ἀνήρ). No es pronuncia.<\/li><li><strong>Esperit aspre ( ῾ ):<\/strong> Té la forma d'una coma mirant cap a la dreta (ex. ἵππος). Es pronuncia com una aspiració suau, semblant a la \"h\" de house en anglés. La \"ρ\" inicial sempre porta esperit aspre (ex. ῥήτωρ).<\/li><\/ul>\n<p>Si la paraula comença per diftong, l'esperit s'escriu sobre la segona vocal, però afecta a la primera (ex. αὐτός). Si la lletra inicial és majúscula, l'esperit es col·loca al seu costat esquerre superior (ex. Ἀθήνη).<\/p>\n<p><strong>Apòstrof i coronis<\/strong><\/p>\n<ul><li><strong>L'Apòstrof (Elisió):<\/strong> Quan una paraula acaba en vocal breu i la següent comença per vocal o diftong, la primera vocal pot desaparéixer. Això es marca amb un apòstrof ('). Ex: ἀπὸ ἐμοῦ ➞ ἀπ' ἐμοῦ.<\/li><li><strong>La Coronis (Crasi):<\/strong> Quan dues paraules es fusionen en una de sola (una acaba en vocal i l'altra hi comença). La vocal resultant porta un signe igual a l'esperit suau, anomenat coronis. Ex: τὰ ἄλλα ➞ τἆλλα.<\/li><\/ul>\n<p><strong>Els signes de puntuació<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Signe grec<\/td><td>Nom<\/td><td>Equivalència en valencià<\/td><\/tr><tr><td>( , )<\/td><td>Coma<\/td><td>Coma ( , )<\/td><\/tr><tr><td>( . )<\/td><td>Punt<\/td><td>Punt i final ( . )<\/td><\/tr><tr><td>( · )<\/td><td>Punt alt<\/td><td>Punt i coma ( ; ) o dos punts ( : )<\/td><\/tr><tr><td>( ; )<\/td><td>Punt i coma grec<\/td><td>Signe d'interrogació ( ? ). (Només a final de frase).<\/td><\/tr><\/table><\/div>\n<h4>4. Fonètica i accentuació bàsica<\/h4>\n<p>El grec antic posseïa originalment un accent musical (una variació del to de veu), que els gramàtics van representar amb tres signes diferents. En la nostra lectura escolar, els pronunciarem tots com si foren el nostre accent d'intensitat.<\/p>\n<ul><li><strong>Accent Agut ( ´ ):<\/strong> Pot recaure en qualsevol de les tres últimes síl·labes. S'utilitza tant en vocals breus com en llargues. (Ex: ἄνθρωπος, ἡμέρα).<\/li><li><strong>Accent Circumflex ( ῀ ):<\/strong> Només pot recaure sobre vocals llargues o diftongs, i exclusivament en l'última o la penúltima síl·laba. (Ex: δῶρον, θεοῦ).<\/li><li><strong>Accent Greu ( ` ):<\/strong> Només es troba a l'última síl·laba. S'utilitza per a substituir un accent agut final quan la paraula va seguida immediatament d'una altra paraula dins de la mateixa oració, sense cap pausa (coma o punt) pel mig. (Ex: καλός, però καλὸς ἀνήρ).<\/li><\/ul>\n<p><strong>La Llei de Limitació<\/strong><\/p>\n<p>L'accent grec és mòbil, però no lliure. Existix una llei mecànica inquebrantable: la posició de l'accent està limitada per la quantitat (durada) de l'última síl·laba.<\/p>\n<ul><li>Si l'última síl·laba de la paraula és breu, l'accent pot remuntar-se fins a la tercera síl·laba començant pel final (l'avantpenúltima). Ex: ἄν-θρω-πος (la \"-πος\" és breu).<\/li><li>Si l'última síl·laba d'una paraula és llarga (una vocal llarga o un diftong), la síl·laba \"pesa\" massa i l'accent no pot anar més arrere de la segona síl·laba començant pel final (la penúltima). Ex: ἀν-θρώ-που (el diftong final \"-που\" fa que l'accent agut baixe).<\/li><\/ul>\n<h4>5. Primeres paraules: Salutacions i presentacions<\/h4>\n<div class=\"tw\"><table><tr><td>Expressió Grega<\/td><td>Traducció<\/td><td>Observacions d'ús<\/td><\/tr><tr><td>Χαῖρε<\/td><td>Hola! / Salut!<\/td><td>Salutació a una sola persona (lit. \"alegra't\").<\/td><\/tr><tr><td>Χαίρετε<\/td><td>Hola! / Salut!<\/td><td>Salutació a diverses persones.<\/td><\/tr><tr><td>Ἔρρωσο<\/td><td>Adéu! / Passa-ho bé!<\/td><td>Comiat a una sola persona (lit. \"estigues fort\").<\/td><\/tr><tr><td>Ἔρρωσθε<\/td><td>Adéu! / Passeu-ho bé!<\/td><td>Comiat a diverses persones.<\/td><\/tr><tr><td>Ναί<\/td><td>Sí<\/td><td>Afirmació.<\/td><\/tr><tr><td>Οὐ / Οὐκ / Οὐχ<\/td><td>No<\/td><td>Οὐ davant consonant, Οὐκ davant vocal amb esperit suau, i Οὐχ davant vocal amb esperit aspre.<\/td><\/tr><tr><td>Τίς εἶ;<\/td><td>Qui eres?<\/td><td>Pregunta d'identificació.<\/td><\/tr><tr><td>Ἐγώ εἰμι…<\/td><td>Jo sóc…<\/td><td>Fórmula de presentació. (Ex: Ἐγώ εἰμι Μᾶρκος = Jo sóc Marc).<\/td><\/tr><tr><td>Καὶ σύ;<\/td><td>I tu?<\/td><td>Per a retornar una pregunta.<\/td><\/tr><\/table><\/div>\n<p><strong>Diàleg de presentació a l'aula<\/strong><\/p>\n<p>— Χαῖρε, ὦ φίλε. (Hola, amic).<\/p>\n<p>— Χαῖρε. Τίς εἶ; (Hola. Qui eres?)<\/p>\n<p>— Ἐγώ εἰμι Ἀλέξανδρος. Καὶ σύ; Τίς εἶ; (Jo sóc Alexandre. I tu? Qui eres?)<\/p>\n<p>— Ἐγώ εἰμι Φίλιππος. (Jo sóc Filip).<\/p>\n<p>— Ἔρρωσο, Φίλιππε. (Adéu, Filip).<\/p>\n<p>— Ἔρρωσο, Ἀλέξανδρε. (Adéu, Alexandre).<\/p>","lexicon":[]},{"n":2,"title":"L'època arcaica: el naixement de la polis","cultura":"<h3>L'època arcaica: el naixement de la polis<\/h3>\n<h4>1. Què és una polis<\/h4>\n<p>Entre els segles VIII i VI aC, Grècia adopta la forma d'organització que la definirà: la <em>polis<\/em>. Traduir-la per «ciutat» és insuficient. Una polis és una comunitat de ciutadans amb un territori propi, unes lleis pròpies, uns cultes propis i una voluntat ferma d'independència.<\/p>\n<p>Físicament tenia dos parts. L'<em>ástu<\/em> era el nucli urbà, on solien alçar-se l'acròpoli —la part alta, fortificada i seu dels temples principals— i l'àgora, la plaça on es feia el mercat i on es reunien els ciutadans. La <em>khóra<\/em> era el camp del voltant, amb els llogarets, els conreus i les pastures, i era el que sustentava la comunitat.<\/p>\n<p>La polis aspirava a l'<em>autarkeia<\/em>, a bastar-se a si mateixa. La majoria eren xicotetes: uns quants milers de persones i un territori que sovint no arribava als cent quilòmetres quadrats. Atenes, amb l'Àtica sencera, i Esparta, amb Lacònia i Messènia, van ser excepcions per grandària. Ser ciutadà no era un tràmit administratiu, sinó una condició hereditària que donava dret a participar en les decisions, a posseir terra i a defendre la comunitat amb les armes, i que comportava obligacions religioses i militars.<\/p>\n<p>Esta divisió no impedia el sentiment de pertànyer a un mateix poble. Els grecs es reconeixien com a <em>hel·lens<\/em> enfront dels <em>bàrbars<\/em> —els qui no parlaven grec— i compartien espais comuns: els santuaris de Delfos i d'Olímpia, els oracles, els jocs i els poemes d'Homer.<\/p>\n<h4>2. La colonització<\/h4>\n<p>A partir del 750 aC, i durant dos segles, milers de grecs abandonen les seues ciutats i funden assentaments per tot el Mediterrani i la mar Negra. Les causes són diverses: l'escassetat de terra cultivable davant del creixement demogràfic, els conflictes polítics interns que empenyien els perdedors a marxar i la recerca de metalls i mercats.<\/p>\n<p>El procés era organitzat. Una ciutat —la metròpoli o «ciutat mare»— designava un cap d'expedició, consultava l'oracle de Delfos, triava el lloc i enviava els colons. La nova fundació, l'<em>apoikía<\/em>, era políticament independent, però mantenia amb la metròpoli vincles religiosos i sentimentals.<\/p>\n<p>Les zones principals van ser el sud d'Itàlia i Sicília, tan poblades de grecs que els romans les anomenaren Magna Grècia (Cumes, Tàrent, Siracusa, Nàpols); les costes de la mar Negra, riques en cereals i peix; la Cirenaica al nord d'Àfrica; i l'occident mediterrani, on Massàlia (Marsella) va servir de pont cap a la península Ibèrica, on es va fundar Emporion, l'actual Empúries.<\/p>\n<p>Les conseqüències van ser profundes: difusió de la llengua i de l'alfabet grecs, contacte amb altres cultures, desenrotllament del comerç i introducció de la moneda encunyada, i creació d'una xarxa mediterrània que Roma heretarà.<\/p>\n<h4>3. De l'aristocràcia a la tirania<\/h4>\n<p>En els primers temps de la polis el poder era en mans de famílies nobles que controlaven la millor terra i els sacerdocis. Dos processos van erosionar eixe domini.<\/p>\n<p>El primer va ser militar. La introducció de la falange hoplítica —una formació compacta de soldats d'infanteria amb escut rodó, llança i cuirassa— va traslladar l'eficàcia bèl·lica del duel aristocràtic a la disciplina col·lectiva. Els hoplites, camperols benestants capaços de costejar-se l'equipament, es van convertir en la columna vertebral de l'exèrcit i, per tant, en un grup amb dret a exigir participació política.<\/p>\n<p>El segon va ser econòmic i jurídic. L'endeutament dels xicotets propietaris, que podien acabar reduïts a l'esclavitud, va provocar tensions greus. Moltes ciutats van encarregar a un legislador la redacció de lleis escrites que limitaren l'arbitrarietat dels jutges nobles.<\/p>\n<p>Quan el conflicte no es resolia, sovint apareixia un <em>tirà<\/em>: un personatge que prenia el poder per la força, sense títol legal, generalment amb el suport dels sectors descontents. En grec, la paraula no tenia encara la càrrega negativa que li donem hui. Alguns tirans, com Cípsel i Periandre a Corint o Polícrates a Samos, van impulsar obres públiques, festes i comerç.<\/p>\n<h4>4. Atenes: el camí cap a la democràcia<\/h4>\n<p>Atenes il·lustra bé el procés. Cap al 621 aC, <strong>Dracó<\/strong> va posar per escrit les lleis penals; la seua duresa proverbial va donar l'adjectiu «draconià», però l'important és que la llei deixava de dependre de la memòria dels nobles.<\/p>\n<p>El 594 aC, <strong>Soló<\/strong> va rebre poders extraordinaris per a resoldre la crisi social. Va abolir els deutes que convertien els camperols en esclaus (la <em>seisáchtheia<\/em>, o «alliberament de càrregues»), va prohibir l'esclavitud per deutes i va reorganitzar la societat en quatre classes segons la renda agrícola, no segons el naixement. Cada classe tenia drets polítics proporcionals.<\/p>\n<p>El 561 aC, <strong>Pisístrat<\/strong> va prendre el poder per primera vegada i, després de dos exilis, va consolidar a partir del 546 aC una tirania que, malgrat el mètode, va afavorir els xicotets propietaris, va embellir la ciutat i va donar impuls a les festes Panatenees i a les Dionísies, on naixerà el teatre.<\/p>\n<p>El 508 aC, <strong>Clístenes<\/strong> va completar la reforma decisiva. Va substituir les antigues tribus de base familiar per deu tribus artificials que barrejaven habitants de la costa, de la ciutat i de l'interior, de manera que les lleialtats locals i clàniques quedaren diluïdes. La unitat bàsica va passar a ser el <em>demos<\/em>, el municipi. Va crear un consell de cinc-cents membres i, segons la tradició, l'ostracisme, un mecanisme per a desterrar durant deu anys qui es considerara un perill per a la comunitat. Amb Clístenes es posen les bases de la democràcia.<\/p>\n<h4>5. Esparta: un model diferent<\/h4>\n<p>Esparta va seguir un camí divergent. En lloc de colonitzar, va conquistar el territori veí de Messènia (segles VIII i VII aC) i va reduir la població vençuda a la condició d'hilotes, treballadors sotmesos i adscrits a la terra. Mantindre eixe domini va exigir convertir la ciutat en una societat militaritzada permanent.<\/p>\n<p>L'ordenament espartà s'atribuïa al legislador llegendari <strong>Licurg<\/strong>. Els ciutadans de ple dret rebien el nom d'<em>hòmoioi<\/em>, «els iguals»: rebien un lot de terra treballat per hilotes i es dedicaven exclusivament a la guerra i a la política. Els <em>periecs<\/em>, lliures però sense drets polítics, s'ocupaven de l'artesania i del comerç.<\/p>\n<p>L'educació, l'<em>agogé<\/em>, era pública i obligatòria des dels set anys, i pretenia formar soldats resistents i obedients. El sistema polític combinava dos reis, un consell d'ancians, una assemblea de ciutadans i cinc magistrats anuals amb amplis poders de control.<\/p>\n<p>Esparta va ser admirada per la seua estabilitat i temuda pel seu exèrcit, però va pagar eixe equilibri amb l'aïllament cultural i amb una davallada demogràfica constant del cos ciutadà.<\/p>\n<h4>6. La cultura de l'època arcaica<\/h4>\n<p>L'època arcaica no és només política. És el moment en què es fixen els poemes d'Homer i Hesíode, en què naix la poesia lírica personal amb Arquíloc, Safo o Alceu, i en què a Milet els primers filòsofs busquen explicar el món sense recórrer als déus. Els grans santuaris panhel·lènics —Olímpia, on la tradició situa els primers jocs el 776 aC, i Delfos, amb l'oracle d'Apol·lo— es consoliden com a punts de trobada de tots els grecs. L'art crea el temple de columnes i les primeres estàtues monumentals. Quan comencen les guerres contra Pèrsia, el món grec ja té una identitat cultural formada.<\/p>","gram":"<h3>La flexió bàsica i l'inici de l'acció<\/h3>\n<p>Després d'aprendre a llegir i pronunciar l'alfabet grec, comencem ara a endinsar-nos en el funcionament intern de la llengua. El grec, igual que el llatí, és una llengua flexiva. Això vol dir que les paraules canvien la seua terminació per a indicar la funció que fan dins de la frase i poder construir així l'acció.<\/p>\n<h4>1. Concepte de declinació i els casos<\/h4>\n<p>En valencià, sabem que una paraula és el subjecte o el complement directe principalment per l'orde en la frase o per l'ús de preposicions (ex. \"El gos mossega el xiquet\" vs. \"El xiquet mossega el gos\"). En grec antic, els substantius, adjectius, pronoms i articles canvien la seua forma final.<\/p>\n<p>Així, una paraula grega es dividix en dues parts:<\/p>\n<ul><li><strong>L'arrel (o tema):<\/strong> Conté el significat principal de la paraula i normalment no canvia (ex. ἀνθρωπ- = home).<\/li><li><strong>La desinència:<\/strong> És la terminació que s'afig a l'arrel i que ens indica el gènere, el nombre (singular o plural) i la funció sintàctica.<\/li><\/ul>\n<p>Al canvi que patix una paraula per a expressar una funció sintàctica l'anomenem <strong>cas<\/strong>. El conjunt de casos d'una paraula s'anomena <strong>declinació<\/strong>. A diferència del llatí (que en té sis), el grec antic té cinc casos, ja que l'ablatiu llatí va desaparéixer i les seues funcions van ser assumides pel genitiu i el datiu:<\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Funció sintàctica principal<\/td><td>Traducció general<\/td><\/tr><tr><td>Nominatiu<\/td><td>Subjecte / Atribut<\/td><td>(Sense preposició)<\/td><\/tr><tr><td>Vocatiu<\/td><td>Apel·lació (per a cridar o dirigir-se a algú)<\/td><td>Oh…! / (Sense preposició)<\/td><\/tr><tr><td>Acusatiu<\/td><td>Complement Directe (CD) / Direcció<\/td><td>(Sense prep., o \"a\" per a persones)<\/td><\/tr><tr><td>Genitiu<\/td><td>Complement del Nom (CN) / Origen<\/td><td>de / des de<\/td><\/tr><tr><td>Datiu<\/td><td>Complement Indirecte (CI) / Instrument / Lloc<\/td><td>a, per a / amb / en<\/td><\/tr><\/table><\/div>\n<p><strong>L'enunciat:<\/strong> En els diccionaris, els substantius no es busquen per qualsevol cas. Es presenten sempre donant el Nominatiu singular, seguit de la terminació del Genitiu singular i, finalment, l'article que ens indica el seu gènere (masculí ὁ, femení ἡ, neutre τό). Conéixer el genitiu és vital, perquè és el \"DNI\" de la paraula i ens diu a quina declinació pertany.<\/p>\n<p><strong>Exemple:<\/strong> ἄνθρωπος, -ου (ὁ) = l'home.<\/p>\n<h4>2. L'article definit (I): Masculí i Neutre<\/h4>\n<p>El grec antic sí que té article definit (com el nostre el, la, els, les), però no té article indefinit (un, una). L'article concorda sempre en gènere, nombre i cas amb el substantiu al qual acompanya. En este tema vorem el masculí i el neutre, que seguixen el patró de la segona declinació.<\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Masculí Singular (el)<\/td><td>Neutre Singular (el / ho)<\/td><td>Masculí Plural (els)<\/td><td>Neutre Plural (els / les)<\/td><\/tr><tr><td>Nominatiu<\/td><td>ὁ<\/td><td>τό<\/td><td>οἱ<\/td><td>τά<\/td><\/tr><tr><td>Acusatiu<\/td><td>τόν<\/td><td>τό<\/td><td>τούς<\/td><td>τά<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ<\/td><td>τοῦ<\/td><td>τῶν<\/td><td>τῶν<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ<\/td><td>τῷ<\/td><td>τοῖς<\/td><td>τοῖς<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>OBSERVACIONS.<\/strong><\/p>\n<p class=\"quadre\">• L'article no té Vocatiu. S'utilitza directament la interjecció ὦ davant del nom.<\/p>\n<p class=\"quadre\">• Fixa't que les formes ὁ i οἱ no porten accent. Són paraules proclítiques (es recolzen en la paraula següent per a pronunciar-se) i sempre duen esperit aspre.<\/p>\n<p class=\"quadre\">• El datiu singular (τῷ) porta una iota subscrita davall de l'omega, que no es pronuncia.<\/p>\n<h4>3. La segona declinació (Temes en -ο)<\/h4>\n<p>Comencem l'estudi de la flexió per la segona declinació perquè és molt regular. Engloba les paraules l'arrel de les quals acaba en la vocal temàtica -ο-. El Genitiu singular sempre acaba en -ου.<\/p>\n<ul><li><strong>Masculins i Femenins (-ος):<\/strong> La gran majoria són masculins (ex. ὁ δοῦλος = l'esclau, ὁ λόγος = la paraula), però hi ha uns pocs femenins molt habituals, com malalties, illes o arbres (ex. ἡ νῆσος = l'illa). Es declinen exactament igual, només canvia l'article que els acompanya.<\/li><li><strong>Neutres (-ον):<\/strong> Es referixen sovint a coses o conceptes (ex. τὸ δῶρον = el regal). Complixen sempre la \"regla d'or\" indoeuropea dels neutres: el Nominatiu, el Vocatiu i l'Acusatiu són sempre iguals (i en plural sempre acaben en una -α breu).<\/li><\/ul>\n<p><strong>Model Masculí / Femení: ὁ ἄνθρωπος (l'home)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Singular<\/td><td>Plural<\/td><\/tr><tr><td>Nominatiu<\/td><td>ὁ ἄνθρωπ-ος<\/td><td>οἱ ἄνθρωπ-οι<\/td><\/tr><tr><td>Vocatiu<\/td><td>ὦ ἄνθρωπ-ε<\/td><td>ὦ ἄνθρωπ-οι<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὸν ἄνθρωπ-ον<\/td><td>τοὺς ἀνθρώπ-ους<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ ἀνθρώπ-ου<\/td><td>τῶν ἀνθρώπ-ων<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ ἀνθρώπ-ῳ<\/td><td>τοῖς ἀνθρώπ-οις<\/td><\/tr><\/table><\/div>\n<p><strong>Model Neutre: τὸ δῶρον (el regal)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Singular<\/td><td>Plural<\/td><\/tr><tr><td>Nominatiu<\/td><td>τὸ δῶρ-ον<\/td><td>τὰ δῶρ-α<\/td><\/tr><tr><td>Vocatiu<\/td><td>ὦ δῶρ-ον<\/td><td>ὦ δῶρ-α<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὸ δῶρ-ον<\/td><td>τὰ δῶρ-α<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ δώρ-ου<\/td><td>τῶν δώρ-ων<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ δώρ-ῳ<\/td><td>τοῖς δώρ-οις<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> El desplaçament de l'accent.<\/p>\n<ul><li>En la flexió nominal, l'accent intenta mantindre's en la mateixa síl·laba que en el nominatiu, però sempre sotmés a la Llei de Limitació.<\/li><li>En ἄνθρωπος, com la terminació \"-ος\" és breu, l'accent agut pot estar a la tercera síl·laba començant pel final (l'avantpenúltima). Però al Genitiu (ἀνθρώπου) o l'Acusatiu Plural (ἀνθρώπους), les terminacions \"-ου\" i \"-ους\" són diftongs (llargs). Com la síl·laba final \"pesa\" molt, l'accent es veu obligat a baixar a la penúltima síl·laba: ἀν-θρώ-που.<\/li><li>En δῶρον, la terminació breu permet un accent circumflex a la penúltima. Però al Genitiu δώρου, com l'última ara és llarga (-ου), el circumflex es convertix en un accent agut normal.<\/li><\/ul>\n<h4>4. El verb: Present d'Indicatiu Actiu i el verb εἰμί<\/h4>\n<p>En grec, els verbs també es flexionen (es conjuguen) i concorden en persona i nombre amb el subjecte. El temps Present expressa una acció que ocorre ara o que és contínua.<\/p>\n<p><strong>4.1. El verb copulatiu εἰμί (ser, estar, existir)<\/strong><\/p>\n<p>És el verb més freqüent i irregular. Funciona de manera molt similar a les llengües romàniques per a enllaçar un subjecte amb el seu atribut.<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Singular<\/td><td>Plural<\/td><\/tr><tr><td>1ª (Jo / Nosaltres)<\/td><td>εἰμί (sóc / estic)<\/td><td>ἐσμέν (som / estem)<\/td><\/tr><tr><td>2ª (Tu / Vosaltres)<\/td><td>εἶ (eres / estàs)<\/td><td>ἐστέ (sou / esteu)<\/td><\/tr><tr><td>3ª (Ell / Ells)<\/td><td>ἐστί(ν) (és / està / hi ha)<\/td><td>εἰσί(ν) (són / estan / hi ha)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>OBSERVACIONS.<\/strong><\/p>\n<p class=\"quadre\">• <strong>La \"ν\" efelcística:<\/strong> Les terceres persones afigen una \"ni\" al final (ἐστίν, εἰσίν) quan la paraula següent comença per vocal o quan estan al final de l'oració, per a evitar un hiat.<\/p>\n<p class=\"quadre\">• <strong>Apunts d'accentuació:<\/strong> Totes les formes del present d'εἰμί (excepte εἶ) són enclítiques. Perden el seu accent i es pronuncien enganxades a la paraula anterior (Ex: ὁ ἄνθρωπός ἐστι).<\/p>\n<p><strong>4.2. Els verbs regulars en -ω (Veu Activa)<\/strong><\/p>\n<p>Són la gran majoria dels verbs grecs. Per a conjugar el present, agafem l'arrel (llevant la -ω de l'enunciat) i hi afegim les desinències personals primàries actives. Utilitzem com a model el verb λύω (deslligar, alliberar).<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Singular<\/td><td>Plural<\/td><\/tr><tr><td>1ª Persona<\/td><td>λύ-ω (deslligue)<\/td><td>λύ-ομεν (deslliguem)<\/td><\/tr><tr><td>2ª Persona<\/td><td>λύ-εις (deslligues)<\/td><td>λύ-ετε (deslligueu)<\/td><\/tr><tr><td>3ª Persona<\/td><td>λύ-ει (deslliga)<\/td><td>λύ-ουσι(ν) (deslliguen)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ VERBAL.<\/strong> El desplaçament de l'accent (Accent recessiu).<\/p>\n<p>A diferència dels noms, els verbs tenen accent recessiu. Això vol dir que l'accent \"fuig\" cap arrere tot el que puga des del final de la paraula, respectant la llei de limitació. Ex: En λύομεν, com la \"-εν\" final és breu, l'accent se'n va fins a l'avantpenúltima síl·laba: λύ-ο-μεν.<\/p>\n<h4>5. L'Imperatiu de present (Actiu i Mitjà)<\/h4>\n<p>Per a poder comprendre des del primer dia els diàlegs dels textos, necessitem una ferramenta clau: el mode Imperatiu, que servix per a donar ordres o fer peticions directes.<\/p>\n<p>De moment, ens centrarem en les segones persones (Tu i Vosaltres), que són les més utilitzades en la conversa.<\/p>\n<p>El grec té veu Activa (fer l'acció) i veu Mitjana (fer l'acció per a un mateix o amb un interés especial).<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Veu Activa (λύω)<\/td><td>Veu Mitjana (λύομαι)<\/td><\/tr><tr><td>2ª Sing. (Tu)<\/td><td>λῦ-ε (deslliga!)<\/td><td>λύ-ου (deslliga't / deslliga per a tu!)<\/td><\/tr><tr><td>2ª Plur. (Vosaltres)<\/td><td>λύ-ετε (deslligueu!)<\/td><td>λύ-εσθε (deslligueu-vos!)<\/td><\/tr><\/table><\/div>\n<ul><li><strong>Exemple Activa:<\/strong> Ὦ δοῦλε, λῦε τὸν ἵππον. (Esclau, deslliga el cavall!).<\/li><li><strong>Exemple Mitjana:<\/strong> Ὦ δοῦλοι, παύεσθε. (Esclaus, atureu-vos / deteniu-vos!).<\/li><\/ul>\n<p class=\"quadre\"><strong>LES PROHIBICIONS.<\/strong> Si volem donar una orde negativa (una prohibició), en grec MAI utilitzarem l'adverbi οὐ (no). Les prohibicions es construïxen sempre amb l'adverbi μή (no).<\/p>\n<p><strong>Exemple:<\/strong> Μὴ παῖε τὸν κύνα! (No colpeges el gos!).<\/p>","lexicon":[{"e":"ἀγρός, -οῦ, ὁ","t":"camp","g":"Substantius"},{"e":"ἄνθρωπος, -ου, ὁ","t":"home, ésser humà","g":"Substantius"},{"e":"δένδρον, -ου, τό","t":"arbre","g":"Substantius"},{"e":"δεσμωτήριον, -ου, τό","t":"presó","g":"Substantius"},{"e":"δοῦλος, -ου, ὁ","t":"esclau","g":"Substantius"},{"e":"δῶρον, -ου, τό","t":"regal, present","g":"Substantius"},{"e":"ἔργον, -ου, τό","t":"faena, treball, obra","g":"Substantius"},{"e":"θάνατος, -ου, ὁ","t":"mort","g":"Substantius"},{"e":"θεός, -οῦ, ὁ","t":"déu","g":"Substantius"},{"e":"θηρίον, -ου, τό","t":"fera, bèstia salvatge","g":"Substantius"},{"e":"ἥλιος, -ου, ὁ","t":"sol","g":"Substantius"},{"e":"ἵππος, -ου, ὁ","t":"cavall","g":"Substantius"},{"e":"κίνδυνος, -ου, ὁ","t":"perill","g":"Substantius"},{"e":"κύριος, -ου, ὁ","t":"senyor, amo","g":"Substantius"},{"e":"λαβύρινθος, -ου, ὁ","t":"laberint","g":"Substantius"},{"e":"λόγος, -ου, ὁ","t":"paraula, discurs","g":"Substantius"},{"e":"λύκος, -ου, ὁ","t":"llop","g":"Substantius"},{"e":"νεκρός, -οῦ, ὁ","t":"mort, cadàver (també funciona com a adjectiu: νεκρός, -ά, -όν)","g":"Substantius"},{"e":"οἶκος, -ου, ὁ","t":"casa, llar","g":"Substantius"},{"e":"ὄλεθρος, -ου, ὁ","t":"ruïna, destrucció, mort","g":"Substantius"},{"e":"ὄνος, -ου, ὁ","t":"ase, ruc","g":"Substantius"},{"e":"ὅπλον, -ου, τό","t":"arma","g":"Substantius"},{"e":"οὐρανός, -οῦ, ὁ","t":"cel","g":"Substantius"},{"e":"ὀφθαλμός, -οῦ, ὁ","t":"ull","g":"Substantius"},{"e":"πεδίον, -ου, τό","t":"plana, camp obert","g":"Substantius"},{"e":"πόνος, -ου, ὁ","t":"esforç, treball dur, dolor","g":"Substantius"},{"e":"πόντος, -ου, ὁ","t":"mar","g":"Substantius"},{"e":"πτερόν, -ου, τό","t":"ala, ploma","g":"Substantius"},{"e":"τέκνον, -ου, τό","t":"fill, xiquet","g":"Substantius"},{"e":"υἱός, -οῦ, ὁ","t":"fill","g":"Substantius"},{"e":"ὕπνος, -ου, ὁ","t":"son (el dormir)","g":"Substantius"},{"e":"φόβος, -ου, ὁ","t":"por","g":"Substantius"},{"e":"ξύλον, -ου, τό","t":"fusta, pal","g":"Substantius"},{"e":"ζῷον, -ου, τό","t":"animal, ésser viu","g":"Substantius"},{"e":"ἀγαθός, -ή, -όν","t":"bo","g":"Adjectius"},{"e":"ἄοκνος, -ον","t":"actiu, treballador, diligent","g":"Adjectius"},{"e":"δεινός, -ή, -όν","t":"terrible, temible (també hàbil)","g":"Adjectius"},{"e":"θερμός, -ή, -όν","t":"calent","g":"Adjectius"},{"e":"θαυμαστός, -ή, -όν","t":"meravellós, admirable","g":"Adjectius"},{"e":"κακός, -ή, -όν","t":"roí, dolent","g":"Adjectius"},{"e":"καλός, -ή, -όν","t":"bell, bonic, bo","g":"Adjectius"},{"e":"μακρός, -ά, -όν","t":"llarg, gran","g":"Adjectius"},{"e":"μικρός, -ά, -όν","t":"xicotet, menut","g":"Adjectius"},{"e":"μόνος, -η, -ον","t":"sol, únic","g":"Adjectius"},{"e":"μωρός, -ά, -όν","t":"ximple, insensat","g":"Adjectius"},{"e":"φίλος, -η, -ον","t":"amic, estimat","g":"Adjectius"},{"e":"χαλεπός, -ή, -όν","t":"difícil, dur","g":"Adjectius"},{"e":"ἄγω, ἄξω, ἤγαγον","t":"portar, conduir, guiar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀκούω, ἀκούσομαι, ἤκουσα","t":"escoltar, sentir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀνοίγω, ἀνοίξω, ἀνέῳξα","t":"obrir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βαίνω, βήσομαι, ἔβην","t":"anar, caminar, avançar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βλέπω, βλέψω, ἔβλεψα","t":"mirar, vore","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"εἰμί, ἔσομαι, --","t":"ser, estar, haver-hi","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἐσθίω, ἔδομαι, ἔφαγον","t":"menjar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἔχω, ἕξω / σχήσω, ἔσχον","t":"tindre","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"καθεύδω, καθευδήσω, --","t":"dormir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"κλαίω, κλαύσομαι, ἔκλαυσα","t":"plorar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"λέγω, ἐρῶ / λέξω, εἶπον / ἔλεξα","t":"dir, parlar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"παίω, παίσω, ἔπαισα","t":"colpejar, pegar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"παύω, παύσω, ἔπαυσα","t":"aturar, fer parar (en veu mitjana παύομαι: aturar-se)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πίπτω, πεσοῦμαι, ἔπεσον","t":"caure","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"σῴζω, σώσω, ἔσωσα","t":"salvar, protegir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φέρω, οἴσω, ἤνεγκον","t":"portar, dur","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φεύγω, φεύξομαι, ἔφυγον","t":"fugir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"χαίρω, χαιρήσω, ἐχάρην","t":"alegrar-se (l'imperatiu χαῖρε / χαίρετε s'utilitza com a salutació: \"hola\", \"salut\").","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"Ἀλέξανδρος, -ου, ὁ","t":"Alexandre","g":"Noms propis"},{"e":"Δαίδαλος, -ου, ὁ","t":"Dèdal","g":"Noms propis"},{"e":"Δάος, -ου, ὁ","t":"Daos (Dau)","g":"Noms propis"},{"e":"Ἴκαρος, -ου, ὁ","t":"Ícar","g":"Noms propis"},{"e":"Μινώταυρος, -ου, ὁ","t":"Minotaure","g":"Noms propis"},{"e":"Νέαρχος, -ου, ὁ","t":"Nearc","g":"Noms propis"},{"e":"Ξάνθος, -ου, ὁ","t":"Xantos","g":"Noms propis"},{"e":"Φίλιππος, -ου, ὁ","t":"Filip","g":"Noms propis"}]},{"n":3,"title":"El segle V aC: guerres mèdiques i guerra del Peloponés","cultura":"<h3>El segle V aC: les guerres mèdiques i la guerra del Peloponés<\/h3>\n<h4>1. L'imperi persa i la revolta jònica<\/h4>\n<p>A finals del segle VI aC, sota Darios I, l'imperi persa aquemènida s'havia convertit en la potència més gran coneguda: s'estenia des de l'Indus fins a Egipte i, des del 546 aC, controlava les ciutats gregues d'Àsia Menor. Els perses hi mantenien tirans afectes i cobraven tribut.<\/p>\n<p>El 499 aC, encapçalades per Milet, estes ciutats es van revoltar. Atenes i Erètria van enviar-hi una ajuda modesta que va resultar decisiva a llarg termini: va donar al rei Darios un motiu per a intervindre a la Grècia europea. La revolta va ser esclafada el 494 aC amb la destrucció de Milet.<\/p>\n<h4>2. La primera guerra mèdica: Marató<\/h4>\n<p>El 490 aC una expedició persa va travessar l'Egeu, va arrasar Erètria i va desembarcar a la plana de Marató, a l'Àtica. Els atenesos, amb el suport de Platees i sota la direcció estratègica de <strong>Milcíades<\/strong>, van atacar amb la falange hoplítica reforçada per les ales i van derrotar un exèrcit numèricament superior.<\/p>\n<p>Marató va tindre un efecte psicològic enorme. Va demostrar que els perses no eren invencibles i va convertir-se en un símbol de la capacitat dels ciutadans lliures per a defendre la seua ciutat. Els atenesos la van recordar durant generacions com el moment fundacional de la seua grandesa.<\/p>\n<h4>3. La segona guerra mèdica: Termòpiles, Salamina i Platees<\/h4>\n<p>Deu anys després, el rei <strong>Xerxes<\/strong> va preparar una invasió a gran escala per terra i per mar. Els grecs, reunits en una lliga dirigida per Esparta, van adoptar una estratègia doble.<\/p>\n<p>Al pas de les <strong>Termòpiles<\/strong> (480 aC), un contingent reduït encapçalat pel rei espartà Leònides va retindre l'avanç persa durant diversos dies fins que una traïció va permetre encerclar-los. La resistència fins a la mort dels tres-cents espartans i dels seus aliats tespis es va convertir en un dels grans relats morals de l'antiguitat.<\/p>\n<p>Mentrestant, <strong>Temístocles<\/strong> havia convençut els atenesos d'invertir els ingressos de les mines de plata del Làurion en una flota de trirrems. Eixa decisió va resultar clau: amb Atenes evacuada i cremada, la flota grega va atraure l'armada persa a l'estret de <strong>Salamina<\/strong> (480 aC), on els vaixells enemics, més nombrosos i pesats, no podien maniobrar. La victòria naval va trencar la logística persa.<\/p>\n<p>L'any següent, la derrota de l'exèrcit persa a <strong>Platees<\/strong> i la de la seua flota a <strong>Mícale<\/strong> (479 aC) van tancar el conflicte. Grècia havia preservat la seua independència, i Atenes n'eixia com a gran potència marítima.<\/p>\n<h4>4. La Pentecontècia i l'imperi atenés<\/h4>\n<p>El període d'uns cinquanta anys entre les guerres mèdiques i la guerra del Peloponés rep el nom de <strong>Pentecontècia<\/strong>. El 478 aC es va constituir la Lliga de Delos, una aliança de ciutats marítimes per a continuar la guerra contra Pèrsia. Cada membre aportava naus o diners a una caixa comuna dipositada a l'illa sagrada de Delos.<\/p>\n<p>Molt aviat, però, la lliga es va transformar en un imperi. Atenes dirigia les operacions, decidia les contribucions i reprimia militarment els intents de separació, com el de Naxos o el de Tasos. El 454 aC el tresor va ser traslladat a l'Acròpoli d'Atenes i una part es va destinar a finançar el programa de construccions de la ciutat. Els aliats havien passat a ser súbdits.<\/p>\n<h4>5. L'Atenes de Pèricles<\/h4>\n<p>Entre el 461 i el 429 aC, <strong>Pèricles<\/strong> va ser la figura dominant de la política atenesa i, des del 443 aC, va ser elegit estrateg gairebé cada any. Sota la seua direcció es va completar la democràcia: es va reduir el poder de l'antic consell aristocràtic de l'areòpag, es van obrir les magistratures a més ciutadans i es va introduir una retribució (el <em>misthós<\/em>) per a l'exercici de càrrecs i per a la participació en els tribunals, de manera que els ciutadans pobres pogueren dedicar-hi temps.<\/p>\n<p>Amb els fons de la lliga es va reconstruir l'Acròpoli destruïda pels perses: el Partenó, els Propileus, l'Erectèon, el temple d'Atena Nike. Atenes va atraure artistes, filòsofs i escriptors de tot el món grec. És l'època de Fídies, d'Èsquil, Sòfocles i Eurípides, d'Heròdot i dels sofistes. Cal recordar, però, que eixa esplendor es finançava amb els tributs dels aliats i que descansava sobre una població de metecs i esclaus sense drets polítics.<\/p>\n<h4>6. La guerra del Peloponés (431-404 aC)<\/h4>\n<p>El creixement atenés va acabar xocant amb Esparta i els seus aliats. Tucídides, que en va escriure la història, va assenyalar com a causa profunda la por que el poder d'Atenes inspirava als espartans; els incidents de Corcira i de Potidea van ser el detonant.<\/p>\n<p>La guerra va enfrontar dos models incompatibles: una potència terrestre, Esparta, contra una potència marítima, Atenes. L'estratègia de Pèricles consistia a refugiar la població de l'Àtica dins de les muralles i a atacar per mar. L'aglomeració va afavorir, però, una epidèmia devastadora que el 430-429 aC va matar una gran part de la població, el mateix Pèricles inclòs.<\/p>\n<p>Després d'una treva, l'expedició a <strong>Sicília<\/strong> (415-413 aC), promoguda per Alcibíades i dirigida a conquistar Siracusa, va acabar en un desastre total: Atenes hi va perdre la flota i milers d'homes. Amb el suport financer persa, Esparta va construir una armada i el 405 aC va destruir les naus ateneses a <strong>Egospòtams<\/strong>. L'any següent Atenes es va rendir: va haver d'enderrocar les muralles, lliurar la flota i renunciar a l'imperi.<\/p>\n<h4>7. Els Trenta Tirans i la restauració democràtica<\/h4>\n<p>Els vencedors van imposar a Atenes un govern oligàrquic de trenta membres que, en pocs mesos del 404 aC, va executar prop de mil cinc-centes persones i va confiscar béns. La resistència democràtica, dirigida per Trasibul, va derrotar el règim, i el 403 aC es va restablir la democràcia amb una amnistia que buscava tancar la ferida.<\/p>\n<p>L'ambient d'eixos anys explica en part un episodi cèlebre: el procés i la condemna a mort de <strong>Sòcrates<\/strong> el 399 aC, acusat d'impietat i de corrompre la joventut. La ciutat que havia produït la primera democràcia va executar el seu filòsof més incòmode.<\/p>\n<h4>8. Balanç del segle<\/h4>\n<p>El segle V aC concentra el que solem anomenar «època clàssica»: la democràcia atenesa, la tragèdia, la historiografia, l'arquitectura del Partenó i l'escultura de Fídies. Però és també un segle de guerra gairebé contínua. Al final, cap polis va eixir enfortida: el conflicte havia esgotat els recursos, havia obert la porta a la intervenció persa i havia deixat el món grec preparat per a la crisi política del segle següent.<\/p>","gram":"<h3>Completant el present i l'adjectiu<\/h3>\n<p>Després d'haver estudiat la segona declinació i l'inici de l'acció verbal en el tema anterior, ara completarem el quadre bàsic de la flexió nominal amb la primera declinació, l'article femení i l'estudi de l'adjectiu. A més, farem un gran salt temporal aprenent a narrar fets en el passat mitjançant l'imperfet d'indicatiu, i introduirem una sèrie de verbs d'altíssima freqüència: els verbs contractes.<\/p>\n<h4>1. L'article definit (II): Femení<\/h4>\n<p>Per a completar el quadre de l'article definit que vam començar amb el masculí (ὁ) i el neutre (τό), ara introduïm el femení (ἡ). Igual que passa amb les altres formes, ens servirà de guia infal·lible per a reconéixer els casos de la primera declinació, amb els quals compartix vocal temàtica.<\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Femení Singular (la)<\/td><td>Femení Plural (les)<\/td><\/tr><tr><td>Nominatiu<\/td><td>ἡ<\/td><td>αἱ<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὴν<\/td><td>τάς<\/td><\/tr><tr><td>Genitiu<\/td><td>τῆς<\/td><td>τῶν<\/td><\/tr><tr><td>Datiu<\/td><td>τῇ<\/td><td>ταῖς<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>OBSERVACIONS.<\/strong><\/p>\n<p class=\"quadre\">• Igual que el masculí, les formes del nominatiu (ἡ, αἱ) són proclítiques (no porten accent i es recolzen en la paraula següent per a pronunciar-se) i sempre duen esperit aspre.<\/p>\n<p class=\"quadre\">• Fixa't en la iota subscrita del datiu singular (τῇ), característica comuna a totes les primeres i segones declinacions.<\/p>\n<h4>2. La primera declinació (Temes en -α i -η)<\/h4>\n<p>La primera declinació comprén els substantius l'arrel dels quals acaba originalment en -α. Engloba principalment substantius femenins, però també hi ha un grup de masculins. Cal tindre present que el plural és idèntic per a totes les paraules de la primera declinació, i la variació només es troba en les terminacions del singular.<\/p>\n<p><strong>2.1. Substantius Femenins<\/strong><\/p>\n<p>Es dividixen en tres tipus segons la lletra en què acabe l'arrel de la paraula:<\/p>\n<ul><li><strong>Alfa pura (-α):<\/strong> Si l'arrel acaba en les lletres ε, ι, ρ, la vocal de la terminació es manté com una -α (llarga) en tot el singular. (Ex: ἡ οἰκία = la casa, ἡ χώρα = el país).<\/li><li><strong>Eta (-η):<\/strong> Si l'arrel acaba en qualsevol altra lletra, l'evolució del dialecte àtic va fer que l'alfa original es tancara, convertint-se en una -η en tot el singular. (Ex: ἡ κώμη = l'aldea, ἡ νίκη = la victòria).<\/li><li><strong>Alfa impura (-α breu):<\/strong> També ocorre quan l'arrel no acaba en ε, ι, ρ. En este cas, el nominatiu i acusatiu mantenen una -α (però breu), mentres que el genitiu i el datiu canvien a -η. (Ex: ἡ θάλαττα = el mar, ἡ δόξα = la glòria).<\/li><\/ul>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Alfa Pura (οἰκία)<\/td><td>Eta (κώμη)<\/td><td>Alfa Impura (θάλαττα)<\/td><td>Plural (Idèntic)<\/td><\/tr><tr><td>Nominatiu<\/td><td>οἰκί-α<\/td><td>κώμ-η<\/td><td>θάλαττ-α<\/td><td>-αι (οἰκίαι, κῶμαι)<\/td><\/tr><tr><td>Vocatiu<\/td><td>οἰκί-α<\/td><td>κώμ-η<\/td><td>θάλαττ-α<\/td><td>-αι<\/td><\/tr><tr><td>Acusatiu<\/td><td>οἰκί-αν<\/td><td>κώμ-ην<\/td><td>θάλαττ-αν<\/td><td>-ας (οἰκίας, κώμας)<\/td><\/tr><tr><td>Genitiu<\/td><td>οἰκί-ας<\/td><td>κώμ-ης<\/td><td>θαλάττ-ης<\/td><td>-ῶν (οἰκιῶν, κωμῶν)<\/td><\/tr><tr><td>Datiu<\/td><td>οἰκί-ᾳ<\/td><td>κώμ-ῃ<\/td><td>θαλάττ-ῃ<\/td><td>-αις (οἰκίαις, κώμαις)<\/td><\/tr><\/table><\/div>\n<p><strong>2.2. Substantius Masculins de la 1a declinació<\/strong><\/p>\n<p>Estos substantius expressen sovint oficis o oficis propis d'homes de l'època. S'identifiquen ràpidament perquè el seu Nominatiu singular afig una -ς (acaben en -ας o -ης) i prenen prestat de la segona declinació el Genitiu singular acabat en -ου.<\/p>\n<ul><li><strong>Tipus en -ης:<\/strong> ὁ πολίτης, -ου (el ciutadà), ὁ ναύτης, -ου (el mariner).<\/li><li><strong>Tipus en -ας<\/strong> (arrel acabada en ε, ι, ρ): ὁ νεανίας, -ου (el jove).<\/li><\/ul>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Singular: ὁ πολίτης (el ciutadà)<\/td><td>Plural<\/td><\/tr><tr><td>Nominatiu<\/td><td>ὁ πολίτ-ης<\/td><td>οἱ πολῖτ-αι<\/td><\/tr><tr><td>Vocatiu<\/td><td>ὦ πολῖτ-α (breu)<\/td><td>ὦ πολῖτ-αι<\/td><\/tr><tr><td>Acusatiu<\/td><td>τὸν πολίτ-ην<\/td><td>τοὺς πολίτ-ας<\/td><\/tr><tr><td>Genitiu<\/td><td>τοῦ πολίτ-ου<\/td><td>τῶν πολιτ-ῶν<\/td><\/tr><tr><td>Datiu<\/td><td>τῷ πολίτ-ῃ<\/td><td>τοῖς πολίτ-αις<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> El Genitiu Plural i el desplaçament.<\/p>\n<ul><li>A més de la Llei de Limitació (que sempre s'aplica i fa que, per exemple, el plural πολῖται amb la -αι sentida com breu permete l'accent circumflex, mentres que a πολίτας amb -ας llarga passe a agut: πολί-τας), la primera declinació té una regla estricta:<\/li><li>El Genitiu Plural de <strong>TOTS<\/strong> els substantius de la primera declinació porta sempre accent circumflex a l'última síl·laba (-ῶν). Siga quin siga l'accent en nominatiu. (Ex: ἡ ἡμέρα ➞ τῶν ἡμερῶν / ὁ ναύτης ➞ τῶν ναυτῶν).<\/li><\/ul>\n<h4>3. Els Adjectius de la primera classe<\/h4>\n<p>Com en valencià i llatí, l'adjectiu concorda amb el substantiu al qual acompanya en gènere, nombre i cas. Els adjectius de la 1a classe s'estudien ara perquè utilitzen, precisament, les declinacions que ja coneixem (2a per al masculí i neutre, i 1a per al femení). N'hi ha de dos tipus:<\/p>\n<p><strong>3.1. Tipus 2-1-2 (Tres terminacions)<\/strong><\/p>\n<p>Tenen una forma per a cada gènere. S'enuncien donant el nominatiu singular de cada un: masculí, femení i neutre. El femení formarà el singular per \"alfa pura\" o per \"eta\" depenent de la lletra final de l'arrel (igual que els substantius).<\/p>\n<ul><li>καλός, καλή, καλόν (bell, bonic): 2a decl., 1a decl. en -η, 2a decl.<\/li><li>δίκαιος, δικαία, δίκαιον (just): 2a decl., 1a decl. en alfa pura (arrel en ι), 2a decl.<\/li><\/ul>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Masc. Sg. (2a)<\/td><td>Fem. Sg. (1a)<\/td><td>Neut. Sg. (2a)<\/td><td>Masc. Pl.<\/td><td>Fem. Pl.<\/td><td>Neut. Pl.<\/td><\/tr><tr><td>Nom.<\/td><td>δίκαι-ος<\/td><td>δικαί-α<\/td><td>δίκαι-ον<\/td><td>δίκαι-οι<\/td><td>δίκαι-αι<\/td><td>δίκαι-α<\/td><\/tr><tr><td>Acus.<\/td><td>δίκαι-ον<\/td><td>δικαί-αν<\/td><td>δίκαι-ον<\/td><td>δικαί-ους<\/td><td>δικαί-ας<\/td><td>δίκαι-α<\/td><\/tr><tr><td>Gen.<\/td><td>δικαί-ου<\/td><td>δικαί-ας<\/td><td>δικαί-ου<\/td><td>δικαί-ων<\/td><td>δικαί-ων<\/td><td>δικαί-ων<\/td><\/tr><tr><td>Dat.<\/td><td>δικαί-ῳ<\/td><td>δικαί-ᾳ<\/td><td>δικαί-ῳ<\/td><td>δικαί-οις<\/td><td>δικαί-αις<\/td><td>δικαί-οις<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>NOTA D'ACCENTUACIÓ.<\/strong> Excepcionalment, el genitiu plural femení dels adjectius (i pronoms) tipus 2-1-2 seguix l'accentuació del masculí i no porta l'accent circumflex final típic dels substantius. Així, escrivim τῶν δικαίων γυναικῶν (i no δικαιῶν).<\/p>\n<p><strong>3.2. Tipus 2-2 (Dues terminacions)<\/strong><\/p>\n<p>El masculí i el femení compartixen la mateixa forma (que es declina per la 2a declinació). El neutre té la seua pròpia forma (també per la 2a declinació). Este grup està format fonamentalment per adjectius compostos, com aquells que porten el prefix privatiu α-.<\/p>\n<ul><li>ἄδικος, ἄδικον (injust).<\/li><li>ἀθάνατος, ἀθάνατον (immortal).<\/li><\/ul>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Masc. / Fem. Sg.<\/td><td>Neutre Sg.<\/td><td>Masc. / Fem. Pl.<\/td><td>Neutre Pl.<\/td><\/tr><tr><td>Nom.<\/td><td>ὁ / ἡ ἄδικος<\/td><td>τὸ ἄδικον<\/td><td>οἱ / αἱ ἄδικοι<\/td><td>τὰ ἄδικα<\/td><\/tr><tr><td>Acus.<\/td><td>τὸν / τὴν ἄδικον<\/td><td>τὸ ἄδικον<\/td><td>τοὺς / τὰς ἀδίκους<\/td><td>τὰ ἄδικα<\/td><\/tr><\/table><\/div>\n<p><strong>3.3. Posició atributiva i predicativa<\/strong><\/p>\n<p>La presència o absència de l'article davant de l'adjectiu canvia completament l'estructura de la frase grega:<\/p>\n<ul><li><strong>Posició Atributiva:<\/strong> L'adjectiu va immediatament precedit per l'article i fa la funció d'un adjectiu normal (Complement del Nom).<\/li><\/ul>\n<p>Ex: ὁ καλὸς ἀγρός o bé ὁ ἀγρὸς ὁ καλός = El camp bonic.<\/p>\n<ul><li><strong>Posició Predicativa:<\/strong> El substantiu porta article, però l'adjectiu NO en porta al davant. En este cas, l'adjectiu fa funció d'Atribut d'una oració copulativa, encara que el verb \"ser\" (εἰμί) estiga omés.<\/li><\/ul>\n<p>Ex: καλὸς ὁ ἀγρός o bé ὁ ἀγρὸς καλός [ἐστιν] = El camp (és) bonic.<\/p>\n<h4>4. L'expressió de l'espai (Ubi, Quo, Unde)<\/h4>\n<p>Igual que en llatí els complements circumstancials de lloc s'estudien al voltant de tres grans preguntes, el grec utilitza unes combinacions estables de preposicions i casos per a indicar l'espai.<\/p>\n<div class=\"tw\"><table><tr><td>Pregunta Llatina<\/td><td>Concepte<\/td><td>Cas Grec<\/td><td>Preposicions principals<\/td><td>Exemples<\/td><\/tr><tr><td>UBI?<\/td><td>Lloc on s'està (Repòs)<\/td><td>Datiu<\/td><td>ἐν (en, dins de)<\/td><td>ἐν τῇ οἰκίᾳ (a la casa) · ἐν τῷ ἀγρῷ (en el camp)<\/td><\/tr><tr><td>QUO?<\/td><td>Cap a on es va (direcció)<\/td><td>Acusatiu<\/td><td>εἰς (cap a dins de) · πρὸς (cap a, en direcció a)<\/td><td>εἰς τὴν ὕλην (cap al bosc) · πρὸς τὴν κώμην (cap a l'aldea)<\/td><\/tr><tr><td>UNDE?<\/td><td>D'on es ve (Origen/Eixida)<\/td><td>Genitiu<\/td><td>ἐκ / ἐξ (des de dins, d'eixir) · ἀπό (des de fora, d'allunyar-se)<\/td><td>ἐκ τῆς κώμης (des de l'aldea) · ἀπὸ τοῦ δένδρου (des de l'arbre)<\/td><\/tr><\/table><\/div>\n<h4>5. L'Imperfet d'indicatiu actiu i l'augment<\/h4>\n<p>El temps Imperfet expressa una acció continuada, habitual o en procés de realització en el passat (equivalent al nostre \"jo deslligava\", \"ell cantava\").<\/p>\n<p>En grec, la marca inconfusible del passat en el mode indicatiu és l'augment, un element que s'afig a l'inici del verb. Es fa de dues maneres depenent de l'inici de l'arrel verbal:<\/p>\n<ul><li><strong>L'augment sil·làbic:<\/strong> Per als verbs que comencen per consonant. Consistix a afegir una èpsilon (ἐ-) amb esperit suau al principi de la paraula, sumant una síl·laba nova.<\/li><\/ul>\n<p>Ex: λύω ➞ ἔ-λυον.<\/p>\n<ul><li><strong>L'augment temporal:<\/strong> Per als verbs que comencen per vocal o diftong. Com que no es pot afegir una \"ἐ-\" per evitar un xoc, la vocal inicial del verb \"s'allarga\", necessitant més \"temps\" de pronunciació.<\/li><li>α / ε ➞ s'allarguen en η (Ex: ἄγω ➞ ἦγον ; ἐλπίζω ➞ ἤλπιζον).<\/li><li>ο ➞ s'allarga en ω (Ex: ὀνομάζω ➞ ὠνόμαζον).<\/li><li>ι / υ ➞ s'allarguen en ῑ / ῡ (s'escriuen igual, però canvien de breus a llargues).<\/li><li>αι / ᾳ ➞ ῃ (la iota original passa a ser iota subscrita).<\/li><li>οι ➞ ῳ (la iota passa a ser subscrita).<\/li><li>αυ / ευ ➞ ηυ.<\/li><\/ul>\n<p><strong>5.1. Conjugació de l'imperfet Actiu (Model λύω)<\/strong><\/p>\n<p>La fórmula és: Augment + Arrel del present + Vocal d'unió (ο/ε) + Desinències secundàries actvies.<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Singular (jo deslligava, etc.)<\/td><td>Plural (nosaltres deslligàvem, etc.)<\/td><\/tr><tr><td>1a (Jo/Nos.)<\/td><td>ἔ-λυ-ο-ν<\/td><td>ἐ-λύ-ο-μεν<\/td><\/tr><tr><td>2a (Tu/Vos.)<\/td><td>ἔ-λυ-ε-ς<\/td><td>ἐ-λύ-ε-τε<\/td><\/tr><tr><td>3a (Ell/Ells)<\/td><td>ἔ-λυ-ε(ν)<\/td><td>ἔ-λυ-ο-ν<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> L'accent \"cau\" sobre l'augment.<\/p>\n<p>Els verbs tenen accent recessiu (\"fugix\" cap arrere). En l'imperfet, en afegir-se l'augment, l'accent intenta retrocedir tot el que puga. En formes com ἔλυον (com la -ον final és breu), l'accent pot anar-se'n fins a l'avantpenúltima síl·laba, caient exactament sobre l'augment.<\/p>\n<p><strong>5.2. L'Imperfet del verb εἰμί<\/strong><\/p>\n<p>El passat del verb copulatiu és molt freqüent, però irregular, amb l'augment ja marcat en la seua lletra inicial (η-).<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Singular<\/td><td>Plural<\/td><\/tr><tr><td>1a<\/td><td>ἦ / ἦν (jo era / estava)<\/td><td>ἦμεν (érem / estàvem)<\/td><\/tr><tr><td>2a<\/td><td>ἦσθα (tu eres / estaves)<\/td><td>ἦτε (éreu / estàveu)<\/td><\/tr><tr><td>3a<\/td><td>ἦν (ell/a era / estava)<\/td><td>ἦσαν (eren / estaven)<\/td><\/tr><\/table><\/div>\n<h4>6. Els verbs contractes en present (-άω, -έω, -όω)<\/h4>\n<p>Fins ara hem conjugat el verb λύω, l'arrel del qual acaba en consonant (o semiconsonant). Però en grec, hi ha infinitat de verbs d'ús diari l'arrel dels quals acaba en vocal (-α, -ε, -ο). En unir-se amb les vocals de les desinències (ω, εις, ει, ομεν…), produïxen xocs que es resolen mitjançant la contracció de vocals, fusionant-se en una de sola o diftong.<\/p>\n<p><strong>Regles bàsiques generals del present actiu:<\/strong><\/p>\n<ul><li><strong>Verbs en -άω<\/strong> (tipus τιμάω = honrar): L'alfa final \"es menja\" les èpsilons donant α, i amb els sons \"o\" dóna ω.<\/li><li><strong>Verbs en -έω<\/strong> (tipus ποιέω = fer): Són els més freqüents. La èpsilon amb \"o\" dóna sempre el diftong ου; i amb \"e\" dóna sempre ει. Si seguix una vocal llarga (ω), l'èpsilon s'absorbix i desapareix.<\/li><li><strong>Verbs en -όω<\/strong> (tipus δηλόω = mostrar): L'òmicron, fortíssima, fusiona qualsevol so donant el diftong ου, excepte si a la desinència hi ha una iota (-ει), cas en el qual dóna οι.<\/li><\/ul>\n<p><strong>Quadre del Present d'Indicatiu Actiu Contracte<\/strong><\/p>\n<p>S'indica entre parèntesis el procés de contracció, que és el que explica per què trobem estes formes tancades als textos.<\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>-άω: τιμάω (honrar)<\/td><td>-έω: ποιέω (fer)<\/td><td>-όω: δηλόω (mostrar)<\/td><\/tr><tr><td>1a sg. (-ω)<\/td><td>τιμῶ (α+ω)<\/td><td>ποιῶ (ε+ω)<\/td><td>δηλῶ (ο+ω)<\/td><\/tr><tr><td>2a sg. (-εις)<\/td><td>τιμᾷς (α+ει)<\/td><td>ποιεῖς (ε+ει)<\/td><td>δηλοῖς (ο+ει)<\/td><\/tr><tr><td>3a sg. (-ει)<\/td><td>τιμᾷ (α+ει)<\/td><td>ποιεῖ (ε+ει)<\/td><td>δηλοῖ (ο+ει)<\/td><\/tr><tr><td>1a pl. (-ομεν)<\/td><td>τιμῶμεν (α+ο)<\/td><td>ποιοῦμεν (ε+ο)<\/td><td>δηλοῦμεν (ο+ο)<\/td><\/tr><tr><td>2a pl. (-ετε)<\/td><td>τιμᾶτε (α+ε)<\/td><td>ποιεῖτε (ε+ε)<\/td><td>δηλοῦτε (ο+ε)<\/td><\/tr><tr><td>3a pl. (-ουσι)<\/td><td>τιμῶσι(ν) (α+ου)<\/td><td>ποιοῦσι(ν) (ε+ου)<\/td><td>δηλοῦσι(ν) (ο+ου)<\/td><\/tr><tr><td>Infinitiu<\/td><td>τιμᾶν<\/td><td>ποιεῖν<\/td><td>δηλοῦν<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> El naixement de l'accent circumflex.<\/p>\n<p>Quan es produïx la contracció vocàlica, si la primera de les dues vocals que es fusionen portava originalment l'accent agut (ex: ποιέ-ω), la nova síl·laba resultant passa a portar un accent circumflex (ποιῶ, ποιοῦμεν, ποιεῖς…). Açò és crucial per a reconéixer visualment un verb contracte al bell mig d'un text.<\/p>","lexicon":[{"e":"γῆ, γῆς, ἡ","t":"terra","g":"Substantius"},{"e":"δέσποινα, -ης, ἡ","t":"senyora, mestressa","g":"Substantius"},{"e":"δεσπότης, -ου, ὁ","t":"senyor, amo","g":"Substantius"},{"e":"θάλαττα, -ης, ἡ","t":"mar","g":"Substantius"},{"e":"θεά, -ᾶς, ἡ","t":"deessa","g":"Substantius"},{"e":"κλέπτης, -ου, ὁ","t":"lladre","g":"Substantius"},{"e":"κώμη, -ης, ἡ","t":"aldea, poblet","g":"Substantius"},{"e":"λύπη, -ης, ἡ","t":"dolor, pena, tristesa","g":"Substantius"},{"e":"νῆσος, -ου, ἡ","t":"illa (nota: és de la 2a declinació, però de gènere femení)","g":"Substantius"},{"e":"οἰκία, -ας, ἡ","t":"casa","g":"Substantius"},{"e":"ὀργή, -ῆς, ἡ","t":"ira, ràbia, enfadament","g":"Substantius"},{"e":"πρόβατον, -ου, τό","t":"ovella; (en plural) ramat","g":"Substantius"},{"e":"ῥόδον, -ου, τό","t":"rosa","g":"Substantius"},{"e":"σκιά, -ᾶς, ἡ","t":"ombra","g":"Substantius"},{"e":"ὕλη, -ης, ἡ","t":"bosc","g":"Substantius"},{"e":"φυγή, -ῆς, ἡ","t":"fugida","g":"Substantius"},{"e":"Ἅιδης, -ου, ὁ","t":"Hades (déu de l'inframon)","g":"Noms propis"},{"e":"Δημήτηρ, ἡ","t":"Demèter","g":"Noms propis"},{"e":"Ἑλένη, -ης, ἡ","t":"Hèlena","g":"Noms propis"},{"e":"Περσεφόνη, -ης, ἡ","t":"Persèfone","g":"Noms propis"},{"e":"Σικελία, -ας, ἡ","t":"Sicília","g":"Noms propis"},{"e":"ἄγριος, -α, -ον","t":"salvatge, ferotge","g":"Adjectius"},{"e":"ἄδικος, -ον","t":"injust (adjectiu de 2 terminacions)","g":"Adjectius"},{"e":"ἀθάνατος, -ον","t":"immortal (adjectiu de 2 terminacions)","g":"Adjectius"},{"e":"ἄλλος, -η, -ο","t":"altre, un altre","g":"Adjectius"},{"e":"μέγας, μεγάλη, μέγα","t":"gran","g":"Adjectius"},{"e":"σκοτεινός, -ή, -όν","t":"fosc, tenebrós","g":"Adjectius"},{"e":"ἀναβαίνω, ἀναβήσομαι, ἀνέβην","t":"pujar, eixir cap a dalt","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἁρπάζω, ἁρπάσω, ἥρπασα","t":"arrencar, agafar amb força, raptar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βοάω, βοήσομαι, ἐβόησα","t":"cridar, exclamar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"δηλόω, δηλώσω, ἐδήλωσα","t":"mostrar, fer evident","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"διώκω, διώξω, ἐδίωξα","t":"perseguir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ζητέω, ζητήσω, ἐζήτησα","t":"buscar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"καλέω, καλῶ, ἐκάλεσα","t":"cridar, anomenar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"κρύπτω, κρύψω, ἔκρυψα","t":"amagar, ocultar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"μισέω, μισήσω, ἐμίσησα","t":"odiar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"οἰκέω, οἰκήσω, ᾤκησα","t":"habitar, viure","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ὁράω, ὄψομαι, εἶδον","t":"vore (veure), mirar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ποιέω, ποιήσω, ἐποίησα","t":"fer","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"τρέχω, δραμοῦμαι, ἔδραμον","t":"córrer","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φιλέω, φιλήσω, ἐφίλησα","t":"amar, estimar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φυλάττω, φυλάξω, ἐφύλαξα","t":"vigilar, protegir","g":"Verbs (Enunciats: Present, Futur, Aorist)"}]},{"n":4,"title":"El segle IV, Alexandre i el món hel·lenístic","cultura":"<h3>El segle IV, Alexandre i el món hel·lenístic<\/h3>\n<h4>1. Un segle d'hegemonies fracassades<\/h4>\n<p>La derrota d'Atenes el 404 aC no va portar la pau, sinó una successió de dominis breus i inestables.<\/p>\n<p><strong>L'hegemonia espartana (404-371 aC).<\/strong> Esparta va imposar guarnicions i governs oligàrquics a les ciutats alliberades, i es va fer tan impopular com abans ho havia sigut Atenes. La guerra de Corint (395-386 aC) va enfrontar-la amb una coalició de Tebes, Atenes, Corint i Argos. El conflicte es va tancar amb la Pau del Rei o Pau d'Antàlcides (386 aC), un acord humiliant negociat amb Pèrsia: el rei persa recuperava les ciutats gregues d'Àsia i es convertia en àrbitre dels afers grecs.<\/p>\n<p><strong>L'hegemonia tebana (371-362 aC).<\/strong> Tebes, dirigida per <strong>Epaminondes<\/strong> i Pelòpides, va renovar la tàctica militar amb la falange obliqua i el cos d'elit del Batalló Sagrat. A <strong>Leuctres<\/strong> (371 aC) va derrotar l'exèrcit espartà, considerat invencible. Epaminondes va envair el Peloponés, va alliberar Messènia i va deixar Esparta reduïda a una potència local. La mort d'Epaminondes a <strong>Mantinea<\/strong> (362 aC) va acabar amb el projecte tebà.<\/p>\n<p>El resultat de més de quatre dècades de lluites va ser l'esgotament general: ciutats empobrides, exèrcits cada vegada més formats per mercenaris i una desconfiança creixent respecte de la capacitat de la polis per a garantir seguretat.<\/p>\n<h4>2. L'ascens de Macedònia<\/h4>\n<p>Macedònia, al nord, havia sigut considerada una regió perifèrica i poc hel·lenitzada. <strong>Filip II<\/strong> (359-336 aC) la va transformar en la primera potència militar de Grècia: va unificar el regne, va explotar les mines d'or del Pangeu i va crear un exèrcit professional que combinava una falange amb llances de fins a sis metres, la <em>sarissa<\/em>, amb una cavalleria de xoc.<\/p>\n<p>La seua expansió cap al sud va dividir l'opinió grega. A Atenes, <strong>Demòstenes<\/strong> va pronunciar les <em>Filípiques<\/em> advertint del perill, mentre que <strong>Isòcrates<\/strong> defenia que només un cabdill fort podria unir els grecs contra Pèrsia. El 338 aC, la batalla de <strong>Queronea<\/strong> va decidir la qüestió: Filip va véncer l'exèrcit conjunt d'Atenes i Tebes. L'any següent va organitzar la Lliga de Corint, que reunia les ciutats gregues sota direcció macedònica i preparava la guerra contra l'imperi persa. La polis conservava les seues institucions, però havia perdut la independència real.<\/p>\n<h4>3. Alexandre el Gran (336-323 aC)<\/h4>\n<p>Assassinat Filip, el seu fill <strong>Alexandre<\/strong>, de vint anys i educat per Aristòtil, va assumir el projecte. En poc més d'una dècada va desfer l'imperi persa.<\/p>\n<p>Va travessar l'Hel·lespont el 334 aC i va véncer al <strong>Grànic<\/strong>. El 333 aC va derrotar el rei Darios III a <strong>Issos<\/strong> i va ocupar la costa siriopalestina i Egipte, on va fundar <strong>Alexandria<\/strong>. El 331 aC, la victòria de <strong>Gaugamela<\/strong> li va obrir Babilònia, Susa i Persèpolis. Va continuar cap a l'Àsia central i l'Índia, fins que les seues tropes es van negar a avançar més enllà del riu Hifasis. Va morir a Babilònia el 323 aC, als trenta-dos anys.<\/p>\n<p>Alexandre no va ser només un conquistador. Va fundar desenes de ciutats de model grec, va incorporar aristocràcia persa a l'administració, va adoptar costums orientals i va promoure matrimonis mixtos. Eixa política, criticada per part dels seus oficials, responia a la idea de governar un imperi de pobles diversos.<\/p>\n<h4>4. Els regnes hel·lenístics<\/h4>\n<p>A la mort d'Alexandre, els seus generals —els <strong>diàdocs<\/strong> o successors— es van repartir el territori després de quaranta anys de guerres. En van sorgir tres grans monarquies:<\/p>\n<ul><li><strong>L'Egipte dels Ptolemeus<\/strong>, amb capital a Alexandria, el més ric i estable, que va durar fins al 30 aC.<\/li><li><strong>L'imperi selèucida<\/strong>, hereu de la major part d'Àsia, extens i difícil de mantindre unit.<\/li><li><strong>La Macedònia dels Antigònides<\/strong>, que controlava indirectament Grècia.<\/li><\/ul>\n<p>A més, hi havia estats menors com el regne de Pèrgam i les lligues federals d'Etòlia i d'Acaia, un intent tardà d'unió entre poleis.<\/p>\n<p>El model polític ja no és la ciutat sobirana, sinó la monarquia territorial: un rei amb exèrcit professional, burocràcia i culte a la seua persona.<\/p>\n<h4>5. La cultura hel·lenística<\/h4>\n<p>L'època hel·lenística (323-30 aC) és una de les més fecundes de l'antiguitat.<\/p>\n<p><strong>Una llengua comuna.<\/strong> Els dialectes cedixen davant de la <em>koiné<\/em>, una variant simplificada basada en l'àtic, que es convertix en la llengua franca del Mediterrani oriental. En koiné s'escriuran la traducció grega de la Bíblia i, més tard, el Nou Testament.<\/p>\n<p><strong>Alexandria, capital intel·lectual.<\/strong> Els Ptolemeus hi van fundar el <strong>Museu<\/strong>, una institució de recerca amb salaris pagats per la corona, i la <strong>Biblioteca<\/strong>, que aspirava a reunir tots els llibres del món. Allí es van fixar els textos d'Homer i es van crear la filologia, la crítica textual i la gramàtica com a disciplines.<\/p>\n<p><strong>La ciència.<\/strong> És el moment de major desenrotllament científic de l'antiguitat: <strong>Euclides<\/strong> sistematitza la geometria; <strong>Arquimedes<\/strong> de Siracusa treballa en mecànica i hidrostàtica; <strong>Eratòstenes<\/strong> calcula amb notable precisió la circumferència de la Terra; <strong>Aristarc de Samos<\/strong> proposa un model heliocèntric; <strong>Hiparc<\/strong> avança l'astronomia i la trigonometria.<\/p>\n<p><strong>La filosofia.<\/strong> Davant d'un món on l'individu ja no decidix el destí de la seua ciutat, les escoles busquen la felicitat personal. L'<strong>estoïcisme<\/strong> de Zenó predica viure d'acord amb la raó i la natura i accepta el que no depén de nosaltres. L'<strong>epicureisme<\/strong> situa el bé en un plaer entés com a absència de dolor i de pertorbació. Els <strong>cínics<\/strong> rebutgen les convencions socials. Totes tres comparteixen un ideal cosmopolita: el savi és ciutadà del món.<\/p>\n<p><strong>Les arts.<\/strong> L'escultura abandona la serenitat clàssica i busca el moviment, el patetisme i el retrat individual. L'urbanisme regular i els grans edificis públics es difonen per tot l'orient.<\/p>\n<h4>6. Grècia i Roma<\/h4>\n<p>Mentre els regnes hel·lenístics es desgastaven en guerres mútues, Roma s'expandia cap a l'est. Després de véncer Macedònia (168 aC), Roma va intervindre directament a Grècia; el 146 aC va destruir <strong>Corint<\/strong> i va sotmetre Grècia al control del governador de Macedònia; la província d'Acaia no es va crear fins al 27 aC. L'últim estat hel·lenístic, l'Egipte de Cleòpatra, va caure el 30 aC.<\/p>\n<p>La derrota militar no va significar la desaparició cultural. Els romans van adoptar la literatura, la filosofia, l'art i l'educació gregues, fins al punt que el poeta Horaci va escriure que la Grècia conquistada havia conquistat el seu ferotge vencedor. A través de Roma, i després de Bizanci i del Renaixement, l'herència grega ha arribat fins a nosaltres.<\/p>","gram":"<h3>La tercera declinació (I), la veu mitjana i el futur<\/h3>\n<p>En este tema farem un gran pas en l'estudi de la morfologia grega. D'una banda, abordarem la declinació més rica i freqüent del grec: la tercera declinació. D'altra banda, ampliarem el sistema verbal introduint una veu completament nova (la veu mitjana) i aprendrem a expressar accions en el futur.<\/p>\n<h4>1. La tercera declinació (I): Temes en consonant<\/h4>\n<p>La tercera declinació inclou substantius i adjectius dels tres gèneres (masculí, femení i neutre). El tret infal·lible per a reconéixer que una paraula pertany a esta declinació és el seu Genitiu Singular, que sempre acaba en -ος (o de vegades en -ως).<\/p>\n<p>A diferència de la primera i la segona declinació, ací l'arrel de la paraula acaba en consonant. A continuació presentem les desinències generals. Notaràs que el masculí i el femení compartixen terminacions, mentres que el neutre té les seues pròpies.<\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Singular (Masc. / Fem.)<\/td><td>Singular (Neutre)<\/td><td>Plural (Masc. / Fem.)<\/td><td>Plural (Neutre)<\/td><\/tr><tr><td>Nominatiu<\/td><td>-ς / Ø (s'allarga la vocal)<\/td><td>Ø (arrel pura)<\/td><td>-ες<\/td><td>-α<\/td><\/tr><tr><td>Vocatiu<\/td><td>-ς / Ø (arrel pura)<\/td><td>Ø (arrel pura)<\/td><td>-ες<\/td><td>-α<\/td><\/tr><tr><td>Acusatiu<\/td><td>-α / -ν<\/td><td>Ø (arrel pura)<\/td><td>-ας<\/td><td>-α<\/td><\/tr><tr><td>Genitiu<\/td><td>-ος<\/td><td>-ος<\/td><td>-ων<\/td><td>-ων<\/td><\/tr><tr><td>Datiu<\/td><td>-ι<\/td><td>-ι<\/td><td>-σι(ν)<\/td><td>-σι(ν)<\/td><\/tr><\/table><\/div>\n<p><strong>1.1. Temes en consonant muda (Oclusives)<\/strong><\/p>\n<p>Les consonants oclusives provoquen xocs ortogràfics quan s'ajunten amb la sigma (-ς) del Nominatiu singular i del Datiu plural masculí/femení:<\/p>\n<ul><li><strong>Labials (π, β, φ) + ς = ψ<\/strong> (Ex: ἡ φλέψ, φλεβ-ός = la vena).<\/li><li><strong>Guturals (κ, γ, χ) + ς = ξ<\/strong> (Ex: ὁ φύλαξ, φύλακ-ος = el guardià).<\/li><li><strong>Dentals (τ, δ, θ) + ς = ς<\/strong> (La dental cau i desapareix. Ex: ἡ ἐλπίς, ἐλπίδ-ος = l'esperança).<\/li><\/ul>\n<p class=\"quadre\"><strong>ATENCIÓ ALS NEUTRES EN DENTAL (-Τ).<\/strong> En grec, cap paraula pot acabar en tau. Per això, en el Nominatiu/Vocatiu/Acusatiu singular, la -τ final cau i desapareix (Ex: τὸ σῶμα, σώματ-ος = el cos).<\/p>\n<p><strong>Models de declinació (Oclusives):<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Gutural (M): ὁ φύλαξ<\/td><td>Dental (F): ἡ ἐλπίς<\/td><td>Dental (Neutre): τὸ σῶμα<\/td><\/tr><tr><td>Nominatiu<\/td><td>φύλαξ (κ+ς)<\/td><td>ἐλπίς (δ+ς)<\/td><td>σῶμα (cau la τ)<\/td><\/tr><tr><td>Vocatiu<\/td><td>φύλαξ<\/td><td>ἐλπί<\/td><td>σῶμα<\/td><\/tr><tr><td>Acusatiu<\/td><td>φύλακ-α<\/td><td>ἐλπίδ-α<\/td><td>σῶμα<\/td><\/tr><tr><td>Genitiu<\/td><td>φύλακ-ος<\/td><td>ἐλπίδ-ος<\/td><td>σώματ-ος<\/td><\/tr><tr><td>Datiu<\/td><td>φύλακ-ι<\/td><td>ἐλπίδ-ι<\/td><td>σώματ-ι<\/td><\/tr><tr><td>Nom/Voc Pl.<\/td><td>φύλακ-ες<\/td><td>ἐλπίδ-ες<\/td><td>σώματ-α<\/td><\/tr><tr><td>Acusatiu Pl.<\/td><td>φύλακ-ας<\/td><td>ἐλπίδ-ας<\/td><td>σώματ-α<\/td><\/tr><tr><td>Genitiu Pl.<\/td><td>φυλάκ-ων<\/td><td>ἐλπίδ-ων<\/td><td>σωμάτ-ων<\/td><\/tr><tr><td>Datiu Pl.<\/td><td>φύλαξι(ν) (κ+σι)<\/td><td>ἐλπίσι(ν) (δ+σι)<\/td><td>σώμασι(ν) (τ+σι)<\/td><\/tr><\/table><\/div>\n<p><strong>1.2. Temes en consonant contínua (Líquides i Nasals)<\/strong><\/p>\n<p>Estos temes formen el seu nominatiu masculí i femení sense afegir sigma. Per a marcar que és nominatiu, allarguen la vocal de l'última síl·laba de l'arrel (la ε passa a η, i la ο passa a ω).<\/p>\n<ul><li><strong>Nasals en -ν:<\/strong> ὁ δαίμων, δαίμον-ος (la divinitat/destí) / ὁ ποιμήν, ποιμέν-ος (el pastor). <em>Nota:<\/em> Al Datiu plural, la -ν- cau davant la -σι- sense deixar rastre (δαίμο-σι).<\/li><li><strong>Líquides en -ρ:<\/strong> ὁ ῥήτωρ, ῥήτορ-ος (l'orador).<\/li><li><strong>Temes en -ρ amb síncope (Noms de parentesc):<\/strong><\/li><\/ul>\n<p>Certs noms de família, com πατήρ (pare) o μήτηρ (mare), patixen una \"síncope\" (pèrdua de la vocal -ε- de l'arrel) en el Genitiu i Datiu singular, i inserixen una -α- breu en el Datiu plural per a facilitar la pronúncia.<\/p>\n<div class=\"tw\"><table><tr><td>Cas<\/td><td>Singular (ὁ πατήρ)<\/td><td>Plural (οἱ πατέρες)<\/td><\/tr><tr><td>Nominatiu<\/td><td>πατήρ (s'allarga)<\/td><td>πατέρ-ες<\/td><\/tr><tr><td>Vocatiu<\/td><td>πάτερ (arrel pura)<\/td><td>πατέρ-ες<\/td><\/tr><tr><td>Acusatiu<\/td><td>πατέρ-α<\/td><td>πατέρ-ας<\/td><\/tr><tr><td>Genitiu<\/td><td>πατρ-ός (cau la ε)<\/td><td>πατέρ-ων<\/td><\/tr><tr><td>Datiu<\/td><td>πατρ-ί (cau la ε)<\/td><td>πατρ-ά-σι(ν) (s'afig α)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> La regla dels monosíl·labs<\/p>\n<p>En la tercera declinació, els substantius l'arrel dels quals és d'una sola síl·laba (monosíl·labs) tenen una regla especial: l'accent es desplaça a la desinència en el Genitiu i el Datiu (tant en singular com en plural).<\/p>\n<p>Exemple amb πούς, ποδ-ός (el peu):<\/p>\n<ul><li>Nom/Acus: πούς, πόδ-α, πόδ-ες, πόδ-ας (Accent a l'arrel).<\/li><li>Gen/Dat: ποδ-ός, ποδ-ί, ποδ-ῶν, πο-σί (Accent a la cua).<\/li><\/ul>\n<h4>2. La Veu Mitjana-Passiva i els verbs deponents<\/h4>\n<p>El llatí i el valencià només tenen veu activa (el subjecte fa l'acció) i passiva (el subjecte rep l'acció). El grec té una tercera veu, molt utilitzada, anomenada veu mitjana.<\/p>\n<p>La veu mitjana indica que el subjecte realitza l'acció amb un interés especial per a ell mateix, sobre alguna cosa seua o en el seu propi profit. Sovint es pot traduir com un verb reflexiu o pronominal.<\/p>\n<ul><li><strong>Activa:<\/strong> λούω τὸν παῖδα (jo llabe el xiquet).<\/li><li><strong>Mitjana:<\/strong> λούομαι (jo em llabe, o llabe les meues coses).<\/li><\/ul>\n<p>En els temps del sistema de Present (Present i Imperfet d'indicatiu), la veu mitjana i la veu passiva utilitzen exactament les mateixes terminacions. El context ens dirà si cal traduir-ho com a mitjana o com a passiva.<\/p>\n<p><strong>2.1. Conjugació Mitjà-Passiva (Model λύω)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Present d'Indicatiu (deslligue per a mi / sóc deslligat)<\/td><td>Imperfet d'Indicatiu (deslligava per a mi / era deslligat)<\/td><\/tr><tr><td>1a sg.<\/td><td>λύ-ομαι<\/td><td>ἐ-λυ-όμην<\/td><\/tr><tr><td>2a sg.<\/td><td>λύ-ῃ (o λύ-ει)<\/td><td>ἐ-λύ-ου<\/td><\/tr><tr><td>3a sg.<\/td><td>λύ-εται<\/td><td>ἐ-λύ-ετο<\/td><\/tr><tr><td>1a pl.<\/td><td>λυ-όμεθα<\/td><td>ἐ-λυ-όμεθα<\/td><\/tr><tr><td>2a pl.<\/td><td>λύ-εσθε<\/td><td>ἐ-λύ-εσθε<\/td><\/tr><tr><td>3a pl.<\/td><td>λύ-ονται<\/td><td>ἐ-λύ-οντο<\/td><\/tr><tr><td>Infinitiu<\/td><td>λύ-εσθαι<\/td><td>-<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ VERBAL.<\/strong><\/p>\n<p class=\"quadre\">Recorda que l'accent dels verbs és sempre recessiu (fuig cap arrere el que permet l'última síl·laba).<\/p>\n<p class=\"quadre\">• En l'imperfet, a l'haver-hi un augment al principi, l'accent sol recaure sobre ell (ex: ἐ-λύ-ε-το).<\/p>\n<p class=\"quadre\">• En l'Infinitiu (λύ-εσθαι), el diftong final \"-αι\" es considera breu a efectes d'accentuació, permetent que l'accent remunte fins a l'avantpenúltima síl·laba (λύ-εσ-θαι).<\/p>\n<p><strong>2.2. Els verbs deponents<\/strong><\/p>\n<p>Igual que en llatí, en grec existixen verbs deponents. Són verbs que no tenen formes actives; només es conjuguen amb les desinències de la veu mitjà-passiva (s'enuncien acabant en -ομαι en lloc de -ω), però el seu significat és totalment actiu.<\/p>\n<p>Exemples molt freqüents que voràs als textos:<\/p>\n<ul><li>ἔρχομαι (anar, vindre)<\/li><li>βούλομαι (voler, desitjar)<\/li><li>γίγνομαι (arribar a ser, nàixer, ocórrer)<\/li><\/ul>\n<h4>3. El temps Futur d'indicatiu<\/h4>\n<p>El temps futur s'utilitza per a accions venidores. A diferència de l'imperfet, el futur NO porta augment, ja que l'augment és una marca exclusiva del temps passat.<\/p>\n<p>La seua marca temporal característica és una lletra sigma (-σ-) que s'insereix entre l'arrel del verb i la vocal temàtica.<\/p>\n<p><strong>Fórmula:<\/strong> Arrel + σ + Vocal temàtica (ο/ε) + Desinències primàries<\/p>\n<p><strong>3.1. Conjugació del Futur (Actiu i Mitjà)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td>Persona<\/td><td>Futur Actiu (λύσω)<\/td><td>Futur Mitjà (λύσομαι)<\/td><\/tr><tr><td>1a sg.<\/td><td>λύ-σ-ω<\/td><td>λύ-σ-ο-μαι<\/td><\/tr><tr><td>2a sg.<\/td><td>λύ-σ-ει-ς<\/td><td>λύ-σ-ῃ (o λύ-σ-ει)<\/td><\/tr><tr><td>3a sg.<\/td><td>λύ-σ-ει<\/td><td>λύ-σ-ε-ται<\/td><\/tr><tr><td>1a pl.<\/td><td>λύ-σ-ο-μεν<\/td><td>λυ-σ-ό-μεθα<\/td><\/tr><tr><td>2a pl.<\/td><td>λύ-σ-ε-τε<\/td><td>λύ-σ-ε-σθε<\/td><\/tr><tr><td>3a pl.<\/td><td>λύ-σ-ου-σι(ν)<\/td><td>λύ-σ-ο-νται<\/td><\/tr><tr><td>Infinitiu<\/td><td>λύ-σ-ειν<\/td><td>λύ-σ-εσθαι<\/td><\/tr><\/table><\/div>\n<p><strong>3.2. Canvis fonètics en el Futur<\/strong><\/p>\n<p>Al formar-se amb una sigma (-σ-), els verbs que tenen l'arrel acabada en consonant oclusiva patiran els mateixos xocs ortogràfics que hem estudiat a la tercera declinació:<\/p>\n<ul><li><strong>Labials (π, β, φ) + σ = ψ<\/strong> (Ex: πέμπω ➞ πέμψω).<\/li><li><strong>Guturals (κ, γ, χ) + σ = ξ<\/strong> (Ex: διώκω ➞ διώξω).<\/li><li><strong>Dentals (τ, δ, θ) + σ = σ<\/strong> (Ex: πείθω ➞ πείσω).<\/li><\/ul>","lexicon":[{"e":"Ἀθῆναι, Ἀθηνῶν, αἱ","t":"Atenes (nom propi, s'usa en plural)","g":"Substantius"},{"e":"ἀνήρ, ἀνδρός, ὁ","t":"home, baró (en oposició a dona), marit","g":"Substantius"},{"e":"βίος, -ου, ὁ","t":"vida","g":"Substantius"},{"e":"βραχίων, βραχίονος, ὁ","t":"braç","g":"Substantius"},{"e":"γέρων, γέροντος, ὁ","t":"ancià, vell","g":"Substantius"},{"e":"δάκρυον, -ου, τό","t":"llàgrima","g":"Substantius"},{"e":"εἰρήνη, -ης, ἡ","t":"pau","g":"Substantius"},{"e":"Ἡρακλῆς, -έους, ὁ","t":"Hèracles (Hèrcules)","g":"Substantius"},{"e":"λέων, λέοντος, ὁ","t":"lleó","g":"Substantius"},{"e":"Νεμέα, -ας, ἡ","t":"Nemea (bosc i regió mítica)","g":"Substantius"},{"e":"νύξ, νυκτός, ἡ","t":"nit","g":"Substantius"},{"e":"ὁδός, ὁδοῦ, ἡ","t":"camí, ruta, viatge","g":"Substantius"},{"e":"παῖς, παιδός, ὁ/ἡ","t":"xiquet, xiqueta, fill, esclau jove","g":"Substantius"},{"e":"ποιμήν, ποιμένος, ὁ","t":"pastor","g":"Substantius"},{"e":"ῥόπαλον, -ου, τό","t":"maça, garrot","g":"Substantius"},{"e":"σῶμα, σώματος, τό","t":"cos","g":"Substantius"},{"e":"τράχηλος, -ου, ὁ","t":"coll","g":"Substantius"},{"e":"ὑστεραία, -ας, ἡ","t":"l'endemà (s'usa en l'expressió τῇ ὑστεραίᾳ: a l'endemà)","g":"Substantius"},{"e":"φύλαξ, φύλακος, ὁ","t":"guardià, vigilant","g":"Substantius"},{"e":"ἀνδρεῖος, -α, -ον","t":"valent, coratjós","g":"Adjectius i pronoms"},{"e":"ἀσθενής, -ές","t":"dèbil, malalt (adjectiu de 2 terminacions)","g":"Adjectius i pronoms"},{"e":"αὐτός, -ή, -ό","t":"ell, ella, açò (com a pronom personal de 3a persona); el mateix (com a adjectiu)","g":"Adjectius i pronoms"},{"e":"ἡμέτερος, -α, -ον","t":"nostre","g":"Adjectius i pronoms"},{"e":"ἰσχυρός, -ά, -όν","t":"fort, vigorós","g":"Adjectius i pronoms"},{"e":"λαμπρός, -ά, -όν","t":"brillant, lluminós","g":"Adjectius i pronoms"},{"e":"οὗτος, αὕτη, τοῦτο","t":"este, esta, açò (pronom/adjectiu demostratiu)","g":"Adjectius i pronoms"},{"e":"πολύς, πολλή, πολύ","t":"molt, abundant","g":"Adjectius i pronoms"},{"e":"ὑμεῖς","t":"vosaltres (pronom personal, 2a persona del plural)","g":"Adjectius i pronoms"},{"e":"ἀναπαύομαι, ἀναπαύσομαι, ἀνεπαυσάμην","t":"descansar, reposar (verb mitjà)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀποθνῄσκω, ἀποθανοῦμαι, ἀπέθανον","t":"morir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀποκρίνομαι, ἀποκρινοῦμαι, ἀπεκρινάμην","t":"respondre (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἀποκτείνω, ἀποκτενῶ, ἀπέκτεινα","t":"matar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"βλάπτω, βλάψω, ἔβλαψα","t":"fer mal, danyar, perjudicar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"γίγνομαι, γενήσομαι, ἐγενόμην","t":"esdevindre, fer-se, arribar a ser, ocórrer (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"δέχομαι, δέξομαι, ἐδεξάμην","t":"rebre, acceptar (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἕπομαι, ἕψομαι, ἑσπόμην","t":"seguir, anar darrere de (verb deponent; regeix datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"ἔρχομαι, εἶμι / ἐλεύσομαι, ἦλθον","t":"anar, vindre","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"εὑρίσκω, εὑρήσω, εὗρον / ηὗρον","t":"trobar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"λείπω, λείψω, ἔλιπον","t":"deixar, abandonar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"μάχομαι, μαχοῦμαι / μαχέσομαι, ἐμαχεσάμην","t":"lluitar, combatre (verb deponent; regeix datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"μένω, μενῶ, ἔμεινα","t":"quedar-se, romandre, esperar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"νικάω, νικήσω, ἐνίκησα","t":"véncer, guanyar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πνίγω, πνίξω, ἔπνιξα","t":"ofegar, escanyar","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πορεύομαι, πορεύσομαι, ἐπορεύθην","t":"marxar, viatjar, anar, avançar (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"φαίνομαι, φανοῦμαι, ἐφάνην","t":"aparéixer, mostrar-se (verb deponent en veu passiva amb sentit mitjà)","g
