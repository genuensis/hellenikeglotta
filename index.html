  t.innerHTML=`<div class="unitpicker" id="atabs" style="margin-bottom:20px">
      <button type="button" data-t="taula" class="on">La taula</button>
      <button type="button" data-t="lletres">Lletres</button>
      <button type="button" data-t="trans">Transcriure</button>
      <button type="button" data-t="ordre">Ordre alfabètic</button>
      <button type="button" data-t="signes">Esperits i accents</button>
      <button type="button" data-t="salut">Salutacions</button>
    </div><div id="abody"></div>`;
  V.appendChild(t);
  const body=$('#abody');
  const show=k=>{
    $('#atabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
    body.className='';
    if(k==='taula') return alfTable(body);
    if(k==='lletres') return alfDrill(body,'Lletres',qLetter);
    if(k==='trans')   return alfDrill(body,'Transcriure',qTranscribe);
    if(k==='ordre')   return alfDrill(body,'Ordre alfabètic',qAlphaOrder);
    if(k==='signes')  return alfDrill(body,'Esperits i accents',()=>Math.random()<.5?qSpirit():qAccent());
    return alfDrill(body,'Salutacions',qGreeting);
  };
  $('#atabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) show(b.dataset.t);});
  show('taula');
}
function alfTable(mount){
  mount.className='prose';
  mount.innerHTML = `<h2>Les 24 lletres</h2><div class="alfgrid">`+
    AL.letters.map(l=>`<div class="alfcard">
       <div class="alfch"><span>${l.M}</span><span>${l.m}</span></div>
       <div class="alfn">${esc(l.n)}</div><div class="alftr">${esc(l.tr)}</div>
       <div class="alfp">${esc(l.p)}</div></div>`).join('')+`</div>
    <h2>Classificació dels sons</h2><div class="tw"><table>`+
    AL.sounds.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+`</table></div>
    <h2>Signes de lectura</h2><div class="tw"><table>
      <tr><td>Signe</td><td>Nom</td><td>Equivalència en valencià</td></tr>`+
    AL.signs.map(s=>`<tr><td>${esc(s.s)}</td><td>${esc(s.n)}</td><td>${esc(s.v)}</td></tr>`).join('')+`</table></div>
    <h2>Primeres paraules</h2><div class="tw"><table>
      <tr><td>Expressió</td><td>Traducció</td><td>Ús</td></tr>`+
    AL.greet.map(g=>`<tr><td class="gr">${esc(g.g)}</td><td>${esc(g.t)}</td><td>${esc(g.o)}</td></tr>`).join('')+`</table></div>`;
}
function alfDrill(mount,name,gen){
  const qs=[]; const seen=new Set(); let guard=0;
  while(qs.length<10 && guard++<400){
    const q=gen(); if(!q) continue;
    if(seen.has(q.q)) continue; seen.add(q.q); qs.push(q);
  }
  runQuiz(mount,{title:name,questions:qs,onEnd:()=>alfDrill(mount,name,gen)});
}
/* --- generadors --- */
function qLetter(){
  const l=sample(AL.letters,1)[0];
  const mode=Math.floor(Math.random()*3);
  const others=AL.letters.filter(x=>x.i!==l.i);
  if(mode===0) return mcq(`Com es diu la lletra <span class="gr big">${l.m}</span>?`,
    esc(l.n),sample(others,3).map(o=>esc(o.n)),`Es transcriu <b>${esc(l.tr)}</b>. ${esc(l.p)}.`);
  if(mode===1) return mcq(`Quina és la minúscula de <span class="gr big">${l.M}</span>?`,
    `<span class="gr">${l.m}</span>`,sample(others,3).map(o=>`<span class="gr">${o.m}</span>`),
    `És la lletra <b>${esc(l.n)}</b>.`);
  return mcq(`Quina és la majúscula de <span class="gr big">${l.m}</span>?`,
    `<span class="gr">${l.M}</span>`,sample(others,3).map(o=>`<span class="gr">${o.M}</span>`),
    `És la lletra <b>${esc(l.n)}</b>.`);
}
function qTranscribe(){
  const l=sample(AL.letters,1)[0];
  const others=AL.letters.filter(x=>x.tr!==l.tr);
  return mcq(`Com es transcriu la lletra <span class="gr big">${l.m}</span> (${esc(l.n)})?`,
    esc(l.tr),sample([...new Map(others.map(o=>[o.tr,o])).values()],3).map(o=>esc(o.tr)),
    esc(l.p)+'.');
}
function qAlphaOrder(){
  const n=AL.letters.length;
  const mode=Math.random();
  if(mode<0.5){
    const i=Math.floor(Math.random()*(n-1));
    const l=AL.letters[i], nxt=AL.letters[i+1];
    const others=AL.letters.filter(x=>x.i!==nxt.i&&x.i!==l.i);
    return mcq(`Quina lletra ve <b>just després</b> de <span class="gr big">${l.m}</span> (${esc(l.n)})?`,
      `<span class="gr">${nxt.m}</span> ${esc(nxt.n)}`,
      sample(others,3).map(o=>`<span class="gr">${o.m}</span> ${esc(o.n)}`),
      `L'ordre alfabètic és el que fan servir els diccionaris.`);
  }
  const four=sample(AL.letters,4).sort(()=>Math.random()-.5);
  return {type:'order',
    q:`Ordena estes lletres segons l'alfabet grec.`,
    shuffled:four.map(l=>`<span class="gr">${l.m}</span> ${esc(l.n)}`),
    order:(()=>{const s=four.slice().sort((a,b)=>a.i-b.i);return four.map(l=>s.indexOf(l));})(),
    x:`Saber l'ordre alfabètic és imprescindible per a buscar al diccionari.`};
}
function qSpirit(){
  const s=sample(AL.spirits,1)[0];
  return mcq(`Quin esperit porta <span class="gr big">${s.q}</span>?`,
    s.a==='aspre'?'Esperit aspre':'Esperit suau',
    [s.a==='aspre'?'Esperit suau':'Esperit aspre','Accent circumflex','Iota subscrita'],s.x);
}
function qAccent(){
  const a=sample(AL.accents,1)[0];
  const kinds=['oxíton','paroxíton','proparoxíton','perispòmen','properispòmen'];
  const cap=w=>w[0].toUpperCase()+w.slice(1);
  return mcq(`Com és, quant a l'accent, la paraula <span class="gr big">${a.q}</span>?`,
    cap(a.a),sample(kinds.filter(k=>k!==a.a),3).map(cap),a.x);
}
function qGreeting(){
  const g=sample(AL.greet,1)[0];
  const others=AL.greet.filter(x=>x.g!==g.g);
  if(Math.random()<.5) return mcq(`Què vol dir <span class="gr big">${esc(g.g)}</span>?`,
    esc(g.t),sample(others,3).map(o=>esc(o.t)),esc(g.o));
  return mcq(`Com es diu «${esc(g.t)}» en grec?`,
    `<span class="gr">${esc(g.g)}</span>`,sample(others,3).map(o=>`<span class="gr">${esc(o.g)}</span>`),esc(g.o));
}
/* ================= ROUTER ================= */
function route(){
  hideTip();
  const h = location.hash.replace(/^#/,'') || 'inici';
  const [sec,arg] = h.split('/');
  markNav(sec==='text'?'textos':sec);
  window.scrollTo(0,0);
  switch(sec){
    case 'textos': return viewTextos();
    case 'text': return viewText(arg);
    case 'cultura': return viewCultura();
    case 'gramatica': return viewGramatica();
    case 'alfabet': return viewAlfabet();
    case 'vocabulari': return viewVocabulari();
    case 'diccionari': return viewDiccionari();
    default: return viewInici();
  }
}
buildNav();
kbInit();
initTheme();
$('#theme').addEventListener('click',toggleTheme);
$('#theme2').addEventListener('click',toggleTheme);
function doReset(){ ST={unit:ST.unit,seen:{}}; save(); route(); }
/* confirmació en dos passos: no depén de confirm(), que pot estar bloquejat */
function armReset(btn){
  if(btn.dataset.armed){ doReset(); return; }
  const old=btn.innerHTML;
  btn.dataset.armed='1'; btn.innerHTML='Segur? Toca una altra vegada';
  btn.classList.add('warn');
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.innerHTML=old; btn.classList.remove('warn'); } },4000);
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-reset]'); if(b) armReset(b); });
addEventListener('hashchange',()=>{kbHide();route();});
route();

</script>
