Aorist)"},{"e":"πειράομαι, πειράσομαι, ἐπειρασάμην","t":"intentar, provar (verb deponent)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πίνω, πίομαι, ἔπιον","t":"beure","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"πλήσσω, πλήξω, ἔπληξα","t":"colpejar, ferir","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"προσέρχομαι, προσελεύσομαι, προσῆλθον","t":"apropar-se, atansar-se a (+ cas Datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"σιγάω, σιγήσομαι, ἐσίγησα","t":"callar, estar en silenci","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"σπάομαι, σπάσομαι, ἐσπασάμην","t":"traure, desembeinar (una espasa)","g":"Verbs (Enunciats: Present, Futur, Aorist)"},{"e":"σπάω, σπάσω, ἔσπασα","t":"traure, estirar (mitjana: desenvainar)","g":"Verbs (Enunciats: Present, Futur, Aorist)"}]},{"n":8,"title":"La literatura grega","cultura":"<h3>La literatura grega: gèneres, autors i pervivència<\/h3>\n<h4>1. Una literatura fundacional<\/h4>\n<p>La literatura grega és la primera d'Europa i la que ha establit els gèneres amb què encara hui classifiquem els textos: èpica, lírica, tragèdia, comèdia, història, oratòria, diàleg filosòfic i novel·la. Cap tradició posterior no ha deixat de dialogar amb ella.<\/p>\n<p>Els textos han arribat fins a nosaltres per un camí llarg i accidentat. Primer es van transmetre oralment; després es van fixar per escrit en rotles de papir; els filòlegs d'Alexandria en van establir versions depurades; a partir dels segles III i IV dC es van copiar en còdexs de pergamí, i durant l'edat mitjana els monestirs bizantins en van assegurar la conservació. Cada pas va suposar una selecció: d'Èsquil, per exemple, se'n conserven set tragèdies de les setanta o noranta que li atribuïen els antics. El que llegim és una part xicoteta del que hi va haver.<\/p>\n<p>Convé recordar també que la literatura grega no era, en origen, literatura per a llegir en silenci. L'èpica es cantava, la lírica s'acompanyava d'instruments, el teatre es representava i l'oratòria es pronunciava. Tots estos textos naixen per a ser escoltats en públic.<\/p>\n<h4>2. L'èpica<\/h4>\n<p>L'èpica és el gènere més antic conservat: narracions extenses en vers sobre les gestes dels herois, compostes en un dialecte artificial que no es corresponia amb cap parla real i en un metre fix, l'hexàmetre dactílic.<\/p>\n<p>Els dos poemes fundacionals s'atribuïxen a <strong>Homer<\/strong>. La <strong>Ilíada<\/strong> narra un episodi del desé any del setge de Troia: la còlera d'Aquil·les contra Agamèmnon, les seues conseqüències per a l'exèrcit grec i la mort d'Hèctor. L'<strong>Odissea<\/strong> relata el retorn accidentat d'<strong>Odisseu<\/strong> a Ítaca i la recuperació de la seua casa. La primera és un poema de guerra, d'honor i de mort; la segona, un poema de viatge, d'astúcia i de reconeixement.<\/p>\n<p>La <strong>qüestió homèrica<\/strong> és el debat, encara obert, sobre qui va compondre estos poemes i com. L'estudi de la poesia oral ha mostrat que els epítets repetits («Aquil·les el de peus lleugers»), les escenes tipus i les fórmules mètriques són recursos propis d'aedes que improvisaven a partir d'un repertori tradicional. Les versions que llegim degueren cristal·litzar entre els segles VIII i VII aC.<\/p>\n<p><strong>Hesíode<\/strong> representa una altra branca de l'èpica, la didàctica: la <strong>Teogonia<\/strong> ordena la genealogia dels déus i <strong>Els treballs i els dies<\/strong> oferix consells sobre l'agricultura i la justícia, amb una veu personal que es queixa del seu germà i de la duresa de la vida camperola.<\/p>\n<h4>3. La lírica<\/h4>\n<p>A partir del segle VII aC apareix una poesia més breu, cantada amb acompanyament musical, en la qual l'autor parla en primera persona dels seus sentiments, de la política, del vi o de l'amor. És una novetat important: davant de l'anonimat èpic, sorgix la veu individual.<\/p>\n<p>Se'n distingixen tres grans modalitats:<\/p>\n<ul><li><strong>L'elegia<\/strong>, en dístics, sovint de contingut exhortatiu o reflexiu: <strong>Tirteu<\/strong> anima els espartans al combat, <strong>Teognis<\/strong> exposa la moral aristocràtica, <strong>Soló<\/strong> justifica les seues reformes.<\/li><li><strong>El iambe<\/strong>, de to satíric i llenguatge directe, amb <strong>Arquíloc<\/strong> com a figura principal.<\/li><li><strong>La mèlica<\/strong>, cantada amb lira. Pot ser <strong>monòdica<\/strong>, per a una veu sola, com en <strong>Safo<\/strong>, que canta la passió amorosa amb una precisió psicològica extraordinària, en <strong>Alceu<\/strong>, poeta polític i simposíac, o en <strong>Anacreont<\/strong>; o <strong>coral<\/strong>, interpretada per un grup, com en <strong>Píndar<\/strong>, autor d'odes en honor dels vencedors dels jocs, o en <strong>Simònides<\/strong> i <strong>Baquílides<\/strong>.<\/li><\/ul>\n<h4>4. El teatre: tragèdia<\/h4>\n<p>El teatre és una creació atenesa i un fet cívic abans que artístic. Les representacions formaven part de les festes en honor de <strong>Dionís<\/strong>, especialment de les Grans Dionísies de primavera. Un magistrat seleccionava les obres i un ciutadà ric assumia com a servei públic el cost del cor. Els concursos duraven diversos dies i el poble hi assistia en massa.<\/p>\n<p>Sobre l'origen de la tragèdia, la hipòtesi més acceptada la relaciona amb el <strong>ditirambe<\/strong>, un cant coral dionisíac; la tradició atribuïx a Tespis la innovació de separar un actor del cor per a dialogar-hi. Èsquil va introduir el segon actor i Sòfocles el tercer.<\/p>\n<p>L'estructura habitual és: <strong>pròleg<\/strong>, entrada del cor o <strong>pàrodos<\/strong>, alternança d'<strong>episodis<\/strong> dialogats i <strong>estàsims<\/strong> cantats pel cor, i <strong>èxode<\/strong> o eixida final. Els actors eren homes, portaven màscara i calçat alt, i interpretaven diversos papers.<\/p>\n<p>Els temes procedixen del mite, però l'important no és la novetat de l'argument —el públic ja el coneixia— sinó el sentit que se li dona. La tragèdia planteja conflictes sense solució còmoda: entre la llei de la ciutat i el deure familiar, entre la voluntat humana i el destí, entre la justícia i la venjança.<\/p>\n<p>Els tres grans tràgics són <strong>Èsquil<\/strong> (<em>Els perses<\/em>, <em>Prometeu encadenat<\/em>, la trilogia de l'<em>Orestea<\/em>), solemne i centrat en la justícia divina; <strong>Sòfocles<\/strong> (<em>Antígona<\/em>, <em>Èdip rei<\/em>, <em>Electra<\/em>), mestre de la construcció dramàtica i de l'heroi que assumix el seu destí; i <strong>Eurípides<\/strong> (<em>Medea<\/em>, <em>Les troianes<\/em>, <em>Les bacants<\/em>), més crític amb la tradició, atent a la psicologia i especialment als personatges femenins.<\/p>\n<h4>5. El teatre: comèdia i drama satíric<\/h4>\n<p>La <strong>comèdia<\/strong> té un origen ritual semblant, en processons festives i cants burlescos. Se'n distingixen tres etapes.<\/p>\n<p>La <strong>comèdia antiga<\/strong>, del segle V aC, és política, obscena i d'una llibertat de crítica sorprenent: ataca per nom polítics, intel·lectuals i institucions, i barreja fantasia desbordada amb sàtira d'actualitat. El seu representant és <strong>Aristòfanes<\/strong> (<em>Els núvols<\/em>, <em>Lisístrata<\/em>, <em>Les granotes<\/em>, <em>Els ocells<\/em>).<\/p>\n<p>La <strong>comèdia mitjana<\/strong>, del segle IV aC, abandona l'atac personal i es fixa més en tipus socials i en paròdies literàries.<\/p>\n<p>La <strong>comèdia nova<\/strong>, d'època hel·lenística, elimina la política i inventa la comèdia d'embolics domèstics, amb personatges fixos —el jove enamorat, el pare avar, l'esclau enginyós, el militar fanfarró— i reconeixements finals. El seu autor principal és <strong>Menandre<\/strong>. A través dels llatins Plaute i Terenci, este model arriba a Molière, a la comèdia europea i, en última instància, al guió de comèdia actual.<\/p>\n<p>El <strong>drama satíric<\/strong> era una peça breu i burlesca, amb un cor de sàtirs, que es representava després de les tres tragèdies per a alleugerir el to.<\/p>\n<h4>6. La prosa: història, oratòria i filosofia<\/h4>\n<p>La prosa naix a Jònia amb els <strong>logògrafs<\/strong>, autors de relats geogràfics i genealògics, entre els quals destaca <strong>Hecateu de Milet<\/strong>.<\/p>\n<p><strong>La historiografia.<\/strong> <strong>Heròdot<\/strong> d'Halicarnàs, anomenat pare de la història, va narrar les guerres mèdiques amb una curiositat immensa per les cultures estrangeres i una gran capacitat narrativa. <strong>Tucídides<\/strong> va escriure la guerra del Peloponés amb un mètode molt més exigent: crítica de les fonts, cronologia precisa i recerca de les causes profundes en el comportament humà i en les relacions de poder. <strong>Xenofont<\/strong> va continuar el relat i va conrear la biografia, el tractat i el llibre de memòries, com en l'<em>Anàbasi<\/em>.<\/p>\n<p><strong>L'oratòria.<\/strong> El debat polític i judicial va convertir la paraula en un instrument de poder, i els sofistes en van fer un ensenyament. Es distingixen tres tipus de discurs: el <strong>judicial<\/strong>, davant dels tribunals; el <strong>deliberatiu<\/strong>, davant de l'assemblea; i l'<strong>epidíctic<\/strong> o de gala, per a ocasions solemnes. Entre els oradors destaquen <strong>Lísies<\/strong>, model de senzillesa i de caracterització dels clients; <strong>Isòcrates<\/strong>, mestre de retòrica i defensor de la unió dels grecs; i <strong>Demòstenes<\/strong>, la veu més poderosa contra Filip de Macedònia.<\/p>\n<p><strong>La filosofia.<\/strong> Els diàlegs de <strong>Plató<\/strong> són alhora pensament i literatura de primer ordre, amb Sòcrates com a personatge central. <strong>Aristòtil<\/strong> ens ha arribat sobretot en forma de tractats, entre els quals la <strong>Poètica<\/strong> ha determinat durant segles la manera d'entendre la tragèdia.<\/p>\n<h4>7. La novel·la<\/h4>\n<p>En època imperial apareix el gènere en prosa més pròxim a la narrativa moderna. Les novel·les gregues conserven un esquema comú: una parella de jóvens s'enamora, la separen circumstàncies adverses —naufragis, pirates, malentesos, morts aparents—, cada un manté la fidelitat a l'altre i finalment es retroben. En són exemples les obres de <strong>Caritó<\/strong>, la <em>Dafnis i Cloe<\/em> de <strong>Longus<\/strong>, d'ambientació pastoral, i les <em>Etiòpiques<\/em> d'<strong>Heliodor<\/strong>. Este model va influir en la novel·la bizantina i, a través d'ella, en la narrativa d'aventures europea del Renaixement i del Barroc.<\/p>\n<h4>8. Pervivència<\/h4>\n<p>La influència de la literatura grega no s'ha interromput mai. Va passar a Roma, on Virgili escriu una epopeia a partir d'Homer i Sèneca unes tragèdies a partir d'Eurípides; va ser recuperada pel Renaixement; va inspirar el teatre classicista francés; i continua present en la poesia, la novel·la, el teatre i el cinema contemporanis. Els mateixos noms dels gèneres, dels recursos retòrics i de les figures literàries són grecs.<\/p>","gram":"<h3>El pronom relatiu i l'Aorist Passiu<\/h3>\n<p>Fins ara hem vist com descriure accions puntuals en el passat (l'Aorist) tant en veu activa com en veu mitjana, utilitzant les mateixes terminacions per a la mitjana i la passiva en el present i l'imperfet. En este tema vorem com l'Aorist crea una forma exclusiva per a la veu passiva. A més, introduirem el pronom relatiu, una paraula clau que ens permetrà enllaçar oracions creant subordinades adjectives, igual que en llatí i en valencià.<\/p>\n<h4>1. El pronom relatiu (ὅς, ἥ, ὅ)<\/h4>\n<p>El pronom relatiu servix per a introduir una oració subordinada adjectiva (o de relatiu). La seua funció és donar informació sobre un nom o pronom de l'oració principal, al qual anomenem antecedent. Es traduïx generalment per \"que\", \"el qual\", \"qui\".<\/p>\n<p>La declinació del pronom relatiu és molt semblant a la de l'article definit (ὁ, ἡ, τό) o als adjectius de la primera classe, però amb tres diferències clau per a reconéixer-lo a simple vista:<\/p>\n<ul><li>No té mai tau inicial (τ-).<\/li><li>Sempre porta esperit aspre.<\/li><li>Sempre porta accent (a diferència de les formes ὁ, ἡ, οἱ, αἱ de l'article).<\/li><\/ul>\n<p><strong>1.1. Declinació del pronom relatiu<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>ὅς<\/td><td>ἥ<\/td><td>ὅ<\/td><td>οἵ<\/td><td>αἵ<\/td><td>ἅ<\/td><\/tr><tr><td>Acusatiu<\/td><td>ὅν<\/td><td>ἥν<\/td><td>ὅ<\/td><td>οὕς<\/td><td>ἅς<\/td><td>ἅ<\/td><\/tr><tr><td>Genitiu<\/td><td>οὗ<\/td><td>ἧς<\/td><td>οὗ<\/td><td>ὧν<\/td><td>ὧν<\/td><td>ὧν<\/td><\/tr><tr><td>Datiu<\/td><td>ᾧ<\/td><td>ᾗ<\/td><td>ᾧ<\/td><td>οἷς<\/td><td>αἷς<\/td><td>οἷς<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong><\/p>\n<p class=\"quadre\">El pronom relatiu porta accent agut en el Nominatiu i Acusatiu (vocals breus), i accent circumflex en el Genitiu i Datiu (vocals llargues i diftongs), complint amb la tendència dels monosíl·labs de la primera i segona declinació.<\/p>\n<p><strong>1.2. La Regla d'Or de la concordança del relatiu<\/strong><\/p>\n<p>La sintaxi del relatiu grec funciona exactament igual que en llatí. La regla d'or de la concordança diu que:<\/p>\n<p><em>El pronom relatiu concorda amb el seu antecedent en GÈNERE i NOMBRE, però el seu CAS depén exclusivament de la funció sintàctica que fa dins de la seua pròpia oració subordinada.<\/em><\/p>\n<p>Que l'antecedent i el relatiu coincidisquen en el cas és pura casualitat. Vegem-ho amb un exemple:<\/p>\n<ul><li><strong>Antecedent en Nominatiu / Relatiu en Acusatiu:<\/strong><\/li><\/ul>\n<p><strong>Grec:<\/strong> Ὁ παῖς, ὃν ὁρᾷς, δίκαιός ἐστιν.<\/p>\n<p><strong>Anàlisi:<\/strong> L'antecedent és ὁ παῖς (masculí, singular, subjecte de l'oració principal). El relatiu ὃν és masculí i singular per a concordar amb \"el xiquet\", però va en cas Acusatiu perquè dins de la seua oració (ὃν ὁρᾷς) fa de Complement Directe del verb \"veus\".<\/p>\n<p><strong>Traducció:<\/strong> El xiquet, que/al qual veus, és just.<\/p>\n<ul><li><strong>Antecedent en Acusatiu / Relatiu en Nominatiu:<\/strong><\/li><\/ul>\n<p><strong>Grec:<\/strong> Ὁρῶ τὸν παῖδα ὃς τὸν ἵππον ἄγει.<\/p>\n<p><strong>Anàlisi:<\/strong> L'antecedent és τὸν παῖδα (masculí, singular, CD de l'oració principal). El relatiu ὃς és masculí i singular per la concordança, però va en cas Nominatiu perquè és el subjecte del verb \"ἄγει\".<\/p>\n<p><strong>Traducció:<\/strong> Veig el xiquet que guia el cavall.<\/p>\n<h4>2. L'Aorist d'Indicatiu Passiu<\/h4>\n<p>En els temes anteriors (Present i Imperfet), vam vore que la veu mitjana i la veu passiva compartien exactament les mateixes desinències (λύομαι = em deslligue / sóc deslligat).<\/p>\n<p>No obstant això, en el tema d'Aorist, la llengua grega desvincula morfològicament la veu passiva de la mitjana, creant una forma exclusiva i inconfusible per a la passiva.<\/p>\n<p>L'Aorist Passiu indica una acció puntual rebuda pel subjecte en el passat (\"va ser deslligat\"). La seua marca temporal característica és el sufix -θη-.<\/p>\n<p><strong>2.1. Formació i conjugació de l'Aorist Passiu (Dèbil)<\/strong><\/p>\n<p>Encara que és un temps passiu, la paradoxa morfològica de l'aorist passiu és que utilitza desinències secundàries ACTIVES (-ν, -ς, Ø, -μεν, -τε, -σαν).<\/p>\n<p>Fórmula: Augment + Arrel + -θη- + Desinències secundàries actives<\/p>\n<p><strong>Model λύω (Aorist passiu: ἐλύθην)<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Persona<\/strong><\/td><td><strong>Aorist Passiu<\/strong><\/td><td><strong>Traducció<\/strong><\/td><\/tr><tr><td>1a sg.<\/td><td>ἐ-λύ-θη-ν<\/td><td>jo vaig ser deslligat / deslligada<\/td><\/tr><tr><td>2a sg.<\/td><td>ἐ-λύ-θη-ς<\/td><td>tu vas ser deslligat / deslligada<\/td><\/tr><tr><td>3a sg.<\/td><td>ἐ-λύ-θη (Ø)<\/td><td>ell/a va ser deslligat / deslligada<\/td><\/tr><tr><td>1a pl.<\/td><td>ἐ-λύ-θη-μεν<\/td><td>vam ser deslligats / deslligades<\/td><\/tr><tr><td>2a pl.<\/td><td>ἐ-λύ-θη-τε<\/td><td>vau ser deslligats / deslligades<\/td><\/tr><tr><td>3a pl.<\/td><td>ἐ-λύ-θη-σαν<\/td><td>van ser deslligats / deslligades<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong><\/p>\n<p class=\"quadre\">Igual que en tots els temps de l'indicatiu que porten augment, l'accent és recessiu, intentant remuntar cap a l'augment tot el que permeta l'última síl·laba.<\/p>\n<p><strong>2.2. Canvis fonètics de l'Aorist Passiu (Oclusives + -θη-)<\/strong><\/p>\n<p>En afegir el sufix -θη-, si l'arrel del verb acaba en una consonant oclusiva muda, esta xocarà amb la \"theta\" (que és una oclusiva dental aspirada). Per la llei de l'assimilació, la consonant de l'arrel ha de convertir-se en la seua companya aspirada.<\/p>\n<ul><li><strong>Labials (π, β, φ) + θ = φθ<\/strong><\/li><\/ul>\n<p>λείπω ➞ ἐλείφθην (vaig ser deixat)<\/p>\n<p>βλάπτω (arrel βλαβ-) ➞ ἐβλάφθην (vaig ser danyat)<\/p>\n<ul><li><strong>Guturals (κ, γ, χ) + θ = χθ<\/strong><\/li><\/ul>\n<p>διώκω ➞ ἐδιώχθην (vaig ser perseguit)<\/p>\n<p>ἄγω ➞ ἤχθην (vaig ser portat / guiat)<\/p>\n<ul><li><strong>Dentals (τ, δ, θ) + θ = σθ<\/strong><\/li><\/ul>\n<p>πείθω ➞ ἐπείσθην (vaig ser convençut)<\/p>\n<h4>3. L'Aorist Passiu Fort<\/h4>\n<p>Alguns verbs, en lloc d'utilitzar el sufix -θη-, utilitzen exclusivament una eta -η- per a formar el seu aorist passiu. Açò s'anomena aorist passiu fort, però es conjuga exactament amb les mateixes desinències que hem vist dalt.<\/p>\n<p><strong>Model φαίνω (mostrar)<\/strong><\/p>\n<p>L'arrel és φαν-. L'aorist passiu fort serà ἐφάνην (vaig ser mostrat / vaig aparéixer).<\/p>\n<div class=\"tw\"><table><tr><td><strong>Persona<\/strong><\/td><td><strong>Aorist Passiu Fort<\/strong><\/td><\/tr><tr><td>1a sg.<\/td><td>ἐ-φάν-η-ν<\/td><\/tr><tr><td>2a sg.<\/td><td>ἐ-φάν-η-ς<\/td><\/tr><tr><td>3a sg.<\/td><td>ἐ-φάν-η<\/td><\/tr><tr><td>1a pl.<\/td><td>ἐ-φάν-η-μεν<\/td><\/tr><tr><td>2a pl.<\/td><td>ἐ-φάν-η-τε<\/td><\/tr><tr><td>3a pl.<\/td><td>ἐ-φάν-η-σαν<\/td><\/tr><\/table><\/div>\n<p><strong>Altres exemples molt freqüents:<\/strong><\/p>\n<ul><li>γράφω (escriure) ➞ ἐγράφην (vaig ser escrit)<\/li><li>τρέπω (girar, posar en fugida) ➞ ἐτράπην (vaig ser posat en fugida)<\/li><\/ul>\n<h4>4. El complement agent<\/h4>\n<p>Quan utilitzem un verb en veu passiva (siga en present, imperfet o aorist passiu), el subjecte rep l'acció. Si volem expressar qui realitza l'acció, necessitem un complement agent.<\/p>\n<p>En grec antic, la construcció del complement agent depén de si l'agent és un ésser animat (persona o déu) o una cosa inanimada:<\/p>\n<ul><li><strong>Agent animat (persones / éssers vius):<\/strong> S'expressa amb la preposició ὑπό + Genitiu (equivalent exacte de l'a/ab + Ablatiu del llatí).<\/li><\/ul>\n<p><strong>Ex:<\/strong> Ὁ δοῦλος ὑπὸ τοῦ δεσπότου ἐλύθη. (L'esclau va ser deslligat pel senyor).<\/p>\n<ul><li><strong>Agent inanimat (coses / instruments):<\/strong> S'expressa en cas Datiu sense preposició (Datiu instrumental).<\/li><\/ul>\n<p><strong>Ex:<\/strong> Ὁ δοῦλος τῷ ξύλῳ ἐπαίετο. (L'esclau era colpejat pel pal / amb el pal).<\/p>","lexicon":[{"e":"αἷμα, αἵματος, τό","t":"sang","g":"Substantius"},{"e":"βασίλεια, -ας, ἡ","t":"reina (no confondre amb el masculí βασιλεύς)","g":"Substantius"},{"e":"δεσμός, -οῦ, ὁ","t":"lligam, cadena, corda (en plural pot aparéixer com a neutre: τὰ δεσμά)","g":"Substantius"},{"e":"θυγάτηρ, θυγατρός, ἡ","t":"filla (es declina com μήτηρ, amb síncope a la 3a declinació)","g":"Substantius"},{"e":"θύρα, -ας, ἡ","t":"porta","g":"Substantius"},{"e":"ἱμάτιον, -ου, τό","t":"mantell, peça de roba, túnica","g":"Substantius"},{"e":"κῆτος, -ους, τό","t":"monstre marí, balena (3a declinació, tema en sibilant)","g":"Substantius"},{"e":"μαντεῖον, -ου, τό","t":"oracle","g":"Substantius"},{"e":"μάχη, -ης, ἡ","t":"batalla, combat","g":"Substantius"},{"e":"μήτηρ, μητρός, ἡ","t":"mare (3a declinació amb síncope)","g":"Substantius"},{"e":"νύμφη, -ης, ἡ","t":"nimfa, nóvia","g":"Substantius"},{"e":"παρθένος, -ου, ἡ","t":"jove, fadrina, verge (atenció: és de la 2a declinació però de gènere femení)","g":"Substantius"},{"e":"πέδιλον, -ου, τό","t":"sandàlia","g":"Substantius"},{"e":"πέτρα, -ας, ἡ","t":"pedra, roca","g":"Substantius"},{"e":"τραῦμα, τραύματος, τό","t":"ferida","g":"Substantius"},{"e":"ὕδωρ, ὕδατος, τό","t":"aigua","g":"Substantius"},{"e":"χείρ, χειρός, ἡ","t":"mà (en datiu plural sol fer χερσί)","g":"Substantius"},{"e":"χώρα, -ας, ἡ","t":"regió, país, territori","g":"Substantius"},{"e":"Αἰθιοπία, -ας, ἡ","t":"Etiòpia","g":"Noms propis"},{"e":"Ἀνδρομέδα, -ας, ἡ","t":"Andròmeda","g":"Noms propis"},{"e":"Κασσιόπεια, -ας, ἡ","t":"Cassiopea","g":"Noms propis"},{"e":"Νηρηΐς, -ίδος, ἡ","t":"Nereida (nimfa del mar)","g":"Noms propis"},{"e":"Περσεύς, -έως, ὁ","t":"Perseu","g":"Noms propis"},{"e":"Ποσειδῶν, Ποσειδῶνος, ὁ","t":"Posidó (déu de la mar)","g":"Noms propis"},{"e":"ὅς, ἥ, ὅ","t":"que, el qual, la qual, qui (pronom relatiu)","g":"Pronoms i Adjectius"},{"e":"καλλίων, κάλλιον","t":"més bell/a, més bonic/a (grau comparatiu de καλός)","g":"Pronoms i Adjectius"},{"e":"κάλλιστος, -η, -ον","t":"el més bell, molt bell (grau superlatiu de καλός)","g":"Pronoms i Adjectius"},{"e":"πτηνός, -ή, -όν","t":"alat, que té ales, volador","g":"Pronoms i Adjectius"},{"e":"ἀδικέω, ἀδικήσω, ἠδίκησα [ἠδικήθην]","t":"fer una injustícia, ofendre, perjudicar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"ἀναπέτομαι, ἀναπτήσομαι, ἀνέπτην / ἀνεπτᾶμην","t":"volar cap amunt, enlairar-se (compost de πέτομαι)","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"βιάζω, βιάσω, ἐβίασα [ἐβιάσθην]","t":"forçar, obligar, violentar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"γαμέω, γαμῶ, ἔγημα [ἐγαμήθην]","t":"casar-se, prendre per esposa (en passiva: ser presa per muller)","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"γελάω, γελάσομαι, ἐγέλασα [ἐγελάσθην]","t":"riure","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"δέω, δήσω, ἔδησα [ἐδέθην]","t":"lligar, encadenar, nugar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"ἐρωτάω, ἐρωτήσω, ἠρώτησα [ἠρωτήθην]","t":"preguntar, interrogar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"καταβαίνω, καταβήσομαι, κατέβην","t":"baixar, davallar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"καυχάομαι, καυχήσομαι, ἐκαυχησάμην","t":"presumir, vantar-se, jactar-se","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"κλέπτω, κλέψω, ἔκλεψα [ἐκλάπην]","t":"furtar, robar (el seu aorist passiu és fort: ἐκλάπην)","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"κολάζω, κολάσω, ἐκόλασα [ἐκολάσθην]","t":"castigar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"παραδίδωμι, παραδώσω, παρέδωκα [παρεδόθην]","t":"entregar, lliurar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"πέμπω, πέμψω, ἔπεμψα [ἐπέμφθην]","t":"enviar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"περιπίπτω, περιπεσοῦμαι, περιέπεσον","t":"caure en, trobar-se amb, ensopegar amb (+ cas Datiu)","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"πέτομαι, πτήσομαι, ἐπτόμην / ἐπτάμην","t":"volar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"πλύνω, πλυνῶ, ἔπλυνα [ἐπλύθην]","t":"llavar, netejar, rentar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"πολεμέω, πολεμήσω, ἐπολέμησα [ἐπολεμήθην]","t":"fer la guerra, lluitar, atacar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"σχίζω, σχίσω, ἔσχισα [ἐσχίσθην]","t":"trencar, esquinçar, esgarrar","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"},{"e":"φορέω, φορήσω, ἐφόρησα","t":"portar posat, vestir (roba, mantell)","g":"Verbs (Enunciats: Present, Futur, Aorist actiu/mitjà i [Aorist Passiu])"}]},{"n":9,"title":"L'art, la ciutat i els espectacles","cultura":"<h3>L'art, la ciutat i els espectacles<\/h3>\n<h4>1. Els principis de l'art grec<\/h4>\n<p>L'art grec parteix d'una convicció que travessa tota la seua cultura: la bellesa consistix en l'ordre, la proporció i la mesura. No busca impressionar per la grandària, com l'art egipci o mesopotàmic, sinó per l'equilibri entre les parts i el conjunt, calculat sovint amb relacions numèriques.<\/p>\n<p>És, a més, un art profundament <strong>antropocèntric<\/strong>: la figura humana n'és el tema central, fins i tot quan representa déus, perquè els déus tenen forma d'home. I és un art <strong>públic<\/strong>: temples, estàtues votives, teatres i edificis cívics es fan per a la comunitat i s'exhibixen en espais oberts.<\/p>\n<h4>2. L'arquitectura: el temple i els ordres<\/h4>\n<p>L'edifici emblemàtic és el <strong>temple<\/strong>, concebut com a casa de la divinitat i no com a lloc de reunió dels fidels. La seua planta deriva de la <em>naos<\/em> o cel·la, on hi havia l'estàtua de culte, precedida d'un vestíbul i envoltada, en els casos més elaborats, per una filera de columnes. L'estructura és arquitravada: columnes i llindes, sense arcs ni voltes. El material preferit és el marbre, i cal recordar que estava policromat, encara que hui el vegem blanc.<\/p>\n<p>Els <strong>ordres arquitectònics<\/strong> definixen les proporcions i la decoració:<\/p>\n<ul><li>L'<strong>ordre dòric<\/strong> és el més antic i sobri. La columna no té base, el fust és estriat i el capitell es reduïx a un coixí circular i un àbac quadrat. El fris alterna tríglifs i mètopes esculpides. Transmet solidesa.<\/li><li>L'<strong>ordre jònic<\/strong> és més esvelt i decoratiu. La columna té base, el fust és més prim i el capitell presenta dos volutes; el fris és corregut i pot dur un relleu continu.<\/li><li>L'<strong>ordre corinti<\/strong>, més tardà, es distingix pel capitell de fulles d'acant. Serà el preferit pels romans.<\/li><\/ul>\n<p>El conjunt més cèlebre és l'<strong>Acròpoli d'Atenes<\/strong>, reconstruïda en època de Pèricles: el <strong>Partenó<\/strong>, dòric, dedicat a Atena i decorat sota la direcció de Fídies; els <strong>Propileus<\/strong> com a entrada monumental; el temple d'<strong>Atena Nike<\/strong> i l'<strong>Erectèon<\/strong>, jònics, este últim amb la tribuna de les cariàtides. El Partenó incorpora <strong>correccions òptiques<\/strong> —columnes lleugerament inclinades i engrossides al centre, basament una mica corbat— destinades a compensar les deformacions de la visió i a donar sensació de perfecta regularitat.<\/p>\n<p>Al costat del temple, l'arquitectura grega desenrotlla altres tipus d'edificis: el <strong>teatre<\/strong>, el <strong>pòrtic<\/strong> o <em>stoá<\/em>, el <strong>gimnàs<\/strong>, el <em>bouleuterion<\/em> per al consell i la <em>tholos<\/em> de planta circular.<\/p>\n<h4>3. L'escultura<\/h4>\n<p>L'escultura grega mostra una evolució que es pot seguir amb claredat.<\/p>\n<p>En l'<strong>època arcaica<\/strong> (segles VII-VI aC) predominen dos tipus: el <strong>kuros<\/strong>, jove nu i dret, i la <strong>kore<\/strong>, jove vestida. Són figures frontals, rígides, amb els braços enganxats al cos i un peu avançat, i amb el característic somriure arcaic, més convencional que expressiu.<\/p>\n<p>L'<strong>època clàssica<\/strong> (segle V aC) resol el problema del moviment i de l'equilibri. <strong>Míron<\/strong> capta l'instant en el <em>Discòbol<\/em>; <strong>Policlet<\/strong> formula un <strong>cànon<\/strong> de proporcions ideals i, amb el <em>Dorífor<\/em>, fixa el joc del contrapost, amb el pes del cos sobre una cama i la conseqüent compensació de malucs i espatles; <strong>Fídies<\/strong> dirigix l'escultura del Partenó i fa les grans estàtues criselefantines d'Atena i de Zeus. El rostre és serè, sense emoció individual: representa l'ideal, no la persona.<\/p>\n<p>En el <strong>segle IV aC<\/strong> apareix una sensibilitat nova. <strong>Praxíteles<\/strong> suavitza les formes i introduïx corbes elegants; <strong>Escopes<\/strong> expressa la passió i el dolor en els rostres; <strong>Lisip<\/strong> allarga les proporcions i multiplica els punts de vista.<\/p>\n<p>L'<strong>època hel·lenística<\/strong> porta el moviment, el dramatisme i el realisme a l'extrem, i incorpora temes fins llavors marginals: la vellesa, el dolor físic, la infantesa. Són obres representatives el <em>Laocoont<\/em>, la <em>Victòria de Samotràcia<\/em>, la <em>Venus de Milo<\/em> i el gran altar de Pèrgam.<\/p>\n<h4>4. La ceràmica i la pintura<\/h4>\n<p>De la pintura grega sobre taula no se n'ha conservat pràcticament res, però la <strong>ceràmica<\/strong> decorada ens permet fer-nos una idea del dibuix i, sobretot, de la vida quotidiana i de la mitologia.<\/p>\n<p>La tècnica de <strong>figures negres<\/strong> (creada cap al 700 aC i dominant durant el segle VI aC) pinta les figures amb vernís negre sobre el fons roig de l'argila i en grava els detalls per incisió. La de <strong>figures roges<\/strong> (a partir del 530 aC aproximadament) invertix el procediment: es pinta el fons de negre i les figures queden del color de l'argila, cosa que permet dibuixar els detalls interiors amb pinzell i aconseguir molta més soltesa.<\/p>\n<p>Les formes responen a usos concrets: l'<strong>àmfora<\/strong> per a emmagatzemar oli o vi, la <strong>cràtera<\/strong> per a barrejar vi i aigua en el simposi, la <strong>hídria<\/strong> per a portar aigua, la <strong>cílix<\/strong> per a beure i el <strong>lècit<\/strong> per a olis perfumats, sovint amb funció funerària.<\/p>\n<h4>5. La ciutat<\/h4>\n<p>La ciutat grega clàssica va créixer normalment sense pla previ, amb carrers estrets i irregulars. Els seus elements característics són l'<strong>acròpoli<\/strong>, recinte elevat i sagrat; l'<strong>àgora<\/strong>, plaça pública on conflueixen el mercat, la política i la conversa, envoltada de pòrtics i d'edificis oficials; les <strong>muralles<\/strong>, i els espais col·lectius: teatre, gimnàs, estadi i santuaris. Atenes va unir la ciutat amb el port del <strong>Pireu<\/strong> mitjançant els Llargs Murs, que garantien l'abastiment en cas de setge.<\/p>\n<p>Al segle V aC, <strong>Hipòdam de Milet<\/strong> va formular un model d'urbanisme <strong>regular o ortogonal<\/strong>: carrers rectes que es tallen en angle recte, illes de cases rectangulars i zones reservades a funcions determinades. Es va aplicar en fundacions noves i en reconstruccions com les de Milet, el Pireu o Rodes, i va ser el precedent de l'urbanisme hel·lenístic i romà, i en última instància de la trama en quadrícula de moltes ciutats modernes.<\/p>\n<h4>6. L'oci, el joc i els espectacles<\/h4>\n<p><strong>El simposi.<\/strong> La reunió de després del sopar era el principal espai de sociabilitat masculina: es bevia vi rebaixat, es conversava, es recitaven poemes, hi havia música i jocs com el còtabe, que consistia a llançar la darrera gota de vi cap a un objectiu.<\/p>\n<p><strong>Els jocs infantils.<\/strong> Coneixem, per la ceràmica i per les joguines trobades en tombes, pilotes, baldufes, cércols, ossets, dauets, nines articulades i carrets de fusta.<\/p>\n<p><strong>Els agons panhel·lènics.<\/strong> Les competicions atlètiques eren actes religiosos celebrats en honor d'una divinitat. Els <strong>Jocs Olímpics<\/strong>, en honor de Zeus a Olímpia, se celebraven cada quatre anys i la tradició en situa l'inici el 776 aC: eixe interval, l'<strong>olimpíada<\/strong>, es va convertir en la referència cronològica comuna dels grecs. Hi havia també els <strong>Jocs Pítics<\/strong> a Delfos, en honor d'Apol·lo, amb proves musicals; els <strong>Ístmics<\/strong> a Corint, dedicats a Posidó; i els <strong>Nemeus<\/strong>, a Zeus. Durant la celebració es proclamava una treva sagrada que permetia el desplaçament segur dels participants.<\/p>\n<p>Les proves incloïen la cursa a peu en diverses distàncies, la lluita, el pugilat, el <strong>pancraci<\/strong> —combinació de lluita i pugilat—, el <strong>pentatló<\/strong> (cursa, salt de llargària, disc, javelina i lluita) i les carreres de carros i de cavalls. Els atletes competien nus i el premi oficial era una corona vegetal, però la ciutat d'origen del vencedor l'omplia d'honors materials i li encarregava odes com les de Píndar.<\/p>\n<p><strong>El teatre com a espectacle.<\/strong> Les representacions dramàtiques eren, alhora, ritual religiós, concurs i gran esdeveniment cívic, i s'hi destinaven fons públics perquè els ciutadans amb menys recursos pogueren assistir-hi.<\/p>\n<h4>7. El llegat<\/h4>\n<p>Els ordres arquitectònics grecs continuen definint la imatge dels edificis institucionals de mig món; el cànon del cos humà creat pels escultors clàssics ha condicionat la representació de la figura fins hui; la trama urbana regular és la base de moltes ciutats contemporànies; i els Jocs Olímpics moderns, restaurats el 1896, reprenen deliberadament el nom, el calendari quadriennal i bona part del simbolisme dels antics.<\/p>","gram":"<h3>La gradació de l'adjectiu i tancament nominal<\/h3>\n<p>Amb este darrer tema completem el sistema nominal grec. Estudiarem un últim grup d'adjectius molt freqüents que barregen declinacions (la tercera classe) i aprendrem a comparar qualitats a través dels graus de l'adjectiu. Finalment, farem un xicotet repàs de les preposicions d'espai per a tindre clar com es mouen els personatges dins dels nostres textos.<\/p>\n<h4>1. Adjectius de la tercera classe<\/h4>\n<p>Fins ara coneixíem adjectius de la 1a classe (que declinen per la 1a i 2a declinació) i de la 2a classe (que declinen íntegrament per la 3a declinació). Els adjectius de la tercera classe són els que barregen declinacions:<\/p>\n<ul><li>El masculí i el neutre seguixen la 3a declinació (temes en consonant o en -υ).<\/li><li>El femení seguix sempre la 1a declinació (tema en alfa impura).<\/li><\/ul>\n<p><strong>1.1. El model πᾶς, πᾶσα, πᾶν (tot, cada)<\/strong><\/p>\n<p>L'arrel del masculí i el neutre és παντ- (la combinació -ντ- cau davant la sigma del nominatiu i es compensa allargant la vocal), mentres que l'arrel del femení és πασ-.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nom / Voc<\/td><td>πᾶς<\/td><td>πᾶσα<\/td><td>πᾶν<\/td><td>πάντες<\/td><td>πᾶσαι<\/td><td>πάντα<\/td><\/tr><tr><td>Acusatiu<\/td><td>πάντα<\/td><td>πᾶσαν<\/td><td>πᾶν<\/td><td>πάντας<\/td><td>πάσας<\/td><td>πάντα<\/td><\/tr><tr><td>Genitiu<\/td><td>παντός<\/td><td>πάσης<\/td><td>παντός<\/td><td>πάντων<\/td><td>πασῶν<\/td><td>πάντων<\/td><\/tr><tr><td>Datiu<\/td><td>παντί<\/td><td>πάσῃ<\/td><td>παντί<\/td><td>πᾶσι(ν)<\/td><td>πάσαις<\/td><td>πᾶσι(ν)<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong><\/p>\n<p class=\"quadre\">Excepcionalment, com ocorre amb els monosíl·labs de la 3a declinació, l'accent del masculí i el neutre es desplaça a la desinència en el genitiu i datiu singular (παντός, παντί), però es manté fix a l'arrel en el plural (πάντων, πᾶσι). El femení, en ser de la 1a declinació, porta accent circumflex final al genitiu plural (πασῶν).<\/p>\n<p><strong>1.2. Els adjectius irregulars μέγας i πολύς<\/strong><\/p>\n<p>Estos dos adjectius són d'altíssima freqüència. Combinen una arrel curta per al Nominatiu, Vocatiu i Acusatiu masculí i neutre singular (de la 3a declinació) amb una arrel allargada per a la resta de casos, els quals seguixen exactament el model d'un adjectiu tipus 2-1-2 (com ἀγαθός).<\/p>\n<p><strong>A) μέγας, μεγάλη, μέγα (gran) — Arrels: μεγα- / μεγαλ-<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>μέγας<\/td><td>μεγάλη<\/td><td>μέγα<\/td><td>μεγάλοι<\/td><td>μεγάλαι<\/td><td>μεγάλα<\/td><\/tr><tr><td>Acusatiu<\/td><td>μέγαν<\/td><td>μεγάλην<\/td><td>μέγα<\/td><td>μεγάλους<\/td><td>μεγάλας<\/td><td>μεγάλα<\/td><\/tr><tr><td>Genitiu<\/td><td>μεγάλου<\/td><td>μεγάλης<\/td><td>μεγάλου<\/td><td>μεγάλων<\/td><td>μεγάλων<\/td><td>μεγάλων<\/td><\/tr><tr><td>Datiu<\/td><td>μεγάλῳ<\/td><td>μεγάλῃ<\/td><td>μεγάλῳ<\/td><td>μεγάλοις<\/td><td>μεγάλαις<\/td><td>μεγάλοις<\/td><\/tr><\/table><\/div>\n<p><strong>B) πολύς, πολλή, πολύ (molt) — Arrels: πολυ- / πολλ-<\/strong><\/p>\n<div class=\"tw\"><table><tr><td><strong>Cas<\/strong><\/td><td><strong>Masc. Sg.<\/strong><\/td><td><strong>Fem. Sg.<\/strong><\/td><td><strong>Neut. Sg.<\/strong><\/td><td><strong>Masc. Pl.<\/strong><\/td><td><strong>Fem. Pl.<\/strong><\/td><td><strong>Neut. Pl.<\/strong><\/td><\/tr><tr><td>Nominatiu<\/td><td>πολύς<\/td><td>πολλή<\/td><td>πολύ<\/td><td>πολλοί<\/td><td>πολλαί<\/td><td>πολλά<\/td><\/tr><tr><td>Acusatiu<\/td><td>πολύν<\/td><td>πολλήν<\/td><td>πολύ<\/td><td>πολλούς<\/td><td>πολλάς<\/td><td>πολλά<\/td><\/tr><tr><td>Genitiu<\/td><td>πολλοῦ<\/td><td>πολλῆς<\/td><td>πολλοῦ<\/td><td>πολλῶν<\/td><td>πολλῶν<\/td><td>πολλῶν<\/td><\/tr><tr><td>Datiu<\/td><td>πολλῷ<\/td><td>πολλῇ<\/td><td>πολλῷ<\/td><td>πολλοῖς<\/td><td>πολλαῖς<\/td><td>πολλοῖς<\/td><\/tr><\/table><\/div>\n<h4>2. Els graus de l'adjectiu (Comparatiu i Superlatiu)<\/h4>\n<p>En grec antic, la gradació regular de l'adjectiu es marca mitjançant sufixos específics que s'afigen a l'arrel de l'adjectiu en grau positiu.<\/p>\n<p><strong>2.1. El Comparatiu de Superioritat<\/strong><\/p>\n<p>S'utilitza per a dir que algú és \"més… que\" un altre. S'hi afig el sufix -τερος, -τέρα, -τερον. Es declina com un adjectiu regular de tres terminacions (tipus δίκαιος).<\/p>\n<p>S'unix a l'arrel de l'adjectiu amb una vocal d'enllaç \"ο\", però si la síl·laba anterior és breu, la vocal d'enllaç s'allarga a \"ω\" per raons rítmiques:<\/p>\n<ul><li>μικρός (xicotet - síl·laba llarga \"κρος\") ➞ μικρό-τερος (més xicotet).<\/li><li>σοφός (savi - síl·laba breu \"φος\") ➞ σοφώ-τερος (més savi).<\/li><\/ul>\n<p><strong>Sintaxi del comparatiu:<\/strong> El segon terme de la comparació pot expressar-se de dues formes diferents:<\/p>\n<ul><li>En el mateix cas que el primer terme precedit de la conjunció ἤ (que).<\/li><li>En cas Genitiu (conegut com a Genitiu comparatiu), sense conjunció.<\/li><\/ul>\n<p><strong>Ex:<\/strong> Ὁ παῖς μικρότερός ἐστι τοῦ ἀνδρός. / Ὁ παῖς μικρότερός ἐστιν ἢ ὁ ἀνήρ.<\/p>\n<p><strong>2.2. El Superlatiu<\/strong><\/p>\n<p>S'utilitza per a dir que algú és \"el més…\" o \"molt…\". S'hi afig el sufix -τατος, -τάτη, -τατον. Utilitza la mateixa regla per a la vocal d'enllaç (-ο- o -ω-) i es declina completament igual.<\/p>\n<ul><li>μικρότατος, -η, -ον (el més xicotet / molt xicotet).<\/li><li>σοφώτατος, -η, -ον (el més savi / molt savi).<\/li><\/ul>\n<p><strong>Sintaxi del superlatiu:<\/strong> Sol portar un complement partitiu expressat normalment en Genitiu.<\/p>\n<p><strong>Ex:<\/strong> Ὁ Σωκράτης σοφώτατός ἐστι πάντων τῶν ἀνθρώπων (Sòcrates és el més savi de tots els hòmens).<\/p>\n<p><strong>2.3. Comparatius i Superlatius Irregulars<\/strong><\/p>\n<p>Alguns adjectius d'ús freqüentíssim formen els seus graus amb arrels diferents i utilitzant la terminació de comparatiu -ιων, -ιον (que es declina per la 3a declinació, com σώφρων) i el superlatiu en -ιστος.<\/p>\n<div class=\"tw\"><table><tr><td><strong>Positiu<\/strong><\/td><td><strong>Comparatiu (més...)<\/strong><\/td><td><strong>Superlatiu (el més...)<\/strong><\/td><\/tr><tr><td>ἀγαθός (bo)<\/td><td>ἀμείνων / βελτίων<\/td><td>ἄριστος / βέλτιστος<\/td><\/tr><tr><td>κακός (roí)<\/td><td>κακίων / χείρων<\/td><td>κάκιστος / χείριστος<\/td><\/tr><tr><td>μέγας (gran)<\/td><td>μείζων<\/td><td>μέγιστος<\/td><\/tr><tr><td>πολύς (molt)<\/td><td>πλείων<\/td><td>πλεῖστος<\/td><\/tr><\/table><\/div>\n<p class=\"quadre\"><strong>APUNTS D'ACCENTUACIÓ.<\/strong> L'accent de les terminacions regulars -τερος i -τατος és sempre proparoxíton (fuix cap arrere fins a l'avantpenúltima síl·laba, complint escrupolosament la llei de limitació).<\/p>\n<h4>3. Repàs general: L'expressió de l'espai<\/h4>\n<p>Al llarg de tots els nostres textos hem vist com la sintaxi de casos en grec (sovint ajudada per preposicions) és el motor per a expressar les relacions espacials i circumstancials. Ací tens el quadre definitiu per a recordar-ho sempre:<\/p>\n<div class=\"tw\"><table><tr><td><strong>Circumstància<\/strong><\/td><td><strong>Cas i Preposició<\/strong><\/td><td><strong>Exemples d'ús<\/strong><\/td><\/tr><tr><td>UBI? (Lloc en on / Repòs)<\/td><td>ἐν + Datiu<\/td><td>ἐν ταῖς Ἀθήναις (a Atenes) · ἐν τῇ ἀγορᾷ (a l'àgora)<\/td><\/tr><tr><td>QUO? (Cap a on / Direcció)<\/td><td>εἰς / πρὸς / ἐπί + Acusatiu<\/td><td>εἰς τὰς Ἀθήνας (cap a Atenes) · πρὸς τὴν ἀγοράν (en direcció a l'àgora)<\/td><\/tr><tr><td>UNDE? (D'on / Origen)<\/td><td>ἐκ (ἐξ) / ἀπό + Genitiu<\/td><td>ἐκ τῶν Ἀθηνῶν (des d'Atenes) · ἀπὸ τῆς ἀγορᾶς (des de l'àgora)<\/td><\/tr><\/table><\/div>\n<p>A més de l'espai, cal no oblidar l'expressió de l'instrument. El Datiu Instrument o Mitjà s'utilitza absolutament a soles (sense cap preposició) per a indicar amb què o mitjançant què es realitza una acció.<\/p>\n<p><strong>Ex:<\/strong> Παίει τὸν κύνα ξύλῳ (Colpeja el gos amb un pal).<\/p>","lexicon":[{"e":"δύναμις, -εως, ἡ","t":"poder, força, potència","g":"Substantius"},{"e":"ἔρως, -ωτος, ὁ","t":"amor, passió, desig","g":"Substantius"},{"e":"κάλλος, -ους, τό","t":"bellesa (substantiu de la 3a declinació, tema en sibilant)","g":"Substantius"},{"e":"μῆλον, -ου, τό","t":"poma","g":"Substantius"},{"e":"νεανίας, -ου, ὁ","t":"jove, xic jove (1a declinació masculina)","g":"Substantius"},{"e":"ὄρος, -ους, τό","t":"muntanya, mont (3a declinació, tema en sibilant)","g":"Substantius"},{"e":"σοφία, -ας, ἡ","t":"saviesa","g":"Substantius"},{"e":"τόπος, -ου, ὁ","t":"lloc, indret","g":"Substantius"},{"e":"φθόνος, -ου, ὁ","t":"enveja, gelosia","g":"Substantius"},{"e":"χαρά, -ᾶς, ἡ","t":"alegria, goig","g":"Substantius"},{"e":"ψεῦδος, -ους, τό","t":"mentida (3a declinació, tema en sibilant)","g":"Substantius"},{"e":"Ἀθηνᾶ, -ᾶς, ἡ","t":"Atena","g":"Noms propis i Mitologia"},{"e":"Ἀφροδίτη, -ης, ἡ","t":"Afrodita","g":"Noms propis i Mitologia"},{"e":"Ἑρμῆς, -οῦ, ὁ","t":"Hermes","g":"Noms propis i Mitologia"},{"e":"Ἔρις, Ἔριδος, ἡ","t":"Eris (la Discòrdia)","g":"Noms propis i Mitologia"},{"e":"Ζεύς, Διός, ὁ","t":"Zeus (declinació irregular; en el text apareix el seu nominatiu)","g":"Noms propis i Mitologia"},{"e":"Ἥρα, -ας, ἡ","t":"Hera","g":"Noms propis i Mitologia"},{"e":"Ὄλυμπος, -ου, ὁ","t":"Olimp","g":"Noms propis i Mitologia"},{"e":"Πάρις, -ιδος, ὁ","t":"Paris","g":"Noms propis i Mitologia"},{"e":"μέσος, -η, -ον","t":"mitjà, del mig (l'expressió εἰς τὸ μέσον es traduïx com \"al centre\" o \"al mig\")","g":"Adjectius de la 3a classe i regulars"},{"e":"πᾶς, πᾶσα, πᾶν","t":"tot, tota, cadascun (adjectiu de la 3a classe; arrel παντ- / πασ-)","g":"Adjectius de la 3a classe i regulars"},{"e":"πιστός, -ή, -όν","t":"fidel, digne de confiança","g":"Adjectius de la 3a classe i regulars"},{"e":"χρυσοῦς, χρυσῆ, χρυσοῦν","t":"d'or, daurat (adjectiu contracte; l'arrel original era χρύσεος)","g":"Adjectius de la 3a classe i regula ni"],"x":"","id":"c1-21"},{"t":"mc","q":"Què suggerix l'absència de fortificacions en els palaus cretencs?","o":["Que Creta controlava la mar i no temia atacs","Que Creta no coneixia encara la construcció en pedra","Que Creta havia sigut ja conquerida pels micènics","Que Creta era una illa despoblada i sense riqueses"],"x":"","id":"c1-22"},{"t":"mc","q":"En què consistia l'economia redistributiva minoica?","o":["El palau arreplegava els excedents agrícoles, els emmagatzemava i els repartia","Cada família venia lliurement els seus propis excedents al mercat del port veí","El rei repartia cada any la terra en lots iguals entre tots els camperols lliures","Els excedents s'exportaven sencers a Egipte a canvi de metalls i de teixits fins"],"x":"Els guardaven en grans gerres dins del palau.","id":"c1-23"},{"t":"mc","q":"Quina escriptura van desenrotllar els minoics per a portar el compte dels excedents?","o":["El lineal A","El lineal B","L'alfabet fenici","Els jeroglífics egipcis"],"x":"","id":"c1-24"},{"t":"mc","q":"Com és l'art minoic?","o":["Lluminós i naturalista, amb dofins, lliris i escenes de salt del bou","Auster i geomètric, amb greques i motius abstractes constantment repetits","Colossal i militar, amb escenes de batalles i files de presoners","Fosc i funerari, amb llargues processons de difunts i escenes d'ultratomba"],"x":"També hi ha ceràmica de decoració vegetal i marina.","id":"c1-25"},{"t":"mc","q":"Cap a quina data van ser destruïts els palaus de Creta?","o":["Cap al 1450 aC","Cap al 1600 aC","Cap al 1200 aC","Cap al 2000 aC"],"x":"","id":"c1-26"},{"t":"mc","q":"Quines causes s'han proposat per a la destrucció dels palaus cretencs?","o":["Terratrémols, revoltes internes i, sobretot, l'arribada de guerrers micènics","Una llarga sequera, la fam i, sobretot, l'arribada dels doris del nord","La invasió persa, la pesta i, sobretot, l'abandó de l'agricultura i del comerç","Un canvi de religió, la guerra civil i, sobretot, la conquesta de l'illa per Egipte"],"x":"","id":"c1-27"},{"t":"mc","q":"Quin paper va tindre l'erupció del volcà de Tera en el final dels palaus cretencs?","o":["Va poder debilitar l'illa, però no ho explica per si sola perquè és molt anterior","Va destruir tots els palaus alhora i va acabar de colp amb tota la cultura minoica","No va tindre cap efecte conegut sobre l'illa, perquè es va produir molts segles després","Va provocar la fugida dels micènics i va salvar l'illa de la conquesta estrangera"],"x":"L'erupció es data cap al 1600 aC i els palaus no cauen fins cap al 1450 aC.","id":"c1-28"},{"t":"tf","q":"Els palaus minoics estaven protegits per grans muralles i torres de defensa.","a":false,"x":"No tenien fortificacions: eixa absència suggerix que Creta controlava la mar.","id":"c1-29"},{"t":"tf","q":"El lineal A encara no ha sigut desxifrat.","a":true,"x":"","id":"c1-30"},{"t":"mc","q":"Com s'anomenen els primers grecs, que van entrar a la península cap al 2000 aC?","o":["Els aqueus","Els doris","Els jonis d'Àsia","Els eolis de Lesbos"],"x":"","id":"c1-31"},{"t":"mc","q":"Entre quines dates van bastir els aqueus la civilització micènica?","o":["Entre el 1600 i el 1200 aC","Entre el 2000 i el 1600 aC","Entre el 1100 i el 800 aC","Entre el 1450 i el 1100 aC"],"x":"","id":"c1-32"},{"t":"mc","q":"Com són els centres micènics, a diferència dels palaus cretencs?","o":["Són fortaleses situades en altura i protegides per muralles","Són ports oberts situats a la vora de la mar i sense defenses","Són santuaris aïllats situats al fons de valls estretes","Són poblats de cabanes escampats per les grans planes"],"x":"Micenes, Tirint, Pilos i Tebes en són els principals.","id":"c1-33"},{"t":"mc","q":"Per què s'anomenen ciclòpies les muralles micèniques?","o":["Perquè els grecs posteriors creien que els blocs enormes eren obra dels ciclops","Perquè cada fortalesa tenia una sola porta d'entrada, com l'únic ull d'un ciclop","Perquè es creia que les havien alçades els gegants vençuts pels déus de l'Olimp","Perquè es contava que les pedres venien de la cova d'un ciclop de les muntanyes"],"x":"","id":"c1-34"},{"t":"in","q":"Com es deia el sobirà que encapçalava la societat micènica?","ans":"wánax","acc":["wanax","wánax","el wanax","vanax","anax"],"x":"","id":"c1-35"},{"t":"in","q":"Quin nom rep l'escriptura de les tauletes d'argila de l'administració micènica?","ans":"lineal B","acc":["lineal b","el lineal b","linear b","lineal-b"],"x":"","id":"c1-36"},{"t":"mc","q":"Què va demostrar el desxiframent del lineal B?","o":["Que la llengua que amagava era el grec, el testimoni escrit més antic de la tradició","Que la llengua que amagava era el fenici, del qual va nàixer després l'alfabet grec","Que era exactament la mateixa escriptura que el lineal A, però simplificada i més tardana","Que els micènics escrivien en una llengua semítica d'origen desconegut i sense parents"],"x":"","id":"c1-37"},{"t":"mc","q":"Cap a quina data s'ensorra el món micènic?","o":["Cap al 1200 aC","Cap al 1450 aC","Cap al 1600 aC","Cap al 800 aC"],"x":"Els palaus són incendiats, l'escriptura desapareix i la població disminuïx.","id":"c1-38"},{"t":"mc","q":"Quines causes es discutixen per a l'ensorrament del món micènic?","o":["Moviments de pobles, conflictes interns, crisis agràries i els «pobles de la mar»","L'expansió de l'imperi dels perses, la pesta i la fugida massiva cap a Àsia Menor","La conquesta de Macedònia, la fam i la fi del comerç del ferro amb l'orient llunyà","L'arribada dels minoics de Creta, els terratrémols i la gran erupció del volcà de Tera"],"x":"","id":"c1-39"},{"t":"mc","q":"En quin període situa el capítol la guerra de Troia?","o":["Entre el 1250 i el 1180 aC","Entre el 1600 i el 1450 aC","Entre el 1100 i el 800 aC","Entre el 2000 i el 1600 aC"],"x":"Pertany, doncs, al període final del món micènic.","id":"c1-40"},{"t":"mc","q":"Entre quines dates se situen aproximadament els segles obscurs?","o":["Entre el 1100 i el 800 aC","Entre el 1600 i el 1200 aC","Entre el 800 i el 500 aC","Entre el 2000 i el 1450 aC"],"x":"","id":"c1-41"},{"t":"mc","q":"Quin poble ocupa el Peloponés i Creta durant els segles obscurs?","o":["Els doris","Els aqueus","Els fenicis","Els etruscs"],"x":"","id":"c1-42"},{"t":"mc","q":"On s'establix la població jònica i eòlica que travessa l'Egeu?","o":["A Àsia Menor","A Sicília i al sud d'Itàlia","A les costes de la mar Negra","Al nord d'Àfrica"],"x":"","id":"c1-43"},{"t":"in","q":"A quina forma de comunitat donaran lloc les comunitats locals dels segles obscurs?","ans":"polis","acc":["polis","la polis","poleis","les poleis"],"x":"","id":"c1-44"},{"t":"mc","q":"Quina modificació decisiva van fer els grecs a l'escriptura que van rebre?","o":["Van transformar en signes vocàlics alguns signes consonàntics que no necessitaven","Van reduir a la meitat el nombre de signes consonàntics que hi havia abans en fenici","Van afegir nous signes sil·làbics presos de l'antiga escriptura micènica del lineal B","Van canviar el sentit de l'escriptura i la van passar a escriure de dalt a baix"],"x":"Naix així el primer alfabet complet de la història, amb vocals i consonants.","id":"c1-45"},{"t":"mc","q":"De quan són els testimonis més antics de l'alfabet grec?","o":["Del segle VIII aC","Del segle XIII aC","Del segle V aC","Del segle II aC"],"x":"","id":"c1-46"},{"t":"mc","q":"Quina conseqüència social va tindre la senzillesa de l'alfabet?","o":["L'escriptura deixa de ser patrimoni exclusiu dels escribes professionals","L'escriptura passa a ser controlada pels sacerdots dels grans santuaris","L'escriptura queda reservada als reis i a l'administració dels seus palaus","L'escriptura només s'ensenya als comerciants dels ports més rics de l'Egeu"],"x":"","id":"c1-47"},{"t":"mc","q":"A través de quines escriptures deriva del grec l'alfabet que usem hui?","o":["A través de l'etrusc i el llatí","A través del fenici i l'hebreu","A través del lineal B i el llatí","A través del copte i l'àrab"],"x":"","id":"c1-48"},{"t":"tf","q":"Els grecs van inventar el seu alfabet des de zero, sense partir de cap escriptura anterior.","a":false,"x":"El van prendre dels fenicis i van transformar en signes vocàlics alguns signes consonàntics que no necessitaven.","id":"c1-49"},{"t":"tf","q":"Durant els segles obscurs es difon l'ús del ferro.","a":true,"x":"","id":"c1-50"},{"t":"mc","q":"A partir de quin any va excavar Arthur Evans el palau de Cnossos?","o":["A partir del 1900","A partir del 1870","A partir del 1876","A partir del 1952"],"x":"","id":"c1-51"},{"t":"mc","q":"Quina relació establix el capítol entre el mite grec i la història?","o":["El mite no és una crònica, però conserva la memòria deformada d'un passat real","El mite és una crònica del tot fiable que l'arqueologia ha confirmat punt per punt","El mite és pura literatura i no té cap mena de relació amb els fets del passat","El mite va ser inventat pels arqueòlegs moderns per a explicar les seues troballes"],"x":"","id":"c1-52"},{"t":"tf","q":"Abans de les grans excavacions, Minos, Micenes i Troia eren considerats només literatura.","a":true,"x":"","id":"c1-53"},{"t":"mat","q":"Emparella cada illa amb el tret que li dóna el capítol:","pairs":[["Creta","La més gran, situada al sud"],["Delos","Illa sagrada d'Apol·lo, al centre de les Cíclades"],["Lesbos","Pàtria de Safo i Alceu"],["Eubea","Illa allargada davant de la costa"]],"x":"","id":"c1-54"},{"t":"mat","q":"Emparella cada ciutat de la Grècia asiàtica amb allò pel qual és coneguda:","pairs":[["Milet","On naix la filosofia amb Tales"],["Efes","On s'alça el temple d'Àrtemis"],["Halicarnàs","Pàtria de l'historiador Heròdot"]],"x":"","id":"c1-55"},{"t":"mat","q":"Emparella cada investigador amb la seua aportació:","pairs":[["Heinrich Schliemann","Va excavar Troia i les tombes reials de Micenes"],["Arthur Evans","Va excavar el palau de Cnossos"],["Michael Ventris","Va desxifrar el lineal B"]],"x":"","id":"c1-56"},{"t":"ord","q":"Ordena cronològicament estos fets de la història de Creta:","items":["La florida de la cultura minoica a Creta","L'erupció del volcà de Tera","La destrucció dels palaus cretencs","L'ocupació de Cnossos per gent que escriu en grec"],"x":"La cultura minoica florix cap al 2000 aC, Tera fa erupció cap al 1600 aC i els palaus són destruïts cap al 1450 aC; a partir d'eixe moment Cnossos apareix ocupada per gent que escriu en grec.","id":"c1-57"},{"t":"ord","q":"Ordena cronològicament estes etapes del món grec més antic:","items":["L'entrada dels primers grecs a la península","L'apogeu de la civilització micènica","L'ensorrament dels palaus micènics","Els segles obscurs","L'adopció d'una escriptura vinguda d'orient"],"x":"Els aqueus entren cap al 2000 aC, la civilització micènica va del 1600 al 1200 aC, els segles obscurs del 1100 al 800 aC i l'alfabet fenici s'adopta al final d'eixa etapa.","id":"c1-58"},{"t":"ord","q":"Ordena estos sistemes d'escriptura del més antic al més modern:","items":["El lineal A","El lineal B","L'alfabet grec","L'alfabet llatí"],"x":"El lineal A és minoic i el lineal B, micènic; del grec ix el llatí a través de l'etrusc.","id":"c1-59"},{"t":"ord","q":"Ordena cronològicament estes fites de l'arqueologia del món egeu:","items":["Les excavacions de Schliemann a Troia i Micenes","Les excavacions d'Evans a Cnossos","El desxiframent del lineal B"],"x":"Schliemann va excavar en les dècades de 1870 i 1880, Evans a Cnossos a partir del 1900 i Ventris va desxifrar el lineal B el 1952.","id":"c1-60"}],"2":[{"t":"mc","q":"Entre quins segles adopta Grècia la forma d'organització que la definirà, la polis?","o":["Entre els segles VIII i VI aC","Entre els segles XII i X aC","Entre els segles V i III aC","Entre els segles XVI i XIV aC"],"x":"És l'època arcaica, la que es tanca quan comencen les guerres contra Pèrsia.","id":"c2-0"},{"t":"mc","q":"Per què traduir polis per «ciutat» és insuficient?","o":["Perquè és una comunitat de ciutadans amb territori, lleis i cultes propis","Perquè designava només el port i el mercat de les grans ciutats costaneres","Perquè el nom s'aplicava únicament a les noves fundacions colonials d'occident","Perquè era el nom del territori rural que envoltava un gran santuari comú"],"x":"A això s'afig una voluntat ferma d'independència.","id":"c2-1"},{"t":"mc","q":"Quina part de la polis sustentava econòmicament la comunitat?","o":["La khóra, el camp del voltant amb els llogarets, els conreus i les pastures","L'acròpoli, la part alta fortificada on s'alçaven els temples principals","L'àgora, la plaça on es feia el mercat i on es reunien tots els ciutadans lliures","L'ástu, el nucli urbà on es concentrava la major part de la població de la comunitat"],"x":"","id":"c2-2"},{"t":"mc","q":"Què era ser ciutadà d'una polis?","o":["Una condició hereditària amb drets polítics i obligacions religioses i militars","Un tràmit administratiu que es podia sol·licitar davant dels magistrats de la polis","Un privilegi temporal que es concedia per sorteig cada any en l'assemblea","Un títol que es podia comprar amb una part de la collita o amb diners en metàl·lic"],"x":"Donava dret a participar en les decisions, a posseir terra i a defendre la comunitat amb les armes.","id":"c2-3"},{"t":"mc","q":"A qui anomenaven bàrbars els grecs?","o":["Als qui no parlaven grec","Als qui vivien fora de les muralles","Als grecs que marxaven a les colònies","Als camperols endeutats i sotmesos"],"x":"Els grecs es reconeixien com a hel·lens enfront dels bàrbars.","id":"c2-4"},{"t":"mc","q":"Quins espais i referents compartien tots els grecs, tot i la divisió en polis?","o":["Els santuaris de Delfos i d'Olímpia, els oracles, els jocs i els poemes d'Homer","Un exèrcit comú, una moneda única, un calendari i uns tributs per a tots","Un rei hereditari, un consell panhel·lènic permanent i un únic codi de lleis comú","Una sola capital religiosa, un tresor comú i un exèrcit permanent de tots els grecs"],"x":"","id":"c2-5"},{"t":"tf","q":"La majoria de les polis eren comunitats xicotetes, d'uns quants milers de persones.","a":true,"x":"Atenes i Esparta van ser excepcions per grandària.","id":"c2-6"},{"t":"mc","q":"A partir de quin any comença la gran expansió colonial grega?","o":["A partir del 750 aC","A partir del 1200 aC","A partir del 950 aC","A partir del 480 aC"],"x":"I es prolonga durant dos segles.","id":"c2-7"},{"t":"mc","q":"Quines causes de la colonització assenyala el capítol?","o":["L'escassetat de terra cultivable, els conflictes polítics interns i la recerca de metalls i mercats","L'avanç dels perses per la costa, les epidèmies del litoral i la falta de vaixells de guerra propis","La caiguda dels palaus micènics, les sequeres continuades i la forta pressió comercial dels fenicis","L'excés de collites de cereal, l'abundància de terra lliure i la prohibició total del comerç marítim"],"x":"","id":"c2-8"},{"t":"mc","q":"Quina relació tenia l'apoikía amb la seua metròpoli?","o":["Era políticament independent, però hi mantenia vincles religiosos i sentimentals","Era una part més del territori de la metròpoli i en compartia les lleis i els cultes","Depenia del govern de la metròpoli, que hi enviava un magistrat cada any","Li pagava un tribut anual a la metròpoli a canvi de protecció militar i comercial"],"x":"","id":"c2-9"},{"t":"mc","q":"Quines d'estes ciutats pertanyien a la Magna Grècia?","o":["Cumes, Tàrent, Siracusa i Nàpols","Massàlia, Emporion, Cirene i Milet","Corint, Samos, Delfos i Olímpia","Esparta, Atenes, Argos i Messènia"],"x":"Els romans van anomenar així el sud d'Itàlia i Sicília, tan poblades de grecs.","id":"c2-10"},{"t":"mc","q":"Quina funció va fer Massàlia (Marsella) en l'expansió grega d'occident?","o":["Va servir de pont cap a la península Ibèrica","Va ser la metròpoli de les colònies de Sicília","Va controlar el pas cap a la mar Negra","Va ser el port principal de la Cirenaica"],"x":"","id":"c2-11"},{"t":"mc","q":"Quina colònia grega de la península Ibèrica és l'actual Empúries?","o":["Emporion","Massàlia","Cirene","Cumes"],"x":"","id":"c2-12"},{"t":"mc","q":"Quines conseqüències va tindre la colonització?","o":["La difusió de la llengua i de l'alfabet grecs, el comerç i la moneda encunyada","L'abandó de l'alfabet grec i el retorn a una escriptura de tipus sil·làbic","La unificació política de totes les ciutats gregues dins d'un únic estat unitari","La desaparició del comerç marítim en benefici de les rutes de terra ferma del nord"],"x":"I una xarxa mediterrània de ciutats i de rutes que Roma heretarà.","id":"c2-13"},{"t":"tf","q":"La colonització es feia sense cap organització prèvia: els colons partien pel seu compte i triaven el lloc a l'atzar.","a":false,"x":"Era un procés organitzat: la metròpoli designava un cap d'expedició, consultava l'oracle i triava el lloc.","id":"c2-14"},{"t":"mc","q":"Qui tenia el poder en els primers temps de la polis?","o":["Les famílies nobles, que controlaven la millor terra i els sacerdocis","Els hoplites, que formaven la infanteria pesada i es pagaven les armes","Els tirans, que el prenien per la força amb el suport dels descontents","Els legisladors, que redactaven les lleis escrites de la ciutat"],"x":"","id":"c2-15"},{"t":"mc","q":"Què era la falange hoplítica?","o":["Una formació compacta de soldats d'infanteria amb escut rodó, llança i cuirassa","Un cos de cavalleria noble que decidia la batalla amb duels individuals","Una tropa lleugera d'arquers i de foners reclutada entre els camperols més pobres","Un esquadró de vaixells de guerra tripulat pels ciutadans més pobres sense terra"],"x":"","id":"c2-16"},{"t":"mc","q":"Qui eren els hoplites?","o":["Camperols benestants capaços de costejar-se l'equipament","Nobles a cavall que combatien en duels davant de l'exèrcit","Mercenaris estrangers pagats amb les rendes dels santuaris","Camperols pobres armats només amb fona i sense protecció"],"x":"","id":"c2-17"},{"t":"mc","q":"Quina conseqüència política va tindre el pes militar dels hoplites?","o":["Es van convertir en un grup amb dret a exigir participació política","Van acabar formant una casta tancada de sacerdots i de jutges","Van perdre la terra i es van vore reduïts a l'esclavitud per deutes","Van substituir els reis i van governar la ciutat com a magistrats"],"x":"","id":"c2-18"},{"t":"mc","q":"Quin problema econòmic i jurídic va provocar tensions greus dins de les polis?","o":["L'endeutament dels xicotets propietaris, que podien acabar reduïts a l'esclavitud","L'aparició de la moneda encunyada, que va arruïnar de colp els grans propietaris nobles","La prohibició de vendre la collita fora del territori de la mateixa comunitat rural","L'excés de terra cultivable, que va fer caure el preu del gra, de l'oli i del vi"],"x":"","id":"c2-19"},{"t":"mc","q":"Per a què encarregaven moltes ciutats a un legislador la redacció de lleis escrites?","o":["Per a limitar l'arbitrarietat dels jutges nobles","Per a repartir la terra entre tots els ciutadans","Per a substituir l'assemblea per un consell de savis","Per a fixar els cultes i el calendari de les festes"],"x":"","id":"c2-20"},{"t":"mc","q":"Què era un tirà en el món grec arcaic?","o":["Algú que prenia el poder per la força, sense títol legal","Un magistrat elegit cada any per l'assemblea de ciutadans","Un rei hereditari que governava amb un consell d'ancians","Un legislador amb poders extraordinaris per a fer lleis"],"x":"Generalment arribava al poder amb el suport dels sectors descontents.","id":"c2-21"},{"t":"mc","q":"Quins tirans van governar Corint?","o":["Cípsel i Periandre","Dracó i Soló","Pisístrat i Clístenes","Licurg i Polícrates"],"x":"","id":"c2-22"},{"t":"tf","q":"En grec, la paraula «tirà» ja tenia la mateixa càrrega negativa que li donem hui.","a":false,"x":"Encara no la tenia: alguns tirans, com Cípsel i Periandre a Corint, van impulsar obres públiques, festes i comerç.","id":"c2-23"},{"t":"tf","q":"Alguns tirans, com Polícrates a Samos, van impulsar obres públiques, festes i comerç.","a":true,"x":"","id":"c2-24"},{"t":"mc","q":"Què va fer Dracó a Atenes cap al 621 aC?","o":["Va posar per escrit
